<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="tdm-reservation" content="1">
<title>Statistik – Endurance Events</title>
<!-- Nur für den Betreiber: Die Seite zeigt die Besucherstatistik aus
     Firestore (stats_daily), geschrieben von der Cloud Function
     aggregateStats (functions/index.js), gesammelt von stats.js. Lesen
     darf, wer in der Sammlung admins/<uid> steht (firestore.rules) - ohne
     den Eintrag zeigt die Seite die eigene uid und die Anleitung. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1220">
<!-- Farbschema hell/dunkel (siehe site.css). WORTGLEICH mit den anderen
     Seiten - test_scraper_lib.py (test_farbschema_skript) vergleicht. -->
<script>
(function () {
  var wahl = null;
  try { wahl = localStorage.getItem('endurance-theme'); } catch (e) { /* privater Modus */ }
  var hell = wahl ? wahl === 'light'
    : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  var setze = function (h) {
    document.documentElement.setAttribute('data-theme', h ? 'light' : 'dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', h ? '#ffffff' : '#0b1220');
  };
  setze(hell);
  document.addEventListener('DOMContentLoaded', function () {
    var knopf = document.querySelector('.theme-btn');
    if (!knopf) return;
    knopf.addEventListener('click', function () {
      hell = document.documentElement.getAttribute('data-theme') !== 'light';
      setze(hell);
      try { localStorage.setItem('endurance-theme', hell ? 'light' : 'dark'); } catch (e) { /* ignorieren */ }
    });
  });
})();
</script>
<link rel="stylesheet" href="vendor/fonts/barlow.css">
<link rel="stylesheet" href="site.css?v=daeec5bd">
<style>
  /* Diagrammfarben: zwei Reihen, in beiden Schemata gegen die Fläche
     geprüft (dataviz-Validator: Helligkeit, Farbfehlsicht, Kontrast).
     Dunkel: Blau #3d8fd9 + Signal; hell: Schwimmen-Blau #1971c2 + Signal. */
  :root { --chart-1: #3d8fd9; --chart-2: #e8590c; --chart-grid: var(--border); }
  :root[data-theme="light"] { --chart-1: #1971c2; }

  body { display: flex; flex-direction: column; min-height: 100vh; }
  .stat-main { width: 100%; max-width: 1180px; margin: 0 auto; padding: 22px 16px 48px; box-sizing: border-box; flex: 1; }
  .stat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 4px 0 18px; }
  .stat-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; margin: 0; letter-spacing: 0.01em; }
  .stat-head p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }

  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 18px 20px; box-sizing: border-box; min-width: 0; }
  .stat-card h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .stat-card h3 small { font-family: var(--font-text); font-weight: 500; font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Zugang */
  /* Wartungsmodus-Karte (14.10.2026), ganz unten hinter einer Trennlinie */
  .stat-trenner { border: 0; border-top: 2px solid var(--border-strong); margin: 36px 0 18px; }
  /* Die fünf Bereiche der Seite (16.10.2026, vom Nutzer: „oben ein
     Dashboard, dann die Graphen, dann die einzelnen Auswertungen, dann
     alles mit Instagram, dann die Wartungsseite – immer mit einer Linie
     und Überschrift trennen"). */
  .stat-bereich { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; margin: 0 0 14px; }
  #wartung-card h3 small.w-an { color: var(--brand); }
  .w-felder { display: grid; gap: 8px; margin: 10px 0; }
  .w-felder label { display: grid; gap: 4px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .w-felder input { font: inherit; font-size: 0.95rem; text-transform: none; letter-spacing: 0; padding: 8px 10px; border-radius: var(--radius-ctl); border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); width: 100%; box-sizing: border-box; }
  .w-knoepfe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 0; }
  .w-knoepfe a.stat-btn { text-decoration: none; display: inline-flex; align-items: center; }
  /* Instagram-Freigabe (14.10.2026): eine Zeile je Tag aus plan.json,
     Status aus Firestore, drei Knöpfe. */
  .frei-liste { display: grid; gap: 10px; margin: 10px 0 0; }
  .frei-zeile { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-ctl); background: var(--bg); }
  .frei-zeile.ist-frei { border-color: var(--sport-fahrrad); }
  .frei-zeile.ist-gesperrt { opacity: 0.7; }
  .frei-kopf { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .frei-kopf b { font-family: var(--font-display); font-size: 1.05rem; }
  .frei-format { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .frei-status { font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--text-muted); }
  .frei-status.frei { background: var(--sport-fahrrad-bg); color: var(--sport-fahrrad-fg); }
  .frei-status.gesperrt { background: var(--sport-laufen-bg); color: var(--sport-laufen-fg); }
  .frei-status.veraltet { background: var(--sport-laufen-bg); color: var(--sport-laufen-fg); }
  .frei-folien { margin: 4px 0 0; font-size: 0.92rem; line-height: 1.45; }
  .frei-folien .fz { color: var(--text-muted); }
  .frei-zeile details { grid-column: 1 / -1; font-size: 0.88rem; }
  .frei-zeile details summary { cursor: pointer; color: var(--text-muted); }
  .frei-zeile pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; padding: 8px 10px; border-radius: var(--radius-ctl); background: var(--panel); border: 1px solid var(--border); }
  .frei-knoepfe { display: flex; flex-direction: column; gap: 6px; align-self: start; }
  .frei-knoepfe .stat-btn { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; white-space: nowrap; }
  @media (max-width: 600px) { .frei-zeile { grid-template-columns: 1fr; } .frei-knoepfe { flex-direction: row; flex-wrap: wrap; } }
  .gate { max-width: 560px; }
  .gate p { margin: 8px 0; line-height: 1.5; }
  .gate .uid { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .gate code { background: var(--accent-bg); padding: 6px 10px; border-radius: 8px; font-size: 0.95rem; word-break: break-all; }
  .stat-btn { font: inherit; font-weight: 600; font-size: 0.9rem; padding: 9px 16px; border-radius: var(--radius-ctl); border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); cursor: pointer; min-height: 40px; }
  .stat-btn:hover { background: var(--accent-bg); }
  .stat-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  /* Zeitraum: EINE Reihe über allem, Voreinstellungen zuerst */
  .stat-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
  .stat-range { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat-range button { font: inherit; font-weight: 600; font-size: 0.88rem; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); cursor: pointer; }
  .stat-range button:hover { background: var(--accent-bg); }
  .stat-range button.active { background: var(--pill-active-bg, var(--accent)); color: var(--pill-active-fg, var(--on-accent)); border-color: var(--pill-active-border, var(--accent)); }
  .stat-meta { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 0.85rem; }
  /* Monatswahl neben den Zeitraum-Knöpfen (14.10.2026): ‹ Oktober 2026 › */
  .stat-monat { display: inline-flex; align-items: center; gap: 4px; }
  .stat-monat button { min-width: 40px; padding: 8px 10px; }
  .stat-monat button:disabled { opacity: 0.4; cursor: default; }
  .stat-monat b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; min-width: 9ch; text-align: center; }

  /* Kennzahlen */
  .stat-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }  /* 150: sieben Kacheln passen in 1.180 px */
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 14px 16px; min-width: 0; }
  .kpi .label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .kpi .value { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.1; margin-top: 4px; }
  .kpi .delta { font-size: 0.82rem; margin-top: 4px; color: var(--text-muted); min-height: 1.2em; }
  .kpi .delta.up { color: var(--sport-fahrrad-fg, #2b8a3e); }
  .kpi .delta.down { color: var(--sport-laufen-fg, #9a3b05); }
  .kpi .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .ig-card { margin-bottom: 14px; }
  .ig-card .ig-kpis { margin: 10px 0 6px; }
  .ig-card .kpi { background: var(--bg); }
  .ig-hinweis { font-size: 0.8rem; color: var(--text-muted); margin: 8px 0 0; }
  .ig-hinweis code { font-size: 0.78rem; word-break: break-all; }

  .stat-section { display: grid; gap: 14px; margin-bottom: 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .stat-section-title { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin: 10px 0 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-zwei { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .stat-card.breit { grid-column: 1 / -1; }
  /* Tabellen in Karten (Monate, Sportart je Region, Werbeplätze, Bericht) */
  table.matrix { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
  table.matrix th, table.matrix td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.matrix th:first-child, table.matrix td:first-child { text-align: left; white-space: normal; }
  table.matrix thead th { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  table.matrix tfoot td { font-weight: 600; border-bottom: 0; }
  .matrix-wrap { overflow-x: auto; }
  /* Bericht je Veranstaltung */
  .bericht-suche { font: inherit; font-size: 0.95rem; padding: 9px 12px; border-radius: var(--radius-ctl); border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); width: 100%; box-sizing: border-box; margin-bottom: 12px; }
  .bericht-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .bericht-kpis .kpi { padding: 10px 12px; }
  .bericht-kpis .kpi .value { font-size: 1.6rem; }
  .bericht-name { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin: 0 0 8px; }
  .bericht-fuss { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .bericht-fuss .hinweis { color: var(--text-muted); font-size: 0.82rem; flex: 1 1 240px; }

  /* Diagramme */
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--font-text); }
  .chart-wrap .grid line { stroke: var(--chart-grid); stroke-width: 1; }
  .chart-wrap .axis text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-wrap .reihe { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-wrap .reihe-1 { stroke: var(--chart-1); }
  .chart-wrap .reihe-2 { stroke: var(--chart-2); }
  .chart-wrap .wash-1 { fill: var(--chart-1); opacity: 0.1; }
  .chart-wrap .punkt-1 { fill: var(--chart-1); stroke: var(--panel); stroke-width: 2; }
  .chart-wrap .punkt-2 { fill: var(--chart-2); stroke: var(--panel); stroke-width: 2; }
  .chart-wrap .cursor { stroke: var(--text-muted); stroke-width: 1; opacity: 0; }
  .chart-wrap .balken { fill: var(--chart-1); }
  .chart-wrap .balken.balken-2 { fill: var(--chart-2); }
  .chart-wrap .balken.aktiv { opacity: 0.75; }
  .chart-wrap .fang { fill: transparent; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 10px; font-size: 0.82rem; box-shadow: var(--shadow); min-width: 140px; z-index: 2; display: none; }
  .chart-tip .tip-datum { color: var(--text-muted); margin-bottom: 4px; }
  .chart-tip .tip-zeile { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .chart-tip .tip-zeile b { font-variant-numeric: tabular-nums; }
  .chart-tip .key { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
  .chart-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-muted); margin: 0 0 8px; }
  .chart-legend .key { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
  .key-1 { background: var(--chart-1); } .key-2 { background: var(--chart-2); }
  details.tabelle { margin-top: 10px; font-size: 0.88rem; }
  details.tabelle summary { cursor: pointer; color: var(--link); }
  details.tabelle table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  details.tabelle th, details.tabelle td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  details.tabelle th:first-child, details.tabelle td:first-child { text-align: left; }

  /* Listen mit Balken */
  .liste { list-style: none; margin: 0; padding: 0; }
  .liste li { padding: 7px 0; border-bottom: 1px solid var(--border); }
  .liste li:last-child { border-bottom: 0; }
  .liste .zeile { display: flex; align-items: baseline; gap: 10px; font-size: 0.92rem; }
  .liste .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liste .zahl { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3ch; text-align: right; }
  .liste .anteil { font-variant-numeric: tabular-nums; color: var(--text-muted); min-width: 4ch; text-align: right; font-size: 0.82rem; }
  .liste .spur { height: 6px; border-radius: 4px; background: var(--accent-bg); margin-top: 5px; overflow: hidden; }
  .liste .spur i { display: block; height: 100%; background: var(--chart-1); border-radius: 4px; }
  .mehr-btn { font: inherit; font-size: 0.85rem; color: var(--link); background: none; border: 0; padding: 8px 0 0; cursor: pointer; }
  .leer { color: var(--text-muted); font-size: 0.9rem; }

  @media (max-width: 700px) {
    .stat-head h2 { font-size: 1.6rem; }
    .stat-meta { margin-left: 0; }
    .stat-card { padding: 14px; }
  }
</style>
</head>
<body>

<header class="site-header top-bar">
  <a class="brand" href="index.html">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 46 L26 20 L38 34 L51 17"/><circle cx="51" cy="17" r="5" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <h1 class="brand-name" id="page-title">Endurance Events</h1>
  </a>
  <nav class="site-nav" aria-label="Seiten">
    <a class="nav-link" href="events.html" id="nav-events">Events</a>
    <a class="nav-link" href="karte.html" id="nav-map">Karte</a>
  </nav>
  <div class="top-actions">
    <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="Hell / Dunkel – Light / Dark" title="Hell / Dunkel – Light / Dark">
      <svg class="theme-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="lang-switch" id="lang-switch">
      <button type="button" class="lang-btn" data-lang="de">DE</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
    <div id="auth-mount"></div>
  </div>
</header>

<main class="stat-main">
  <div class="stat-head">
    <h2 id="stat-title">Statistik</h2>
    <p id="stat-sub"></p>
  </div>

  <section class="stat-card gate" id="stat-gate" aria-live="polite"></section>

  <div id="stat-content" hidden>
    <h2 class="stat-bereich" id="b-dashboard"></h2>
    <div class="stat-filters">
      <div class="stat-range" id="stat-range" role="group"></div>
      <div class="stat-meta">
        <span id="stat-stand"></span>
        <button type="button" class="stat-btn" id="csv-btn"></button>
      </div>
    </div>

    <div class="stat-kpis" id="stat-kpis"></div>

    <hr class="stat-trenner">
    <h2 class="stat-bereich" id="b-graphen"></h2>
    <div class="stat-section">
      <section class="stat-card">
        <h3><span id="h-verlauf"></span></h3>
        <div class="chart-legend" id="legend-verlauf"></div>
        <div class="chart-wrap" id="wrap-verlauf">
          <svg id="chart-verlauf" role="img"></svg>
          <div class="chart-tip" id="tip-verlauf"></div>
        </div>
        <details class="tabelle">
          <summary id="t-tabelle"></summary>
          <table id="tabelle-verlauf"></table>
        </details>
      </section>
      <!-- Monate (14.10.2026): Werbung wird je Monat verkauft - die zwölf
           Monate als Balken (Besuche, Seitenaufrufe) und als Tabelle, die
           zugleich das Mediadaten-Blatt ist (Besucher, Besuche, Aufrufe,
           Seiten je Besuch, Dauer, Abos zum Monatsende). -->
      <section class="stat-card">
        <h3><span id="h-monate"></span><small id="h-monate-sub"></small></h3>
        <div class="chart-legend" id="legend-monate"></div>
        <div class="chart-wrap" id="wrap-monate">
          <svg id="chart-monate" role="img"></svg>
          <div class="chart-tip" id="tip-monate"></div>
        </div>
        <details class="tabelle" open>
          <summary id="t-tabelle-monate"></summary>
          <div class="matrix-wrap"><table class="matrix" id="tabelle-monate"></table></div>
        </details>
      </section>
      <div class="stat-zwei">
        <section class="stat-card">
          <h3><span id="h-stunden"></span><small id="h-stunden-sub"></small></h3>
          <div class="chart-wrap" id="wrap-stunden">
            <svg id="chart-stunden" role="img"></svg>
            <div class="chart-tip" id="tip-stunden"></div>
          </div>
        </section>
        <!-- Wochentag (14.10.2026): aus den Tagesdokumenten gerechnet,
             keine neue Zählung - Ø Seitenaufrufe je Wochentag. -->
        <section class="stat-card">
          <h3><span id="h-wochentage"></span><small id="h-wochentage-sub"></small></h3>
          <div class="chart-wrap" id="wrap-wochentage">
            <svg id="chart-wochentage" role="img"></svg>
            <div class="chart-tip" id="tip-wochentage"></div>
          </div>
        </section>
      </div>
    </div>

    <hr class="stat-trenner">
    <h2 class="stat-bereich" id="b-auswertungen"></h2>
    <div id="stat-listen"></div>

    <hr class="stat-trenner">
    <h2 class="stat-bereich" id="b-instagram"></h2>
    <!-- Instagram (14.10.2026, Account „AusdauerMaschine"): wie viele
         Besucher über Instagram kommen - erkannt an utm_source=instagram
         (Link in der Bio, Story-Links), am Referrer instagram.com und am
         eingebauten Browser der App (stats_aggregate.js, kanal()). -->
    <section class="stat-card ig-card" id="ig-card">
      <h3><span id="h-ig"></span><small id="h-ig-sub"></small></h3>
      <div class="stat-kpis ig-kpis" id="ig-kpis"></div>
      <div class="chart-wrap" id="wrap-ig">
        <svg id="chart-ig" role="img"></svg>
        <div class="chart-tip" id="tip-ig"></div>
      </div>
      <p class="ig-hinweis" id="ig-hinweis"></p>
    </section>

    <!-- Instagram-Freigabe (14.10.2026, vom Nutzer: „die ersten Videos alle

      // Sportarten heißen in den Daten deutsch (art1) - hier die Anzeige.
      sport: { Laufen: 'Running', Fahrrad: 'Cycling', Schwimmen: 'Swimming', Triathlon: 'Triathlon' },
      ld: { DE: 'Germany', AT: 'Austria', CH: 'Switzerland', IT: 'Italy', LI: 'Liechtenstein', LU: 'Luxembourg', BE: 'Belgium', NL: 'Netherlands', FR: 'France', CZ: 'Czechia', PL: 'Poland', DK: 'Denmark', SE: 'Sweden', NO: 'Norway', FI: 'Finland', GB: 'United Kingdom', IE: 'Ireland', ES: 'Spain', PT: 'Portugal', HU: 'Hungary', SI: 'Slovenia', HR: 'Croatia', SK: 'Slovakia', GR: 'Greece', EU: 'Europe (other)', AM: 'Americas', AS: 'Asia', OC: 'Oceania', AF: 'Africa', '??': 'Unknown' },
      wochentage: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      uhr: 'h'
    }

  let lang = 'de';
  try {
    const g = localStorage.getItem('endurance-lang');
    if (g === 'de' || g === 'en') lang = g;
  } catch (e) { /* ignorieren */ }
  function t(key, ...args) {
    const v = I18N[lang][key];
    return typeof v === 'function' ? v(...args) : (v == null ? key : v);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtInt(n) {
    const s = String(Math.round(Number(n) || 0));
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'de' ? '.' : ',');
  }
  function fmtDez(n, stellen) {
    if (!Number.isFinite(n)) return '–';
    const s = n.toFixed(stellen);
    return lang === 'de' ? s.replace('.', ',') : s;
  }
  function fmtProzent(anteil) {
    if (!Number.isFinite(anteil)) return '–';
    return fmtDez(anteil * 100, anteil * 100 >= 10 ? 0 : 1) + ' %';
  }
  function fmtDauer(sek) {
    if (!Number.isFinite(sek)) return '–';
    const m = Math.floor(sek / 60), s = Math.round(sek % 60);
    return `${m}:${s < 10 ? '0' : ''}${s} min`;
  }
  function isoHeute() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function isoPlus(iso, tage) {
    const [j, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(j, m - 1, d + tage));
    return dt.toISOString().slice(0, 10);
  }
  function tageZwischen(von, bis) {
    const a = Date.parse(von + 'T00:00:00Z'), b = Date.parse(bis + 'T00:00:00Z');
    return Math.round((b - a) / 86400000) + 1;
  }
  function fmtTag(iso, kurz) {
    const [j, m, d] = iso.split('-').map(Number);
    const wt = I18N[lang].wochentage[new Date(Date.UTC(j, m - 1, d)).getUTCDay()];
    if (lang === 'de') return kurz ? `${d}.${m}.` : `${wt} ${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${j}`;
    const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1];
    return kurz ? `${d} ${mon}` : `${wt} ${d} ${mon} ${j}`;
  }

  // ---------- Zugang ----------

  async function nachAnmeldung(user) {

  // ---------- Instagram-Freigabe ----------
  // plan.json (Pages-Workflow: insta_inhalte.py --plan 14) nennt je Tag
  // Format, Folien, Caption und die Kennung des Inhalts; Firestore
  // insta_freigaben/<Datum> trägt status/hash/format/geaendert. Ein Klick
  // schreibt das Dokument, der Abendlauf liest es per REST
  // (scripts/insta_freigabe.py). Stimmt die gespeicherte Kennung nicht
  // mehr mit dem Plan überein, ist die Freigabe verfallen - die Zeile
  // sagt es und bittet um einen neuen Klick.
  const FREIGABE_PLAN_URL = 'marketing/instagram/plan.json';
  const FREIGABE_ACTIONS_URL = 'https://github.com/AntDon930/Enduranceevents/actions/workflows/instagram.yml';
  let freigabePlan = null;        // { erzeugt, beitraege: [...] } oder null
  let freigabeDocs = {};          // datum -> { status, hash }
  let freigabeFehler = null;
  let freigabePlanFehlt = false;

  async function ladeFreigaben() {
    freigabeFehler = null;
    try {
      const r = await fetch(FREIGABE_PLAN_URL, { cache: 'no-store' });
      if (r.ok) { freigabePlan = await r.json(); freigabePlanFehlt = false; }
      else { freigabePlan = null; freigabePlanFehlt = true; }
    } catch (err) { freigabePlan = null; freigabePlanFehlt = true; }
    try {
      const heute = new Date();
      const iso = `${heute.getFullYear()}-${String(heute.getMonth() + 1).padStart(2, '0')}-${String(heute.getDate()).padStart(2, '0')}`;
      const snap = await db.collection('insta_freigaben')
        .where(firebase.firestore.FieldPath.documentId(), '>=', iso).get();
      const docs = {};
      snap.forEach(d => { const x = d.data() || {}; docs[d.id] = { status: x.status, hash: x.hash }; });
      freigabeDocs = docs;
    } catch (err) {
      freigabeFehler = err;
    }
    zeichneFreigaben();
  }

  async function setzeFreigabe(datum, status, beitrag) {
    const card = document.getElementById('insta-freigabe-card');
    card.querySelectorAll('button').forEach(b => { b.disabled = true; });
    try {
      const ref = db.collection('insta_freigaben').doc(datum);
      if (!status) {
        await ref.delete();
      } else {
        await ref.set({
          status,
          hash: beitrag.hash,
          format: beitrag.format,
          geaendert: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      freigabeFehler = null;
    } catch (err) {
      freigabeFehler = err;
    }
    await ladeFreigaben();
  }

  function freigabeStatus(beitrag) {
    const doc = freigabeDocs[beitrag.datum];
    if (!doc) return 'offen';
    if (doc.status === 'gesperrt') return 'gesperrt';
    if (doc.status === 'freigegeben') return doc.hash === beitrag.hash ? 'frei' : 'veraltet';
    return 'offen';
  }

  function folienText(folien) {
    // Die erste Folie als Kurzfassung: Überschrift groß, dazu bis zu drei Zeilen.
    const f = (folien || [])[0] || {};
    const teile = [];
    if (f.ueber) teile.push(`<span class="fz">${escapeHtml(f.ueber)}</span>`);
    const kopf = [f.zahl, f.titel].filter(Boolean).join(' – ');
    if (kopf) teile.push(`<b>${escapeHtml(kopf)}</b>`);
    const zeilen = (f.zeilen || []).slice(0, 3).map(z => escapeHtml(typeof z === 'string' ? z : (z.text || z.name || '')));
    if (f.text) zeilen.unshift(escapeHtml(f.text));
    if (zeilen.length) teile.push(zeilen.join('<br>'));
    return teile.join('<br>');
  }

  function storiesText(stories) {
    // Die Stories des Tages in einer Zeile: je Story Überschrift und Titel/Name.
    if (!Array.isArray(stories) || !stories.length) return '';
    const teile = stories.map(st => {
      const f = st.folie || {};
      return escapeHtml([f.ueber, f.zahl, f.name || f.titel].filter(Boolean).join(' – '));
    });
    return `<p class="frei-folien"><span class="fz">${escapeHtml(t('f_stories'))}</span> ${teile.join(' · ')}</p>`;
  }

  function zeichneFreigaben() {
    const card = document.getElementById('insta-freigabe-card');
    if (!card) return;
    const kopf = `<h3><span>${escapeHtml(t('f_titel'))}</span><small>${escapeHtml(t('f_sub'))}</small></h3>
      <p>${escapeHtml(t('f_erklaert'))} <a href="${FREIGABE_ACTIONS_URL}" target="_blank" rel="noopener">${escapeHtml(t('f_video'))}</a></p>`;
    const fehler = freigabeFehler
      ? `<p class="leer">${escapeHtml(t('f_fehler'))} ${escapeHtml(freigabeFehler.message || String(freigabeFehler))} ${escapeHtml(t('w_regeln'))}</p>` : '';
    if (!freigabePlan || !Array.isArray(freigabePlan.beitraege)) {
      card.innerHTML = kopf + `<p class="leer">${escapeHtml(freigabePlanFehlt ? t('f_kein_plan') : t('gate_laden'))}</p>` + fehler;
      return;
    }
    const heute = new Date(); heute.setHours(0, 0, 0, 0);
    const zeilen = freigabePlan.beitraege.filter(b => new Date(b.datum + 'T00:00:00') >= heute).map(b => {
      const st = freigabeStatus(b);
      const label = { frei: 'f_s_frei', gesperrt: 'f_s_gesperrt', veraltet: 'f_s_veraltet', offen: 'f_s_offen' }[st];
      const d = new Date(b.datum + 'T00:00:00');
      const datum = d.toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB', { weekday: 'short', day: '2-digit', month: '2-digit' });
      const fmt = t('f_fmt_' + b.format) || b.format;
      const knoepfe = [];
      if (st !== 'frei') knoepfe.push(`<button type="button" class="stat-btn primary" data-frei="${b.datum}">${escapeHtml(t('f_frei'))}</button>`);
      if (st !== 'gesperrt') knoepfe.push(`<button type="button" class="stat-btn" data-sperren="${b.datum}">${escapeHtml(t('f_sperren'))}</button>`);
      if (st !== 'offen') knoepfe.push(`<button type="button" class="stat-btn" data-zurueck="${b.datum}">${escapeHtml(t('f_zurueck'))}</button>`);
      return `<div class="frei-zeile ist-${st}" data-datum="${b.datum}">
        <div>
          <div class="frei-kopf"><b>${escapeHtml(datum)}</b><span class="frei-format">${escapeHtml(fmt)}</span><span class="frei-status ${st}">${escapeHtml(t(label))}</span></div>
          <p class="frei-folien">${folienText(b.folien)}</p>
          ${storiesText(b.stories)}
        </div>
        <div class="frei-knoepfe">${knoepfe.join('')}</div>
        <details><summary>${escapeHtml(t('f_caption'))}</summary><pre>${escapeHtml(b.caption || '')}</pre></details>
      </div>`;
    });
    const stand = freigabePlan.erzeugt ? `<p class="leer">${escapeHtml(t('f_stand'))}${escapeHtml(String(freigabePlan.erzeugt).replace('T', ' ').slice(0, 16))}</p>` : '';
    card.innerHTML = kopf + `<div class="frei-liste">${zeilen.join('')}</div>` + stand + fehler;
    const beitragZu = (datum) => freigabePlan.beitraege.find(b => b.datum === datum);
    card.querySelectorAll('[data-frei]').forEach(b => b.addEventListener('click', () => setzeFreigabe(b.dataset.frei, 'freigegeben', beitragZu(b.dataset.frei))));
    card.querySelectorAll('[data-sperren]').forEach(b => b.addEventListener('click', () => setzeFreigabe(b.dataset.sperren, 'gesperrt', beitragZu(b.dataset.sperren))));
    card.querySelectorAll('[data-zurueck]').forEach(b => b.addEventListener('click', () => setzeFreigabe(b.dataset.zurueck, null, beitragZu(b.dataset.zurueck))));
  }

  // ---------- Wartungsmodus ----------
  // Das Dokument config/wartung: aktiv, text_de, text_en, geaendert, von.
  // Lesen dürfen alle (die öffentlichen Seiten fragen es im Kopf ab),
  // schreiben nur Admins - firestore.rules.
  const WARTUNG_VORGABE = {
    text_de: 'Wir arbeiten gerade an der Seite und sind in Kürze zurück.',
    text_en: 'We are working on the site and will be back shortly.'
  };
  let wartung = null;
  let wartungFehler = null;

  async function ladeWartung() {
    try {
      const snap = await db.collection('config').doc('wartung').get();
      const d = snap.exists ? snap.data() : {};
      wartung = {
        aktiv: d.aktiv === true,

        geaendert: d.geaendert && typeof d.geaendert.toDate === 'function' ? d.geaendert.toDate() : null
      };

  async function speichereWartung(aktiv) {
