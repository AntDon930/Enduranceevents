     Firestore (stats_daily), geschrieben von der Cloud Function
     aggregateStats (functions/index.js), gesammelt von stats.js. Lesen
     darf, wer in der Sammlung admins/<uid> steht (firestore.rules) - ohne
     den Eintrag zeigt die Seite die eigene uid und die Anleitung. -->

<!-- Farbschema hell/dunkel (siehe site.css). WORTGLEICH mit den anderen
     Seiten - test_scraper_lib.py (test_farbschema_skript) vergleicht. -->
<script>
(function () {
  var wahl = null;
  try { wahl = localStorage.getItem('endurance-theme'); } catch (e) { /* privater Modus */ }
  var hell = wahl ? wahl === 'light'
    : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  var setze = function (h) {
    document.documentElement.setAttribute('data-theme', h ? 'light' : 'dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', h ? '#ffffff' : '#0b1220');
  };
  setze(hell);
  document.addEventListener('DOMContentLoaded', function () {
    var knopf = document.querySelector('.theme-btn');
    if (!knopf) return;
    knopf.addEventListener('click', function () {
      hell = document.documentElement.getAttribute('data-theme') !== 'light';
      setze(hell);
      try { localStorage.setItem('endurance-theme', hell ? 'light' : 'dark'); } catch (e) { /* ignorieren */ }
    });
  });
})();
</script>

  :root[data-theme="light"] { --chart-1: #1971c2; }

  body { display: flex; flex-direction: column; min-height: 100vh; }
  .stat-main { width: 100%; max-width: 1180px; margin: 0 auto; padding: 22px 16px 48px; box-sizing: border-box; flex: 1; }
  .stat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 4px 0 18px; }
  .stat-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; margin: 0; letter-spacing: 0.01em; }
  .stat-head p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }

  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 18px 20px; box-sizing: border-box; min-width: 0; }
  .stat-card h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .stat-card h3 small { font-family: var(--font-text); font-weight: 500; font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Zugang */
  /* Wartungsmodus-Karte (14.10.2026), ganz unten hinter einer Trennlinie */
  .stat-trenner { border: 0; border-top: 2px solid var(--border-strong); margin: 32px 0 20px; }
  #wartung-card h3 small.w-an { color: var(--brand); }
  .w-felder { display: grid; gap: 8px; margin: 10px 0; }
  .w-felder label { display: grid; gap: 4px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .w-felder input { font: inherit; font-size: 0.95rem; text-transform: none; letter-spacing: 0; padding: 8px 10px; border-radius: var(--radius-ctl); border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); width: 100%; box-sizing: border-box; }
  .w-knoepfe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 0; }
  .w-knoepfe a.stat-btn { text-decoration: none; display: inline-flex; align-items: center; }
  .gate { max-width: 560px; }
  .gate p { margin: 8px 0; line-height: 1.5; }
  .gate .uid { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .gate code { background: var(--accent-bg); padding: 6px 10px; border-radius: 8px; font-size: 0.95rem; word-break: break-all; }
  .stat-btn { font: inherit; font-weight: 600; font-size: 0.9rem; padding: 9px 16px; border-radius: var(--radius-ctl); border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); cursor: pointer; min-height: 40px; }
  .stat-btn:hover { background: var(--accent-bg); }
  .stat-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  /* Zeitraum: EINE Reihe über allem, Voreinstellungen zuerst */
  .stat-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
  .stat-range { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat-range button { font: inherit; font-weight: 600; font-size: 0.88rem; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); cursor: pointer; }
  .stat-range button:hover { background: var(--accent-bg); }
  .stat-range button.active { background: var(--pill-active-bg, var(--accent)); color: var(--pill-active-fg, var(--on-accent)); border-color: var(--pill-active-border, var(--accent)); }
  .stat-meta { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 0.85rem; }

  /* Kennzahlen */
  .stat-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 14px 16px; min-width: 0; }
  .kpi .label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .kpi .value { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.1; margin-top: 4px; }
  .kpi .delta { font-size: 0.82rem; margin-top: 4px; color: var(--text-muted); min-height: 1.2em; }
  .kpi .delta.up { color: var(--sport-fahrrad-fg, #2b8a3e); }
  .kpi .delta.down { color: var(--sport-laufen-fg, #9a3b05); }
  .kpi .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

  .stat-section { display: grid; gap: 14px; margin-bottom: 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .stat-section-title { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin: 10px 0 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }

  /* Diagramme */
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--font-text); }
  .chart-wrap .grid line { stroke: var(--chart-grid); stroke-width: 1; }
  .chart-wrap .axis text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-wrap .reihe { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-wrap .reihe-1 { stroke: var(--chart-1); }
  .chart-wrap .reihe-2 { stroke: var(--chart-2); }
  .chart-wrap .wash-1 { fill: var(--chart-1); opacity: 0.1; }
  .chart-wrap .punkt-1 { fill: var(--chart-1); stroke: var(--panel); stroke-width: 2; }
  .chart-wrap .punkt-2 { fill: var(--chart-2); stroke: var(--panel); stroke-width: 2; }
  .chart-wrap .cursor { stroke: var(--text-muted); stroke-width: 1; opacity: 0; }
  .chart-wrap .balken { fill: var(--chart-1); }
  .chart-wrap .balken.aktiv { opacity: 0.75; }
  .chart-wrap .fang { fill: transparent; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 10px; font-size: 0.82rem; box-shadow: var(--shadow); min-width: 140px; z-index: 2; display: none; }
  .chart-tip .tip-datum { color: var(--text-muted); margin-bottom: 4px; }
  .chart-tip .tip-zeile { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .chart-tip .tip-zeile b { font-variant-numeric: tabular-nums; }
  .chart-tip .key { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
  .chart-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-muted); margin: 0 0 8px; }
  .chart-legend .key { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
  .key-1 { background: var(--chart-1); } .key-2 { background: var(--chart-2); }
  details.tabelle { margin-top: 10px; font-size: 0.88rem; }
  details.tabelle summary { cursor: pointer; color: var(--link); }
  details.tabelle table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  details.tabelle th, details.tabelle td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  details.tabelle th:first-child, details.tabelle td:first-child { text-align: left; }

  /* Listen mit Balken */
  .liste { list-style: none; margin: 0; padding: 0; }
  .liste li { padding: 7px 0; border-bottom: 1px solid var(--border); }
  .liste li:last-child { border-bottom: 0; }
  .liste .zeile { display: flex; align-items: baseline; gap: 10px; font-size: 0.92rem; }
  .liste .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liste .zahl { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3ch; text-align: right; }
  .liste .anteil { font-variant-numeric: tabular-nums; color: var(--text-muted); min-width: 4ch; text-align: right; font-size: 0.82rem; }
  .liste .spur { height: 6px; border-radius: 4px; background: var(--accent-bg); margin-top: 5px; overflow: hidden; }
  .liste .spur i { display: block; height: 100%; background: var(--chart-1); border-radius: 4px; }

  .leer { color: var(--text-muted); font-size: 0.9rem; }

    .stat-meta { margin-left: 0; }

      wochentage: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      uhr: 'h'

  };

  let lang = 'de';
  try {
    const g = localStorage.getItem('endurance-lang');
    if (g === 'de' || g === 'en') lang = g;
  } catch (e) { /* ignorieren */ }
  function t(key, ...args) {
    const v = I18N[lang][key];
    return typeof v === 'function' ? v(...args) : (v == null ? key : v);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtInt(n) {
    const s = String(Math.round(Number(n) || 0));
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'de' ? '.' : ',');
  }
  function fmtDez(n, stellen) {
    if (!Number.isFinite(n)) return '–';
    const s = n.toFixed(stellen);
    return lang === 'de' ? s.replace('.', ',') : s;
  }
  function fmtProzent(anteil) {
    if (!Number.isFinite(anteil)) return '–';
    return fmtDez(anteil * 100, anteil * 100 >= 10 ? 0 : 1) + ' %';
  }
  function fmtDauer(sek) {
    if (!Number.isFinite(sek)) return '–';
    const m = Math.floor(sek / 60), s = Math.round(sek % 60);
    return `${m}:${s < 10 ? '0' : ''}${s} min`;
  }
  function isoHeute() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function isoPlus(iso, tage) {
    const [j, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(j, m - 1, d + tage));
    return dt.toISOString().slice(0, 10);
  }
  function tageZwischen(von, bis) {
    const a = Date.parse(von + 'T00:00:00Z'), b = Date.parse(bis + 'T00:00:00Z');
    return Math.round((b - a) / 86400000) + 1;
  }
  function fmtTag(iso, kurz) {
    const [j, m, d] = iso.split('-').map(Number);
    const wt = I18N[lang].wochentage[new Date(Date.UTC(j, m - 1, d)).getUTCDay()];
    if (lang === 'de') return kurz ? `${d}.${m}.` : `${wt} ${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${j}`;
    const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1];
    return kurz ? `${d} ${mon}` : `${wt} ${d} ${mon} ${j}`;
  }

  // ---------- Zugang ----------
  const gateEl = document.getElementById('stat-gate');
  const contentEl = document.getElementById('stat-content');
  let db = null;
  let geladenFuer = null;        // uid, für die die Daten stehen

  function zeigeGate(html) {
    gateEl.hidden = false;
    gateEl.innerHTML = html;
    contentEl.hidden = true;
  }

  function gateLogin() {
    zeigeGate(`<h3>${escapeHtml(t('gate_login_titel'))}</h3><p>${escapeHtml(t('gate_login_text'))}</p>
      <p><button type="button" class="stat-btn primary" id="gate-login-btn">${escapeHtml(t('gate_login_btn'))}</button></p>`);
    gateEl.querySelector('#gate-login-btn').addEventListener('click', () => {
      if (window.EndauranceAuth) window.EndauranceAuth.openModal('login');
    });
  }

  function gateKeinAdmin(uid) {
    zeigeGate(`<h3>${escapeHtml(t('gate_admin_titel'))}</h3><p>${escapeHtml(t('gate_admin_text'))}</p>
      <p>${escapeHtml(t('gate_uid'))}</p>
      <div class="uid"><code id="gate-uid">${escapeHtml(uid)}</code>
      <button type="button" class="stat-btn" id="gate-copy">${escapeHtml(t('gate_kopieren'))}</button></div>`);
    gateEl.querySelector('#gate-copy').addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(uid).then(() => { gateEl.querySelector('#gate-copy').textContent = t('kopiert'); }).catch(() => {});
      }
    });
  }

  function gateFehler(err) {
    zeigeGate(`<h3>${escapeHtml(t('gate_fehler'))}</h3><p class="leer">${escapeHtml(err && err.message ? err.message : String(err))}</p>`);
  }

  async function nachAnmeldung(user) {
    if (!user) { geladenFuer = null; gateLogin(); return; }
    if (geladenFuer === user.uid) return;
    zeigeGate(`<p class="leer">${escapeHtml(t('gate_laden'))}</p>`);
    try {
      db = firebase.firestore();
      const admin = await db.collection('admins').doc(user.uid).get();
      if (!admin.exists) { gateKeinAdmin(user.uid); return; }
      geladenFuer = user.uid;
      gateEl.hidden = true;
      contentEl.hidden = false;
      ladeWartung();
      await ladeUndZeichne();
    } catch (err) {
      gateFehler(err);
    }
  }

  // ---------- Wartungsmodus ----------
  // Das Dokument config/wartung: aktiv, text_de, text_en, geaendert, von.
  // Lesen dürfen alle (die öffentlichen Seiten fragen es im Kopf ab),
  // schreiben nur Admins - firestore.rules.
  const WARTUNG_VORGABE = {
    text_de: 'Wir arbeiten gerade an der Seite und sind in Kürze zurück.',
    text_en: 'We are working on the site and will be back shortly.'
  };
  let wartung = null;
  let wartungFehler = null;

  async function ladeWartung() {
    try {
      const snap = await db.collection('config').doc('wartung').get();
      const d = snap.exists ? snap.data() : {};
      wartung = {
        aktiv: d.aktiv === true,
        text_de: typeof d.text_de === 'string' && d.text_de ? d.text_de : WARTUNG_VORGABE.text_de,
        text_en: typeof d.text_en === 'string' && d.text_en ? d.text_en : WARTUNG_VORGABE.text_en,
        geaendert: d.geaendert && typeof d.geaendert.toDate === 'function' ? d.geaendert.toDate() : null
      };
      wartungFehler = null;
    } catch (err) {
      wartung = null;
      wartungFehler = err;
    }
    zeichneWartung();
  }

  async function speichereWartung(aktiv) {
    const card = document.getElementById('wartung-card');
    const lies = (id, vorgabe) => {
      const el = card.querySelector('#' + id);
      const v = el ? el.value.trim().slice(0, 300) : '';
      return v || vorgabe;
    };
    const daten = {
      aktiv,
      text_de: lies('wartung-de', WARTUNG_VORGABE.text_de),
      text_en: lies('wartung-en', WARTUNG_VORGABE.text_en),
      geaendert: firebase.firestore.FieldValue.serverTimestamp(),
      von: geladenFuer
    };
    card.querySelectorAll('button').forEach(b => { b.disabled = true; });
    try {
      await db.collection('config').doc('wartung').set(daten);
      wartungFehler = null;
    } catch (err) {
      wartungFehler = err;
    }
    await ladeWartung();
  }

  function zeichneWartung() {
    const card = document.getElementById('wartung-card');
    if (!card) return;
    if (!wartung) {
      card.innerHTML = `<h3><span>${escapeHtml(t('w_titel'))}</span></h3>
        <p class="leer">${escapeHtml(wartungFehler ? t('w_fehler') + ' ' + (wartungFehler.message || wartungFehler) : t('gate_laden'))}</p>
        ${wartungFehler ? `<p class="leer">${escapeHtml(t('w_regeln'))}</p>` : ''}`;
      return;
    }
    const an = wartung.aktiv;
    const seit = wartung.geaendert
      ? ` ${escapeHtml(t('w_seit'))}${escapeHtml(wartung.geaendert.toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB', { dateStyle: 'short', timeStyle: 'short' }))}.`
      : '';
    card.innerHTML = `<h3><span>${escapeHtml(t('w_titel'))}</span><small class="${an ? 'w-an' : 'w-aus'}">${escapeHtml(an ? t('w_status_an') : t('w_status_aus'))}</small></h3>
      <p>${escapeHtml(an ? t('w_erklaert_an') : t('w_erklaert_aus'))}${seit}</p>
      <div class="w-felder">
        <label>${escapeHtml(t('w_text_de'))}<input id="wartung-de" maxlength="300" value="${escapeHtml(wartung.text_de)}"></label>
        <label>${escapeHtml(t('w_text_en'))}<input id="wartung-en" maxlength="300" value="${escapeHtml(wartung.text_en)}"></label>
      </div>
      <p class="w-knoepfe">
        <button type="button" class="stat-btn primary" id="wartung-toggle">${escapeHtml(an ? t('w_aus_btn') : t('w_an_btn'))}</button>
        <button type="button" class="stat-btn" id="wartung-speichern">${escapeHtml(t('w_speichern'))}</button>
        <a class="stat-btn" href="wartung.html?vorschau" target="_blank" rel="noopener">${escapeHtml(t('w_vorschau'))}</a>
      </p>
      ${wartungFehler ? `<p class="leer">${escapeHtml(t('w_fehler'))} ${escapeHtml(wartungFehler.message || String(wartungFehler))} ${escapeHtml(t('w_regeln'))}</p>` : ''}`;
    card.querySelector('#wartung-toggle').addEventListener('click', () => {
      if (!an && !window.confirm(t('w_bestaetigen'))) return;
      speichereWartung(!an);
    });
    card.querySelector('#wartung-speichern').addEventListener('click', () => speichereWartung(an));
  }

  // ---------- Daten ----------
  const ZEITRAEUME = [
    { id: '7', tage: 7 }, { id: '30', tage: 30 }, { id: '90', tage: 90 }, { id: 'jahr' }, { id: 'alles' }
  ];
  let zeitraum = '30';
  try {
    const g = localStorage.getItem('endurance-stat-zeitraum');
    if (ZEITRAEUME.some(z => z.id === g)) zeitraum = g;
  } catch (e) { /* ignorieren */ }
  const tageCache = new Map();   // iso -> Tagesdokument
  let allesGeladen = false;

  function grenzen() {
    const heute = isoHeute();
    const z = ZEITRAEUME.find(x => x.id === zeitraum);
    if (z.tage) {
      const von = isoPlus(heute, -(z.tage - 1));
      return { von, bis: heute, vergleich: { von: isoPlus(von, -z.tage), bis: isoPlus(von, -1) } };
    }
    if (z.id === 'jahr') return { von: heute.slice(0, 4) + '-01-01', bis: heute, vergleich: null };
    return { von: null, bis: heute, vergleich: null };
  }

  async function ladeTage(von, bis) {
    const FieldPath = firebase.firestore.FieldPath;
    let q = db.collection('stats_daily');
    if (von) {
      if (tageCache.has(von) && tageCache.has(bis) && alleImCache(von, bis)) return;
      q = q.where(FieldPath.documentId(), '>=', von).where(FieldPath.documentId(), '<=', bis);
    } else if (allesGeladen) {
      return;
    }
    const snap = await q.get();
    if (!von) allesGeladen = true;
    if (von) {
      // Auch leere Tage merken, sonst fragt jeder Wechsel neu nach.
      for (let d = von; d <= bis; d = isoPlus(d, 1)) if (!tageCache.has(d)) tageCache.set(d, null);
    }
    snap.forEach(doc => tageCache.set(doc.id, doc.data()));
  }
  function alleImCache(von, bis) {
    for (let d = von; d <= bis; d = isoPlus(d, 1)) if (!tageCache.has(d)) return false;
    return true;
  }
  function tageIm(von, bis) {
    const liste = [];
    if (!von) {
      const mitDaten = Array.from(tageCache.keys()).filter(d => tageCache.get(d) && d <= bis).sort();
      if (!mitDaten.length) return liste;
      von = mitDaten[0];
    }
    for (let d = von; d <= bis; d = isoPlus(d, 1)) liste.push({ d, doc: tageCache.get(d) || null });
    return liste;
  }

  const LISTEN_FELDER = ['seiten', 'einstieg', 'ausstieg', 'referrer', 'quellen', 'medien', 'kampagnen', 'laender', 'sprachen',
    'seitensprache', 'schema', 'geraete', 'browser', 'systeme', 'aktionen', 'events', 'veranstalter', 'kalender', 'teilen', 'abo', 'melden', 'suche', 'filter'];

  function summiere(tage) {
    const s = { pv: 0, besucher: 0, besuche: 0, absprung: 0, dauer_sek: 0, dauer_n: 0, stunden: new Array(24).fill(0), listen: {}, aktualisiert: null, tageMitDaten: 0 };
    LISTEN_FELDER.forEach(f => { s.listen[f] = new Map(); });
    tage.forEach(({ doc }) => {
      if (!doc) return;
      s.tageMitDaten++;
      s.pv += doc.pv || 0; s.besucher += doc.besucher || 0; s.besuche += doc.besuche || 0;
      s.absprung += doc.absprung || 0; s.dauer_sek += doc.dauer_sek || 0; s.dauer_n += doc.dauer_n || 0;
      (doc.stunden || []).forEach((n, i) => { if (i < 24) s.stunden[i] += n || 0; });
      LISTEN_FELDER.forEach(f => {
        (doc[f] || []).forEach(({ k, n }) => { if (k != null) s.listen[f].set(k, (s.listen[f].get(k) || 0) + (n || 0)); });
      });
      const akt = doc.aktualisiert && typeof doc.aktualisiert.toMillis === 'function' ? doc.aktualisiert.toMillis() : 0;
      if (akt > (s.aktualisiert || 0)) s.aktualisiert = akt;
    });
    return s;
  }

  // ---------- Zeichnen ----------
  let aktuell = null;    // {tage, summe, vergleich}

  async function ladeUndZeichne() {
    const g = grenzen();
    const ladeVon = g.vergleich ? g.vergleich.von : g.von;
    await ladeTage(ladeVon, g.bis);
    const tage = tageIm(g.von, g.bis);
    const summe = summiere(tage);
    const vergleich = g.vergleich ? summiere(tageIm(g.vergleich.von, g.vergleich.bis)) : null;
    aktuell = { tage, summe, vergleich, g };
    zeichneAlles();
  }

  function zeichneAlles() {
    if (!aktuell) return;
    zeichneZeitraum();
    zeichneKpis();
    zeichneVerlauf();
    zeichneStunden();
    zeichneListen();
    const standEl = document.getElementById('stat-stand');
    if (aktuell.summe.aktualisiert) {
      const d = new Date(aktuell.summe.aktualisiert);
      standEl.textContent = `${t('stand')}: ${d.toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB', { dateStyle: 'short', timeStyle: 'short' })}`;
    } else {
      standEl.textContent = '';
    }
  }

  function zeichneZeitraum() {
    const el = document.getElementById('stat-range');
    el.innerHTML = ZEITRAEUME.map(z =>
      `<button type="button" data-z="${z.id}" class="${z.id === zeitraum ? 'active' : ''}" aria-pressed="${z.id === zeitraum}">${escapeHtml(t('z' + z.id))}</button>`
    ).join('');
  }
  document.getElementById('stat-range').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-z]');
    if (!b || b.dataset.z === zeitraum) return;
    zeitraum = b.dataset.z;
    try { localStorage.setItem('endurance-stat-zeitraum', zeitraum); } catch (e) { /* ignorieren */ }
    // Beim Nachladen bleibt das alte Bild stehen, nur leicht gedämpft.
    contentEl.style.opacity = '0.6';
    ladeUndZeichne().catch(gateFehler).finally(() => { contentEl.style.opacity = ''; });
  });

  function delta(neu, alt, prozentpunkte) {
    if (!aktuell.vergleich) return '';
    if (!Number.isFinite(alt) || !Number.isFinite(neu)) return '';
    if (prozentpunkte) {
      const diff = (neu - alt) * 100;
      if (Math.abs(diff) < 0.05) return `<div class="delta">± 0 ${escapeHtml(t('punkte'))}</div>`;
      return `<div class="delta ${diff > 0 ? 'down' : 'up'}">${diff > 0 ? '+' : '−'}${fmtDez(Math.abs(diff), 1)} ${escapeHtml(t('punkte'))}</div>`;
    }
    if (alt === 0) return neu > 0 ? `<div class="delta up">+ ${escapeHtml(t('vergleich', aktuell.tage.length))}</div>` : '<div class="delta"></div>';
    const p = (neu - alt) / alt * 100;
    if (Math.abs(p) < 0.5) return `<div class="delta">± 0 %</div>`;
    return `<div class="delta ${p > 0 ? 'up' : 'down'}">${p > 0 ? '+' : '−'}${fmtDez(Math.abs(p), Math.abs(p) >= 10 ? 0 : 1)} % ${escapeHtml(t('vergleich', aktuell.tage.length))}</div>`;
  }

  function zeichneKpis() {
    const s = aktuell.summe, v = aktuell.vergleich;
    const jeBesuch = s.besuche ? s.pv / s.besuche : NaN;
    const absprung = s.besuche ? s.absprung / s.besuche : NaN;
    const dauer = s.dauer_n ? s.dauer_sek / s.dauer_n : NaN;
    const vJe = v && v.besuche ? v.pv / v.besuche : NaN;
    const vAb = v && v.besuche ? v.absprung / v.besuche : NaN;
    const vDa = v && v.dauer_n ? v.dauer_sek / v.dauer_n : NaN;
    // Absprungrate: hoch ist schlecht - deshalb dort die Farben vertauscht
    // (siehe delta(…, true): plus = rot).
    const kacheln = [
      { label: t('kpi_besucher'), wert: fmtInt(s.besucher), d: delta(s.besucher, v ? v.besucher : NaN), hint: t('kpi_besucher_hint') },
      { label: t('kpi_besuche'), wert: fmtInt(s.besuche), d: delta(s.besuche, v ? v.besuche : NaN) },
      { label: t('kpi_pv'), wert: fmtInt(s.pv), d: delta(s.pv, v ? v.pv : NaN) },
      { label: t('kpi_je_besuch'), wert: fmtDez(jeBesuch, 1), d: delta(jeBesuch, vJe) },
      { label: t('kpi_absprung'), wert: fmtProzent(absprung), d: delta(absprung, vAb, true) },
      { label: t('kpi_dauer'), wert: fmtDauer(dauer), d: delta(dauer, vDa) }
    ];
    document.getElementById('stat-kpis').innerHTML = kacheln.map(k =>
      `<div class="kpi"><div class="label">${escapeHtml(k.label)}</div><div class="value">${escapeHtml(k.wert)}</div>${k.d || '<div class="delta"></div>'}${k.hint ? `<div class="hint">${escapeHtml(k.hint)}</div>` : ''}</div>`
    ).join('');
  }

  function svgEl(name, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', name);
    Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
    return el;
  }
  function schoeneSkala(max) {
    if (max <= 0) return { max: 4, schritt: 1 };
    const roh = max / 4;
    const zehner = Math.pow(10, Math.floor(Math.log10(roh)));
    const schritt = [1, 2, 5, 10].map(f => f * zehner).find(s => s >= roh) || 10 * zehner;
    return { max: schritt * 4, schritt };
  }
  function kompakt(n) {
    if (n >= 1000000) return fmtDez(n / 1000000, 1) + 'M';
    if (n >= 1000) return (n % 1000 === 0 ? String(n / 1000) : fmtDez(n / 1000, 1)) + 'K';
    return String(n);
  }

  function zeichneVerlauf() {
    const wrap = document.getElementById('wrap-verlauf');
    const svg = document.getElementById('chart-verlauf');
    const tip = document.getElementById('tip-verlauf');
    const tage = aktuell.tage;
    svg.innerHTML = '';
    document.getElementById('legend-verlauf').innerHTML =
      `<span><i class="key key-1"></i>${escapeHtml(t('kpi_besucher'))}</span>` +
      `<span><i class="key key-2"></i>${escapeHtml(t('kpi_pv'))}</span>`;
    const W = Math.max(320, wrap.clientWidth || 800), H = 260;
    const padL = 44, padR = 16, padT = 12, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('aria-label', `${t('verlauf')}: ${t('kpi_besucher')} ${fmtInt(aktuell.summe.besucher)}, ${t('kpi_pv')} ${fmtInt(aktuell.summe.pv)}`);
    if (!tage.length || !aktuell.summe.tageMitDaten) {
      const txt = svgEl('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', class: 'leer', fill: 'currentColor' });
      txt.textContent = t('keine_daten');
      txt.style.fontSize = '13px';
      svg.appendChild(txt);
      zeichneTabelle();
      return;
    }
    const werte1 = tage.map(x => (x.doc && x.doc.besucher) || 0);
    const werte2 = tage.map(x => (x.doc && x.doc.pv) || 0);
    const skala = schoeneSkala(Math.max(...werte2, ...werte1));
    const x = (i) => padL + (tage.length === 1 ? iw / 2 : i * iw / (tage.length - 1));
    const y = (v) => padT + ih - (v / skala.max) * ih;

    const grid = svgEl('g', { class: 'grid' });
    const axis = svgEl('g', { class: 'axis' });
    for (let v = 0; v <= skala.max; v += skala.schritt) {
      grid.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v) }));
      const tx = svgEl('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end' });
      tx.textContent = kompakt(v);
      axis.appendChild(tx);
    }
    const schrittX = Math.max(1, Math.ceil(tage.length / Math.max(2, Math.floor(iw / 70))));
    tage.forEach((tg, i) => {
      if (i % schrittX !== 0 && i !== tage.length - 1) return;
      const tx = svgEl('text', { x: x(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === tage.length - 1 ? 'end' : 'middle' });
      tx.textContent = fmtTag(tg.d, true);
      axis.appendChild(tx);
    });
    svg.appendChild(grid); svg.appendChild(axis);

    const pfad = (werte) => werte.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (tage.length > 1) {
      svg.appendChild(svgEl('path', { class: 'wash-1', d: `${pfad(werte1)} L${x(tage.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z` }));
      svg.appendChild(svgEl('path', { class: 'reihe reihe-2', d: pfad(werte2) }));
      svg.appendChild(svgEl('path', { class: 'reihe reihe-1', d: pfad(werte1) }));
    }
    // Endpunkte (Ring in Flächenfarbe) - und bei einem einzelnen Tag der Punkt selbst.
    const letzte = tage.length - 1;
    svg.appendChild(svgEl('circle', { class: 'punkt-2', cx: x(letzte), cy: y(werte2[letzte]), r: 4 }));
    svg.appendChild(svgEl('circle', { class: 'punkt-1', cx: x(letzte), cy: y(werte1[letzte]), r: 4 }));
    const cursor = svgEl('line', { class: 'cursor', x1: 0, x2: 0, y1: padT, y2: padT + ih });
    svg.appendChild(cursor);
    const p1 = svgEl('circle', { class: 'punkt-1', r: 4, style: 'display:none' });
    const p2 = svgEl('circle', { class: 'punkt-2', r: 4, style: 'display:none' });
    svg.appendChild(p2); svg.appendChild(p1);
    const fang = svgEl('rect', { class: 'fang', x: padL, y: padT, width: iw, height: ih });
    svg.appendChild(fang);

    function zeige(i, clientX) {
      const tg = tage[i];
      cursor.setAttribute('x1', x(i)); cursor.setAttribute('x2', x(i)); cursor.style.opacity = '1';
      p1.setAttribute('cx', x(i)); p1.setAttribute('cy', y(werte1[i])); p1.style.display = '';
      p2.setAttribute('cx', x(i)); p2.setAttribute('cy', y(werte2[i])); p2.style.display = '';
      tip.innerHTML = `<div class="tip-datum">${escapeHtml(fmtTag(tg.d))}</div>` +
        `<div class="tip-zeile"><span><i class="key key-1"></i>${escapeHtml(t('kpi_besucher'))}</span><b>${fmtInt(werte1[i])}</b></div>` +
        `<div class="tip-zeile"><span><i class="key key-2"></i>${escapeHtml(t('kpi_pv'))}</span><b>${fmtInt(werte2[i])}</b></div>` +
        (tg.doc ? `<div class="tip-zeile"><span>${escapeHtml(t('kpi_besuche'))}</span><b>${fmtInt(tg.doc.besuche || 0)}</b></div>` : '');
      tip.style.display = 'block';
      const r = wrap.getBoundingClientRect();
      const links = clientX - r.left;
      const breite = tip.offsetWidth || 160;
      tip.style.left = `${Math.min(Math.max(0, links - breite / 2), r.width - breite)}px`;
      tip.style.top = '8px';
    }
    function verstecke() {
      cursor.style.opacity = '0'; p1.style.display = 'none'; p2.style.display = 'none'; tip.style.display = 'none';
    }
    fang.addEventListener('pointermove', (ev) => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (W / r.width);
      let i = tage.length === 1 ? 0 : Math.round((px - padL) / iw * (tage.length - 1));
      i = Math.max(0, Math.min(tage.length - 1, i));
      zeige(i, ev.clientX);
    });
    fang.addEventListener('pointerleave', verstecke);
    zeichneTabelle();
  }

  function zeichneTabelle() {
    document.getElementById('t-tabelle').textContent = t('tabelle');
    const tbl = document.getElementById('tabelle-verlauf');
    const zeilen = aktuell.tage.filter(x => x.doc);
    tbl.innerHTML = `<thead><tr><th>${escapeHtml(t('th_tag'))}</th><th>${escapeHtml(t('th_besucher'))}</th><th>${escapeHtml(t('th_besuche'))}</th><th>${escapeHtml(t('th_pv'))}</th><th>${escapeHtml(t('th_absprung'))}</th><th>${escapeHtml(t('th_dauer'))}</th></tr></thead><tbody>` +
      zeilen.slice().reverse().map(({ d, doc }) =>
        `<tr><td>${escapeHtml(fmtTag(d))}</td><td>${fmtInt(doc.besucher)}</td><td>${fmtInt(doc.besuche)}</td><td>${fmtInt(doc.pv)}</td><td>${fmtInt(doc.absprung)}</td><td>${escapeHtml(doc.dauer_n ? fmtDauer(doc.dauer_sek / doc.dauer_n) : '–')}</td></tr>`
      ).join('') + '</tbody>';
  }

  function zeichneStunden() {
    const wrap = document.getElementById('wrap-stunden');
    const svg = document.getElementById('chart-stunden');
    const tip = document.getElementById('tip-stunden');
    document.getElementById('h-stunden').textContent = t('stunden');
    document.getElementById('h-stunden-sub').textContent = t('stunden_sub');
    svg.innerHTML = '';
    const werte = aktuell.summe.stunden;
    const W = Math.max(320, wrap.clientWidth || 800), H = 200;
    const padL = 36, padR = 10, padT = 10, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    const spitze = werte.indexOf(Math.max(...werte));
    svg.setAttribute('aria-label', `${t('stunden')}: ${t('stunden_sub')}${aktuell.summe.pv ? `, ${spitze}:00 ${t('uhr')}` : ''}`);
    const skala = schoeneSkala(Math.max(...werte));
    const y = (v) => padT + ih - (v / skala.max) * ih;
    const grid = svgEl('g', { class: 'grid' });
    const axis = svgEl('g', { class: 'axis' });
    for (let v = 0; v <= skala.max; v += skala.schritt) {
      grid.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v) }));
      const tx = svgEl('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end' });
      tx.textContent = kompakt(v);
      axis.appendChild(tx);
    }
    svg.appendChild(grid);
    const slot = iw / 24;
    const breite = Math.min(24, Math.max(4, slot - 2));
    werte.forEach((v, h) => {
      const bx = padL + h * slot + (slot - breite) / 2;
      const hoehe = Math.max(0, y(0) - y(v));
      const r = Math.min(4, breite / 2, hoehe);
      // Balken: oben gerundet (4 px), an der Grundlinie eckig.
      const d = hoehe > 0
        ? `M${bx},${y(0)} V${y(v) + r} Q${bx},${y(v)} ${bx + r},${y(v)} H${bx + breite - r} Q${bx + breite},${y(v)} ${bx + breite},${y(v) + r} V${y(0)} Z`
        : '';
      const g = svgEl('g', {});
      if (d) g.appendChild(svgEl('path', { class: 'balken', d }));
      const fang = svgEl('rect', { class: 'fang', x: padL + h * slot, y: padT, width: slot, height: ih });
      fang.addEventListener('pointerenter', (ev) => {
        g.querySelectorAll('.balken').forEach(b => b.classList.add('aktiv'));
        tip.innerHTML = `<div class="tip-zeile"><span>${h}:00–${h + 1}:00 ${escapeHtml(t('uhr'))}</span><b>${fmtInt(v)}</b></div>`;
        tip.style.display = 'block';
        const wr = wrap.getBoundingClientRect();
        const tb = tip.offsetWidth || 140;
        const links = (bx + breite / 2) * (wr.width / W);
        tip.style.left = `${Math.min(Math.max(0, links - tb / 2), wr.width - tb)}px`;
        tip.style.top = '0px';
      });
      fang.addEventListener('pointerleave', () => {
        g.querySelectorAll('.balken').forEach(b => b.classList.remove('aktiv'));
        tip.style.display = 'none';
      });
      g.appendChild(fang);
      svg.appendChild(g);
      if (h % 3 === 0) {
        const tx = svgEl('text', { x: padL + h * slot + slot / 2, y: H - 8, 'text-anchor': 'middle' });
        tx.textContent = `${h}`;
        axis.appendChild(tx);
      }
    });
    svg.appendChild(axis);
  }

  // ---------- Listen ----------
  const ABSCHNITTE = [
    { titel: 's_seiten', listen: ['seiten', 'einstieg', 'ausstieg'] },
    { titel: 's_herkunft', listen: ['referrer', 'laender', 'sprachen', 'quellen', 'medien', 'kampagnen'] },
    { titel: 's_technik', listen: ['geraete', 'browser', 'systeme', 'seitensprache', 'schema'] },
    { titel: 's_aktionen', listen: ['aktionen', 'events', 'veranstalter', 'suche', 'filter', 'kalender', 'teilen', 'abo', 'melden'] }
  ];
  const BESCHRIFTUNG = {
    seiten: (k) => t('p_' + k) === 'p_' + k ? k : t('p_' + k),
    einstieg: (k) => BESCHRIFTUNG.seiten(k),
    ausstieg: (k) => BESCHRIFTUNG.seiten(k),
    referrer: (k) => k === '(direkt)' ? t('direkt') : k,
    laender: (k) => I18N[lang].ld[k] || k,
    seitensprache: (k) => k.toUpperCase(),
    schema: (k) => t('schema_' + k) === 'schema_' + k ? k : t('schema_' + k),
    geraete: (k) => t('dv_' + k) === 'dv_' + k ? k : t('dv_' + k),
    aktionen: (k) => t('akt_' + k) === 'akt_' + k ? k : t('akt_' + k),
    kalender: (k) => t('kal_' + k) === 'kal_' + k ? k : t('kal_' + k),
    teilen: (k) => t('teilen_' + k) === 'teilen_' + k ? k : t('teilen_' + k),
    filter: (k) => k.replace('=', ': ')
  };
  const ANFANG = 8;
  const offen = new Set();   // Listen, die ganz gezeigt werden

  function zeichneListen() {
    const root = document.getElementById('stat-listen');
    root.innerHTML = ABSCHNITTE.map(a =>
      `<h3 class="stat-section-title">${escapeHtml(t(a.titel))}</h3><div class="stat-grid">` +
      a.listen.map(f => listeHtml(f)).join('') + '</div>'
    ).join('');
  }

  function listeHtml(feld) {
    const map = aktuell.summe.listen[feld] || new Map();
    const eintraege = Array.from(map, ([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n || (a.k < b.k ? -1 : 1));
    const gesamt = eintraege.reduce((s, e) => s + e.n, 0);
    const max = eintraege.length ? eintraege[0].n : 0;
    const zeigeAlle = offen.has(feld);
    const sichtbar = zeigeAlle ? eintraege : eintraege.slice(0, ANFANG);
    const beschrifte = BESCHRIFTUNG[feld] || ((k) => k);
    let html = `<section class="stat-card" data-liste="${feld}"><h3><span>${escapeHtml(t('l_' + feld))}</span><small>${fmtInt(gesamt)}</small></h3>`;
    if (!eintraege.length) {
      html += `<p class="leer">${escapeHtml(t('leer'))}</p></section>`;
      return html;
    }
    html += '<ul class="liste">' + sichtbar.map(e =>
      `<li><div class="zeile"><span class="name" title="${escapeHtml(e.k)}">${escapeHtml(beschrifte(String(e.k)))}</span><span class="zahl">${fmtInt(e.n)}</span><span class="anteil">${escapeHtml(fmtProzent(gesamt ? e.n / gesamt : 0))}</span></div><div class="spur"><i style="width:${max ? (e.n / max * 100).toFixed(1) : 0}%"></i></div></li>`
    ).join('') + '</ul>';
    if (eintraege.length > ANFANG) {
      html += `<button type="button" class="mehr-btn" data-mehr="${feld}">${escapeHtml(zeigeAlle ? t('weniger') : `${t('mehr')} (${eintraege.length})`)}</button>`;
    }
    return html + '</section>';
  }
  document.getElementById('stat-listen').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-mehr]');
    if (!b) return;
    const feld = b.dataset.mehr;
    if (offen.has(feld)) offen.delete(feld); else offen.add(feld);
    const alt = b.closest('section[data-liste]');
    const tmp = document.createElement('div');
    tmp.innerHTML = listeHtml(feld);
    alt.replaceWith(tmp.firstElementChild);
  });

  // ---------- CSV ----------
  document.getElementById('csv-btn').addEventListener('click', () => {
    if (!aktuell) return;
    const zeilen = [[t('th_tag'), t('th_besucher'), t('th_besuche'), t('th_pv'), t('th_absprung'), t('th_dauer') + ' (s)']];
    aktuell.tage.filter(x => x.doc).forEach(({ d, doc }) => {
      zeilen.push([d, doc.besucher || 0, doc.besuche || 0, doc.pv || 0, doc.absprung || 0, doc.dauer_n ? Math.round(doc.dauer_sek / doc.dauer_n) : '']);
    });
    const csv = zeilen.map(z => z.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `endurance-events-statistik-${aktuell.g.von || 'alles'}-${aktuell.g.bis}.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });

  // ---------- Sprache ----------
  function applyLang(l) {
    lang = l;
    try { localStorage.setItem('endurance-lang', l); } catch (e) { /* ignorieren */ }
    document.documentElement.lang = l;
    document.title = t('title') + ' – Endurance Events';
    document.getElementById('stat-title').textContent = t('title');
    document.getElementById('stat-sub').textContent = t('sub');
    document.getElementById('nav-events').textContent = t('nav_events');
    document.getElementById('nav-map').textContent = t('nav_map');
    document.getElementById('h-verlauf').textContent = t('verlauf');
    document.getElementById('csv-btn').textContent = t('csv');
    document.getElementById('footer-impressum').textContent = l === 'de' ? 'Impressum' : 'Legal notice';
    document.getElementById('footer-datenschutz').textContent = l === 'de' ? 'Datenschutz' : 'Privacy';
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    if (aktuell) zeichneAlles();
    else if (!gateEl.hidden) {
      // Der Zugangshinweis trägt Text - neu zeichnen, je nach Zustand.
      if (geladenFuer === null && window.EndauranceAuth && !window.EndauranceAuth.getUser()) gateLogin();
    }
    zeichneWartung();
  }
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });
  applyLang(lang);

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (!aktuell) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { zeichneVerlauf(); zeichneStunden(); }, 150);
  });

  // auth.js lädt mit defer und existiert hier noch nicht - deshalb über
  // die Warteschlange (dieselbe wie in events.html).
  zeigeGate(`<p class="leer">${escapeHtml(t('gate_laden'))}</p>`);
  if (!window.FIREBASE_CONFIGURED && document.readyState === 'complete') {
    zeigeGate(`<p class="leer">${escapeHtml(t('gate_nicht_konfiguriert'))}</p>`);
  }
  (window.EE_AUTH_QUEUE = window.EE_AUTH_QUEUE || []).push((user) => {
    nachAnmeldung(user).catch(gateFehler);
  });
  window.addEventListener('load', () => {
    if (!window.FIREBASE_CONFIGURED) zeigeGate(`<p class="leer">${escapeHtml(t('gate_nicht_konfiguriert'))}</p>`);
  });
})();
</script>
</body>
</html>
