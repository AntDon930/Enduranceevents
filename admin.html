  // ---------- Daten ----------
  // „Monat" (14.10.2026): Werbung wird je Kalendermonat verkauft, deshalb
  // neben den gleitenden Zeiträumen ein fester Monat mit ‹ › daneben.
  // Vergleich ist der Vormonat über GLEICH VIELE Tage (der 14. Oktober
  // gegen den 1.–14. September), sonst stünde ein halber Monat gegen
  // einen ganzen.
  const ZEITRAEUME = [
    { id: '7', tage: 7 }, { id: '30', tage: 30 }, { id: '90', tage: 90 }, { id: 'monat' }, { id: 'jahr' }, { id: 'alles' }
  ];
  let zeitraum = '30';
  try {
    const g = localStorage.getItem('endurance-stat-zeitraum');
    if (ZEITRAEUME.some(z => z.id === g)) zeitraum = g;
  } catch (e) { /* ignorieren */ }
  let monat = isoHeute().slice(0, 7);   // YYYY-MM, der gewählte Monat
  const MONATE_IM_BILD = 12;
  const tageCache = new Map();   // iso -> Tagesdokument
  let allesGeladen = false;

  function monatPlus(ym, n) {
    const [j, m] = ym.split('-').map(Number);
    return new Date(Date.UTC(j, m - 1 + n, 1)).toISOString().slice(0, 7);
  }
  function monatsEnde(ym) {
    const [j, m] = ym.split('-').map(Number);
    return new Date(Date.UTC(j, m, 0)).toISOString().slice(0, 10);
  }
  function fmtMonat(ym) {
    const [j, m] = ym.split('-').map(Number);
    return `${I18N[lang].monate[m - 1]} ${j}`;
  }
  function wochentagVon(iso) {
    const [j, m, d] = iso.split('-').map(Number);
    return new Date(Date.UTC(j, m - 1, d)).getUTCDay();
  }

  function grenzen() {
    const heute = isoHeute();
    const z = ZEITRAEUME.find(x => x.id === zeitraum);
    if (z.tage) {
      const von = isoPlus(heute, -(z.tage - 1));
      return { von, bis: heute, vergleich: { von: isoPlus(von, -z.tage), bis: isoPlus(von, -1) }, vergleichArt: 'tage' };
    }
    if (z.id === 'monat') {
      if (monat > heute.slice(0, 7)) monat = heute.slice(0, 7);
      const von = monat + '-01';
      const ende = monatsEnde(monat);
      const bis = ende < heute ? ende : heute;
      const vm = monatPlus(monat, -1);
      const vBis = isoPlus(vm + '-01', tageZwischen(von, bis) - 1);
      const vEnde = monatsEnde(vm);
      return { von, bis, vergleich: { von: vm + '-01', bis: vBis < vEnde ? vBis : vEnde }, vergleichArt: 'monat' };
    }
    if (z.id === 'jahr') return { von: heute.slice(0, 4) + '-01-01', bis: heute, vergleich: null };
    return { von: null, bis: heute, vergleich: null };
  }

  async function ladeTage(von, bis) {
    const FieldPath = firebase.firestore.FieldPath;
    let q = db.collection('stats_daily');
    if (von) {
      if (tageCache.has(von) && tageCache.has(bis) && alleImCache(von, bis)) return;
      q = q.where(FieldPath.documentId(), '>=', von).where(FieldPath.documentId(), '<=', bis);
    } else if (allesGeladen) {
      return;
    }
    const snap = await q.get();
    if (!von) allesGeladen = true;
    if (von) {
      // Auch leere Tage merken, sonst fragt jeder Wechsel neu nach.
      for (let d = von; d <= bis; d = isoPlus(d, 1)) if (!tageCache.has(d)) tageCache.set(d, null);
    }
    snap.forEach(doc => tageCache.set(doc.id, doc.data()));
  }
  function alleImCache(von, bis) {
    for (let d = von; d <= bis; d = isoPlus(d, 1)) if (!tageCache.has(d)) return false;
    return true;
  }
  function tageIm(von, bis) {
    const liste = [];
    if (!von) {
      const mitDaten = Array.from(tageCache.keys()).filter(d => tageCache.get(d) && d <= bis).sort();
      if (!mitDaten.length) return liste;
      von = mitDaten[0];
    }
    for (let d = von; d <= bis; d = isoPlus(d, 1)) liste.push({ d, doc: tageCache.get(d) || null });
    return liste;
  }

  // Jede Liste eines Tagesdokuments (stats_aggregate.js: AKTIONS_DETAIL
  // plus die festen Listen) - test_statistik vergleicht.
  const LISTEN_FELDER = ['seiten', 'einstieg', 'ausstieg', 'referrer', 'quellen', 'medien', 'kampagnen', 'laender', 'sprachen',
    'seitensprache', 'schema', 'geraete', 'browser', 'systeme', 'aktionen', 'events', 'veranstalter', 'kalender', 'teilen', 'abo', 'melden', 'suche', 'filter',
    'sport_events', 'sport_veranstalter', 'sport_region', 'events_kalender', 'events_teilen', 'anzeige_sicht', 'anzeige_klick',
    'kanaele', 'instagram_medien', 'instagram_kampagnen', 'instagram_einstieg', 'instagram_aktionen'];
  // Die Zahlen des Objekts `instagram` im Tagesdokument (stats_aggregate.js).
  const IG_FELDER = ['besucher', 'besuche', 'pv', 'absprung', 'dauer_sek', 'dauer_n'];
  const IG_LINK = 'https://endurance-events.de/?utm_source=instagram&utm_medium=bio';

  // Der jüngste Abo-Stand (abos_aktiv, von aggregateStats ins Dokument des
  // Tages geschrieben) bis zum Tag `bis`, auf Wunsch frühestens ab `von`;
  // `erster` liefert stattdessen den ÄLTESTEN Stand im Fenster.
  function aboStand(bis, von, erster) {
    let best = null;
    tageCache.forEach((doc, d) => {
      if (!doc || typeof doc.abos_aktiv !== 'number' || d > bis || (von && d < von)) return;
      if (!best || (erster ? d < best.d : d > best.d)) best = { d, n: doc.abos_aktiv, rhythmus: doc.abos_rhythmus || [] };
    });
    return best;
  }

  function summiere(tage) {
    const s = { pv: 0, besucher: 0, besuche: 0, absprung: 0, dauer_sek: 0, dauer_n: 0, stunden: new Array(24).fill(0), listen: {}, aktualisiert: null, tageMitDaten: 0, ig: {} };
    IG_FELDER.forEach(f => { s.ig[f] = 0; });
    LISTEN_FELDER.forEach(f => { s.listen[f] = new Map(); });
    tage.forEach(({ doc }) => {
      if (!doc) return;
      s.tageMitDaten++;
      s.pv += doc.pv || 0; s.besucher += doc.besucher || 0; s.besuche += doc.besuche || 0;
      s.absprung += doc.absprung || 0; s.dauer_sek += doc.dauer_sek || 0; s.dauer_n += doc.dauer_n || 0;
      (doc.stunden || []).forEach((n, i) => { if (i < 24) s.stunden[i] += n || 0; });
      if (doc.instagram) IG_FELDER.forEach(f => { s.ig[f] += doc.instagram[f] || 0; });
      LISTEN_FELDER.forEach(f => {
        (doc[f] || []).forEach(({ k, n }) => { if (k != null) s.listen[f].set(k, (s.listen[f].get(k) || 0) + (n || 0)); });
      });
      const akt = doc.aktualisiert && typeof doc.aktualisiert.toMillis === 'function' ? doc.aktualisiert.toMillis() : 0;
      if (akt > (s.aktualisiert || 0)) s.aktualisiert = akt;
    });
    return s;
  }

  // ---------- Zeichnen ----------
  let aktuell = null;    // {tage, summe, vergleich}

  async function ladeUndZeichne() {
    const g = grenzen();
    // Die letzten zwölf Monate zuerst (eine Abfrage): Daraus kommen das
    // Monatsdiagramm und fast jeder Zeitraum samt Vergleich aus dem Cache.
    const heute = isoHeute();
    await ladeTage(monatPlus(heute.slice(0, 7), -(MONATE_IM_BILD - 1)) + '-01', heute);
    const ladeVon = g.vergleich ? g.vergleich.von : g.von;
    await ladeTage(ladeVon, g.bis);
    const tage = tageIm(g.von, g.bis);
    const summe = summiere(tage);
    const vergleich = g.vergleich ? summiere(tageIm(g.vergleich.von, g.vergleich.bis)) : null;
    aktuell = { tage, summe, vergleich, g };
    zeichneAlles();
  }

  function zeichneAlles() {
    if (!aktuell) return;
    zeichneZeitraum();
    zeichneKpis();
    zeichneInstagram();
    zeichneVerlauf();
    zeichneMonate();
    zeichneStunden();
    zeichneWochentage();
    zeichneListen();
    const standEl = document.getElementById('stat-stand');
    if (aktuell.summe.aktualisiert) {
      const d = new Date(aktuell.summe.aktualisiert);
      standEl.textContent = `${t('stand')}: ${d.toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB', { dateStyle: 'short', timeStyle: 'short' })}`;
    } else {
      standEl.textContent = '';
    }
  }

  function zeichneZeitraum() {
    const el = document.getElementById('stat-range');
    el.innerHTML = ZEITRAEUME.map(z =>
      `<button type="button" data-z="${z.id}" class="${z.id === zeitraum ? 'active' : ''}" aria-pressed="${z.id === zeitraum}">${escapeHtml(t('z' + z.id))}</button>`
    ).join('') + (zeitraum === 'monat'
      ? `<span class="stat-monat"><button type="button" data-m="-1" aria-label="${escapeHtml(t('monat_zurueck'))}">‹</button><b>${escapeHtml(fmtMonat(monat))}</b><button type="button" data-m="1" aria-label="${escapeHtml(t('monat_vor'))}" ${monat >= isoHeute().slice(0, 7) ? 'disabled' : ''}>›</button></span>`
      : '');
  }
  function neuLaden() {
    // Beim Nachladen bleibt das alte Bild stehen, nur leicht gedämpft.
    contentEl.style.opacity = '0.6';
    ladeUndZeichne().catch(gateFehler).finally(() => { contentEl.style.opacity = ''; });
  }
  document.getElementById('stat-range').addEventListener('click', (ev) => {
    const m = ev.target.closest('button[data-m]');
    if (m) {
      const neu = monatPlus(monat, Number(m.dataset.m));
      if (neu > isoHeute().slice(0, 7)) return;
      monat = neu;
      neuLaden();
      return;
    }
    const b = ev.target.closest('button[data-z]');
    if (!b || b.dataset.z === zeitraum) return;
    zeitraum = b.dataset.z;
    try { localStorage.setItem('endurance-stat-zeitraum', zeitraum); } catch (e) { /* ignorieren */ }
    neuLaden();
  });

  function delta(neu, alt, prozentpunkte) {
    if (!aktuell.vergleich) return '';
    if (!Number.isFinite(alt) || !Number.isFinite(neu)) return '';
    if (prozentpunkte) {
      const diff = (neu - alt) * 100;
      if (Math.abs(diff) < 0.05) return `<div class="delta">± 0 ${escapeHtml(t('punkte'))}</div>`;
      return `<div class="delta ${diff > 0 ? 'down' : 'up'}">${diff > 0 ? '+' : '−'}${fmtDez(Math.abs(diff), 1)} ${escapeHtml(t('punkte'))}</div>`;
    }
    const txt = vergleichText();
    if (alt === 0) return neu > 0 ? `<div class="delta up">+ ${escapeHtml(txt)}</div>` : '<div class="delta"></div>';
    const p = (neu - alt) / alt * 100;
    if (Math.abs(p) < 0.5) return `<div class="delta">± 0 %</div>`;
    return `<div class="delta ${p > 0 ? 'up' : 'down'}">${p > 0 ? '+' : '−'}${fmtDez(Math.abs(p), Math.abs(p) >= 10 ? 0 : 1)} % ${escapeHtml(txt)}</div>`;
  }
  function vergleichText() {
    return aktuell.g.vergleichArt === 'monat' ? t('vergleich_monat') : t('vergleich', aktuell.tage.length);
  }

  function zeichneKpis() {
    const s = aktuell.summe, v = aktuell.vergleich;
    const jeBesuch = s.besuche ? s.pv / s.besuche : NaN;
    const absprung = s.besuche ? s.absprung / s.besuche : NaN;
    const dauer = s.dauer_n ? s.dauer_sek / s.dauer_n : NaN;
    const vJe = v && v.besuche ? v.pv / v.besuche : NaN;
    const vAb = v && v.besuche ? v.absprung / v.besuche : NaN;
    const vDa = v && v.dauer_n ? v.dauer_sek / v.dauer_n : NaN;
    // Absprungrate: hoch ist schlecht - deshalb dort die Farben vertauscht
    // (siehe delta(…, true): plus = rot).
    const kacheln = [
      { label: t('kpi_besucher'), wert: fmtInt(s.besucher), d: delta(s.besucher, v ? v.besucher : NaN), hint: t('kpi_besucher_hint') },
      { label: t('kpi_besuche'), wert: fmtInt(s.besuche), d: delta(s.besuche, v ? v.besuche : NaN) },
      { label: t('kpi_pv'), wert: fmtInt(s.pv), d: delta(s.pv, v ? v.pv : NaN) },
      { label: t('kpi_je_besuch'), wert: fmtDez(jeBesuch, 1), d: delta(jeBesuch, vJe) },
      { label: t('kpi_absprung'), wert: fmtProzent(absprung), d: delta(absprung, vAb, true) },
      { label: t('kpi_dauer'), wert: fmtDauer(dauer), d: delta(dauer, vDa) },
      aboKachel()
    ];
    document.getElementById('stat-kpis').innerHTML = kacheln.map(k =>
      `<div class="kpi"><div class="label">${escapeHtml(k.label)}</div><div class="value">${escapeHtml(k.wert)}</div>${k.d || '<div class="delta"></div>'}${k.hint ? `<div class="hint">${escapeHtml(k.hint)}</div>` : ''}</div>`
    ).join('');
  }

  // Aktive E-Mail-Abos: der jüngste Tagesstand im Zeitraum, dazu der
  // Zuwachs seit dem Stand vor dem Zeitraum (oder dem ältesten darin).
  function aboKachel() {
    const g = aktuell.g;
    const stand = aboStand(g.bis);
    if (!stand) return { label: t('kpi_abos'), wert: '–', hint: t('abo_kein_stand') };
    const vorher = (g.von && aboStand(isoPlus(g.von, -1))) || aboStand(g.bis, g.von, true);
    let d = '<div class="delta"></div>';
    if (vorher && vorher.d !== stand.d && vorher.n !== stand.n) {
      const diff = stand.n - vorher.n;
      d = `<div class="delta ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : '−'}${fmtInt(Math.abs(diff))} ${escapeHtml(t('abo_zuwachs'))}</div>`;
    }
    return { label: t('kpi_abos'), wert: fmtInt(stand.n), d, hint: t('abo_stand', fmtTag(stand.d)) };
  }

  // Instagram: Kennzahlen der Besuche aus Instagram und ihr Verlauf je Tag.
  function zeichneInstagram() {
    const s = aktuell.summe, v = aktuell.vergleich, ig = s.ig;
    const akt = s.listen.instagram_aktionen || new Map();
    const vAkt = v ? (v.listen.instagram_aktionen || new Map()) : null;
    document.getElementById('h-ig').textContent = t('ig_titel');
    document.getElementById('h-ig-sub').textContent = t('ig_sub');
    const anteil = s.besuche ? ig.besuche / s.besuche : NaN;
    const vAnteil = v && v.besuche ? v.ig.besuche / v.besuche : NaN;
    const jeBesuch = ig.besuche ? ig.pv / ig.besuche : NaN;
    const kacheln = [
      { label: t('ig_besucher'), wert: fmtInt(ig.besucher), d: delta(ig.besucher, v ? v.ig.besucher : NaN), hint: t('kpi_besucher_hint') },
      { label: t('ig_besuche'), wert: fmtInt(ig.besuche), d: delta(ig.besuche, v ? v.ig.besuche : NaN) },
      { label: t('ig_anteil'), wert: fmtProzent(anteil), d: '' },
      { label: t('ig_je_besuch'), wert: fmtDez(jeBesuch, 1), d: '' },
      { label: t('ig_events'), wert: fmtInt(akt.get('detail') || 0), d: delta(akt.get('detail') || 0, vAkt ? (vAkt.get('detail') || 0) : NaN) },
      { label: t('ig_veranstalter'), wert: fmtInt(akt.get('veranstalter') || 0), d: delta(akt.get('veranstalter') || 0, vAkt ? (vAkt.get('veranstalter') || 0) : NaN) }
    ];
    // Der Anteil vergleicht in Prozentpunkten - mehr ist hier gut, deshalb
    // nicht delta(…, true) (das färbt ein Plus rot wie bei der Absprungrate).
    if (Number.isFinite(anteil) && Number.isFinite(vAnteil)) {
      const diff = (anteil - vAnteil) * 100;
      kacheln[2].d = Math.abs(diff) < 0.05 ? `<div class="delta">± 0 ${escapeHtml(t('punkte'))}</div>`
        : `<div class="delta ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : '−'}${fmtDez(Math.abs(diff), 1)} ${escapeHtml(t('punkte'))}</div>`;
    }
    document.getElementById('ig-kpis').innerHTML = kacheln.map(k =>
      `<div class="kpi"><div class="label">${escapeHtml(k.label)}</div><div class="value">${escapeHtml(k.wert)}</div>${k.d || '<div class="delta"></div>'}${k.hint ? `<div class="hint">${escapeHtml(k.hint)}</div>` : ''}</div>`
    ).join('');
    const hinweis = document.getElementById('ig-hinweis');
    hinweis.innerHTML = `${ig.besuche ? '' : escapeHtml(t('ig_leer')) + ' '}${escapeHtml(t('ig_hinweis'))} <code>${escapeHtml(IG_LINK)}</code>`;
    const tage = aktuell.tage;
    const werte = tage.map(({ doc }) => (doc && doc.instagram && doc.instagram.besuche) || 0);
    const schritt = Math.max(1, Math.ceil(tage.length / 8));
    balkenDiagramm({
      wrap: 'wrap-ig', svg: 'chart-ig', tip: 'tip-ig', hoehe: 160,
      reihen: [{ werte, klasse: 'balken-2' }],
      aria: `${t('ig_reihe')}: ${fmtInt(ig.besuche)}`,
      achse: (i) => i % schritt === 0 ? fmtTag(tage[i].d, true) : null,
      tipp: (i) => `<div class="tip-zeile"><span>${escapeHtml(fmtTag(tage[i].d))}</span><b>${fmtInt(werte[i])}</b></div>`
    });
  }

  function svgEl(name, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', name);
    Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
    return el;
  }
  function schoeneSkala(max) {
    if (max <= 0) return { max: 4, schritt: 1 };
    const roh = max / 4;
    const zehner = Math.pow(10, Math.floor(Math.log10(roh)));
    const schritt = [1, 2, 5, 10].map(f => f * zehner).find(s => s >= roh) || 10 * zehner;
    return { max: schritt * 4, schritt };
  }
  function kompakt(n) {
    if (n >= 1000000) return fmtDez(n / 1000000, 1) + 'M';
    if (n >= 1000) return (n % 1000 === 0 ? String(n / 1000) : fmtDez(n / 1000, 1)) + 'K';
    return String(n);
  }

  function zeichneVerlauf() {
    const wrap = document.getElementById('wrap-verlauf');
    const svg = document.getElementById('chart-verlauf');
    const tip = document.getElementById('tip-verlauf');
    const tage = aktuell.tage;
    svg.innerHTML = '';
    document.getElementById('legend-verlauf').innerHTML =
      `<span><i class="key key-1"></i>${escapeHtml(t('kpi_besucher'))}</span>` +
      `<span><i class="key key-2"></i>${escapeHtml(t('kpi_pv'))}</span>`;
    const W = Math.max(320, wrap.clientWidth || 800), H = 260;
    const padL = 44, padR = 16, padT = 12, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('aria-label', `${t('verlauf')}: ${t('kpi_besucher')} ${fmtInt(aktuell.summe.besucher)}, ${t('kpi_pv')} ${fmtInt(aktuell.summe.pv)}`);
    if (!tage.length || !aktuell.summe.tageMitDaten) {
      const txt = svgEl('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', class: 'leer', fill: 'currentColor' });
      txt.textContent = t('keine_daten');
      txt.style.fontSize = '13px';
      svg.appendChild(txt);
      zeichneTabelle();
      return;
    }
    const werte1 = tage.map(x => (x.doc && x.doc.besucher) || 0);
    const werte2 = tage.map(x => (x.doc && x.doc.pv) || 0);
    const skala = schoeneSkala(Math.max(...werte2, ...werte1));
    const x = (i) => padL + (tage.length === 1 ? iw / 2 : i * iw / (tage.length - 1));
    const y = (v) => padT + ih - (v / skala.max) * ih;

    const grid = svgEl('g', { class: 'grid' });
    const axis = svgEl('g', { class: 'axis' });
    for (let v = 0; v <= skala.max; v += skala.schritt) {
      grid.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v) }));
      const tx = svgEl('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end' });
      tx.textContent = kompakt(v);
      axis.appendChild(tx);
    }
    const schrittX = Math.max(1, Math.ceil(tage.length / Math.max(2, Math.floor(iw / 70))));
    tage.forEach((tg, i) => {
      if (i % schrittX !== 0 && i !== tage.length - 1) return;
      const tx = svgEl('text', { x: x(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === tage.length - 1 ? 'end' : 'middle' });
      tx.textContent = fmtTag(tg.d, true);
      axis.appendChild(tx);
    });
    svg.appendChild(grid); svg.appendChild(axis);

    const pfad = (werte) => werte.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (tage.length > 1) {
      svg.appendChild(svgEl('path', { class: 'wash-1', d: `${pfad(werte1)} L${x(tage.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z` }));
      svg.appendChild(svgEl('path', { class: 'reihe reihe-2', d: pfad(werte2) }));
      svg.appendChild(svgEl('path', { class: 'reihe reihe-1', d: pfad(werte1) }));
    }
    // Endpunkte (Ring in Flächenfarbe) - und bei einem einzelnen Tag der Punkt selbst.
    const letzte = tage.length - 1;
    svg.appendChild(svgEl('circle', { class: 'punkt-2', cx: x(letzte), cy: y(werte2[letzte]), r: 4 }));
    svg.appendChild(svgEl('circle', { class: 'punkt-1', cx: x(letzte), cy: y(werte1[letzte]), r: 4 }));
    const cursor = svgEl('line', { class: 'cursor', x1: 0, x2: 0, y1: padT, y2: padT + ih });
    svg.appendChild(cursor);
    const p1 = svgEl('circle', { class: 'punkt-1', r: 4, style: 'display:none' });
    const p2 = svgEl('circle', { class: 'punkt-2', r: 4, style: 'display:none' });
    svg.appendChild(p2); svg.appendChild(p1);
    const fang = svgEl('rect', { class: 'fang', x: padL, y: padT, width: iw, height: ih });
    svg.appendChild(fang);

    function zeige(i, clientX) {
      const tg = tage[i];
      cursor.setAttribute('x1', x(i)); cursor.setAttribute('x2', x(i)); cursor.style.opacity = '1';
      p1.setAttribute('cx', x(i)); p1.setAttribute('cy', y(werte1[i])); p1.style.display = '';
      p2.setAttribute('cx', x(i)); p2.setAttribute('cy', y(werte2[i])); p2.style.display = '';
      tip.innerHTML = `<div class="tip-datum">${escapeHtml(fmtTag(tg.d))}</div>` +
        `<div class="tip-zeile"><span><i class="key key-1"></i>${escapeHtml(t('kpi_besucher'))}</span><b>${fmtInt(werte1[i])}</b></div>` +
        `<div class="tip-zeile"><span><i class="key key-2"></i>${escapeHtml(t('kpi_pv'))}</span><b>${fmtInt(werte2[i])}</b></div>` +
        (tg.doc ? `<div class="tip-zeile"><span>${escapeHtml(t('kpi_besuche'))}</span><b>${fmtInt(tg.doc.besuche || 0)}</b></div>` : '');
      tip.style.display = 'block';
      const r = wrap.getBoundingClientRect();
      const links = clientX - r.left;
      const breite = tip.offsetWidth || 160;
      tip.style.left = `${Math.min(Math.max(0, links - breite / 2), r.width - breite)}px`;
      tip.style.top = '8px';
    }
    function verstecke() {
      cursor.style.opacity = '0'; p1.style.display = 'none'; p2.style.display = 'none'; tip.style.display = 'none';
    }
    fang.addEventListener('pointermove', (ev) => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (W / r.width);
      let i = tage.length === 1 ? 0 : Math.round((px - padL) / iw * (tage.length - 1));
      i = Math.max(0, Math.min(tage.length - 1, i));
      zeige(i, ev.clientX);
    });
    fang.addEventListener('pointerleave', verstecke);
    zeichneTabelle();
  }

  function zeichneTabelle() {
    document.getElementById('t-tabelle').textContent = t('tabelle');
    const tbl = document.getElementById('tabelle-verlauf');
    const zeilen = aktuell.tage.filter(x => x.doc);
    tbl.innerHTML = `<thead><tr><th>${escapeHtml(t('th_tag'))}</th><th>${escapeHtml(t('th_besucher'))}</th><th>${escapeHtml(t('th_besuche'))}</th><th>${escapeHtml(t('th_pv'))}</th><th>${escapeHtml(t('th_absprung'))}</th><th>${escapeHtml(t('th_dauer'))}</th></tr></thead><tbody>` +
      zeilen.slice().reverse().map(({ d, doc }) =>
        `<tr><td>${escapeHtml(fmtTag(d))}</td><td>${fmtInt(doc.besucher)}</td><td>${fmtInt(doc.besuche)}</td><td>${fmtInt(doc.pv)}</td><td>${fmtInt(doc.absprung)}</td><td>${escapeHtml(doc.dauer_n ? fmtDauer(doc.dauer_sek / doc.dauer_n) : '–')}</td></tr>`
      ).join('') + '</tbody>';
  }

  // EIN Balkendiagramm für Tageszeit, Wochentag und Monate: `reihen` =
  // [{ werte, klasse }] mit gleich vielen Werten, die Balken einer Gruppe
  // stehen nebeneinander. Oben gerundet (4 px), Hairline-Raster, Tooltip
  // über der Gruppe; `achse(i)` liefert die Beschriftung oder null.
  function balkenDiagramm(o) {
    const wrap = document.getElementById(o.wrap);
    const svg = document.getElementById(o.svg);
    const tip = document.getElementById(o.tip);
    svg.innerHTML = '';
    const n = o.reihen[0].werte.length;
    const W = Math.max(320, wrap.clientWidth || 800), H = o.hoehe || 200;
    const padL = 36, padR = 10, padT = 10, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('aria-label', o.aria || '');
    const alle = o.reihen.reduce((a, r) => a.concat(r.werte), [0]);
    const skala = schoeneSkala(Math.max(...alle));
    const y = (v) => padT + ih - (v / skala.max) * ih;
    const grid = svgEl('g', { class: 'grid' });
    const axis = svgEl('g', { class: 'axis' });
    for (let v = 0; v <= skala.max; v += skala.schritt) {
      grid.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v) }));
      const tx = svgEl('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end' });
      tx.textContent = kompakt(v);
      axis.appendChild(tx);
    }
    svg.appendChild(grid);
    const slot = n ? iw / n : iw;
    const k = o.reihen.length;
    const luecke = k > 1 ? 2 : 0;
    const breite = Math.min(24, Math.max(3, (slot - 2 - luecke * (k - 1)) / k));
    const gruppe = breite * k + luecke * (k - 1);
    for (let i = 0; i < n; i++) {
      const g = svgEl('g', {});
      const start = padL + i * slot + (slot - gruppe) / 2;
      o.reihen.forEach((r, ri) => {
        const v = r.werte[i] || 0;
        const bx = start + ri * (breite + luecke);
        const hoehe = Math.max(0, y(0) - y(v));
        const rad = Math.min(4, breite / 2, hoehe);
        // Balken: oben gerundet, an der Grundlinie eckig.
        if (hoehe > 0) {
          g.appendChild(svgEl('path', { class: 'balken ' + (r.klasse || ''),
            d: `M${bx},${y(0)} V${y(v) + rad} Q${bx},${y(v)} ${bx + rad},${y(v)} H${bx + breite - rad} Q${bx + breite},${y(v)} ${bx + breite},${y(v) + rad} V${y(0)} Z` }));
        }
      });
      const fang = svgEl('rect', { class: 'fang', x: padL + i * slot, y: padT, width: slot, height: ih });
      fang.addEventListener('pointerenter', () => {
        g.querySelectorAll('.balken').forEach(b => b.classList.add('aktiv'));
        tip.innerHTML = o.tipp(i);
        tip.style.display = 'block';
        const wr = wrap.getBoundingClientRect();
        const tb = tip.offsetWidth || 140;
        const links = (start + gruppe / 2) * (wr.width / W);
        tip.style.left = `${Math.min(Math.max(0, links - tb / 2), wr.width - tb)}px`;
        tip.style.top = '0px';
      });
      fang.addEventListener('pointerleave', () => {
        g.querySelectorAll('.balken').forEach(b => b.classList.remove('aktiv'));
        tip.style.display = 'none';
      });
      g.appendChild(fang);
      svg.appendChild(g);
      const label = o.achse(i);
      if (label != null) {
        const tx = svgEl('text', { x: padL + i * slot + slot / 2, y: H - 8, 'text-anchor': 'middle' });
        tx.textContent = label;
        axis.appendChild(tx);
      }
    }
    svg.appendChild(axis);
  }

  function zeichneStunden() {
    document.getElementById('h-stunden').textContent = t('stunden');
    document.getElementById('h-stunden-sub').textContent = t('stunden_sub');
    const werte = aktuell.summe.stunden;
    const spitze = werte.indexOf(Math.max(...werte));
    balkenDiagramm({
      wrap: 'wrap-stunden', svg: 'chart-stunden', tip: 'tip-stunden',
      reihen: [{ werte }],
      aria: `${t('stunden')}: ${t('stunden_sub')}${aktuell.summe.pv ? `, ${spitze}:00 ${t('uhr')}` : ''}`,
      achse: (h) => h % 3 === 0 ? String(h) : null,
      tipp: (h) => `<div class="tip-zeile"><span>${h}:00–${h + 1}:00 ${escapeHtml(t('uhr'))}</span><b>${fmtInt(werte[h])}</b></div>`
    });
  }

  // Wochentag: Ø Seitenaufrufe je Tag, Montag zuerst - aus den
  // Tagesdokumenten des Zeitraums, geteilt durch die Zahl der Tage mit
  // Daten je Wochentag (ein Tag ohne Dokument hatte keinen Aufruf oder
  // lag vor dem Start der Zählung - beides zählt nicht mit).
  const WOCHE = [1, 2, 3, 4, 5, 6, 0];
  function zeichneWochentage() {
    document.getElementById('h-wochentage').textContent = t('wochentage_titel');
    document.getElementById('h-wochentage-sub').textContent = t('wochentage_sub');
    const summe = new Array(7).fill(0), tage = new Array(7).fill(0);
    aktuell.tage.forEach(({ d, doc }) => {
      if (!doc) return;
      const wd = wochentagVon(d);
      summe[wd] += doc.pv || 0;
      tage[wd]++;
    });
    const werte = WOCHE.map(wd => tage[wd] ? Math.round(summe[wd] / tage[wd]) : 0);
    const namen = I18N[lang].wochentage;
    balkenDiagramm({
      wrap: 'wrap-wochentage', svg: 'chart-wochentage', tip: 'tip-wochentage',
      reihen: [{ werte }],
      aria: `${t('wochentage_titel')}: ${t('wochentage_sub')}`,
      achse: (i) => namen[WOCHE[i]],
      tipp: (i) => `<div class="tip-zeile"><span>${escapeHtml(namen[WOCHE[i]])} · ${fmtInt(tage[WOCHE[i]])} ${escapeHtml(t('tage_n'))}</span><b>${fmtInt(werte[i])}</b></div>`
    });
  }

  // Monate: die letzten zwölf, ab dem ersten Monat mit Daten (vorher gab
  // es die Zählung nicht - leere Balken davor wären kein Befund). Jeder
  // Monat ist die Summe seiner Tagesdokumente, unabhängig vom gewählten
  // Zeitraum; die Tabelle darunter ist das Mediadaten-Blatt.
  function monatsWerte() {
    const heute = isoHeute();
    const liste = [];
    for (let i = MONATE_IM_BILD - 1; i >= 0; i--) {
      const ym = monatPlus(heute.slice(0, 7), -i);
      const bis = i === 0 ? heute : monatsEnde(ym);
      const su = summiere(tageIm(ym + '-01', bis));
      su.abos = aboStand(bis, ym + '-01');
      liste.push({ ym, s: su });
    }
    const erster = liste.findIndex(x => x.s.tageMitDaten > 0);
    return erster < 0 ? liste.slice(-1) : liste.slice(erster);
  }
  function zeichneMonate() {
    document.getElementById('h-monate').textContent = t('monate_titel');
    document.getElementById('h-monate-sub').textContent = t('monate_sub');
    document.getElementById('t-tabelle-monate').textContent = t('tabelle_monate');
    document.getElementById('legend-monate').innerHTML =
      `<span><i class="key key-1"></i>${escapeHtml(t('kpi_besuche'))}</span>` +
      `<span><i class="key key-2"></i>${escapeHtml(t('kpi_pv'))}</span>`;
    const monate = monatsWerte();
    const besuche = monate.map(m => m.s.besuche);
    const pv = monate.map(m => m.s.pv);
    balkenDiagramm({
      wrap: 'wrap-monate', svg: 'chart-monate', tip: 'tip-monate',
      reihen: [{ werte: besuche }, { werte: pv, klasse: 'balken-2' }],
      aria: `${t('monate_titel')}: ${t('monate_sub')}`,
      achse: (i) => {
        const [j, m] = monate[i].ym.split('-').map(Number);
        return lang === 'de' ? `${I18N.de.monate[m - 1].slice(0, 3)} ${String(j).slice(2)}` : `${I18N.en.monate[m - 1].slice(0, 3)} ${String(j).slice(2)}`;
      },
      tipp: (i) => `<div class="tip-datum">${escapeHtml(fmtMonat(monate[i].ym))}</div>` +
        `<div class="tip-zeile"><span><i class="key key-1"></i>${escapeHtml(t('kpi_besuche'))}</span><b>${fmtInt(besuche[i])}</b></div>` +
        `<div class="tip-zeile"><span><i class="key key-2"></i>${escapeHtml(t('kpi_pv'))}</span><b>${fmtInt(pv[i])}</b></div>`
    });
    const tbl = document.getElementById('tabelle-monate');
    const kopf = ['th_monat', 'th_besucher', 'th_besuche', 'th_pv', 'th_je_besuch', 'th_dauer', 'th_abos'];
    tbl.innerHTML = `<thead><tr>${kopf.map(k => `<th>${escapeHtml(t(k))}</th>`).join('')}</tr></thead><tbody>` +
      monate.slice().reverse().filter(m => m.s.tageMitDaten > 0).map(({ ym, s: su }) =>
        `<tr><td>${escapeHtml(fmtMonat(ym))}</td><td>${fmtInt(su.besucher)}</td><td>${fmtInt(su.besuche)}</td><td>${fmtInt(su.pv)}</td>` +
        `<td>${escapeHtml(fmtDez(su.besuche ? su.pv / su.besuche : NaN, 1))}</td><td>${escapeHtml(su.dauer_n ? fmtDauer(su.dauer_sek / su.dauer_n) : '–')}</td>` +
        `<td>${su.abos ? fmtInt(su.abos.n) : '–'}</td></tr>`
      ).join('') + '</tbody>';
  }

  // ---------- Listen ----------
  // Zielgruppe und die beiden Kundenkarten zuerst (14.10.2026) - das sind
  // die Zahlen für Werbekunden und Veranstalter; `extra` liefert
  // zusätzliche Karten als HTML (Sportart je Region, Bericht, Werbeplätze).
  const ABSCHNITTE = [
    { titel: 's_zielgruppe', listen: ['sport_events', 'sport_veranstalter'], extra: () => sportRegionHtml() },
    { titel: 's_kunden', listen: [], extra: () => berichtHtml() + werbungHtml() },
    { titel: 's_seiten', listen: ['seiten', 'einstieg', 'ausstieg'] },
    { titel: 's_herkunft', listen: ['kanaele', 'referrer', 'laender', 'sprachen', 'quellen', 'medien', 'kampagnen'] },
    { titel: 's_technik', listen: ['geraete', 'browser', 'systeme', 'seitensprache', 'schema'] },
    { titel: 's_aktionen', listen: ['aktionen', 'events', 'veranstalter', 'events_kalender', 'events_teilen', 'suche', 'filter', 'kalender', 'teilen', 'abo', 'melden'] }
  ];
  function sportName(k) { return I18N[lang].sport[k] || k; }
  const BESCHRIFTUNG = {
    sport_events: (k) => sportName(k),
    sport_veranstalter: (k) => sportName(k),
    seiten: (k) => t('p_' + k) === 'p_' + k ? k : t('p_' + k),
    einstieg: (k) => BESCHRIFTUNG.seiten(k),
    ausstieg: (k) => BESCHRIFTUNG.seiten(k),
    referrer: (k) => k === '(direkt)' ? t('direkt') : k,
    kanaele: (k) => t('kn_' + k) === 'kn_' + k ? k : t('kn_' + k),
    instagram_medien: (k) => t('igm_' + k) === 'igm_' + k ? k : t('igm_' + k),
    instagram_einstieg: (k) => BESCHRIFTUNG.seiten(k),
    instagram_aktionen: (k) => BESCHRIFTUNG.aktionen(k),
    laender: (k) => I18N[lang].ld[k] || k,
    seitensprache: (k) => k.toUpperCase(),
    schema: (k) => t('schema_' + k) === 'schema_' + k ? k : t('schema_' + k),
    geraete: (k) => t('dv_' + k) === 'dv_' + k ? k : t('dv_' + k),
    aktionen: (k) => t('akt_' + k) === 'akt_' + k ? k : t('akt_' + k),
    kalender: (k) => t('kal_' + k) === 'kal_' + k ? k : t('kal_' + k),
    teilen: (k) => t('teilen_' + k) === 'teilen_' + k ? k : t('teilen_' + k),
    filter: (k) => k.replace('=', ': ')
  };
  // Die Instagram-Auswertungen stehen im Bereich Instagram (16.10.2026).
  const ABSCHNITTE_IG = [
    { titel: 's_instagram', listen: ['instagram_medien', 'instagram_einstieg', 'instagram_aktionen', 'instagram_kampagnen'] }
  ];
  const ANFANG = 8;
  const offen = new Set();   // Listen, die ganz gezeigt werden

  function zeichneListen() {
    const html = (abschnitte) => abschnitte.map(a =>
      `<h3 class="stat-section-title">${escapeHtml(t(a.titel))}</h3><div class="stat-grid">` +
      a.listen.map(f => listeHtml(f)).join('') + (a.extra ? a.extra() : '') + '</div>'
    ).join('');
    document.getElementById('stat-listen').innerHTML = html(ABSCHNITTE);
    document.getElementById('stat-listen-ig').innerHTML = html(ABSCHNITTE_IG);
  }

  // Sportart je Region: eine Kreuztabelle aus `sport_region` ("Laufen|DE").
  // Zeilen nach Größe, Spalten die vier größten Regionen plus „Sonstige".
  function sportRegionHtml() {
    const map = aktuell.summe.listen.sport_region || new Map();
    const sport = new Map(), region = new Map(), zelle = new Map();
    let gesamt = 0;
    map.forEach((n, k) => {
      const i = k.lastIndexOf('|');
      const sp = i < 0 ? k : k.slice(0, i), ld = i < 0 ? '??' : k.slice(i + 1);
      sport.set(sp, (sport.get(sp) || 0) + n);
      region.set(ld, (region.get(ld) || 0) + n);
      zelle.set(sp + '|' + ld, n);
      gesamt += n;
    });
    let html = `<section class="stat-card breit" data-liste="sport_region"><h3><span>${escapeHtml(t('l_sport_region'))}</span><small>${escapeHtml(t('sport_region_sub'))} · ${fmtInt(gesamt)}</small></h3>`;
    if (!gesamt) return html + `<p class="leer">${escapeHtml(t('leer'))}</p></section>`;
    const sortiert = (m) => Array.from(m, ([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n || (a.k < b.k ? -1 : 1));
    const sportarten = sortiert(sport);
    const regionen = sortiert(region);
    const spalten = regionen.slice(0, 4).map(r => r.k);
    const rest = regionen.slice(4).map(r => r.k);
    const wert = (sp, ld) => zelle.get(sp + '|' + ld) || 0;
    const restWert = (sp) => rest.reduce((a, ld) => a + wert(sp, ld), 0);
    const ld = (k) => I18N[lang].ld[k] || k;
    html += '<div class="matrix-wrap"><table class="matrix"><thead><tr>' +
      `<th>${escapeHtml(t('th_sport'))}</th>` + spalten.map(k => `<th>${escapeHtml(ld(k))}</th>`).join('') +
      (rest.length ? `<th>${escapeHtml(t('sonstige'))}</th>` : '') + `<th>${escapeHtml(t('th_gesamt'))}</th></tr></thead><tbody>` +
      sportarten.map(({ k, n }) =>
        `<tr><td>${escapeHtml(sportName(k))}</td>` + spalten.map(l => `<td>${fmtInt(wert(k, l))}</td>`).join('') +
        (rest.length ? `<td>${fmtInt(restWert(k))}</td>` : '') + `<td>${fmtInt(n)} <span class="anteil">(${escapeHtml(fmtProzent(n / gesamt))})</span></td></tr>`
      ).join('') + '</tbody><tfoot><tr>' +
      `<td>${escapeHtml(t('th_gesamt'))}</td>` + spalten.map(l => `<td>${fmtInt(region.get(l) || 0)}</td>`).join('') +
      (rest.length ? `<td>${fmtInt(rest.reduce((a, l) => a + (region.get(l) || 0), 0))}</td>` : '') + `<td>${fmtInt(gesamt)}</td></tr></tfoot></table></div>`;
    return html + '</section>';
  }

  // Bericht je Veranstaltung: was ein Veranstalter wissen will - wie oft
  // sein Event geöffnet wurde, wie viele zu seiner Seite weitergingen,
  // Kalender, Teilen; dazu die Tage. Gerechnet aus den Tageslisten
  // (events, veranstalter, events_kalender, events_teilen), die je Tag die
  // 500 meistgenannten Events führen - ein sehr kleines Event an einem
  // sehr großen Tag kann darin fehlen.
  let berichtEvent = null;   // Wahl des Nutzers; null = das meistgeöffnete
  function berichtHtml() {
    const L = aktuell.summe.listen;
    const ev = L.events || new Map();
    const namen = Array.from(ev, ([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n || (a.k < b.k ? -1 : 1));
    const name = berichtEvent != null ? berichtEvent : (namen.length ? namen[0].k : '');
    let html = `<section class="stat-card breit" id="bericht-card"><h3><span>${escapeHtml(t('bericht_titel'))}</span><small>${escapeHtml(t('bericht_sub'))}</small></h3>`;
    html += `<input class="bericht-suche" id="bericht-suche" list="bericht-liste" placeholder="${escapeHtml(t('bericht_platzhalter'))}" value="${escapeHtml(name)}" autocomplete="off">` +
      `<datalist id="bericht-liste">${namen.slice(0, 500).map(e => `<option value="${escapeHtml(e.k)}"></option>`).join('')}</datalist>`;
    if (!namen.length) return html + `<p class="leer">${escapeHtml(t('bericht_leer'))}</p></section>`;
    if (!ev.has(name)) return html + `<p class="leer">${escapeHtml(t('bericht_unbekannt'))}</p></section>`;
    const g = ev.get(name) || 0;
    const v = (L.veranstalter && L.veranstalter.get(name)) || 0;
    const k = (L.events_kalender && L.events_kalender.get(name)) || 0;
    const sh = (L.events_teilen && L.events_teilen.get(name)) || 0;
    const rate = g ? v / g : NaN;
    const vg = aktuell.vergleich ? (aktuell.vergleich.listen.events.get(name) || 0) : NaN;
    const kacheln = [
      { label: t('b_geoeffnet'), wert: fmtInt(g), d: delta(g, vg) },
      { label: t('b_veranstalter'), wert: fmtInt(v) },
      { label: t('b_klickrate'), wert: fmtProzent(rate) },
      { label: t('b_kalender'), wert: fmtInt(k) },
      { label: t('b_teilen'), wert: fmtInt(sh) }
    ];
    html += `<p class="bericht-name">${escapeHtml(name)}</p><div class="bericht-kpis">` + kacheln.map(x =>
      `<div class="kpi"><div class="label">${escapeHtml(x.label)}</div><div class="value">${escapeHtml(x.wert)}</div>${x.d || ''}</div>`
    ).join('') + '</div>';
    const inListe = (liste, n) => { const e = (liste || []).find(x => x.k === n); return e ? e.n || 0 : 0; };
    const zeilen = aktuell.tage.filter(x => x.doc).map(({ d, doc }) => ({
      d, g: inListe(doc.events, name), v: inListe(doc.veranstalter, name), k: inListe(doc.events_kalender, name), s: inListe(doc.events_teilen, name)
    })).filter(z => z.g || z.v || z.k || z.s).reverse();
    html += `<details class="tabelle"><summary>${escapeHtml(t('tabelle'))}</summary><div class="matrix-wrap"><table class="matrix"><thead><tr>` +
      ['th_tag', 'b_geoeffnet', 'b_veranstalter', 'b_kalender', 'b_teilen'].map(x => `<th>${escapeHtml(t(x))}</th>`).join('') + '</tr></thead><tbody>' +
      zeilen.map(z => `<tr><td>${escapeHtml(fmtTag(z.d))}</td><td>${fmtInt(z.g)}</td><td>${fmtInt(z.v)}</td><td>${fmtInt(z.k)}</td><td>${fmtInt(z.s)}</td></tr>`).join('') +
      '</tbody></table></div></details>';
    html += `<div class="bericht-fuss"><button type="button" class="stat-btn" id="bericht-kopieren">${escapeHtml(t('bericht_kopieren'))}</button><span class="hinweis">${escapeHtml(t('bericht_hinweis'))}</span></div>`;
    return html + '</section>';
  }
  function berichtText() {
    const L = aktuell.summe.listen;
    const ev = L.events || new Map();
    const name = berichtEvent != null ? berichtEvent : (Array.from(ev.keys())[0] || '');
    if (!ev.has(name)) return '';
    const g = ev.get(name) || 0, v = (L.veranstalter && L.veranstalter.get(name)) || 0;
    const zeitraum = aktuell.g.von ? `${fmtTag(aktuell.g.von)} – ${fmtTag(aktuell.g.bis)}` : `${lang === 'de' ? 'bis' : 'until'} ${fmtTag(aktuell.g.bis)}`;
    return t('bericht_text', name, zeitraum, fmtInt(g), fmtInt(v), fmtProzent(g ? v / g : NaN),
      fmtInt((L.events_kalender && L.events_kalender.get(name)) || 0), fmtInt((L.events_teilen && L.events_teilen.get(name)) || 0));
  }

  // Werbeplätze: Einblendungen und Klicks je Platz, daraus die Klickrate.
  // Leer, bis eine Seite EnduranceStats.anzeige() aufruft (stats.js).
  function werbungHtml() {
    const sicht = aktuell.summe.listen.anzeige_sicht || new Map();
    const klick = aktuell.summe.listen.anzeige_klick || new Map();
    const plaetze = new Set([...sicht.keys(), ...klick.keys()]);
    let html = `<section class="stat-card" data-liste="anzeige"><h3><span>${escapeHtml(t('werbung_titel'))}</span><small>${escapeHtml(t('werbung_sub'))}</small></h3>`;
    if (!plaetze.size) return html + `<p class="leer">${escapeHtml(t('werbung_leer'))}</p></section>`;
    const zeilen = Array.from(plaetze, (k) => ({ k, s: sicht.get(k) || 0, c: klick.get(k) || 0 })).sort((a, b) => b.s - a.s || (a.k < b.k ? -1 : 1));
    const gs = zeilen.reduce((a, z) => a + z.s, 0), gc = zeilen.reduce((a, z) => a + z.c, 0);
    html += `<div class="matrix-wrap"><table class="matrix"><thead><tr>${['th_platz', 'th_sicht', 'th_klicks', 'th_ctr'].map(x => `<th>${escapeHtml(t(x))}</th>`).join('')}</tr></thead><tbody>` +
      zeilen.map(z => `<tr><td>${escapeHtml(z.k)}</td><td>${fmtInt(z.s)}</td><td>${fmtInt(z.c)}</td><td>${escapeHtml(fmtProzent(z.s ? z.c / z.s : NaN))}</td></tr>`).join('') +
      `</tbody><tfoot><tr><td>${escapeHtml(t('th_gesamt'))}</td><td>${fmtInt(gs)}</td><td>${fmtInt(gc)}</td><td>${escapeHtml(fmtProzent(gs ? gc / gs : NaN))}</td></tr></tfoot></table></div>`;
    return html + '</section>';
  }
  function zeichneBerichtNeu() {
    const alt = document.getElementById('bericht-card');
    // Beim Neuzeichnen der Listen (Sprachwechsel) verliert das Suchfeld
    // den Fokus, Chrome feuert dabei `change`, und die alte Karte hängt
    // schon nicht mehr im Dokument - dann gibt es nichts zu ersetzen.
    if (!alt || !alt.isConnected) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = berichtHtml();
    alt.replaceWith(tmp.firstElementChild);
  }
  document.getElementById('stat-content').addEventListener('change', (ev) => {
    if (ev.target.id !== 'bericht-suche' || !ev.target.isConnected) return;
    const neu = ev.target.value.trim();
    if (neu === berichtEvent) return;
    berichtEvent = neu;
    zeichneBerichtNeu();
  });

  function listeHtml(feld) {
    const map = aktuell.summe.listen[feld] || new Map();
    const eintraege = Array.from(map, ([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n || (a.k < b.k ? -1 : 1));
    const gesamt = eintraege.reduce((s, e) => s + e.n, 0);
    const max = eintraege.length ? eintraege[0].n : 0;
    const zeigeAlle = offen.has(feld);
    const sichtbar = zeigeAlle ? eintraege : eintraege.slice(0, ANFANG);
    const beschrifte = BESCHRIFTUNG[feld] || ((k) => k);
    let html = `<section class="stat-card" data-liste="${feld}"><h3><span>${escapeHtml(t('l_' + feld))}</span><small>${fmtInt(gesamt)}</small></h3>`;
    if (!eintraege.length) {
      html += `<p class="leer">${escapeHtml(t('leer'))}</p></section>`;
      return html;
    }
    html += '<ul class="liste">' + sichtbar.map(e =>
      `<li><div class="zeile"><span class="name" title="${escapeHtml(e.k)}">${escapeHtml(beschrifte(String(e.k)))}</span><span class="zahl">${fmtInt(e.n)}</span><span class="anteil">${escapeHtml(fmtProzent(gesamt ? e.n / gesamt : 0))}</span></div><div class="spur"><i style="width:${max ? (e.n / max * 100).toFixed(1) : 0}%"></i></div></li>`
    ).join('') + '</ul>';
    if (eintraege.length > ANFANG) {
      html += `<button type="button" class="mehr-btn" data-mehr="${feld}">${escapeHtml(zeigeAlle ? t('weniger') : `${t('mehr')} (${eintraege.length})`)}</button>`;
    }
    return html + '</section>';
  }
  document.getElementById('stat-content').addEventListener('click', (ev) => {
    const kopie = ev.target.closest('#bericht-kopieren');
    if (kopie) {
      const text = berichtText();
      if (text && navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => { kopie.textContent = t('kopiert'); }).catch(() => {});
      }
      return;
    }
    const b = ev.target.closest('button[data-mehr]');
    if (!b) return;
    const feld = b.dataset.mehr;
    if (offen.has(feld)) offen.delete(feld); else offen.add(feld);
    const alt = b.closest('section[data-liste]');
    const tmp = document.createElement('div');
    tmp.innerHTML = listeHtml(feld);
    alt.replaceWith(tmp.firstElementChild);
  });

  // ---------- CSV ----------
  document.getElementById('csv-btn').addEventListener('click', () => {
    if (!aktuell) return;
    const zeilen = [[t('th_tag'), t('th_besucher'), t('th_besuche'), t('th_pv'), t('th_absprung'), t('th_dauer') + ' (s)', t('kpi_abos'), t('ig_besuche')]];
    aktuell.tage.filter(x => x.doc).forEach(({ d, doc }) => {
      zeilen.push([d, doc.besucher || 0, doc.besuche || 0, doc.pv || 0, doc.absprung || 0, doc.dauer_n ? Math.round(doc.dauer_sek / doc.dauer_n) : '',
        typeof doc.abos_aktiv === 'number' ? doc.abos_aktiv : '', (doc.instagram && doc.instagram.besuche) || 0]);
    });
    const csv = zeilen.map(z => z.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `endurance-events-statistik-${aktuell.g.von || 'alles'}-${aktuell.g.bis}.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });

  // ---------- Sprache ----------
  function applyLang(l) {
    lang = l;
    try { localStorage.setItem('endurance-lang', l); } catch (e) { /* ignorieren */ }
    document.documentElement.lang = l;
    document.title = t('title') + ' – Endurance Events';
    document.getElementById('stat-title').textContent = t('title');
    document.getElementById('stat-sub').textContent = t('sub');
    document.getElementById('nav-events').textContent = t('nav_events');
    document.getElementById('nav-map').textContent = t('nav_map');
    document.getElementById('h-verlauf').textContent = t('verlauf');
    ['dashboard', 'graphen', 'auswertungen', 'instagram', 'wartung'].forEach(k => {
      document.getElementById('b-' + k).textContent = t('b_' + k);
    });
    document.getElementById('csv-btn').textContent = t('csv');
    document.getElementById('footer-impressum').textContent = l === 'de' ? 'Impressum' : 'Legal notice';
    document.getElementById('footer-datenschutz').textContent = l === 'de' ? 'Datenschutz' : 'Privacy';
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    if (aktuell) zeichneAlles();
    else if (!gateEl.hidden) {
      // Der Zugangshinweis trägt Text - neu zeichnen, je nach Zustand.
      if (geladenFuer === null && window.EndauranceAuth && !window.EndauranceAuth.getUser()) gateLogin();
    }
    zeichneWartung();
    zeichneFreigaben();
  }
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });
  applyLang(lang);

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (!aktuell) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { zeichneInstagram(); zeichneVerlauf(); zeichneMonate(); zeichneStunden(); zeichneWochentage(); }, 150);
  });

  // auth.js lädt mit defer und existiert hier noch nicht - deshalb über
  // die Warteschlange (dieselbe wie in events.html).
  zeigeGate(`<p class="leer">${escapeHtml(t('gate_laden'))}</p>`);
  if (!window.FIREBASE_CONFIGURED && document.readyState === 'complete') {
    zeigeGate(`<p class="leer">${escapeHtml(t('gate_nicht_konfiguriert'))}</p>`);
  }
  (window.EE_AUTH_QUEUE = window.EE_AUTH_QUEUE || []).push((user) => {
    nachAnmeldung(user).catch(gateFehler);
  });
  window.addEventListener('load', () => {
    if (!window.FIREBASE_CONFIGURED) zeigeGate(`<p class="leer">${escapeHtml(t('gate_nicht_konfiguriert'))}</p>`);
  });
})();
</script>
</body>
</html>
