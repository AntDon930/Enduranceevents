<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ausdauersport-Events D/A/CH</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e0e3e8;
    --text: #1c1f24;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --accent-bg: #eaf1ff;
    --row-alt: #f8fafc;
    --row-hover: #eef4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1d2025;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-muted: #9aa1ac;
      --accent: #5b9dff;
      --accent-bg: #1e2a40;
      --row-alt: #202329;
      --row-hover: #22314a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 0 0 16px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .result-count { font-size: 0.85rem; color: var(--text-muted); }
  .reset-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .reset-btn:hover { background: var(--accent-bg); }
  .active-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.75rem;
  }
  .chip button {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 320px);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
    max-height: 78vh;
    overflow-y: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 780px;
    font-size: 0.86rem;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 2;
    border-bottom: 1px solid var(--border);
    text-align: left;
    padding: 0;
  }
  .th-inner {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  th.sortable .th-inner { cursor: pointer; }
  th.sortable .th-inner:hover { background: var(--row-hover); }
  .sort-arrow { color: var(--text-muted); font-size: 0.7rem; }

  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.active { background: var(--accent-bg); }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
    margin-right: 3px;
    white-space: nowrap;
  }
  .empty-row td {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
  }

  /* Excel-style column filter popover */
  .col-filter { position: relative; }
  .col-filter > summary {
    list-style: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    user-select: none;
  }
  .col-filter[open] > summary,
  .col-filter.has-filter > summary {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .col-filter > summary::-webkit-details-marker { display: none; }
  .filter-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 10;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 10px;
    min-width: 200px;
    max-width: 260px;
    font-weight: normal;
    white-space: normal;
  }
  .filter-panel .fp-actions {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    margin-bottom: 6px;
  }
  .filter-panel .fp-actions a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }
  .filter-list {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-list label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: normal;
    cursor: pointer;
  }
  .filter-panel .fp-empty {
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .filter-panel .date-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .filter-panel .date-row label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .filter-panel input[type="date"] {
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.82rem;
  }
  .radius-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .radius-section .radius-title {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .geo-btn {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 0.78rem;
    margin-bottom: 6px;
  }
  .geo-btn:hover { background: var(--accent-bg); }
  .radius-status {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    min-height: 1.1em;
  }
  .radius-options label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: normal;
    cursor: pointer;
    padding: 2px 0;
  }
  .radius-options select,
  .filter-panel select {
    width: 100%;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.82rem;
    margin-bottom: 6px;
  }

  .detail-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
    position: sticky;
    top: 16px;
  }
  .detail-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 24px 8px;
    font-size: 0.9rem;
  }
  .detail-panel h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .detail-panel .sub { color: var(--text-muted); margin-bottom: 16px; font-size: 0.88rem; }
  .detail-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 9px;
    column-gap: 14px;
    font-size: 0.88rem;
  }
  .detail-grid dt { color: var(--text-muted); font-weight: 500; }
  .detail-grid dd { margin: 0; }
  .detail-link {
    display: inline-block;
    margin-top: 20px;
    padding: 9px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.88rem;
  }
  .detail-link:hover { opacity: 0.9; }
</style>
</head>
<body>

<h1>🏁 Ausdauersport-Events – Deutschland / Österreich / Schweiz</h1>
<p class="subtitle">Klicke auf eine Kopfzeile-Filterschaltfläche (▾), um die Liste einzugrenzen. Zeile anklicken für Details.</p>

<div class="toolbar">
  <div class="result-count" id="result-count"></div>
  <div class="active-chips" id="active-chips"></div>
  <button class="reset-btn" id="reset-btn">Alle Filter zurücksetzen</button>
</div>

<div class="layout">
  <div class="table-wrap">
    <table>
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="event-body"></tbody>
    </table>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty">Wähle eine Zeile aus, um Details zu sehen.</div>
  </div>
</div>

<script>
(async function () {
  // Platzhalter-Zuordnung Art I -> erlaubte Art II Werte.
  // Bitte anpassen, sobald die genaue Aufteilung feststeht.
  const ART2_BY_ART1 = {
    'Laufen': ['Straße', 'Trail', 'Bahn'],
    'Schwimmen': ['Freiwasser', 'Schwimmbad'],
    'Rennrad': ['Straße', 'Mountainbike', 'Bahn'],
    'Triathlon': ['Straße']
  };

  const RADIUS_BUCKETS = [
    { key: '0-5', label: '0–5 km' },
    { key: '5-20', label: '5–20 km' },
    { key: '20-50', label: '20–50 km' },
    { key: '50+', label: '50+ km' }
  ];

  const COLUMNS = [
    { key: 'land', label: 'Land', type: 'checkbox', options: () => uniqueSorted(events.map(e => e.land)) },
    { key: 'name', label: 'Name', type: 'none' },
    { key: 'standort', label: 'Standort', type: 'standort' },
    { key: 'art1', label: 'Art I', type: 'checkbox', options: () => uniqueSorted(events.map(e => e.art1)) },
    { key: 'art2', label: 'Art II', type: 'checkbox', options: () => availableArt2Options() },
    { key: 'zeitraum', label: 'Zeitraum', type: 'date' },
    { key: 'laenge_km', label: 'Länge (km)', type: 'none' }
  ];

  let events = [];
  let selectedIndex = null;

  // Filter state
  const state = {
    land: new Set(),
    art1: new Set(),
    art2: new Set(),
    standort: new Set(),
    von: '',
    bis: '',
    origin: null,       // { lat, lon, label }
    radius: ''          // '' | '0-5' | '5-20' | '20-50' | '50+'
  };

  const bodyEl = document.getElementById('event-body');
  const headerRowEl = document.getElementById('header-row');
  const countEl = document.getElementById('result-count');
  const chipsEl = document.getElementById('active-chips');
  const detailEl = document.getElementById('detail-panel');
  document.getElementById('reset-btn').addEventListener('click', resetFilters);

  try {
    const res = await fetch('events.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    events = await res.json();
  } catch (err) {
    bodyEl.innerHTML = `<tr><td colspan="7" class="empty-row">Konnte events.json nicht laden: ${escapeHtml(err.message)}</td></tr>`;
    return;
  }

  buildHeader();
  render();

  // ---------- helpers ----------

  function uniqueSorted(values) {
    return Array.from(new Set(values.filter(v => v !== undefined && v !== null && v !== ''))).sort((a, b) => String(a).localeCompare(String(b), 'de'));
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function inBucket(distKm, bucketKey) {
    switch (bucketKey) {
      case '0-5': return distKm <= 5;
      case '5-20': return distKm > 5 && distKm <= 20;
      case '20-50': return distKm > 20 && distKm <= 50;
      case '50+': return distKm > 50;
      default: return true;
    }
  }

  function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}.${m}.${y}`;
  }

  function formatRange(start, end) {
    if (start === end) return formatDate(start);
    return `${formatDate(start)} – ${formatDate(end)}`;
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function availableArt2Options() {
    const presentArt2 = uniqueSorted(events.map(e => e.art2));
    if (state.art1.size === 0) return presentArt2;
    const allowed = new Set();
    state.art1.forEach(a1 => (ART2_BY_ART1[a1] || []).forEach(a2 => allowed.add(a2)));
    return presentArt2.filter(a2 => allowed.has(a2));
  }

  // ---------- header / filter UI ----------

  function buildHeader() {
    const columns = COLUMNS;

    headerRowEl.innerHTML = '';
    columns.forEach(col => {
      const th = document.createElement('th');
      const inner = document.createElement('div');
      inner.className = 'th-inner';
      const labelSpan = document.createElement('span');
      labelSpan.textContent = col.label;
      inner.appendChild(labelSpan);

      if (col.type !== 'none') {
        const details = document.createElement('details');
        details.className = 'col-filter';
        details.dataset.col = col.key;
        const summary = document.createElement('summary');
        summary.textContent = '▾';
        details.appendChild(summary);

        const panel = document.createElement('div');
        panel.className = 'filter-panel';
        panel.id = `panel-${col.key}`;
        details.appendChild(panel);

        details.addEventListener('toggle', () => {
          if (details.open) {
            closeOtherPanels(details);
            renderFilterPanel(col, panel);
          }
        });

        inner.appendChild(details);
      }

      th.appendChild(inner);
      headerRowEl.appendChild(th);
    });

    document.addEventListener('click', (ev) => {
      document.querySelectorAll('details.col-filter[open]').forEach(d => {
        if (!d.contains(ev.target)) d.removeAttribute('open');
      });
    });
  }

  function closeOtherPanels(except) {
    document.querySelectorAll('details.col-filter[open]').forEach(d => {
      if (d !== except) d.removeAttribute('open');
    });
  }

  function renderFilterPanel(col, panel) {
    if (col.type === 'checkbox') {
      renderCheckboxPanel(col, panel);
    } else if (col.type === 'standort') {
      renderStandortPanel(panel);
    } else if (col.type === 'date') {
      renderDatePanel(panel);
    }
  }

  function renderCheckboxPanel(col, panel) {
    const options = col.options();
    const selectedSet = state[col.key];
    // prune invalid selections (relevant mainly for art2 after art1 changes)
    Array.from(selectedSet).forEach(v => { if (!options.includes(v)) selectedSet.delete(v); });

    panel.innerHTML = '';
    const actions = document.createElement('div');
    actions.className = 'fp-actions';
    actions.innerHTML = `<a data-act="all">Alle</a><a data-act="none">Keine</a>`;
    panel.appendChild(actions);

    if (options.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'fp-empty';
      empty.textContent = 'Keine Werte für die aktuelle Auswahl.';
      panel.appendChild(empty);
    } else {
      const list = document.createElement('div');
      list.className = 'filter-list';
      options.forEach(opt => {
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = opt;
        cb.checked = selectedSet.has(opt);
        cb.addEventListener('change', () => {
          if (cb.checked) selectedSet.add(opt); else selectedSet.delete(opt);
          if (col.key === 'art1') {
            // Art II Optionen hängen von Art I ab -> ungültige Auswahl bereinigen
            const valid = new Set(availableArt2Options());
            Array.from(state.art2).forEach(v => { if (!valid.has(v)) state.art2.delete(v); });
          }
          selectedIndex = null;
          render();
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(opt));
        list.appendChild(label);
      });
      panel.appendChild(list);
    }

    actions.querySelector('[data-act="all"]').addEventListener('click', () => {
      options.forEach(o => selectedSet.add(o));
      if (col.key === 'art1') {
        const valid = new Set(availableArt2Options());
        Array.from(state.art2).forEach(v => { if (!valid.has(v)) state.art2.delete(v); });
      }
      selectedIndex = null;
      render();
      renderCheckboxPanel(col, panel);
    });
    actions.querySelector('[data-act="none"]').addEventListener('click', () => {
      selectedSet.clear();
      selectedIndex = null;
      render();
      renderCheckboxPanel(col, panel);
    });
  }

  function renderStandortPanel(panel) {
    const allCities = uniqueSorted(events.map(e => e.standort)); // immer ALLE Städte, unabhängig von anderen Filtern
    panel.innerHTML = '';

    const actions = document.createElement('div');
    actions.className = 'fp-actions';
    actions.innerHTML = `<a data-act="all">Alle</a><a data-act="none">Keine</a>`;
    panel.appendChild(actions);

    const list = document.createElement('div');
    list.className = 'filter-list';
    allCities.forEach(city => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = city;
      cb.checked = state.standort.has(city);
      cb.addEventListener('change', () => {
        if (cb.checked) state.standort.add(city); else state.standort.delete(city);
        selectedIndex = null;
        render();
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(city));
      list.appendChild(label);
    });
    panel.appendChild(list);

    actions.querySelector('[data-act="all"]').addEventListener('click', () => {
      allCities.forEach(c => state.standort.add(c));
      selectedIndex = null;
      render();
      renderStandortPanel(panel);
    });
    actions.querySelector('[data-act="none"]').addEventListener('click', () => {
      state.standort.clear();
      selectedIndex = null;
      render();
      renderStandortPanel(panel);
    });

    // Umkreissuche
    const radiusSection = document.createElement('div');
    radiusSection.className = 'radius-section';
    radiusSection.innerHTML = `<div class="radius-title">Umkreissuche</div>`;

    const geoBtn = document.createElement('button');
    geoBtn.type = 'button';
    geoBtn.className = 'geo-btn';
    geoBtn.textContent = '📍 Aktuellen Standort verwenden';
    radiusSection.appendChild(geoBtn);

    const citySelect = document.createElement('select');
    const cityPlaceholder = document.createElement('option');
    cityPlaceholder.value = '';
    cityPlaceholder.textContent = 'oder Stadt als Ausgangspunkt wählen…';
    citySelect.appendChild(cityPlaceholder);
    events
      .filter(e => e.lat != null && e.lon != null)
      .reduce((acc, e) => (acc.some(x => x.standort === e.standort) ? acc : acc.concat(e)), [])
      .sort((a, b) => a.standort.localeCompare(b.standort, 'de'))
      .forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.standort;
        opt.textContent = e.standort;
        if (state.origin && state.origin.label === e.standort) opt.selected = true;
        citySelect.appendChild(opt);
      });
    citySelect.addEventListener('change', () => {
      if (!citySelect.value) { state.origin = null; }
      else {
        const match = events.find(e => e.standort === citySelect.value);
        if (match) state.origin = { lat: match.lat, lon: match.lon, label: match.standort };
      }
      selectedIndex = null;
      render();
      renderStandortPanel(panel);
    });
    radiusSection.appendChild(citySelect);

    const statusEl = document.createElement('div');
    statusEl.className = 'radius-status';
    statusEl.textContent = state.origin ? `Ausgangspunkt: ${state.origin.label}` : 'Kein Ausgangspunkt gewählt.';
    radiusSection.appendChild(statusEl);

    geoBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        statusEl.textContent = 'Geolocation wird von diesem Browser nicht unterstützt.';
        return;
      }
      statusEl.textContent = 'Standort wird ermittelt…';
      navigator.geolocation.getCurrentPosition(
        pos => {
          state.origin = { lat: pos.coords.latitude, lon: pos.coords.longitude, label: 'Aktueller Standort' };
          selectedIndex = null;
          render();
          renderStandortPanel(panel);
        },
        err => {
          statusEl.textContent = 'Standort nicht verfügbar: ' + err.message;
        },
        { enableHighAccuracy: false, timeout: 10000 }
      );
    });

    const radiusOptions = document.createElement('div');
    radiusOptions.className = 'radius-options';
    RADIUS_BUCKETS.forEach(b => {
      const label = document.createElement('label');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'radius-bucket';
      radio.value = b.key;
      radio.checked = state.radius === b.key;
      radio.disabled = !state.origin;
      radio.addEventListener('change', () => {
        state.radius = radio.checked ? b.key : '';
        selectedIndex = null;
        render();
      });
      label.appendChild(radio);
      label.appendChild(document.createTextNode(b.label));
      radiusOptions.appendChild(label);
    });
    const clearLabel = document.createElement('label');
    const clearRadio = document.createElement('input');
    clearRadio.type = 'radio';
    clearRadio.name = 'radius-bucket';
    clearRadio.checked = state.radius === '';
    clearRadio.disabled = !state.origin;
    clearRadio.addEventListener('change', () => {
      state.radius = '';
      selectedIndex = null;
      render();
    });
    clearLabel.appendChild(clearRadio);
    clearLabel.appendChild(document.createTextNode('Kein Umkreis-Filter'));
    radiusOptions.appendChild(clearLabel);

    radiusSection.appendChild(radiusOptions);
    panel.appendChild(radiusSection);
  }

  function renderDatePanel(panel) {
    panel.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'date-row';
    wrap.innerHTML = `
      <label>Von<input type="date" id="date-von"></label>
      <label>Bis<input type="date" id="date-bis"></label>
    `;
    panel.appendChild(wrap);
    const vonInput = wrap.querySelector('#date-von');
    const bisInput = wrap.querySelector('#date-bis');
    vonInput.value = state.von;
    bisInput.value = state.bis;
    vonInput.addEventListener('change', () => { state.von = vonInput.value; selectedIndex = null; render(); });
    bisInput.addEventListener('change', () => { state.bis = bisInput.value; selectedIndex = null; render(); });
  }

  // ---------- filtering / rendering ----------

  function getFiltered() {
    return events
      .map((e, idx) => ({ e, idx }))
      .filter(({ e }) => {
        if (state.land.size && !state.land.has(e.land)) return false;
        if (state.art1.size && !state.art1.has(e.art1)) return false;
        if (state.art2.size && !state.art2.has(e.art2)) return false;
        if (state.standort.size && !state.standort.has(e.standort)) return false;
        if (state.von && e.datum_ende < state.von) return false;
        if (state.bis && e.datum_start > state.bis) return false;
        if (state.radius && state.origin) {
          if (e.lat == null || e.lon == null) return false;
          const dist = haversineKm(state.origin.lat, state.origin.lon, e.lat, e.lon);
          if (!inBucket(dist, state.radius)) return false;
        }
        return true;
      })
      .sort((a, b) => a.e.datum_start.localeCompare(b.e.datum_start));
  }

  function refreshOpenPanels() {
    document.querySelectorAll('details.col-filter[open]').forEach(d => {
      const col = COLUMNS.find(c => c.key === d.dataset.col);
      const panel = d.querySelector('.filter-panel');
      if (col && panel) renderFilterPanel(col, panel);
    });
  }

  function render() {
    updateFilterIndicators();
    renderChips();
    refreshOpenPanels();
    const filtered = getFiltered();
    countEl.textContent = `${filtered.length} von ${events.length} Events`;

    if (filtered.length === 0) {
      bodyEl.innerHTML = '<tr class="empty-row"><td colspan="7">Keine Events gefunden.</td></tr>';
    } else {
      bodyEl.innerHTML = '';
      filtered.forEach(({ e, idx }) => {
        const tr = document.createElement('tr');
        if (idx === selectedIndex) tr.classList.add('active');
        tr.innerHTML = `
          <td>${escapeHtml(e.land)}</td>
          <td>${escapeHtml(e.name)}</td>
          <td>${escapeHtml(e.standort)}</td>
          <td><span class="badge">${escapeHtml(e.art1)}</span></td>
          <td>${e.art2 ? `<span class="badge">${escapeHtml(e.art2)}</span>` : '–'}</td>
          <td>${formatRange(e.datum_start, e.datum_ende)}</td>
          <td>${e.laenge_km != null ? e.laenge_km + ' km' : '–'}</td>
        `;
        tr.addEventListener('click', () => { selectedIndex = idx; render(); });
        bodyEl.appendChild(tr);
      });
    }

    renderDetail();
  }

  function renderDetail() {
    if (selectedIndex === null || !events[selectedIndex]) {
      detailEl.innerHTML = '<div class="detail-empty">Wähle eine Zeile aus, um Details zu sehen.</div>';
      return;
    }
    const e = events[selectedIndex];
    detailEl.innerHTML = `
      <h2>${escapeHtml(e.name)}</h2>
      <div class="sub">${escapeHtml(e.standort)}, ${escapeHtml(e.land)}</div>
      <dl class="detail-grid">
        <dt>Art I</dt><dd>${escapeHtml(e.art1)}</dd>
        <dt>Art II</dt><dd>${escapeHtml(e.art2 || '–')}</dd>
        <dt>Zeitraum</dt><dd>${formatRange(e.datum_start, e.datum_ende)}</dd>
        <dt>Länge</dt><dd>${e.laenge_km != null ? e.laenge_km + ' km' : '–'}</dd>
        <dt>Land</dt><dd>${escapeHtml(e.land)}</dd>
        <dt>Standort</dt><dd>${escapeHtml(e.standort)}</dd>
      </dl>
      ${e.veranstalter_url ? `<a class="detail-link" href="${escapeHtml(e.veranstalter_url)}" target="_blank" rel="noopener noreferrer">Zur Veranstalter-Website ↗</a>` : ''}
    `;
  }

  function updateFilterIndicators() {
    document.querySelectorAll('details.col-filter').forEach(d => {
      const col = d.dataset.col;
      let active = false;
      if (col === 'land') active = state.land.size > 0;
      else if (col === 'art1') active = state.art1.size > 0;
      else if (col === 'art2') active = state.art2.size > 0;
      else if (col === 'standort') active = state.standort.size > 0 || (state.origin && state.radius);
      else if (col === 'zeitraum') active = !!(state.von || state.bis);
      d.classList.toggle('has-filter', active);
    });
  }

  function renderChips() {
    const chips = [];
    state.land.forEach(v => chips.push({ label: `Land: ${v}`, clear: () => state.land.delete(v) }));
    state.art1.forEach(v => chips.push({ label: `Art I: ${v}`, clear: () => state.art1.delete(v) }));
    state.art2.forEach(v => chips.push({ label: `Art II: ${v}`, clear: () => state.art2.delete(v) }));
    state.standort.forEach(v => chips.push({ label: `Standort: ${v}`, clear: () => state.standort.delete(v) }));
    if (state.von) chips.push({ label: `ab ${formatDate(state.von)}`, clear: () => { state.von = ''; } });
    if (state.bis) chips.push({ label: `bis ${formatDate(state.bis)}`, clear: () => { state.bis = ''; } });
    if (state.origin && state.radius) {
      const bucket = RADIUS_BUCKETS.find(b => b.key === state.radius);
      chips.push({ label: `Umkreis ${bucket ? bucket.label : ''} von ${state.origin.label}`, clear: () => { state.radius = ''; } });
    }

    chipsEl.innerHTML = '';
    chips.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(c.label)} <button aria-label="Filter entfernen">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        c.clear();
        selectedIndex = null;
        render();
      });
      chipsEl.appendChild(chip);
    });
  }

  function resetFilters() {
    state.land.clear();
    state.art1.clear();
    state.art2.clear();
    state.standort.clear();
    state.von = '';
    state.bis = '';
    state.origin = null;
    state.radius = '';
    selectedIndex = null;
    render();
  }
})();
</script>
</body>
</html>
