<script>
(function () {
  if (!window.fetch) return;
  fetch('https://firestore.googleapis.com/v1/projects/endurance-5177a/databases/(default)/documents/config/wartung', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var f = d && d.fields && d.fields.aktiv;
      if (f && f.booleanValue === true) location.replace('wartung.html');
    })
    .catch(function () { /* ohne Antwort läuft die Seite normal */ });
})();
</script>
<!-- Farbschema hell/dunkel: wortgleich wie in den anderen Seiten (test_farbschema_skript). -->
<script>
(function () {
  var wahl = null;
  try { wahl = localStorage.getItem('endurance-theme'); } catch (e) { /* privater Modus */ }
  var hell = wahl ? wahl === 'light'
    : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  var setze = function (h) {
    document.documentElement.setAttribute('data-theme', h ? 'light' : 'dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', h ? '#ffffff' : '#0b1220');
  };
  setze(hell);
  document.addEventListener('DOMContentLoaded', function () {
    var knopf = document.querySelector('.theme-btn');
    if (!knopf) return;
    knopf.addEventListener('click', function () {
      hell = document.documentElement.getAttribute('data-theme') !== 'light';
      setze(hell);
      try { localStorage.setItem('endurance-theme', hell ? 'light' : 'dark'); } catch (e) { /* ignorieren */ }
    });
  });
})();
</script>

<script>
(async function () {
  // Die Beiträge stehen in blog.json (neueste zuerst); jeder Beitrag ist
  // eine eigene Seite unter blog/<slug>.html, damit Suchmaschinen ihn
  // finden – seit dem 10.11.2026 auch auf Englisch unter blog/en/<slug>.html
  // (titel_en/teaser_en in blog.json, scripts/build_blog.py). Auf Englisch
  // zeigt die Übersicht die englischen Titel und verlinkt die englische
  // Fassung; ein Beitrag ohne sie bleibt deutsch, dann steht der Hinweis da.
  const I18N = {
    de: {
      title: 'Blog',
      nav_events: 'Events', nav_clubs: 'Clubs', nav_map: 'Karte', nav_blog: 'Blog',
      intro: 'Leitfäden, Tipps und Hintergründe rund um Laufen, Radfahren, Schwimmen und Triathlon – damit du dein nächstes Rennen findest und gut vorbereitet am Start stehst.',
      sprache: '',
      lesezeit: (n) => `${n} Min. Lesezeit`,
      weiter: 'Weiterlesen →',
      leer: 'Noch keine Beiträge.',
      fehler: 'Die Beiträge konnten nicht geladen werden.',
      eyebrow: 'Magazin', alle: 'Alle', filter: 'Beiträge filtern',
      abo_titel: 'Kein Rennen mehr verpassen',
      abo_text: 'Wähle Sportart und Umkreis – wir schicken dir neue Events per E-Mail, sobald sie in der Liste stehen.',
      abo_knopf: 'E-Mail-Abo einrichten', abo_events: 'Events entdecken',
      footer_imprint: 'Impressum', footer_privacy: 'Datenschutz',
      sport: { Laufen: 'Laufen', Fahrrad: 'Rad', Schwimmen: 'Schwimmen', Triathlon: 'Triathlon' },
      serie: { wissenschaft: 'Wissenschaft' },
      suche: 'Beiträge durchsuchen', suche_platzhalter: 'Beiträge durchsuchen – z. B. Kälte, Tapering, Neopren',
      suche_leeren: 'Suche löschen',
      treffer: (n, q) => `${n === 1 ? '1 Beitrag' : n + ' Beiträge'} zu „${q}“`,
      kein_treffer: (q) => `Kein Beitrag zu „${q}“ – versuch ein anderes Stichwort.`
    },
    en: {
      title: 'Blog',
      nav_events: 'Events', nav_clubs: 'Clubs', nav_map: 'Map', nav_blog: 'Blog',
      intro: 'Guides, tips and background on running, cycling, swimming and triathlon – to help you find your next race and start well prepared.',
      sprache: 'Some articles are only available in German.',
      lesezeit: (n) => `${n} min read`,
      weiter: 'Read more →',
      leer: 'No articles yet.',
      fehler: 'The articles could not be loaded.',
      eyebrow: 'Magazine', alle: 'All', filter: 'Filter articles',
      abo_titel: 'Never miss a race',
      abo_text: 'Pick your sport and radius – we email you new events as soon as they are listed.',
      abo_knopf: 'Set up email alerts', abo_events: 'Explore events',
      footer_imprint: 'Legal notice', footer_privacy: 'Privacy',
      sport: { Laufen: 'Running', Fahrrad: 'Cycling', Schwimmen: 'Swimming', Triathlon: 'Triathlon' },
      serie: { wissenschaft: 'Science' },
      suche: 'Search articles', suche_platzhalter: 'Search articles – e.g. cold, tapering, wetsuit',
      suche_leeren: 'Clear search',
      treffer: (n, q) => `${n === 1 ? '1 article' : n + ' articles'} for “${q}”`,
      kein_treffer: (q) => `No articles for “${q}” – try another keyword.`
    }
  };
  let lang = 'de';
  try { const s = localStorage.getItem('endurance-lang'); if (s === 'de' || s === 'en') lang = s; } catch (e) { /* ignorieren */ }
  const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SPORT_KLASSE = { Laufen: 'sport-laufen', Fahrrad: 'sport-fahrrad', Schwimmen: 'sport-schwimmen', Triathlon: 'sport-triathlon' };
  let beitraege = null;

  function datum(iso) {
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString(lang === 'en' ? 'en-GB' : 'de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  const SPORT_REIHE = ['Laufen', 'Fahrrad', 'Schwimmen', 'Triathlon'];
  // Serien (seit 20.11.2026): "serie" in blog.json, dieselben Namen wie
  // SERIEN in scripts/build_blog.py. Ein Filter wählt eine Sportart ODER
  // eine Serie; in der Adresse ?sportart=… bzw. ?serie=….
  const SERIEN = ['wissenschaft'];
  let filter = '';
  try {
    const q = new URLSearchParams(location.search);
    const f = q.get('sportart'), s = q.get('serie');
    if (SPORT_REIHE.includes(f)) filter = f;
    else if (SERIEN.includes(s)) filter = 'serie:' + s;
  } catch (e) { /* ignorieren */ }
  const passt = (b) => !filter || (filter.startsWith('serie:') ? b.serie === filter.slice(6) : b.sportart === filter);

  // Suche (seit 20.11.2026, vom Nutzer: „ein Suchfeld …, wo man nach Blogs
  // (also Stichwörtern) suchen kann“): Titel und Teaser aus blog.json, dazu
  // der ganze Text aus blog-suche.json (build_blog.py, DE und EN) – die Datei
  // lädt erst, wenn jemand ins Feld tippt. Jedes Wort muss vorkommen; Treffer
  // im Titel zählen mehr als im Teaser, die mehr als im Text. Umlaute gelten
  // in beiden Schreibweisen („Kälte“ = „Kaelte“). In der Adresse ?q=….
  let suche = '';
  try { suche = (new URLSearchParams(location.search).get('q') || '').slice(0, 80); } catch (e) { /* ignorieren */ }
  let index = null, indexLaedt = null;
  const normCache = new Map();
  const norm = (s) => String(s || '').toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  function ladeIndex() {
    if (!indexLaedt) {
      indexLaedt = fetch('blog-suche.json', { cache: 'no-cache' })
        .then(r => r.ok ? r.json() : {}).catch(() => ({}))
        .then(d => { index = d; if (suche) zeichne(); });
    }
    return indexLaedt;
  }
  const suchWoerter = () => norm(suche).split(/[^a-z0-9]+/).filter(w => w.length >= 2);
  function textNorm(b) {
    if (!index || !index[b.slug]) return '';
    if (!normCache.has(b.slug)) normCache.set(b.slug, norm((index[b.slug].de || '') + ' ' + (index[b.slug].en || '')));
    return normCache.get(b.slug);
  }
  function punkte(b, ws) {
    const titel = norm(b.titel + ' ' + (b.titel_en || '')), teaser = norm(b.teaser + ' ' + (b.teaser_en || ''));
    const text = textNorm(b);
    let summe = 0;
    for (const w of ws) {
      const p = (titel.includes(w) ? 6 : 0) + (teaser.includes(w) ? 3 : 0) + (text.includes(w) ? 1 : 0);
      if (!p) return 0;
      summe += p;
    }
    return summe;
  }
  // Ein Satzausschnitt um das erste Suchwort im Text der Seitensprache, das
  // Wort hervorgehoben – damit man sieht, warum der Beitrag passt.
  function ausschnitt(b, ws) {
    const roh = index && index[b.slug] && (index[b.slug][lang] || index[b.slug].de);
    if (!roh || !ws.length) return '';
    const muster = ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      .replace(/ae/g, '(?:ae|ä)').replace(/oe/g, '(?:oe|ö)').replace(/ue/g, '(?:ue|ü)').replace(/ss/g, '(?:ss|ß)'));
    const re = new RegExp(muster.join('|'), 'gi');
    const m = re.exec(roh);
    if (!m) return '';
    let von = Math.max(0, m.index - 70), bis = Math.min(roh.length, m.index + 110);
    if (von > 0) { const l = roh.indexOf(' ', von); if (l > 0 && l < m.index) von = l + 1; }
    if (bis < roh.length) { const r = roh.lastIndexOf(' ', bis); if (r > m.index) bis = r; }
    const stueck = roh.slice(von, bis);
    const markiert = esc(stueck).replace(new RegExp(muster.map(x => x.replace(/&/g, '&amp;')).join('|'), 'gi'), t => `<mark>${t}</mark>`);
    return (von > 0 ? '… ' : '') + markiert + (bis < roh.length ? ' …' : '');
  }

  // Englische Fassung da? test_blog hält fest, dass zu titel_en auch der
  // Text und damit die Seite blog/en/<slug>.html gehört.
  const hatEn = (b) => !!(b.titel_en && b.teaser_en);
  const inSprache = (b, f) => (lang === 'en' && hatEn(b) && b[f + '_en']) || b[f];
  const linkVon = (b) => `blog/${lang === 'en' && hatEn(b) ? 'en/' : ''}${encodeURIComponent(b.slug)}.html`;

  const tagHtml = (b) => '<span class="blog-tags">'
    + (b.sportart ? `<span class="blog-tag ${SPORT_KLASSE[b.sportart] || ''}">${esc(t('sport')[b.sportart] || b.sportart)}</span>` : '')
    + (SERIEN.includes(b.serie) ? `<span class="blog-tag serie-${esc(b.serie)}">${esc(t('serie')[b.serie])}</span>` : '')
    + '</span>';

  // Sportart-Filter nur mit den Sportarten, zu denen es Beiträge gibt –
  // bei einer einzigen Sportart gibt es nichts zu wählen. Dahinter je Serie
  // ein Chip, sobald es einen Beitrag der Serie gibt.
  function zeichneFilter() {
    const box = el('blog-filter');
    const da = SPORT_REIHE.filter(s => beitraege.some(b => b.sportart === s));
    const serien = SERIEN.filter(s => beitraege.some(b => b.serie === s));
    box.hidden = da.length < 2 && !serien.length;
    box.setAttribute('aria-label', t('filter'));
    if (box.hidden) { filter = ''; return; }
    if (filter && !beitraege.some(passt)) filter = '';
    const chips = ['', ...da].map(s =>
      `<button type="button" class="blog-chip${s ? ' ' + SPORT_KLASSE[s] : ''}" data-sport="${esc(s)}" aria-pressed="${s === filter}">${esc(s ? (t('sport')[s] || s) : t('alle'))}</button>`);
    serien.forEach(s => chips.push(
      `<button type="button" class="blog-chip serie-${esc(s)}" data-sport="serie:${esc(s)}" aria-pressed="${'serie:' + s === filter}">${esc(t('serie')[s])}</button>`));
    box.innerHTML = chips.join('');
  }

  function zeichne() {
    const liste = el('blog-liste');
    if (beitraege === null) return;
    zeichneFilter();
    let sicht = beitraege.filter(passt);
    const ws = suchWoerter();
    const sucht = ws.length > 0;
    if (sucht) {
      const bewertet = sicht.map(b => [b, punkte(b, ws)]).filter(x => x[1] > 0);
      bewertet.sort((a, b) => b[1] - a[1] || b[0].datum.localeCompare(a[0].datum));
      sicht = bewertet.map(x => x[0]);
    }
    const treffer = el('blog-treffer');
    treffer.hidden = !sucht || !sicht.length;
    if (sucht) treffer.textContent = t('treffer', sicht.length, suche.trim());
    if (!sicht.length) {
      liste.innerHTML = `<li class="blog-leer">${esc(sucht ? t('kein_treffer', suche.trim()) : t('leer'))}</li>`;
      return;
    }
    // Der neueste Beitrag steht groß oben (Aufmacher), die anderen als
    // Kacheln; beim Suchen sind alle Treffer gleich groß, mit Textausschnitt.
    liste.innerHTML = sicht.map((b, i) => `
      <li class="blog-karte${i === 0 && !sucht ? ' ist-aufmacher' : ''}">
        <a href="${linkVon(b)}"${lang === 'en' && !hatEn(b) ? ' hreflang="de" lang="de"' : ''}>
          <div class="blog-karte-bild">
            <img src="${esc(i === 0 ? b.bild : (b.bild_klein || b.bild))}"${i === 0 && b.bild_klein ? ` srcset="${esc(b.bild_klein)} 480w, ${esc(b.bild)} 960w" sizes="(max-width: 900px) 100vw, 640px"` : ''} alt="${esc(inSprache(b, 'bild_alt') || '')}" ${i === 0 ? 'fetchpriority="high"' : 'loading="lazy"'} width="960" height="640">
            ${tagHtml(b)}
          </div>
          <div class="blog-karte-text">
            <div class="blog-meta"><span>${esc(datum(b.datum))}</span><span aria-hidden="true">·</span><span>${esc(t('lesezeit', b.lesezeit_min))}</span></div>
            <h3>${esc(inSprache(b, 'titel'))}</h3>
            <p>${esc(inSprache(b, 'teaser'))}</p>
            ${sucht && ausschnitt(b, ws) ? `<p class="blog-ausschnitt">${ausschnitt(b, ws)}</p>` : ''}
            <span class="blog-weiter">${esc(t('weiter'))}</span>
          </div>
        </a>
      </li>`).join('');
  }
  el('blog-filter').addEventListener('click', (ev) => {
    const k = ev.target.closest('.blog-chip');
    if (!k) return;
    filter = k.dataset.sport;
    try {
      const u = new URL(location.href);
      u.searchParams.delete('sportart');
      u.searchParams.delete('serie');
      if (filter.startsWith('serie:')) u.searchParams.set('serie', filter.slice(6));
      else if (filter) u.searchParams.set('sportart', filter);
      history.replaceState(null, '', u);
    } catch (e) { /* ignorieren */ }
    zeichne();
  });

  const feld = el('blog-suche'), leeren = el('blog-suche-leeren');
  let sucheTimer = 0;
  function schreibeSuche() {
    try {
      const u = new URL(location.href);
      if (suche.trim()) u.searchParams.set('q', suche.trim()); else u.searchParams.delete('q');
      history.replaceState(null, '', u);
    } catch (e) { /* ignorieren */ }
  }
  function sucheGeaendert(sofort) {
    suche = feld.value.slice(0, 80);
    leeren.hidden = !suche;
    // Die Adresse sofort, nur das Zeichnen nach der Tipp-Pause: Kommt der
    // Index in der Pause an, zeichnet ladeIndex() schon – und dann muss ?q=
    // bereits zum angezeigten Stand passen.
    schreibeSuche();
    if (suche) ladeIndex();
    clearTimeout(sucheTimer);
    sucheTimer = setTimeout(zeichne, sofort ? 0 : 150);
  }
  feld.value = suche;
  leeren.hidden = !suche;
  if (suche) ladeIndex();
  feld.addEventListener('focus', ladeIndex, { once: true });
  feld.addEventListener('input', () => sucheGeaendert(false));
  feld.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); sucheGeaendert(true); feld.blur(); }
    if (ev.key === 'Escape' && feld.value) { ev.preventDefault(); feld.value = ''; sucheGeaendert(true); }
  });
  leeren.addEventListener('click', () => { feld.value = ''; sucheGeaendert(true); feld.focus(); });

  // „Nur auf Deutsch“ nur, wenn es wirklich einen Beitrag ohne englische Fassung gibt.
  function zeigeSprachhinweis() {
    const fehlt = beitraege !== null && beitraege.some(b => !hatEn(b));
    el('blog-sprache').textContent = t('sprache');
    el('blog-sprache').hidden = !t('sprache') || !fehlt;
  }

  function setLanguage(neu) {
    lang = neu;
    try { localStorage.setItem('endurance-lang', lang); } catch (e) { /* ignorieren */ }
    document.documentElement.lang = lang;
    document.title = t('title') + ' – Endurance Events';
    el('nav-events').textContent = t('nav_events');
    // Nur den Text setzen – das Schildchen „new“ bleibt stehen.
    el('nav-clubs').firstChild.nodeValue = t('nav_clubs');
    el('nav-map').textContent = t('nav_map');
    el('nav-blog').textContent = t('nav_blog');
    el('blog-eyebrow').textContent = t('eyebrow');
    el('blog-intro').textContent = t('intro');
    feld.placeholder = t('suche_platzhalter');
    feld.setAttribute('aria-label', t('suche'));
    leeren.setAttribute('aria-label', t('suche_leeren'));
    el('abo-titel').textContent = t('abo_titel');
    el('abo-text').textContent = t('abo_text');
    el('abo-knopf').textContent = t('abo_knopf');
    el('abo-events').textContent = t('abo_events');
    zeigeSprachhinweis();
    el('footer-impressum').textContent = t('footer_imprint');
    el('footer-datenschutz').textContent = t('footer_privacy');
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    zeichne();
  }
  document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.lang)));
  setLanguage(lang);

  try {
    const r = await fetch('blog.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    beitraege = (await r.json()).slice().sort((a, b) => b.datum.localeCompare(a.datum));
  } catch (err) {
    el('blog-liste').innerHTML = `<li class="blog-leer">${esc(t('fehler'))}</li>`;
    return;
  }
  zeigeSprachhinweis();
  zeichne();
})();
</script>

</body>
</html>
