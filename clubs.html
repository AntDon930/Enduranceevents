<!-- Wartungsmodus: wortgleich wie in Startseite, Liste und Karte (test_wartung). -->
<script>
(function () {
  if (!window.fetch) return;
  fetch('https://firestore.googleapis.com/v1/projects/endurance-5177a/databases/(default)/documents/config/wartung', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var f = d && d.fields && d.fields.aktiv;
      if (f && f.booleanValue === true) location.replace('wartung.html');
    })
    .catch(function () { /* ohne Antwort läuft die Seite normal */ });
})();
</script>
<!-- Farbschema hell/dunkel: wortgleich wie in den anderen Seiten (test_farbschema_skript). -->
<script>
(function () {
  var wahl = null;
  try { wahl = localStorage.getItem('endurance-theme'); } catch (e) { /* privater Modus */ }
  var hell = wahl ? wahl === 'light'
    : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  var setze = function (h) {
    document.documentElement.setAttribute('data-theme', h ? 'light' : 'dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', h ? '#ffffff' : '#0b1220');
  };
  setze(hell);
  document.addEventListener('DOMContentLoaded', function () {
    var knopf = document.querySelector('.theme-btn');
    if (!knopf) return;
    knopf.addEventListener('click', function () {
      hell = document.documentElement.getAttribute('data-theme') !== 'light';
      setze(hell);
      try { localStorage.setItem('endurance-theme', hell ? 'light' : 'dark'); } catch (e) { /* ignorieren */ }
    });
  });
})();
</script>

      fehlt_err_anon: 'Anonymes Melden ist in diesem Projekt noch nicht aktiviert (Firebase-Anbieter „Anonym“).',
      fehlt_err_config: 'Melden ist noch nicht eingerichtet (Firebase-Konfiguration fehlt).',
      schliessen: 'Schließen',
      // Vom Nutzer am 11.11.2026: Die Liste wächst noch jede Woche.
      hinweis: 'Wir ergänzen zurzeit jede Woche neue Clubs.',
      // Vom Nutzer am 16.11.2026: die verlinkte Seite des Clubs ist maßgeblich.
      hinweis_aenderung: 'Termine und Treffpunkte können sich kurzfristig ändern – schau vorher kurz ins verlinkte Strava- oder Instagram-Konto des Clubs.',
      kein_termin: 'Saisonpause',
      footer_imprint: 'Impressum', footer_privacy: 'Datenschutz'
    },
    en: {
      title: 'Clubs',
      nav_events: 'Events', nav_clubs: 'Clubs', nav_map: 'Map',
      suche: 'Club, city or meeting point',
      alle: 'All',
      wann_alle: 'Any time', wann_heute: 'Today', wann_morgen: 'Tomorrow', wann_wochenende: 'Weekend', wann_woche: '7 days',
      alle_staedte: 'All cities',
      alle_stufen: 'All levels',
      gratis: 'Free only',
      karte: 'On the map',
      treffer: (n) => `${n} club${n === 1 ? '' : 's'}`,
      leer: 'No club matches these filters.',
      reset: 'Clear filters',
      laden: 'Loading clubs…',
      fehler: (m) => `Could not load clubs.json: ${m}`,
      box_leer: 'Pick a club to see its meeting point, sessions and pace.',
      fehlt_box_titel: 'Missing your club?',
      fehlt_box_text: 'Send us the details – we will add it.',
      fehlt_open: 'Report a club',
      fehlt_titel: 'Is your club missing?',
      fehlt_intro: 'Send us a link to the club – website, Instagram or Strava – and the city. We will take the meeting point, sessions and pace from there.',

      fehlt_url_placeholder: 'https://… or @instagram-name',
      fehlt_name_label: 'Name of the club',
      fehlt_name_placeholder: 'e.g. Riverside Run Club',
      fehlt_stadt_label: 'City',
      fehlt_stadt_placeholder: 'e.g. Munich',
      fehlt_hinweis_label: 'Note (optional)',
      fehlt_hinweis_placeholder: 'Anything we should know – e.g. "meets every Tuesday at 7 pm".',
      fehlt_send: 'Send',
      fehlt_sending: 'Sending …',
      fehlt_thanks: 'Thank you! We will look at the club and add it.',
      fehlt_err_url: 'Please enter a link to the club.',
      fehlt_err_name: 'Please enter the name of the club.',
      fehlt_err_stadt: 'Please enter the city.',
      fehlt_err_save: 'Could not save your note. Please try again later.',
      fehlt_err_anon: 'Anonymous reporting is not enabled yet for this project (Firebase provider "Anonymous").',
      fehlt_err_config: 'Reporting is not set up yet (Firebase configuration missing).',
      schliessen: 'Close',
      hinweis: 'We’re adding new clubs every week.',
      hinweis_aenderung: 'Times and meeting points can change at short notice – check the club’s linked Strava or Instagram account before you go.',
      kein_termin: 'Off-season',
      footer_imprint: 'Legal notice', footer_privacy: 'Privacy'
    }
  };
  let lang = 'de';
  try { const s = localStorage.getItem('endurance-lang'); if (s === 'de' || s === 'en') lang = s; } catch (e) { /* ignorieren */ }
  const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };
  const esc = EF.escapeHtml;

  const f = { art: new Set(), stufe: new Set(), stadt: new Set(), gratis: false, wann: null, suche: '' };
  let clubs = [];
  let gewaehlt = null;

  const el = (id) => document.getElementById(id);
  const listeEl = el('club-liste');
  const boxEl = el('club-box-panel');   // die Club-Box; darunter steht „Dein Club fehlt?“
  const sucheEl = el('club-suche');
  const stadtEl = el('sel-stadt');
  const stufeEl = el('sel-stufe');
  const gratisEl = el('chk-gratis');
  const handy = () => window.matchMedia('(max-width: 900px)').matches;

  // ---------- Adresse ----------
  function leseAdresse() {
    const p = new URLSearchParams(location.search);
    (p.get('art') || '').split(',').filter(a => EC.ARTEN.includes(a)).forEach(a => f.art.add(a));
    (p.get('stufe') || '').split(',').filter(s => EC.STUFEN.includes(s)).forEach(s => f.stufe.add(s));
    (p.get('stadt') || '').split(',').filter(Boolean).forEach(s => f.stadt.add(s));
    f.gratis = p.get('gratis') === '1';
    const w = p.get('wann'); f.wann = EC.WANN.includes(w) ? w : null;
    f.suche = p.get('s') || '';
    const c = p.get('club'); if (c) gewaehlt = clubs.find(x => x.id === c) || null;
  }
  function params() {
    const p = new URLSearchParams();
    if (f.suche.trim()) p.set('s', f.suche.trim());
    if (f.art.size) p.set('art', Array.from(f.art).join(','));
    if (f.wann) p.set('wann', f.wann);
    if (f.stadt.size) p.set('stadt', Array.from(f.stadt).join(','));
    if (f.stufe.size) p.set('stufe', Array.from(f.stufe).join(','));
    if (f.gratis) p.set('gratis', '1');
    return p;
  }
  function schreibeAdresse() {
    const p = params();
    if (gewaehlt) p.set('club', gewaehlt.id);
    const s = p.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
  }
  // Die Karte versteht die Sportart als ?sportart= (filters.js) und
  // ?wann= für die Clubs (karte.html).
  function kartenLink() {
    const p = new URLSearchParams();
    p.set('ebene', 'clubs');
    if (f.art.size) p.set('sportart', Array.from(f.art).join(','));
    if (f.wann) p.set('wann', f.wann);
    if (f.suche.trim()) p.set('s', f.suche.trim());
    return 'karte.html?' + p.toString();
  }

  // ---------- Filterknöpfe ----------
  function seg(container, werte, aktiv, beschriftung, klick) {
    container.innerHTML = werte.map(w =>
      `<button type="button" class="seg-btn" data-w="${esc(w.key)}" aria-pressed="${aktiv(w.key) ? 'true' : 'false'}">${w.icon || ''}${esc(beschriftung(w.key))}</button>`
    ).join('');
    container.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => klick(b.dataset.w)));
  }
  function baueFilter() {
    seg(el('seg-art'), [{ key: '' }].concat(EC.ARTEN.map(a => ({ key: a, icon: EC.sportIcon(a, 15) }))),
      k => (k === '' ? f.art.size === 0 : f.art.has(k)),
      k => (k === '' ? t('alle') : EC.tx(lang, 'art_' + k)),
      k => { if (k === '') f.art.clear(); else if (f.art.has(k)) f.art.delete(k); else f.art.add(k); render(); });
    seg(el('seg-wann'), [{ key: '' }].concat(EC.WANN.map(w => ({ key: w }))),
      k => (k === '' ? !f.wann : f.wann === k),
      k => t('wann_' + (k || 'alle')),
      k => { f.wann = k || null; render(); });
    const staedte = Array.from(new Set(clubs.map(c => c.stadt))).sort((a, b) => a.localeCompare(b, 'de'));
    stadtEl.innerHTML = `<option value="">${esc(t('alle_staedte'))}</option>`
      + staedte.map(s => `<option value="${esc(s)}"${f.stadt.has(s) ? ' selected' : ''}>${esc(EF.VALUE_TRANSLATIONS.standort && EF.VALUE_TRANSLATIONS.standort[s] ? EF.VALUE_TRANSLATIONS.standort[s][lang] : s)}</option>`).join('');
    stufeEl.innerHTML = `<option value="">${esc(t('alle_stufen'))}</option>`
      + EC.STUFEN.map(s => `<option value="${s}"${f.stufe.has(s) ? ' selected' : ''}>${esc(EC.tx(lang, 'stufe_' + s))}</option>`).join('');
    gratisEl.checked = f.gratis;
    sucheEl.value = f.suche;
  }
  stadtEl.addEventListener('change', () => { f.stadt.clear(); if (stadtEl.value) f.stadt.add(stadtEl.value); render(); });
  stufeEl.addEventListener('change', () => { f.stufe.clear(); if (stufeEl.value) f.stufe.add(stufeEl.value); render(); });
  gratisEl.addEventListener('change', () => { f.gratis = gratisEl.checked; render(); });
  sucheEl.addEventListener('input', () => { f.suche = sucheEl.value; render(true); });
  el('reset-btn').addEventListener('click', () => {
    f.art.clear(); f.stufe.clear(); f.stadt.clear(); f.gratis = false; f.wann = null; f.suche = '';
    render();
  });

  // ---------- Liste ----------
  function hatFilter() {
    return f.art.size || f.stufe.size || f.stadt.size || f.gratis || f.wann || f.suche.trim();
  }
  // Der angezeigte Termin: der erste im gewählten Zeitraum, sonst der nächste.
  function terminFuer(c, jetzt) {
    const z = f.wann ? EC.wannZeitraum(f.wann, jetzt) : null;
    if (z) return EC.termineImZeitraum(c, z[0], z[1], { jetzt })[0] || null;
    return EC.naechsterTermin(c, jetzt);
  }
  function kachel(c, termin, pause) {
    const s = EC.stufen(c);
    const tags = [];
    // Kosten nur, wenn die Quelle etwas sagt - ein „–" als Tag sähe kaputt aus.
    const kosten = EC.formatKosten(c, lang);
    if (kosten !== '–') tags.push(`<span class="club-tag${EC.istGratis(c) ? ' club-tag--gratis' : ''}">${esc(kosten)}</span>`);
    s.forEach(x => tags.push(`<span class="club-tag">${esc(EC.tx(lang, 'stufe_' + x))}</span>`));
    const d = EC.formatDistanz(c.distanz_km, lang);
    if (d) tags.push(`<span class="club-tag">${esc(d)}</span>`);
    const rel = termin ? EF.relativeDays(termin.datum, lang) : '';
    const stadt = EF.VALUE_TRANSLATIONS.standort && EF.VALUE_TRANSLATIONS.standort[c.stadt] ? EF.VALUE_TRANSLATIONS.standort[c.stadt][lang] : c.stadt;
    const terminText = pause
      ? (pause.ab ? EC.tx(lang, 'pausiert_ab', EF.formatDateLong(pause.ab.datum, lang)) : EC.tx(lang, 'pausiert_offen'))
      : termin ? esc(EC.formatTerminKurz(termin, lang)) + (rel && !/^(heute|morgen|today|tomorrow)$/.test(rel) ? ` <span>· ${esc(rel)}</span>` : '') : esc(t('kein_termin'));
    return `<li><button type="button" class="club-karte${pause ? ' club-karte--pausiert' : ''}" data-id="${esc(c.id)}"${gewaehlt === c ? ' aria-current="true"' : ''}>
      <span class="ck-oben"><span class="ck-sport ${EC.sportClass(c.art)}">${EC.sportIcon(c.art, 14)}${esc(EC.tx(lang, 'art_' + c.art))}</span>${esc(EC.tx(lang, 'rh_' + EC.rhythmusVon(c)))}</span>
      <span class="ck-name">${esc(c.name)}</span>
      <span class="ck-ort">${esc(stadt)}${c.treffpunkt ? ' · ' + esc(c.treffpunkt) : ''}</span>
      <span class="ck-termin">${pause ? `<span class="ck-pausiert">${esc(terminText)}</span>` : terminText}</span>
      <span class="ck-fuss">${tags.join('')}</span>
    </button></li>`;
  }

  function zeichneBox() {
    if (!gewaehlt) {
      document.body.classList.remove('club-offen');
      boxEl.innerHTML = handy() ? '' : `<div class="detail-panel club-box-leer"><div class="detail-empty">${esc(t('box_leer'))}</div></div>`;
      richteAus();
      passeSpalte(true);
      return;
    }
    const panel = document.createElement('div');
    panel.className = 'detail-panel';
    EC.renderDetail(panel, gewaehlt, {
      lang, mapLink: true,
      onClose: handy() ? () => { gewaehlt = null; render(); } : null
    });
    boxEl.innerHTML = '';
    boxEl.appendChild(panel);
    document.body.classList.toggle('club-offen', handy());
    richteAus();
    passeSpalte(true);
  }

  // Die rechte Spalte klebt (sticky) und zeigt die Club-Box immer ganz,
  // ohne eigenen Scrollbalken (vom Nutzer am 16.11.2026: „Die sollte immer
  // voll gezeigt werden“ – vorher war die Spalte fensterhoch, oben auf der
  // Seite blieb der Box nur der Rest unter Kopf und Filtern, und Datum und
  // Name lagen weggescrollt im Kasten). Passt die Spalte ins Fenster, klebt
  // sie 16 px unter dem oberen Rand. Ist sie höher, wandert sie mit der
  // Seite: beim Herunterscrollen, bis ihre Unterkante („Dein Club fehlt?“)
  // im Bild ist, beim Hochscrollen, bis ihre Oberkante wieder da ist –
  // `top` liegt dafür zwischen Fensterhöhe − Spaltenhöhe − 16 und 16 px.
  // Ein neu gezeichneter Club beginnt oben (passeSpalte(true)).
  const spalteEl = el('club-box');
  let spalteTop = 16, letztesY = window.scrollY, spalteFrame = 0;
  function passeSpalte(vonOben) {
    spalteFrame = 0;
    const y = window.scrollY;
    const delta = y - letztesY;
    letztesY = y;
    if (handy()) { spalteEl.style.top = ''; return; }
    const unten = Math.min(16, window.innerHeight - spalteEl.offsetHeight - 16);
    spalteTop = vonOben === true ? 16 : spalteTop - delta;
    spalteTop = Math.max(unten, Math.min(16, spalteTop));
    spalteEl.style.top = spalteTop + 'px';
  }
  const spalteSpaeter = () => { if (!spalteFrame) spalteFrame = requestAnimationFrame(passeSpalte); };
  window.addEventListener('scroll', spalteSpaeter, { passive: true });
  window.addEventListener('resize', spalteSpaeter);
  // Die Box wird nach dem Laden der Schrift oder beim Umordnen der Fakten
  // höher oder niedriger – dann die Grenzen neu rechnen.
  if (window.ResizeObserver) new ResizeObserver(spalteSpaeter).observe(spalteEl);

  // Die rechte Spalte folgt den Reihen der Kartenliste (vom Nutzer am
  // 16.11.2026: „Die Box ‚Wähle einen Club…‘ muss mit der Box der Clubs
  // übereinstimmen und die orange Box mit der zweiten Reihe“): Oben
  // beginnen Liste und Spalte auf derselben Höhe (clubs.css), und solange
  // kein Club gewählt ist, ist die leere Box so hoch wie die erste Reihe,
  // „Dein Club fehlt?“ so hoch wie die zweite – der Abstand dazwischen ist
  // derselbe wie zwischen den Reihen (14 px, clubs.css). Eine gewählte
  // Club-Box behält ihre Höhe: Bis zur nächsten Reihenkante gestreckt,
  // hätte sie unten eine leere Fläche, und der Kasten rutschte aus dem
  // Bild. Nur am Rechner und nur, wenn beides ins Fenster passt
  // (Fensterhöhe − 32 px, dann klebt die Spalte ganz, passeSpalte).
  const fehltSeiteEl = spalteEl.querySelector('.club-fehlt-seite');
  let ausrichtFrame = 0;
  function richteAus() {
    ausrichtFrame = 0;
    const panel = boxEl.querySelector('.detail-panel');
    if (panel) panel.style.minHeight = '';
    fehltSeiteEl.style.minHeight = '';
    if (handy() || !panel || !panel.classList.contains('club-box-leer')) return;
    const karten = listeEl.children;
    if (karten.length < 2) return;
    const platz = window.innerHeight - 32;
    // Die ersten beiden Reihen (alle Karten einer Reihe sind gleich hoch).
    const reihen = [];
    for (const li of karten) {
      const r = li.getBoundingClientRect();
      const letzte = reihen[reihen.length - 1];
      if (letzte && Math.abs(r.top - letzte.oben) < 2) continue;
      if (reihen.length === 2) break;
      reihen.push({ oben: r.top, hoehe: r.height });
    }
    if (reihen.length < 2) return;
    const [erste, zweite] = reihen;
    const natuerlich = panel.offsetHeight;
    const fehltHoehe = fehltSeiteEl.offsetHeight;
    if (erste.hoehe < natuerlich - 1) return;
    if (zweite.oben + zweite.hoehe - erste.oben <= platz && zweite.hoehe >= fehltHoehe) {
      panel.style.minHeight = erste.hoehe + 'px';
      fehltSeiteEl.style.minHeight = zweite.hoehe + 'px';
    } else if (erste.hoehe + 14 + fehltHoehe <= platz) {
      panel.style.minHeight = erste.hoehe + 'px';
    }
  }
  const ausrichtenSpaeter = () => { if (!ausrichtFrame) ausrichtFrame = requestAnimationFrame(richteAus); };
  window.addEventListener('resize', ausrichtenSpaeter);
  // Über die 900-px-Grenze (iPad drehen) die Box neu zeichnen: Am Rechner
  // steht immer eine (die leere oder die des gewählten Clubs), auf dem
  // Handy ohne Auswahl keine. Ein gewählter Club öffnet beim Drehen aufs
  // Handy aber kein Blatt – das tut nur ein Tippen.
  const handyMq = window.matchMedia('(max-width: 900px)');
  const breiteGewechselt = () => { if (!handy() || !gewaehlt) zeichneBox(); else passeSpalte(); };
  if (handyMq.addEventListener) handyMq.addEventListener('change', breiteGewechselt);
  else if (handyMq.addListener) handyMq.addListener(breiteGewechselt);
  // Die Höhen der Karten stehen erst fest, wenn Barlow geladen ist – und
  // die Schrift kommt oft erst nach dem ersten Zeichnen. Ändert sich die
  // Liste in der Höhe, wird neu ausgerichtet (das Strecken der Spalte
  // ändert die Liste nicht, also keine Schleife).
  if (window.ResizeObserver) new ResizeObserver(ausrichtenSpaeter).observe(listeEl);
  else if (document.fonts && document.fonts.ready) document.fonts.ready.then(ausrichtenSpaeter);

  function render(nurListe) {
    const jetzt = new Date();
    if (!nurListe) baueFilter();
    const treffer = clubs.filter(c => EC.passt(c, f, jetzt))
      .map(c => ({ c, termin: terminFuer(c, jetzt), pause: EC.pausiert(c, jetzt) }))
      .sort((a, b) => {
        // Pausierte Clubs ans Ende – sie bleiben sichtbar, aber nach allem, was gerade läuft.
        if (!a.pause !== !b.pause) return a.pause ? 1 : -1;
        if (!a.termin !== !b.termin) return a.termin ? -1 : 1;
        if (a.termin && b.termin) {
          const ka = a.termin.datum + a.termin.uhrzeit, kb = b.termin.datum + b.termin.uhrzeit;
          if (ka !== kb) return ka < kb ? -1 : 1;
        }
        return a.c.name.localeCompare(b.c.name, 'de');
      });
    el('result-count').textContent = t('treffer', treffer.length);
    el('reset-btn').hidden = !hatFilter();
    listeEl.innerHTML = treffer.length
      ? treffer.map(x => kachel(x.c, x.termin, x.pause)).join('')
      : `<li class="club-leer">${esc(t('leer'))}</li>`;
    listeEl.querySelectorAll('.club-karte').forEach(b => b.addEventListener('click', () => {
      gewaehlt = clubs.find(c => c.id === b.dataset.id) || null;
      render(true);
    }));
    el('karte-btn').href = kartenLink();
    zeichneBox();
    schreibeAdresse();
  }

  // ---------- „Wir haben deinen Club nicht?“ ----------
  //
  // Derselbe Weg wie „Wir haben dein Event nicht?“ in events.html: gefragt
  // wird nach einem Link (Webseite, Instagram, Strava), dem Namen und – neu
  // gegenüber den Events – der Stadt, denn ein Instagram-Konto nennt sie
  // selten. Treffpunkt, Termine und Tempo holen wir uns vom Link; nichts
  // wird automatisch übernommen. Gespeichert wird über suggestEvent() in
  // eventSuggestions, mit „Club: “ vor dem Namen und „Stadt: …“ vorn im
  // Hinweis – die Grenzen der Regel (Name 200, Hinweis 600 Zeichen) halten
  // die maxlength-Werte unten ein.
  const SUGGEST_URL_MAX = 500;
  const SUGGEST_NAME_MAX = 190;      // + „Club: “ = höchstens 196
  const SUGGEST_STADT_MAX = 80;
  const SUGGEST_HINWEIS_MAX = 500;   // + „Stadt: …\n“ = höchstens 588
  const suggestOverlay = el('suggest-overlay');
  const suggestBodyEl = el('suggest-body');
  let suggestFesselGesetzt = false;
  let suggestFokusVorher = null;

  el('suggest-close').addEventListener('click', closeSuggestModal);
  suggestOverlay.addEventListener('click', (evt) => { if (evt.target === suggestOverlay) closeSuggestModal(); });
  document.querySelectorAll('[data-fehlt-btn]').forEach((b) => b.addEventListener('click', openSuggestModal));

  function closeSuggestModal() {
    suggestOverlay.hidden = true;
    suggestBodyEl.innerHTML = '';
    if (suggestFokusVorher && suggestFokusVorher.isConnected) {
      try { suggestFokusVorher.focus(); } catch (e) { /* ignorieren */ }
    }
    suggestFokusVorher = null;
  }

  // „run-club.de“ ohne Schema bekommt https:// davor, „@lauftreff“ wird
  // zum Instagram-Link; ohne Punkt im Hostnamen ist es keine Adresse.
  function normalisiereUrl(eingabe) {
    let text = String(eingabe || '').trim();
    if (!text) return null;
    const handle = /^@([A-Za-z0-9._]{1,30})$/.exec(text);
    if (handle) return `https://www.instagram.com/${handle[1]}/`;
    if (!/^https?:\/\//i.test(text)) {
      if (/^[a-z]+:\/\//i.test(text)) return null;
      text = 'https://' + text;
    }
    let u;
    try { u = new URL(text); } catch (e) { return null; }
    if (!u.hostname.includes('.')) return null;
    return u.href.slice(0, SUGGEST_URL_MAX);
  }

  function fehlerText(err) {
    const code = (err && (err.code || err.message)) || '';
    if (code === 'not-configured') return t('fehlt_err_config');
    if (code === 'auth/operation-not-allowed' || code === 'auth/admin-restricted-operation') return t('fehlt_err_anon');
    return t('fehlt_err_save');
  }

  function openSuggestModal() {
    const A = window.EndauranceAuth;
    if (!A || !A.suggestEvent) return;
    if (A.prepareFirestore) A.prepareFirestore();
    // Escape + Fokusfessel aus auth.js, erst beim ersten Öffnen: auth.js
    // trägt `defer` und existiert beim Inline-Skript noch nicht.
    if (!suggestFesselGesetzt && A.dialogTasten) {
      A.dialogTasten(suggestOverlay, closeSuggestModal);
      suggestFesselGesetzt = true;
    }
    suggestFokusVorher = document.activeElement;
    suggestBodyEl.innerHTML = `
      <h2 id="suggest-heading">${esc(t('fehlt_titel'))}</h2>
      <p class="report-intro">${esc(t('fehlt_intro'))}</p>
      <div id="suggest-msg"></div>
      <form id="suggest-form" novalidate>
        <div class="ee-field">
          <label for="suggest-url">${esc(t('fehlt_url_label'))}</label>
          <input type="url" id="suggest-url" inputmode="url" autocomplete="off"
                 maxlength="${SUGGEST_URL_MAX}" placeholder="${esc(t('fehlt_url_placeholder'))}">
        </div>
        <div class="ee-field">
          <label for="suggest-name">${esc(t('fehlt_name_label'))}</label>
          <input type="text" id="suggest-name" autocomplete="off"
                 maxlength="${SUGGEST_NAME_MAX}" placeholder="${esc(t('fehlt_name_placeholder'))}">
        </div>
        <div class="ee-field">
          <label for="suggest-stadt">${esc(t('fehlt_stadt_label'))}</label>
          <input type="text" id="suggest-stadt" autocomplete="address-level2"
                 maxlength="${SUGGEST_STADT_MAX}" placeholder="${esc(t('fehlt_stadt_placeholder'))}">
        </div>
        <div class="ee-field">
          <label for="suggest-hinweis">${esc(t('fehlt_hinweis_label'))}</label>
          <textarea id="suggest-hinweis" maxlength="${SUGGEST_HINWEIS_MAX}"
                    placeholder="${esc(t('fehlt_hinweis_placeholder'))}"></textarea>
          <div class="report-counter" id="suggest-counter">0 / ${SUGGEST_HINWEIS_MAX}</div>
        </div>
        <button type="submit" class="ee-submit-btn" id="suggest-submit">${esc(t('fehlt_send'))}</button>
      </form>
    `;
    suggestOverlay.hidden = false;
    const q = (s) => suggestBodyEl.querySelector(s);
    const form = q('#suggest-form'), urlEl = q('#suggest-url'), nameEl = q('#suggest-name');
    const stadtEl = q('#suggest-stadt'), hinweisEl = q('#suggest-hinweis');
    const counterEl = q('#suggest-counter'), msgEl = q('#suggest-msg'), submitEl = q('#suggest-submit');
    hinweisEl.addEventListener('input', () => {
      counterEl.textContent = `${hinweisEl.value.length} / ${SUGGEST_HINWEIS_MAX}`;
    });
    urlEl.focus({ preventScroll: true });
    const setMsg = (text, kind) => {
      msgEl.innerHTML = text ? `<div class="ee-form-msg ${kind}">${esc(text)}</div>` : '';
    };
    form.addEventListener('submit', (evt) => {
      evt.preventDefault();
      const url = normalisiereUrl(urlEl.value);
      const name = nameEl.value.trim();
      const stadt = stadtEl.value.trim();
      const hinweis = hinweisEl.value.trim();
      if (!url) { setMsg(t('fehlt_err_url'), 'error'); urlEl.focus(); return; }
      if (name.length < 2) { setMsg(t('fehlt_err_name'), 'error'); nameEl.focus(); return; }
      if (stadt.length < 2) { setMsg(t('fehlt_err_stadt'), 'error'); stadtEl.focus(); return; }
      setMsg(null);
      submitEl.disabled = true;
      submitEl.textContent = t('fehlt_sending');
      window.EndauranceAuth.suggestEvent({
        url,
        name: 'Club: ' + name,
        hinweis: 'Stadt: ' + stadt + (hinweis ? '\n' + hinweis : '')
      }).then(() => {
        if (window.EnduranceStats) window.EnduranceStats.event('fehlt');
        setMsg(t('fehlt_thanks'), 'success');
        form.querySelectorAll('.ee-field').forEach((x) => x.remove());
        submitEl.remove();
        // Mit den Feldern geht der Fokus verloren – zurück in den Dialog,
        // sonst erreicht Escape die Fokusfessel nicht mehr.
        suggestOverlay.querySelector('.ee-modal').focus({ preventScroll: true });
        window.setTimeout(() => { if (!suggestOverlay.hidden) closeSuggestModal(); }, 2500);
      }).catch((err) => {
        submitEl.disabled = false;
        submitEl.textContent = t('fehlt_send');
        setMsg(fehlerText(err), 'error');
      });
    });
  }

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && gewaehlt && handy() && suggestOverlay.hidden) { gewaehlt = null; render(true); }
  });
  // Ein Tippen auf den Schleier (body::after) schließt das Blatt.
  document.addEventListener('click', (ev) => {
    if (!document.body.classList.contains('club-offen')) return;
    if (ev.target === document.body || ev.target === document.documentElement) { gewaehlt = null; render(true); }
  });

  function setLanguage(neu) {
    lang = neu;
    try { localStorage.setItem('endurance-lang', lang); } catch (e) { /* ignorieren */ }
    document.documentElement.lang = lang;
    document.title = t('title') + ' – Endurance Events';
    el('nav-events').textContent = t('nav_events');
    el('nav-clubs').firstChild.nodeValue = t('nav_clubs');
    el('nav-map').textContent = t('nav_map');
    sucheEl.placeholder = t('suche');
    sucheEl.setAttribute('aria-label', t('suche'));
    el('chk-gratis-text').textContent = t('gratis');
    el('karte-btn-text').textContent = t('karte');
    el('reset-btn').textContent = t('reset');
    el('club-hinweis-neu').textContent = t('hinweis');
    el('club-hinweis-aenderung').textContent = t('hinweis_aenderung');
    document.querySelectorAll('[data-club-fehlt]').forEach((b) => {
      b.querySelector('[data-fehlt-titel]').textContent = t('fehlt_box_titel');
      b.querySelector('[data-fehlt-text]').textContent = t('fehlt_box_text');
      b.querySelector('[data-fehlt-btn]').textContent = t('fehlt_open');
    });
    el('suggest-close').setAttribute('aria-label', t('schliessen'));
    el('footer-impressum').textContent = t('footer_imprint');
    el('footer-datenschutz').textContent = t('footer_privacy');
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    if (clubs.length) render();
  }
  document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.lang)));

  setLanguage(lang);
  el('result-count').textContent = t('laden');
  try {
    clubs = await EC.loadClubs();
  } catch (err) {
    el('result-count').textContent = t('fehler', err.message);
    return;
  }
  leseAdresse();
  render();
  if (gewaehlt) {
    const k = listeEl.querySelector(`.club-karte[data-id="${CSS.escape(gewaehlt.id)}"]`);
    if (k) k.scrollIntoView({ block: 'center' });
  }
})();
</script>

</body>
</html>
