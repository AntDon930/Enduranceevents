name: Instagram-Reel

# Täglich ein Reel für den Account „AusdauerMaschine" (scripts/insta_lauf.py,
# README „Instagram"): planen → Video rendern → Caption → auf Wunsch
# veröffentlichen. Das Video liegt danach IMMER als Artefakt am Lauf
# (Actions → Lauf → „Artifacts"), auch wenn nicht gepostet wurde.
#
# ZWEI LÄUFE AM TAG (seit 14.10.2026, Freigabe mit einem Klick):
#   - 08:47 deutscher Zeit (06:47 UTC): VORSCHAU - nur rendern, das Reel
#     liegt als Artefakt zum Ansehen. Nichts wird gepostet.
#   - 17:47 deutscher Zeit (15:47 UTC): POSTEN - rendern und mit
#     `--posten --freigabe` veröffentlichen, wenn der Tag im Dashboard
#     freigegeben ist (admin.html, Karte „Instagram-Freigabe" → Firestore
#     insta_freigaben/<Datum>, scripts/insta_freigabe.py) ODER die
#     Repository-Variable INSTAGRAM_AUTOPOST = ja ist (Settings → Secrets
#     and variables → Actions → Variables). „gesperrt" im Dashboard sperrt
#     immer. Ohne Google-Zugang (nächster Absatz) wird nur gerendert.
#   - Von Hand („Run workflow"): Haken „posten" postet sofort, ohne
#     Freigabeprüfung.
#
# ANMELDUNG ÜBER INSTAGRAM (seit 16.10.2026, vom Nutzer gewählt: keine
# Facebook-Seite, das private Facebook-Konto bleibt getrennt). Der Schritt
# „Google-Zugang" tauscht das GitHub-Kennzeichen des Laufs per Workload
# Identity gegen einen Google-Zugang für eine Stunde – keine Schlüsseldatei,
# kein Secret in GitHub. Damit legt scripts/insta_posten.py das Video kurz
# in den Speicher gs://endurance-5177a-instagram (Instagram holt es dort
# ab) und holt den Instagram-Schlüssel aus dem Google-Tresor; JEDER Lauf
# erneuert ihn nach sieben Tagen, damit er nie die 60 Tage erreicht.
# Eingerichtet wird das einmal mit scripts/instagram_google_einrichten.sh
# in der Cloud Shell. Vorher schlägt der Schritt fehl (continue-on-error)
# und es wird nur gerendert – der Lauf bleibt grün.
#
# Der Zeitplan wirkt nur aus der Fassung auf `main` (GitHub liest
# schedule-Trigger nur vom Standard-Branch, wie bei update-events.yml);
# die Skripte kommen vom Entwicklungs-Branch. Wird diese Datei geändert,
# muss sie auf `main` mit.
#
# 17:47 Uhr deutscher Zeit im Sommer (15:47 UTC), 16:47 im Winter -
# Feierabend, die Zeit, in der Ausdauersportler auf Instagram sind.
# Minute 47 statt 0: Läufe zur vollen Stunde verspäten sich bei GitHub.

on:
  schedule:
    - cron: '47 6 * * *'
    - cron: '47 15 * * *'
  workflow_dispatch:
    inputs:
      datum:
        description: 'Datum YYYY-MM-DD (leer = heute)'
        required: false
        default: ''
      format:
        description: 'Format erzwingen (leer = Wochenplan)'
        required: false
        default: ''
        type: choice
        options: ['', monat, anmeldung, top, krass, naehe, wuerdest, humor, wochenende, saison, moment, clip, wochenvorschau, spotlight, region]
      posten:
        description: 'Auf Instagram veröffentlichen'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write   # Workload Identity: Google-Zugang ohne Schlüsseldatei

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/endurance-events-website-v1wruf

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg und Pakete
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet requests pillow

      # Pexels-Videos einmal laden, dann wiederverwenden.
      - name: Video-Cache
        uses: actions/cache@v4
        with:
          path: marketing/instagram/.cache
          key: insta-cache-${{ github.run_id }}
          restore-keys: insta-cache-

      # Nur der Workflow instagram.yml dieses Repositorys bekommt den
      # Zugang (Bedingung am Anbieter, scripts/instagram_google_einrichten.sh).
      - name: Google-Zugang (Workload Identity, ohne Schlüsseldatei)
        id: google
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/939878897826/locations/global/workloadIdentityPools/github/providers/enduranceevents
          service_account: instagram-reel@endurance-5177a.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Reel bauen (und veröffentlichen)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GCP_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          INSTAGRAM_AUTOPOST: ${{ vars.INSTAGRAM_AUTOPOST }}
          # Der Abendlauf postet mit Freigabeprüfung, der Handlauf mit
          # Haken „posten" sofort; der Morgenlauf rendert nur.
          ABENDLAUF: ${{ github.event_name == 'schedule' && github.event.schedule == '47 15 * * *' }}
          HANDPOSTEN: ${{ github.event_name == 'workflow_dispatch' && inputs.posten }}
        run: |
          ARGS="--ausgabe ausgabe"
          [ -n "${{ inputs.datum }}" ] && ARGS="$ARGS --datum ${{ inputs.datum }}"
          [ -n "${{ inputs.format }}" ] && ARGS="$ARGS --format ${{ inputs.format }}"
          [ "$ABENDLAUF" = "true" ] && ARGS="$ARGS --posten --freigabe"
          [ "$HANDPOSTEN" = "true" ] && ARGS="$ARGS --posten"
          python3 scripts/insta_lauf.py $ARGS

      - name: Reel als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: ausgabe/
          retention-days: 14
          if-no-files-found: ignore
