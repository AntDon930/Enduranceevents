name: Events automatisch aktualisieren

on:
  schedule:
    # WÖCHENTLICH, montags. Vorher lief der Workflow täglich; solange die
    # Seite noch nicht live ist, bringt ein täglicher Lauf nichts außer
    # Laufzeit und täglichen events.json-Commits (die Datei ist ~450 KB,
    # jeder Lauf erzeugt einen großen Diff). Ein Veranstaltungskalender
    # ändert sich ohnehin nicht stündlich. Für einen Lauf zwischendurch:
    # Actions -> "Events automatisch aktualisieren" -> "Run workflow".
    #
    # GitHub Actions führt Cron-Zeitpläne IMMER in UTC aus, keine deutsche
    # Zeitzone möglich. 06:00 deutscher Zeit entspricht 05:00 UTC (CET,
    # Winterzeit) bzw. 04:00 UTC (CEST, Sommerzeit). "05:00 UTC" hier ist
    # ein Mittelwert: das ergibt real ca. 06:00 Uhr CET / 07:00 Uhr CEST.
    # Für ganzjährig exakt 06:00 Uhr Ortszeit müsste man zwei Cron-Einträge
    # (04:00 und 05:00 UTC) mit einer Zeitzonen-Prüfung im ersten Schritt
    # kombinieren, die den "falschen" der beiden Läufe überspringt.
    - cron: '0 5 * * 1'
  # Manuelles Auslösen zum Testen (Tab "Actions" -> "Events automatisch
  # aktualisieren" -> "Run workflow").
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    # Laufzeit-Abschätzung (2 s Pause pro Request, aus robots.txt):
    #
    #   laufen.de        25 Kalenderseiten +  ~750 Detailseiten  ~26 min
    #   running.life   ~101 Kalenderseiten + ~2020 Detailseiten  ~71 min
    #   übrige Quellen                                            ~5 min
    #   Geocoding neuer Orte (nur beim ersten Lauf nach dem
    #   Ausweiten, danach aus dem Actions-Cache)               ~15-25 min
    #                                                       = ~120-130 min
    #
    # Die Detailseiten sind nicht optional: nur dort stehen die einzelnen
    # Wettbewerbe, das Land und die offizielle Veranstalter-Seite.
    # Das Limit liegt deutlich darüber, damit ein einzelner langsamer Lauf
    # nicht kurz vor dem Commit abgeschnitten wird - eine hängende
    # Quelle soll ihn aber weiterhin beenden, statt stundenlang Minuten zu
    # verbrauchen (GitHub-Standard wären 6 Stunden).
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/endurance-events-website-v1wruf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Nominatim (Geocoding) erlaubt max. 1 Request/Sekunde und die
      # Scraper-Skripte cachen Ergebnisse lokal in scripts/.geocode_cache.json
      # (per .gitignore nicht Teil des Repos). Der Cache wird hier über
      # GitHub Actions Cache zwischen den wöchentlichen Läufen
      # wiederverwendet, damit bereits bekannte Städte nicht jede Woche
      # erneut angefragt werden müssen.
      - name: Restore geocoding cache
        uses: actions/cache@v4
        with:
          path: scripts/.geocode_cache.json
          key: geocode-cache-${{ github.run_id }}
          restore-keys: |
            geocode-cache-

      - name: Anzahl Events vor dem Update zählen
        id: before
        run: echo "count=$(python3 -c 'import json; print(len(json.load(open("events.json"))))')" >> "$GITHUB_OUTPUT"

      # Führt alle scripts/*_scraper.py nacheinander aus und führt ihre
      # Ergebnisse in events.json zusammen (siehe scripts/update_events.py).
      # Ein einzelnes fehlschlagendes Scraper-Skript (z. B. weil eine
      # Quelle gerade nicht erreichbar ist oder ihre robots.txt den
      # Zugriff verbietet) lässt diesen Schritt NICHT fehlschlagen - nur
      # wenn ALLE Skripte fehlschlagen, bricht der Job hier ab.
      - name: Scraper ausführen und events.json aktualisieren
        env:
          # Optional: nur gesetzt, wenn "Benachrichtige mich" per E-Mail
          # eingerichtet wurde (siehe README.md, Abschnitt "Login/
          # Anmeldung einrichten" -> "Benachrichtige mich"). Ohne diese
          # Secrets ruft update_events.py schlicht keinen Webhook auf.
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: python3 scripts/update_events.py

      - name: events.json committen und pushen, falls geändert
        run: |
          # kalender/ zählt mit: dort liegt je Event eine .ics-Datei
          # (scripts/build_ics.py). Sie ändern sich, wenn Events dazu-
          # kommen oder wegfallen - auch wenn events.json selbst gleich
          # bliebe, dürfen sie nicht liegen bleiben.
          if git diff --quiet -- events.json kalender && \
             [ -z "$(git status --porcelain -- kalender)" ]; then
            echo "Keine Änderungen an events.json oder kalender/ – kein Commit nötig."
            exit 0
          fi

          AFTER=$(python3 -c 'import json; print(len(json.load(open("events.json"))))')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json kalender
          git commit -m "Automatisches Events-Update: ${{ steps.before.outputs.count }} -> ${AFTER} Events" \
                     -m "Ausgeführt vom wöchentlichen update-events-Workflow (scripts/update_events.py)."

          for i in 1 2 3 4; do
            if git push origin HEAD:claude/endurance-events-website-v1wruf; then
              break
            fi
            echo "Push fehlgeschlagen (Versuch $i/4) – hole Änderungen und versuche erneut..."
            git fetch origin claude/endurance-events-website-v1wruf
            git rebase origin/claude/endurance-events-website-v1wruf
            sleep $((2 ** i))
          done
