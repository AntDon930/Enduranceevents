name: Deploy GitHub Pages

# Jeder Push auf den Entwicklungs-Branch wird hier veröffentlicht - seit
# dem 13.10.2026 aber erst, wenn die Tests grün sind (Deploy-Gate, vom
# Nutzer gewünscht: „die sicherste Methode, ohne dass die Webseite down
# gehen kann"). Vorher liefen Tests (ci.yml) und Deploy nebeneinander:
# Eine kaputte Seite ging live, bevor die CI rot wurde. Drei Jobs:
#
#   aenderung - sieht nach, ob der Push NUR wartung.json ändert (der
#               Wartungsschalter, siehe README „Wartungsmodus").
#   pruefung  - ci.yml als wiederverwendbarer Workflow: Regressionstests
#               und Rauchtest in Chromium, zusammen etwa fünf Minuten.
#               Entfällt beim reinen Wartungsschalter - der soll in zwei
#               Minuten wirken, nicht in sieben.
#   deploy    - nur, wenn pruefung grün ist oder übersprungen wurde. Rot
#               heißt: nichts passiert, die alte Fassung bleibt live, die
#               CI-Mail sagt, welcher Job fehlschlug. Rollback: unter
#               Actions einen älteren grünen Lauf dieses Workflows öffnen
#               und „Re-run all jobs" - der alte Stand ist in zwei Minuten
#               wieder da.
#
# Ein Push des Datenlaufs (update-events.yml) löst diesen Workflow NICHT
# aus: GitHub unterdrückt Workflow-Läufe, die ein Push mit dem eigenen
# GITHUB_TOKEN auslösen würde (der Lauf vom 12.10.2026 hatte keinen
# einzigen Folge-Lauf). Die Ausnahme ist workflow_dispatch - deshalb soll
# update-events.yml diesen Workflow nach seinem Push selbst anstoßen
# (`gh workflow run pages.yml`); bis die Fassung auf main das tut, geht
# ein Datenlauf erst mit dem nächsten Push von Hand live.

on:
  push:
    branches:
      - claude/endurance-events-website-v1wruf
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aenderung:
    name: Was hat sich geändert?
    runs-on: ubuntu-latest
    outputs:
      nur_wartung: ${{ steps.a.outputs.nur_wartung }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # github.event.before ist der Stand vor dem Push. Fehlt er (manueller
      # Start, neuer Branch) oder ändert der Push noch etwas anderes, laufen
      # die Tests - im Zweifel prüfen.
      - name: Nur wartung.json?
        id: a
        env:
          VORHER: ${{ github.event.before }}
          EREIGNIS: ${{ github.event_name }}
        run: |
          nur=false
          if [ "$EREIGNIS" = push ] && [ -n "$VORHER" ] && git cat-file -e "$VORHER" 2>/dev/null; then
            dateien=$(git diff --name-only "$VORHER" "$GITHUB_SHA")
            if [ "$dateien" = "wartung.json" ]; then nur=true; fi
          fi
          echo "nur_wartung=$nur" >> "$GITHUB_OUTPUT"
          echo "Nur wartung.json geändert: $nur"

  pruefung:
    name: Tests vor dem Deploy
    needs: aenderung
    if: needs.aenderung.outputs.nur_wartung != 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [aenderung, pruefung]
    # Ohne diese Bedingung würde ein ÜBERSPRUNGENES pruefung (Wartungs-
    # schalter) auch den Deploy überspringen; ein rotes oder abgebrochenes
    # pruefung hält ihn weiter an.
    if: ${{ !cancelled() && needs.aenderung.result == 'success' && (needs.pruefung.result == 'success' || needs.pruefung.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # fetch-depth 0: build_web_data.py liest den Tag des letzten
      # Datencommits aus `git log -- events.json` (die Werkzeugleiste zeigt
      # ihn als "Stand"); mit einem flachen Checkout stünde dort der
      # Deploy-Tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Die kompakte Datenfassung entsteht hier, nicht im Repo (siehe
      # scripts/build_web_data.py und CLAUDE.md). Die Seiten laden sie
      # zuerst und fallen auf events.json zurück, wenn sie fehlt.
      - name: events.web.json erzeugen
        run: python3 scripts/build_web_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
