<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Ausdauersport-Events D/A/CH</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e0e3e8;
    --text: #1c1f24;
    --text-muted: #6b7280;
    --accent: #14509a;
    --accent-bg: #eaf1ff;
    --row-alt: #f8fafc;
    --row-hover: #eef4ff;
    --hero-gradient: linear-gradient(135deg, #0b2e6b 0%, #14509a 55%, #1d8fa8 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1d2025;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-muted: #9aa1ac;
      --accent: #5b9dff;
      --accent-bg: #1e2a40;
      --row-alt: #202329;
      --row-hover: #22314a;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    text-decoration: none;
  }
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    background: var(--hero-gradient);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: #fff;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 0.85rem;
    margin: 0;
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
  }
  .home-btn:hover, .map-btn:hover { background: rgba(255,255,255,0.26); }
  .map-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .lang-btn {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .lang-btn.active {
    background: #fff;
    color: #14315e;
    border-color: #fff;
  }

  /* Dasselbe Raster wie .layout, damit der rechte Rand der ersten Spalte
     exakt auf dem rechten Tabellenrand liegt. Die zweite Spalte bleibt
     leer und hält nur die Breite des Detailbereichs frei - so sitzt der
     Zurücksetzen-Button über der LISTE und nicht über den Details. */
  .toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px;
    margin-bottom: 10px;
  }
  @media (max-width: 900px) {
    .toolbar { grid-template-columns: 1fr; }
  }
  .toolbar-main {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  /* Schiebt den Button an das rechte Ende der Tabellenspalte. */
  .toolbar-main .reset-btn { margin-left: auto; }
  .result-count { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
  .reset-btn {
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(20,80,154,0.25);
  }
  .reset-btn:hover { opacity: 0.9; }
  .active-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.75rem;
    text-decoration: none;
  }
  .chip button {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0;
  }

  .notify-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-size: 0.86rem;
  }
  .notify-box[hidden] { display: none; }
  .notify-box p { margin: 0; flex: 1; min-width: 200px; color: var(--text); }
  .notify-box button {
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .notify-box button:hover { opacity: 0.9; }
  .notify-box .notify-status { font-size: 0.8rem; color: var(--text-muted); }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
    position: sticky;
    top: 16px;
  }
  .side-panel .detail-panel { width: 100%; }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
    max-height: 78vh;
    overflow-y: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 800px;
    table-layout: fixed;
    font-size: 0.86rem;
  }
  /* Spaltenreihenfolge: 1 Name, 2 Datum, 3 Land, 4 Standort, 5 Sportart,
     6 Kategorie, 7 Länge. Name breiter, Länge schmaler (die Einheit "km"
     steht ohnehin schon in jeder Zelle). Die Anmeldung-Spalte (Offen/
     Geschlossen) wurde entfernt: der Anmeldeschluss lässt sich bei den
     meisten Quellen nicht zuverlässig auslesen und fehlt daher fast
     überall - keine gute Datenbasis für einen Filter/eine Spalte. */
  th:nth-child(1), td:nth-child(1) { width: 22%; }
  th:nth-child(2), td:nth-child(2) { width: 13%; }
  th:nth-child(3), td:nth-child(3) { width: 12%; }
  th:nth-child(4), td:nth-child(4) { width: 15%; }
  th:nth-child(5), td:nth-child(5) { width: 12%; }
  th:nth-child(6), td:nth-child(6) { width: 17%; }
  th:nth-child(7), td:nth-child(7) { width: 9%; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 2;
    border-bottom: 1px solid var(--border);
    text-align: left;
    padding: 0;
    font-weight: 600;
  }
  .th-inner {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .th-inner span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    text-align: left;
    color: var(--text);
    text-decoration: none;
    font-weight: normal;
  }
  .cell-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
  }
  /* Bezeichnung des konkreten Wettbewerbs unter dem Veranstaltungsnamen.
     Eine Veranstaltung mit mehreren Strecken steht mit je einer Zeile pro
     Strecke in der Liste - ohne diese Zeile wären die Zeilen bis auf die
     Längenangabe identisch. */
  .wettbewerb {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.active { background: var(--accent-bg); }
  .empty-row td {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
  }

  /* Excel-style column filter button + floating panel */
  .col-filter-btn {
    list-style: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    background: transparent;
    user-select: none;
    flex-shrink: 0;
  }
  .col-filter-btn.open,
  .col-filter-btn.has-filter {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .filter-panel {
    position: fixed;
    z-index: 100;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    padding: 10px;
    min-width: 220px;
    max-width: 280px;
    font-weight: normal;
    white-space: normal;
    font-size: 0.86rem;
  }
  .filter-panel[hidden] { display: none; }
  .filter-panel .fp-actions {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    margin-bottom: 6px;
  }
  .filter-panel .fp-actions a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }
  .filter-list {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-list label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: normal;
    cursor: pointer;
  }
  .filter-panel .fp-empty {
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .filter-panel .range-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .filter-panel .range-row label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .filter-panel input[type="date"],
  .filter-panel input[type="number"],
  .filter-panel input[type="text"] {
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.82rem;
    width: 100%;
  }
  .radius-section .radius-title {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  /* Umkreis-Regler: 1-200 km */
  .radius-slider-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 8px;
  }
  .radius-slider-row .radius-value {
    font-size: 0.78rem;
    color: var(--text);
  }
  .radius-slider-row input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    margin: 0;
  }
  .radius-slider-row.disabled .radius-value { color: var(--text-muted); }
  .radius-scale {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--text-muted);
  }
  /* Ortssuche (places.json): Eingabefeld + Trefferliste */
  .place-search { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .place-results {
    max-height: 190px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 4px;
  }
  .place-result {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    padding: 4px 6px;
    font-size: 0.82rem;
    line-height: 1.25;
  }
  .place-result:hover,
  .place-result:focus { background: var(--accent-bg); border-color: var(--accent); }
  .place-result .place-meta {
    display: block;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .place-note {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .place-source {
    font-size: 0.66rem;
    color: var(--text-muted);
    margin-top: 8px;
  }
  .place-source a { color: inherit; }
  .origin-clear {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.72rem;
    padding: 0;
    margin-bottom: 6px;
  }
  .geo-btn {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 0.78rem;
    margin-bottom: 6px;
  }
  .geo-btn:hover { background: var(--accent-bg); }
  .radius-status {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    min-height: 1.1em;
  }
  .filter-panel select {
    width: 100%;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.82rem;
    margin-bottom: 6px;
  }

  /* Länge-Filter: Sportart-Tabs + Distanzkategorien */
  .distance-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }
  .distance-tab {
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 0.75rem;
    cursor: pointer;
  }
  .distance-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .distance-categories {
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* Datum-Baum (Jahr > Monat > Tag) */
  .date-tree {
    max-height: 240px;
    overflow-y: auto;
  }
  .tree-node { margin-bottom: 2px; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tree-toggle {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.7rem;
    width: 14px;
    flex-shrink: 0;
    padding: 0;
  }
  .tree-spacer {
    width: 14px;
    flex-shrink: 0;
    display: inline-block;
  }
  .tree-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: normal;
    cursor: pointer;
  }
  .tree-children { margin-left: 18px; }

  .detail-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
  }
  .detail-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 24px 8px;
    font-size: 0.9rem;
  }
  .detail-panel h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .detail-panel .sub { color: var(--text-muted); margin-bottom: 16px; font-size: 0.88rem; }
  .detail-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 9px;
    column-gap: 14px;
    font-size: 0.88rem;
  }
  .detail-grid dt { color: var(--text-muted); font-weight: 500; }
  .detail-grid dd { margin: 0; font-weight: normal; }
  .detail-link {
    display: inline-block;
    margin-top: 20px;
    padding: 9px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.88rem;
  }
  .detail-link:hover { opacity: 0.9; }

  /* "Fehler zu diesem Event melden" - bewusst als unauffaelliger
     Sekundaer-Button unter dem Veranstalter-Link: er soll auffindbar
     sein, aber nicht mit dem Link zur offiziellen Seite konkurrieren. */
  .report-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 8px 12px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
  }
  .report-btn:hover { background: var(--row-hover); color: var(--text); }

  /* Das Melde-Formular nutzt die Modal-Styles aus auth.js
     (.ee-modal-overlay, .ee-modal, .ee-field, .ee-submit-btn,
     .ee-form-msg) - hier nur die Ergaenzungen fuer Select/Textarea
     und die Event-Zusammenfassung im Dialog. */
  .report-event-summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 0.85rem;
  }
  .report-event-summary strong { display: block; margin-bottom: 2px; }
  .report-event-summary span { color: var(--text-muted); }
  .report-intro { margin: 0 0 14px; font-size: 0.86rem; color: var(--text-muted); }
  .ee-field select,
  .ee-field textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
  }
  .ee-field textarea { resize: vertical; min-height: 90px; }
  .report-counter { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 4px; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1 id="page-title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="top-actions">
    <a class="home-btn" href="index.html" id="home-btn"><span id="home-btn-label"></span></a>
    <a class="map-btn" href="karte.html" id="map-btn"><span id="map-btn-label"></span></a>
    <div id="auth-mount"></div>
    <div class="lang-switch" id="lang-switch">
      <button type="button" class="lang-btn" data-lang="de">DE</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="toolbar-main">
    <div class="result-count" id="result-count"></div>
    <div class="active-chips" id="active-chips"></div>
    <button class="reset-btn" id="reset-btn"></button>
  </div>
</div>

<div class="notify-box" id="notify-box" hidden></div>

<div class="layout">
  <div class="table-wrap">
    <table>
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="event-body"></tbody>
    </table>
  </div>
  <div class="side-panel">
    <div class="detail-panel" id="detail-panel"></div>
  </div>
</div>

<!-- Melde-Dialog fuer falsche Event-Daten. Nutzt die Modal-Optik aus
     auth.js; gespeichert wird via EndauranceAuth.reportEventError() in
     der Firestore-Collection "errorReports" (anonyme Anmeldung, damit
     die Security Rules request.auth verlangen koennen). -->
<div class="ee-modal-overlay" id="report-overlay" hidden>
  <div class="ee-modal" role="dialog" aria-modal="true" aria-labelledby="report-heading" tabindex="-1">
    <button type="button" class="ee-modal-close" id="report-close" aria-label="Schliessen">&#10005;</button>
    <div id="report-body"></div>
  </div>
</div>

<!-- Login/Registrierung (Google + E-Mail/Passwort), siehe auth.js und
     firebase-config.js. Ohne ausgefüllte Firebase-Config zeigt der
     "Anmelden"-Button einen Hinweis statt kaputter Funktionalität. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

<script>
(async function () {
  // ---------- Übersetzungen / i18n ----------

  const I18N = {
    de: {
      tab_title: 'Ausdauersport-Events D/A/CH',
      title: 'Ausdauersport-Events – Deutschland / Österreich / Schweiz',
      subtitle: 'Klicke auf eine Kopfzeile-Filterschaltfläche (▾), um die Liste einzugrenzen. Zeile anklicken für Details.',
      reset: 'Alle Filter zurücksetzen',
      home: 'Startseite',
      map: 'Karte',
      result_count: (n, total) => `${n} von ${total} Events`,
      col_datum: 'Datum', col_name: 'Name', col_sportart: 'Sportart', col_standort: 'Stadt/Ort',
      col_land: 'Land', col_kategorie: 'Kategorie', col_laenge: 'Länge',
