  .home-btn {

  /* Dasselbe Raster wie .layout, damit der rechte Rand der ersten Spalte
     exakt auf dem rechten Tabellenrand liegt. Die zweite Spalte bleibt
     leer und hält nur die Breite des Detailbereichs frei - so sitzt der

  .toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px;
    margin-bottom: 10px;
  }
  @media (max-width: 900px) {
    .toolbar { grid-template-columns: 1fr; }
  }
  .toolbar-main {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  /* Schiebt den Button an das rechte Ende der Tabellenspalte. */
  .toolbar-actions {
    /* margin-left: auto hält "Alle Filter zurücksetzen" am rechten Rand -
       auch dann, wenn Trefferzahl, Schalter und Chips so breit werden,
       dass der Knopf in eine eigene Zeile rutscht. Versuch, die Chips
       stattdessen wachsen zu lassen (flex: 1): dann rutschte der Knopf
       beim Umbruch nach LINKS. */
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .group-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    /* Etwas Abstand zur Trefferzahl links davon, damit Zahl und Schalter
       nicht ineinanderlaufen. */
    margin-left: 4px;
  }
  .group-toggle:hover { color: var(--text); }
  /* Zusammengefasste Zeile: der Name trägt einen Aufklapp-Pfeil, die
     Längen stehen als kleine Marken nebeneinander. */
  .group-row { cursor: pointer; font-weight: 600; }
  .group-row:hover { background: var(--row-hover); }
  .group-name { display: flex; align-items: center; gap: 6px; }
  .group-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  /* Rundes Feld mit Pfeil, dreht sich beim Aufklappen um 90°. */
  .chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    transition: transform 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .group-row:hover .chevron { color: var(--accent); border-color: var(--accent); }
  /* Veranstaltung mit nur einer Strecke: kein Pfeil, aber derselbe
     Einzug - so beginnen alle Namen der Spalte auf einer Linie. */
  .chevron-spacer { display: inline-block; width: 16px; height: 16px; flex-shrink: 0; }
  .chevron.open { transform: rotate(90deg); color: var(--accent); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }
  /* Anzahl der zusammengefassten Strecken. Auch die 1 wird angezeigt -
     sonst sieht eine einzelne Strecke nach einem fehlenden Wert aus.
     Bewusst ohne Kapsel/Rahmen: als Kapsel war die Zahl breiter als die
     ganze Spalte jetzt ist. */
  /* Die Zahl der zusammengefassten Strecken steht schlicht in der
     Tabelle, am linken Rand der ersten Spalte. Eine Variante, in der sie
     als Kapsel halb über der Rahmenlinie lag, war ausprobiert und wieder
     verworfen - sie wirkte wie ein aufgeklebtes Etikett. */
  .count-pill {
    display: inline-block;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    text-align: left;
  }
  .group-row:hover .count-pill { color: var(--text); }
  /* Die Marken in der Länge-Spalte (eine Kapsel je Distanz) sind weg:
     Sie sahen mit ihrem Rahmen und dem abgesetzten Hintergrund aus, als
     ließen sie sich anklicken, und bei einer Veranstaltung mit vielen
     Wettbewerben füllten sie mehrere Zeilen (beides vom Nutzer
     gemeldet). Stattdessen steht dort jetzt die Spanne "5–42,2 km"
     (laengeSpanne) - gleiche Schrift wie der Rest der Tabelle. */
  /* Unterzeilen tragen dieselbe Schrift wie alle anderen Zeilen - nur
     eingerückt. Sie waren früher kleiner (0.82rem); zusammen mit den
     Marken in der Länge-Spalte wirkte die Tabelle dadurch uneinheitlich
     (vom Nutzer gemeldet). Kenntlich sind Veranstaltung und Strecke jetzt
     über Pfeil, Anzahl und Einrückung - nicht über die Schriftgröße. */
  tbody tr.sub-row .col-name { padding-left: 22px; }
  tbody tr.sub-row .col-anzahl { color: var(--text-muted); }
  /* Aufgeklappt zeigt die Veranstaltungszeile die ERSTE Strecke selbst
     (siehe groupRowHtml) - zwei Strecken sind dann auch zwei Zeilen, nicht
     drei. Damit die Zeilen einer Veranstaltung dabei wie ein Block wirken,
     bekommt sie dieselbe Schrift wie ihre Unterzeilen; Pfeil und Anzahl
     bleiben als Kennzeichen der Veranstaltung. */
  tbody tr.group-row.open { font-weight: normal; }
  /* Mit Wettbewerbs-Zeile unter dem Namen säße der Pfeil sonst mittig
     zwischen beiden Zeilen. */
  .group-row.open .group-name { align-items: flex-start; }
  /* Aufgeklappt darf der Name umbrechen (darunter steht die Bezeichnung
     des Wettbewerbs) - aber höchstens auf zwei Zeilen, sonst wäre die
     Zeile höher als alle anderen. Gekürzt wird .group-name-text, nicht
     .group-name: Dessen display:-webkit-box widerspricht dem Flex, der
     Name rutschte damit unter das Chevron. */
  .group-row.open .group-name-text {
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .result-count { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
  /* Die Mastersuche: EIN Feld über Eventname, Wettbewerb und Ort. Sie

  .master-search input {

  /* Das ✕ erscheint nur, wenn etwas im Feld steht - ein dauerhaft

  .reset-btn {

  .active-chips {

  .notify-box {
    display: flex;
    flex-wrap: wrap;

    gap: 10px;

    border: 1px solid var(--accent);

  }
  .notify-box[hidden] { display: none; }
  .notify-box p { margin: 0; flex: 1; min-width: 200px; color: var(--text); }
  .notify-box button {
    padding: 8px 16px;
    border-radius: 999px;

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
    position: sticky;
    top: 16px;
  }
  .side-panel .detail-panel { width: 100%; }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
    max-height: 78vh;
    overflow-y: auto;
  }
  /* Die Liste soll die ganze Seite nutzen. Vorher war die Tabelle auf
     78vh begrenzt, die SEITE aber höher: Scrollte man die Seite statt der
     Liste, hörte die Liste auf und darunter blieb eine leere Fläche -
     und man scrollte in zwei verschiedenen Dingen (vom Nutzer gemeldet).
     Ab 901 px (zweispaltig, Detailbereich NEBEN der Tabelle) ist die
     Seite deshalb genau fensterhoch, und nur die Liste scrollt.
     Fußzeile und der Knopf "Event fehlt?" stehen damit immer sichtbar
     am unteren Rand.
     Auf dem Handy bleibt es beim Seiten-Scroll: Dort steht der
     Detailbereich UNTER der Tabelle und muss erreichbar sein - genau
     dafür scrollt zeigeDetailbereich() die Seite. */
  @media (min-width: 901px) {
    html { height: 100%; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* min-height: 0 an beiden Stellen - ohne das wächst ein Grid-/
       Flex-Element auf seine Inhaltshöhe und schiebt die Fußzeile aus
       dem Bild, statt selbst zu scrollen. */
    .layout { flex: 1 1 auto; min-height: 0; align-items: stretch; }
    .layout > * { min-height: 0; }
    .table-wrap { max-height: 100%; height: 100%; }
    .side-panel { max-height: 100%; overflow-y: auto; }
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 800px;
    table-layout: fixed;
    font-size: 0.86rem;
  }
  /* Spaltenreihenfolge: 1 Name, 2 Datum, 3 Land, 4 Standort, 5 Sportart,
     6 Kategorie, 7 Länge. Name breiter, Länge schmaler (die Einheit "km"
     steht ohnehin schon in jeder Zelle). Die Anmeldung-Spalte (Offen/
     Geschlossen) wurde entfernt: der Anmeldeschluss lässt sich bei den
     meisten Quellen nicht zuverlässig auslesen und fehlt daher fast
     überall - keine gute Datenbasis für einen Filter/eine Spalte. */
  /* Spaltenbreiten über KLASSEN, nicht über nth-child: die Spalten
     wechseln je nach Zustand (Entfernung nur mit Ausgangspunkt, Anzahl
     nur beim Zusammenfassen), und mit nth-child bräuchte jede Kombination
     ihren eigenen Satz Regeln. Die Summe muss nicht genau 100 % sein -
     table-layout: fixed verteilt proportional. */
  /* Die Zusammenfassung soll so wenig Platz wie möglich kosten: die
     Anzahl steht als kleine Zahl ganz links am Tabellenrand, gleich
     danach kommt der Name. Feste Pixelbreite statt Prozent - die Zahl
     ist ein- bis zweistellig, ein Anteil an der Tabellenbreite wäre
     immer zu breit. */
  .col-anzahl { width: 28px; text-align: left; }
  thead th.col-anzahl .th-inner { padding-left: 8px; padding-right: 0; }
  tbody td.col-anzahl { padding-left: 8px; padding-right: 0; }
  .col-name { width: 22%; }
  .col-datum { width: 13%; }
  /* 13 %, nicht 11 %: Bei 11 % (93 px auf Handybreite) brach
     "Deutschland" mitten im Wort um ("Deutschl" / "and") - das Wort
     braucht 76 px, der Inhalt hatte 73 px. Die Spaltenbreiten summieren
     sich ohnehin nur auf 95 %, die zwei Prozentpunkte kosten also keine
     andere Spalte. */
  .col-land { width: 13%; }
  .col-standort { width: 14%; }
  .col-entfernung { width: 11%; }
  .col-art1 { width: 11%; }
  .col-art2 { width: 13%; }
  .col-laenge_km { width: 11%; }
  table.with-distance { min-width: 900px; }

  /* Der Browser ueberspringt Layout und Zeichnen fuer Zeilen, die gerade
     nicht im Bild sind. Bei ueber 4.000 Zeilen ist das der Unterschied
     zwischen einer zaeh aufbauenden und einer sofort da stehenden Liste.
     Moeglich ist es nur, weil die Spaltenbreiten fest sind
     (table-layout: fixed) - sonst muesste der Browser doch jede Zeile
     ausmessen, um die Spalten zu verteilen. contain-intrinsic-size nennt
     die geschaetzte Zeilenhoehe, damit die Bildlaufleiste von Anfang an
     stimmt. Browser ohne content-visibility ignorieren beide Zeilen. */
  /* Jede Zeile ist gleich hoch, und kein Text darf über zwei Zeilen
     hinausgehen (so vom Nutzer gewünscht). `height` wirkt an einem <tr>
     wie eine Mindesthöhe: Eine einzeilige Zeile wird auf 52 px gestreckt,
     eine zweizeilige braucht genau so viel - damit sind alle gleich hoch.
     Dass nichts darüber hinauswächst, sichern die Kürzungen
     (.cell-clamp, .group-name-text) und die Längen-SPANNE bei
     zusammengefassten Veranstaltungen (laengeSpanne) - vorher stand dort
     je Strecke eine eigene Marke, was eine Veranstaltung mit 15
     Wettbewerben über vier Zeilen zog. */
  tbody tr {
    content-visibility: auto;
    contain-intrinsic-size: auto 52px;
    height: 52px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 2;
    border-bottom: 1px solid var(--border);
    text-align: left;
    padding: 0;
    font-weight: 600;
  }
  .th-inner {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .th-inner span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Der Spaltenname ist ein Knopf (Sortierung), soll aber wie eine
     Kopfzeile aussehen - deshalb ohne Rahmen und Hintergrund. */
  .th-sort {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .th-sort:hover { color: var(--accent); }
  .th-sort.active { color: var(--accent); }
  .sort-arrow { font-size: 0.7em; flex-shrink: 0; }

  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    text-align: left;
    color: var(--text);
    text-decoration: none;
    font-weight: normal;
  }
  .cell-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
  }
  /* Bezeichnung des konkreten Wettbewerbs unter dem Veranstaltungsnamen.
     Eine Veranstaltung mit mehreren Strecken steht mit je einer Zeile pro
     Strecke in der Liste - ohne diese Zeile wären die Zeilen bis auf die
     Längenangabe identisch. */
  .wettbewerb {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.active { background: var(--accent-bg); }
  /* Tastaturbedienung: die Zeile, auf der der Fokus steht, muss zu sehen
     sein. `:focus-visible` statt `:focus`, damit ein Mausklick (der die
     Zeile ebenfalls fokussiert) keinen Rahmen hinterlässt. `-2px` legt
     ihn nach innen - außen würde ihn der scrollende Tabellen-Container
     abschneiden. */
  tbody tr:focus { outline: none; }
  tbody tr:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: var(--accent-bg);
  }
  /* Enter auf einer Zeile springt in die Angaben - dort muss sichtbar
     sein, dass der Fokus jetzt hier steht. */
  .detail-panel:focus { outline: none; }
  .detail-panel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* "Neue Events per E-Mail" - sekundär neben "Alle Filter
     zurücksetzen", damit die Werkzeugleiste nicht zwei laute Knöpfe
     hat. */
  .abo-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--panel);
    color: var(--accent);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .abo-btn:hover { background: var(--accent-bg); }

  /* Inhalt des Abo-Dialogs */
  .abo-summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 0 0 14px;
    font-size: 0.86rem;
  }
  .abo-summary strong { display: block; margin-bottom: 2px; }
  /* Eigene Zeile: Im ersten Versuch stand der Hinweis direkt hinter der
     Filter-Zusammenfassung und las sich wie ein Teil von ihr
     ("… 25 km um München Der Datumsfilter gehört nicht dazu"). */
  .abo-summary .abo-hint {
    display: block;
    margin-top: 5px;
    color: var(--text-muted);
    font-size: 0.82rem;
  }
  /* Die Filterknöpfe im Dialog: dieselben wie in der Liste
     (filter-ui.css), hier nur die Reihe darum. */
  .abo-filter { margin: 0 0 12px; }
  .abo-filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .abo-abschnitt { display: block; margin: 0 0 6px; }
  .abo-filter > strong { display: block; }
  .abo-rhythm { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
  .abo-rhythm label {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .abo-rhythm label:hover { background: var(--row-hover); }
  .abo-rhythm input { margin-top: 3px; }
  .abo-rhythm .abo-rhythm-note { display: block; color: var(--text-muted); font-size: 0.8rem; }
  .abo-list { margin: 18px 0 0; border-top: 1px solid var(--border); padding-top: 14px; }
  .abo-list h3 { margin: 0 0 8px; font-size: 0.92rem; }
  .abo-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 0.84rem;
  }
  .abo-item .abo-item-rhythm { color: var(--text-muted); font-size: 0.8rem; }
  .abo-item button {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 6px;
    padding: 3px 9px;
    font: inherit;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .abo-item button:hover { color: #b42318; border-color: #b42318; }
  .abo-status { font-size: 0.85rem; margin-top: 10px; }
  .abo-status.ok { color: #1a7f37; }
  .abo-status.fehler { color: #b42318; }

  /* Die letzte Zeile, solange noch Einträge fehlen (siehe zeigeMehr).
     Die Zelle spannt über alle Spalten, also über die volle
     Tabellenbreite (800 px) - ein mittig gesetzter Knopf lag auf
     Handybreite damit außerhalb des Bildes, sobald man waagerecht
     gescrollt hatte. `position: sticky; left: 0` am inneren Element
     hält ihn am linken Rand des SICHTBAREN Bereichs, egal wie weit die
     Tabelle geschoben ist. */
  .mehr-row td {
    padding: 0;
    background: var(--panel);
  }
  .mehr-row .mehr-inner {
    position: sticky;
    left: 0;
    display: block;
    width: -moz-fit-content;
    width: fit-content;
    padding: 10px 8px;
  }
  .mehr-row .mehr-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--accent);
    border-radius: 999px;
    padding: 7px 16px;
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .mehr-row .mehr-btn:hover { background: var(--accent-bg); }
  .empty-row td {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
  }

  /* Excel-style column filter button + floating panel */
  /* Die Filterknöpfe und das schwebende Panel stehen in filter-ui.css -
     die Karte bindet dieselbe Datei ein (siehe filter-ui.js). */

  .detail-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
  }
  .detail-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 24px 8px;
    font-size: 0.9rem;
  }
  /* Kopfzeile der Box: Name + Ort links, Teilen-Knopf oben rechts. */
  .detail-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .detail-head-text { min-width: 0; flex: 1; }
  .detail-share {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    cursor: pointer;
  }
  .detail-share:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  .detail-share:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .detail-panel h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .detail-panel .sub { color: var(--text-muted); margin-bottom: 16px; font-size: 0.88rem; }
  .detail-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 9px;
    column-gap: 14px;
    font-size: 0.88rem;
  }
  .detail-grid dt { color: var(--text-muted); font-weight: 500; }
  .detail-grid dd { margin: 0; font-weight: normal; }
  .detail-link {
    display: inline-block;
    margin-top: 20px;
    padding: 9px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.88rem;
  }
  .detail-link:hover { opacity: 0.9; }

  /* "Zum Kalender hinzufügen" steht zwischen dem Veranstalter-Link und
     dem Melde-Knopf und sieht wie eine dritte, gleichwertige Schaltfläche
     aus - nur ohne Akzentfarbe, damit der Link zur offiziellen Seite die
     Hauptaktion bleibt. */
  .cal-box { position: relative; margin-top: 12px; }
  .cal-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .cal-btn:hover { background: var(--row-hover); border-color: var(--accent); color: var(--accent); }
  .cal-btn svg { flex-shrink: 0; }
  .cal-menu {
    margin-top: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .cal-menu[hidden] { display: none; }
  .cal-menu a,
  .cal-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--text);
    text-decoration: none;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .cal-menu a:hover,
  .cal-menu button:hover { background: var(--row-hover); color: var(--accent); }
  .cal-note {
    padding: 8px 12px;
    font-size: 0.76rem;
    color: var(--text-muted);
    background: var(--bg);
  }

  /* "Fehler zu diesem Event melden" - bewusst als unauffaelliger
     Sekundaer-Button unter dem Veranstalter-Link: er soll auffindbar
     sein, aber nicht mit dem Link zur offiziellen Seite konkurrieren. */
  .report-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 8px 12px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
  }
  .report-btn:hover { background: var(--row-hover); color: var(--text); }

  /* Das Melde-Formular nutzt die Modal-Styles aus auth.js
     (.ee-modal-overlay, .ee-modal, .ee-field, .ee-submit-btn,
     .ee-form-msg) - hier nur die Ergaenzungen fuer Select/Textarea
     und die Event-Zusammenfassung im Dialog. */
  .report-event-summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 0.85rem;
  }
  .report-event-summary strong { display: block; margin-bottom: 2px; }
  .report-event-summary span { color: var(--text-muted); }
  .report-intro { margin: 0 0 14px; font-size: 0.86rem; color: var(--text-muted); }
  .ee-field select,
  .ee-field textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
  }
  .ee-field textarea { resize: vertical; min-height: 90px; }
  .report-counter { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 4px; }

  /* "Wir haben dein Event nicht?" - eine schmale, leise Zeile UNTER der
     Liste. Wer etwas sucht, soll zuerst die Liste sehen; wer nichts
     gefunden hat, findet hier den nächsten Schritt. Ab 901 px ist die
     Seite genau fensterhoch, die Zeile steht also immer sichtbar unten.
     Dieselbe Sache steht zusätzlich in der Box bei null Treffern - dort
     ist sie der naheliegende nächste Schritt. */
  .fehlt-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 10px;
    padding: 10px 16px 0;
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  .fehlt-bar span { text-align: center; }
  .fehlt-btn {
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--accent);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .fehlt-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
  /* Im Melde-Dialog steht die Adresse der offiziellen Seite - ein langes
     Feld, das nicht abgeschnitten sein darf. */
  .ee-field input[type="url"] { font-family: inherit; }
  /* Fußzeile mit Impressum und Datenschutz. Beide müssen von JEDER
     Seite aus unmittelbar erreichbar sein (§ 5 DDG), deshalb steht die
     Zeile auf allen drei Seiten - hier inline und nicht in seite.css,
     weil diese Seite ihre eigenen Farbvariablen mitbringt. */
  .seiten-footer {
    padding: 18px 16px 28px;
    color: var(--text-muted);
    font-size: 0.82rem;
    text-align: center;
  }
  .seiten-footer a { color: inherit; }
  .seiten-footer .trenner { opacity: 0.5; padding: 0 6px; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-text">
    <h1 id="page-title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <!-- Alle Knöpfe in EINER umbrechenden Reihe, rechts. Der Teilen-Knopf
       gehört zur Seite als Ganzem (die aktuelle Suche), nicht zur Tabelle -
       in der Werkzeugleiste stand er zwischen Filter-Chips und
       Zurücksetzen und ging dort unter. -->
  <div class="top-actions">
    <a class="home-btn" href="index.html" id="home-btn"><span id="home-btn-label"></span></a>
    <a class="map-btn" href="karte.html" id="map-btn"><span id="map-btn-label"></span></a>
    <div id="auth-mount"></div>
    <div class="lang-switch" id="lang-switch">
      <button type="button" class="lang-btn" data-lang="de">DE</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
    <button type="button" class="share-btn" id="share-btn">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/>
        <path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>
      </svg>
      <span id="share-btn-label"></span>
    </button>
  </div>
</div>

<!-- Kurze Rückmeldung nach dem Kopieren. Bewusst ein eigenes, kleines
     Fenster statt einer Textänderung am Knopf: man sieht es auch, wenn
     der Blick gerade auf der Liste liegt. -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="toolbar">
  <div class="toolbar-main">
    <!-- Mastersuche: Eventname oder Ort, ein Feld. Steht links von der
         Trefferzahl (so vom Nutzer gewünscht). -->
    <div class="master-search">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input type="search" id="master-search" autocomplete="off" enterkeyhint="search">
      <button type="button" id="master-search-clear" hidden aria-label="">&#10005;</button>
    </div>
    <div class="result-count" id="result-count"></div>
    <!-- Der Schalter steht direkt hinter der Trefferzahl: Er verändert,
         WIE diese Zahl zu lesen ist ("810 Veranstaltungen (1413
         Strecken)"), gehört also dorthin und nicht zu den Knöpfen
         rechts. -->
    <label class="group-toggle"><input type="checkbox" id="group-toggle"><span id="group-toggle-label"></span></label>
    <div class="active-chips" id="active-chips"></div>
    <div class="toolbar-actions">
      <!-- Abo-Knopf: immer erreichbar, nicht nur bei null Treffern. Die
           frühere Box erschien erst, wenn eine Suche leer ausging - wer
           "alle neuen Schwimm-Events in Thüringen" abonnieren wollte,
           kam also gar nicht an sie heran. -->
      <button type="button" class="abo-btn" id="abo-open-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        <span id="abo-open-label"></span>
      </button>
      <button class="reset-btn" id="reset-btn"></button>
    </div>
  </div>
</div>

<div class="notify-box" id="notify-box" hidden></div>

<!-- Abo-Dialog ("Neue Events per E-Mail"). Nutzt die Modal-Stile aus
     auth.js (.ee-modal-overlay/.ee-modal) und dieselbe Fokusfessel
     (dialogTasten) wie der Melde-Dialog. -->
<div class="ee-modal-overlay" id="abo-overlay" hidden>
  <div class="ee-modal" role="dialog" aria-modal="true" aria-labelledby="abo-heading" tabindex="-1">
    <button type="button" class="ee-modal-close" id="abo-close" aria-label="Schliessen">&#10005;</button>
    <div id="abo-body"></div>
  </div>
</div>

<div class="layout">
  <div class="table-wrap">
    <table id="event-table">
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="event-body"></tbody>
    </table>
  </div>
  <div class="side-panel">
    <!-- tabindex="-1": Enter auf einer Zeile springt hierher (siehe
         Tastaturbedienung), ein eigener Tab-Stopp ist es aber nicht. -->
    <div class="detail-panel" id="detail-panel" tabindex="-1"></div>
  </div>
</div>

<!-- Unter der Liste: der Hinweis, dass die Liste nicht vollständig sein
     muss. Führt in denselben Dialog wie der Knopf in der
     Null-Treffer-Box - ein Weg, an dem ein Vorschlag entsteht. -->
<div class="fehlt-bar">
  <span id="fehlt-bar-text"></span>
  <button type="button" class="fehlt-btn" id="fehlt-open-btn"></button>
</div>

<!-- "Wir haben dein Event nicht?" - gespeichert wird via
     EndauranceAuth.suggestEvent() in der Firestore-Collection
     "eventSuggestions" (anonyme Anmeldung, wie bei den
     Fehlermeldungen). -->
<div class="ee-modal-overlay" id="suggest-overlay" hidden>
  <div class="ee-modal" role="dialog" aria-modal="true" aria-labelledby="suggest-heading" tabindex="-1">
    <button type="button" class="ee-modal-close" id="suggest-close" aria-label="Schliessen">&#10005;</button>
    <div id="suggest-body"></div>
  </div>
</div>

<!-- Melde-Dialog fuer falsche Event-Daten. Nutzt die Modal-Optik aus
     auth.js; gespeichert wird via EndauranceAuth.reportEventError() in
     der Firestore-Collection "errorReports" (anonyme Anmeldung, damit
     die Security Rules request.auth verlangen koennen). -->
<div class="ee-modal-overlay" id="report-overlay" hidden>
  <div class="ee-modal" role="dialog" aria-modal="true" aria-labelledby="report-heading" tabindex="-1">
    <button type="button" class="ee-modal-close" id="report-close" aria-label="Schliessen">&#10005;</button>
    <div id="report-body"></div>
  </div>
</div>

<!-- Login/Registrierung (Google + E-Mail/Passwort), siehe auth.js und
     firebase-config.js. Ohne ausgefüllte Firebase-Config zeigt der
     "Anmelden"-Button einen Hinweis statt kaputter Funktionalität. -->
<!-- `defer`: laedt parallel zum Seitenaufbau und laeuft erst danach.
     Ohne das wartete das Inline-Skript dieser Seite auf ~200 KB
     Firebase, bevor es events.json ueberhaupt anforderte.
     firebase-firestore-compat.js (344 KB) fehlt hier absichtlich -
     auth.js laedt es erst nach, wenn wirklich geschrieben wird. -->
<script defer src="vendor/firebase-10.14.1/firebase-app-compat.js"></script>
<script defer src="vendor/firebase-10.14.1/firebase-auth-compat.js"></script>
<script defer src="firebase-config.js"></script>
<script defer src="auth.js"></script>

<!-- Filterzustand, Distanzkategorien und Filter-Chips: dieselbe Datei
     nutzt karte.html, damit Liste und Karte unter denselben Filtern
     dieselben Events zeigen. -->
<script src="filters.js?v=62082c3c"></script>
<script src="filter-ui.js?v=50612dad"></script>

<script>
(async function () {
  // Gemeinsamer Filterzustand (filters.js). Alles, was Liste UND Karte
  // brauchen, steht dort - hier bleibt nur, was die Liste ausmacht
  // (Spalten, Sortierung, Zusammenfassen, Filter-Panels).
  const EF = window.EnduranceFilters;
  const EFU = window.EnduranceFilterUI;

  // Sicherung gegen eine halb alte Seite: GitHub Pages liefert jede Datei
  // mit max-age=600, ein Browser kann also diese Seite mit einer zehn
  // Minuten alten filters.js kombinieren. Fehlt darin eine Funktion,
  // bricht das Skript in seiner ersten Zeile ab - die Seite blieb dann
  // LEER (blauer Kopf, sonst nichts; genau das ist passiert). Die

  // Chip-/Zeitraum-Texte und die Übersetzung der Datenwerte

  } catch (e) { /* localStorage evtl. nicht verfügbar */ }

  function t(key, ...args) {
    const entry = I18N[currentLang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  }

  function tv(field, value) {
    if (value == null) return value;
    const entry = VALUE_TRANSLATIONS[field] && VALUE_TRANSLATIONS[field][value];
    return entry ? entry[currentLang] : value;
  }

  // Neues (siehe displayWettbewerb).
  const CANONICAL_RACE_NAMES = {
    'marathon': 42.2,
    'halbmarathon': 21.1,
    'half marathon': 21.1,
    'halbmarathon (hm)': 21.1
  };

  // Die Wettbewerbs-Bezeichnung, ODER null wenn sie nur die Länge
  // wiederholt.
  //
  // Die Quellen benennen einen Wettbewerb oft schlicht mit seiner Distanz
  // ("50 km", "6 km") oder mit deren kanonischem Namen ("Halbmarathon").
  // Beides steht schon in der Längen-Spalte; im Detailbereich erschien es
  // dadurch zweimal ("Race 50 km" über "Length 50 km"), in der Liste als
  // Unterzeile unter dem Namen. Bei gerundeten Quellenangaben sah es sogar
  // nach einem Widerspruch aus: Unterzeile "6 km" über der Spalte "5.5 km".
  //
  // Bezeichnungen mit eigener Aussage bleiben: "Laufen", "Wandern",
  // "Moslig 8000", "5×5 km Staffel", "26 km Trail". Das Feld selbst bleibt
  // in events.json erhalten - die Duplikat-Erkennung der Scraper braucht
  // es (über "Halbmarathon" wurde der doppelte München-Halbmarathon
  // gefunden).
  function displayWettbewerb(e) {
    const label = (e.wettbewerb || '').trim();
    if (!label) return null;
    const km = e.laenge_km;

    // Kanonischer Name, der genau die gespeicherte Länge bezeichnet?
    const canonical = CANONICAL_RACE_NAMES[label.toLowerCase()];
    if (canonical != null && km != null && Math.abs(canonical - Number(km)) <= 0.5) return null;

    // Bleibt nach Abzug der Distanzangaben und Füllwörter noch etwas übrig?
    const rest = label
      .replace(/\d{1,3}(?:[.,]\d+)?\s*(?:km|kilometer)\b/gi, ' ')
      .replace(/\b(?:ca|circa|etwa|rund|ungefähr|approx|ungefaehr)\b\.?/gi, ' ')
      .replace(/[\s.,;:\-–|~()]+/g, '')
      .trim();
    return rest ? label : null;
  }

  // Kategorie, Länge - die Liste steht in filter-ui.js, weil dieselbe

  // Keine Anmeldung-Spalte/-Filter: der Anmeldeschluss lässt sich bei
  // den meisten gescrapten Quellen nicht zuverlässig auslesen (fehlt fast
  // überall) - keine gute Datenbasis, siehe Docstrings der Scraper-Skripte.

  // die Gruppe sortiert Einträge ohne verwertbare Angabe ans Ende, egal in
  // welche Richtung sortiert wird (eine Zeile ohne Distanz soll nicht bei
  // "aufsteigend" ganz oben stehen).
  const SORT_KEYS = {
    name: e => [0, `${e.name || ''} ${e.wettbewerb || ''}`.toLowerCase()],
    datum: e => [0, e.datum_start || ''],
    land: e => [0, tv('land', e.land).toLowerCase()],
    standort: e => [0, (e.standort || '').toLowerCase()],
    art1: e => [0, tv('art1', e.art1).toLowerCase()],
    art2: e => [0, e.art2 ? tv('art2', e.art2).toLowerCase() : ''],
    // Drei Stufen: bekannte Distanz, dann Zeitrennen (nach Dauer), dann
    // Einträge ohne beides. Km und Stunden sind nicht vergleichbar - sie
    // in eine Zahlenreihe zu mischen würde eine Ordnung behaupten, die es
    // nicht gibt.
    laenge_km: e => e.laenge_km != null ? [0, e.laenge_km]
                  : e.dauer_h != null ? [1, e.dauer_h] : [2, 0],
    entfernung: e => {
      const d = distanceFromOrigin(e);
      return d == null ? [1, 0] : [0, d];
    }
  };

  // Die Entfernungs-Spalte gibt es nur mit Ausgangspunkt - ohne einen
  // wäre sie eine Spalte voller Striche. Sie steht direkt hinter
  // Stadt/Ort, weil sie dieselbe Frage beantwortet ("wie weit weg?").
