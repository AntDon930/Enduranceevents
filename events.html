  // Was ein Ausgangspunkt in der LISTE auslöst. Das Setzen selbst steckt
  // in filters.js (setOriginPlain), hier kommt dazu, was nur die Tabelle
  // betrifft: Mit einem Ausgangspunkt ist "was ist am nächsten?" die
  // naheliegende Frage - also nach Entfernung sortieren, solange noch die
  // Standard-Sortierung aktiv ist. Eine selbst gewählte Sortierung wird
  // nicht überschrieben. Fällt der Ausgangspunkt weg, verschwindet die
  // Spalte und mit ihr die Sortierung. Die Filter-Panels rufen das über
  // den setOrigin-Haken (siehe EFU.create oben).
  function setOrigin(origin) {
    const hatteOrigin = !!state.origin;
    EF.setOriginPlain(state, origin);
    if (origin && !hatteOrigin && state.sortKey === 'datum') {
      state.sortKey = 'entfernung';
      state.sortDir = 'asc';
    }
    if (!origin && state.sortKey === 'entfernung') {
      state.sortKey = 'datum';
      state.sortDir = 'asc';
    }
    selectedIndex = null;
    buildHeader();
  }

  function buildHeader() {
    headerRowEl.innerHTML = '';
    activeColumns().forEach(col => {
      const th = document.createElement('th');
      th.className = `col-${col.key}`;
      const inner = document.createElement('div');
      inner.className = 'th-inner';
      // Kurzer Spaltenname, wo es einen gibt ("Ort" statt "Ort & Umkreis"
      // - der lange steht auf der Filterpille).
      const name = t(col.headerKey || col.labelKey);

      // Der Spaltenname selbst ist der Sortier-Knopf. Spalten ohne
      // Sortierschlüssel bekommen nur eine Beschriftung, keinen toten
      // Knopf. Die FILTER-Knöpfe sitzen seit dem 21.09.2026 nicht mehr
      // hier, sondern als Pillen über der Tabelle (filter-bar).
      if (SORT_KEYS[col.key]) {
        const sortBtn = document.createElement('button');
        sortBtn.type = 'button';
        sortBtn.className = 'th-sort' + (state.sortKey === col.key ? ' active' : '');
        sortBtn.title = `${name} – ${t('sort_hint')}`;
        sortBtn.innerHTML = `<span>${escapeHtml(name)}</span>`
          + (state.sortKey === col.key
               ? `<span class="sort-arrow">${state.sortDir === 'asc' ? '▲' : '▼'}</span>`
               : '');
        sortBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          toggleSort(col.key);
        });
        th.setAttribute('aria-sort', state.sortKey === col.key
          ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
        inner.appendChild(sortBtn);
      } else {
        const label = document.createElement('span');
        label.textContent = name;
        inner.appendChild(label);
      }

      th.appendChild(inner);
      headerRowEl.appendChild(th);
    });
  }

  // ---------- filtering / rendering ----------

  function getFiltered() {
    return events
      .map((e, idx) => ({ e, idx }))
      // Welche Filter ein Event treffen müssen, entscheidet
      // EF.matchEvent - dieselbe Funktion nutzt die Karte.
      .filter(({ e }) => EF.matchEvent(state, e))
      // Sortiert nach der angeklickten Spalte, Standard ist das Datum
      // aufsteigend (nächster Termin zuerst). Vergangene Events brauchen
      // keinen Sonderfall mehr - sie kommen gar nicht in die Liste
      // (siehe dropPastEvents beim Laden).
      .sort((a, b) => compareEvents(a.e, b.e));
  }

  // Erster Klick auf eine Spalte sortiert aufsteigend, der zweite dreht
  // die Richtung. Datum und Entfernung fangen aufsteigend an (nächster
  // Termin / nächstgelegener Ort zuerst) - das ist auch bei allen anderen
  // Spalten die erwartete Leserichtung.
  function toggleSort(key) {
    if (!SORT_KEYS[key]) return;
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = 'asc';
    }
    buildHeader();
    render();
  }

  function compareEvents(a, b) {
    const fn = SORT_KEYS[state.sortKey] || SORT_KEYS.datum;
    const [ga, va] = fn(a);
    const [gb, vb] = fn(b);
    // Einträge ohne Angabe stehen immer hinten, unabhängig von der Richtung.
    if (ga !== gb) return ga - gb;
    let cmp;
    if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), currentLang === 'de' ? 'de' : 'en');
    if (cmp === 0) {
      // Gleichstand: Datum, dann Name - sonst wechselt die Reihenfolge
      // gleichwertiger Zeilen bei jedem Neuzeichnen.
      cmp = (a.datum_start || '').localeCompare(b.datum_start || '')
         || (a.name || '').localeCompare(b.name || '');
      return cmp;
    }
    return state.sortDir === 'asc' ? cmp : -cmp;
  }

  // Eine Tabellenzelle. Die Zellen werden aus activeColumns() aufgebaut
  // statt fest untereinander geschrieben - nur so lässt sich die
  // Entfernungs-Spalte an der richtigen Stelle einschieben, ohne die
  // Reihenfolge an zwei Orten pflegen zu müssen.
  // opts.zweiteZeile: in einem aufgeklappten Block steht unter dem Namen
  // IMMER der Wettbewerb - notfalls die Länge ("10 km"), damit sich die
  // Strecken einer Veranstaltung auch im Namen unterscheiden (Vorlage
  // des Nutzers). Außerhalb eines Blocks nur, wenn das Label mehr sagt
  // als die Längen-Spalte (displayWettbewerb).
  function cellHtml(col, e, opts) {
    const td = (inhalt, extra) =>
      `<td class="col-${col.key}${extra ? ' ' + extra : ''}">${inhalt}</td>`;
    switch (col.key) {
      case 'name': {
        const wb = displayWettbewerb(e) || (opts && opts.zweiteZeile ? formatLength(e) : null);
        return td(`<div class="cell-clamp" title="${escapeHtml(wb ? e.name + ' – ' + wb : e.name)}">`
             + `${escapeHtml(e.name)}${wb ? `<span class="wettbewerb">${escapeHtml(wb)}</span>` : ''}</div>`);
      }
      case 'datum': return td(`<div class="cell-clamp">${formatRangeHtml(e.datum_start, e.datum_ende)}</div>`);
      case 'land': return td(`<div class="cell-clamp">${escapeHtml(tv('land', e.land))}</div>`);
      // tv() statt des rohen Werts: Städte mit eigenem englischen Namen
      // stehen in der englischen Fassung auch so da (München → Munich,
      // siehe VALUE_TRANSLATIONS.standort). Alle anderen ~1.500 Orte
      // gibt tv() unverändert zurück.
      case 'standort': return td(`<div class="cell-clamp">${escapeHtml(tv('standort', e.standort))}</div>`);
      case 'entfernung': return td(`<div class="cell-clamp">${escapeHtml(formatDistance(e))}</div>`);
      case 'art1': return td(`<div class="cell-clamp sport-cell">${EED.sportIcon(e.art1)}<span>${escapeHtml(tv('art1', e.art1))}</span></div>`);
      case 'art2': return td(`<div class="cell-clamp">${e.art2 ? escapeHtml(tv('art2', e.art2)) : '–'}</div>`);
      case 'laenge_km': return td(`<div class="cell-clamp">${formatLength(e)}</div>`);
      default: return td('');
    }
  }


  // Schlüssel einer Veranstaltung: Name + Datum + Ort. Genau die drei
  // Felder machen aus mehreren Strecken eine Veranstaltung - die Distanz
  // ist gerade das, was sie unterscheidet.
  function groupKey(e) {
    return `${(e.name || '').toLowerCase()}|${e.datum_start}|${(e.standort || '').toLowerCase()}`;
  }

  // Gruppiert die (schon sortierten) Zeilen in der Reihenfolge, in der
  // sie auftreten - so bleibt die gewählte Sortierung sichtbar.
  function buildGroups(filtered) {
    const gruppen = [];
    const index = new Map();
    filtered.forEach(row => {
      const key = groupKey(row.e);
      let g = index.get(key);
      if (!g) {
        g = { key, rows: [] };
        index.set(key, g);
        gruppen.push(g);
      }
      g.rows.push(row);
    });
    return gruppen;
  }

  // Besteht eine Veranstaltung nur aus einer Strecke, gibt es nichts
  // aufzuklappen: die Unterzeile würde Wort für Wort dasselbe zeigen wie
  // die Zeile darüber. Solche Zeilen bekommen deshalb keinen Pfeil (und
  // in render() auch kein Klick-Verhalten zum Aufklappen).
  function istEinzelgruppe(g) {
    return g.rows.length === 1;
  }

  // Zugeklappt fasst diese Zeile die ganze Veranstaltung zusammen (alle
  // Längen als Marken). Aufgeklappt zeigt sie die ERSTE Strecke wie eine
  // gewöhnliche Zeile - die übrigen folgen als Unterzeilen. Eine
  // Veranstaltung mit zwei Strecken steht dadurch aufgeklappt in zwei
  // Zeilen; vorher waren es drei (Zusammenfassung + beide Strecken), und
  // die Zusammenfassung wiederholte nur, was direkt darunter stand.
  // Was bei einer zusammengefassten Veranstaltung in der Länge-Spalte
  // steht: die SPANNE über alle ihre Strecken, "5–42,2 km". Eine
  // Veranstaltung mit 15 Wettbewerben hatte vorher 15 Marken in der
  // Zelle und war dadurch vielfach höher als jede andere Zeile (so vom
  // Nutzer gemeldet); die einzelnen Distanzen stehen aufgeklappt
  // ohnehin in ihren eigenen Zeilen.
  //
  // Eine bekannte Distanz hat Vorrang (Datenregel 8): Bietet eine
  // Veranstaltung Strecken UND ein Zeitrennen, nennt die Zeile die
  // Strecken. Nur wenn es gar keine Distanz gibt, steht dort die Spanne
  // der Dauern ("12–24 h").
  function laengeSpanne(g) {
    const km = [];
    const stunden = [];
    g.rows.forEach(({ e }) => {
      if (e.laenge_km != null && !Number.isNaN(Number(e.laenge_km))) km.push(Number(e.laenge_km));
      else if (e.dauer_h != null && !Number.isNaN(Number(e.dauer_h))) stunden.push(Number(e.dauer_h));
    });
    const werte = km.length ? km : stunden;
    if (!werte.length) return '–';
    const einheit = km.length ? 'km' : 'h';
    const zahl = (v) => EF.formatNumber(v, currentLang, 1);
    const von = zahl(Math.min.apply(null, werte));
    const bis = zahl(Math.max.apply(null, werte));
    // Ohne Leerzeichen um den Gedankenstrich: Die Spalte ist schmal, und
    // "5 – 42,2 km" bräuchte dort zwei Zeilen.
    return von === bis ? `${von} ${einheit}` : `${von}–${bis} ${einheit}`;
  }

  function groupRowHtml(g, cols) {
    const e = g.rows[0].e;
    const einzeln = istEinzelgruppe(g);
    const offen = !einzeln && state.offeneGruppen.has(g.key);
    const wb = offen ? (displayWettbewerb(e) || formatLength(e)) : null;
    const kategorien = [];
    g.rows.forEach(({ e: r }) => {
      const k = r.art2 ? tv('art2', r.art2) : null;
      if (k && !kategorien.includes(k)) kategorien.push(k);
    });
    return cols.map(col => {
      switch (col.key) {
        case 'name':
          // Statt des Pfeils ein gleich breiter Platzhalter: sonst
          // beginnen die Namen einzelner Strecken weiter links als die
          // der aufklappbaren Veranstaltungen.
          return `<td class="col-name"><div class="group-name" title="${escapeHtml(wb ? e.name + ' – ' + wb : e.name)}">`
               + (einzeln
                   ? `<span class="chevron-spacer" aria-hidden="true"></span>`
                   : `<span class="chevron${offen ? ' open' : ''}">${CHEVRON_SVG}</span>`)
               + `<span class="group-name-text">${escapeHtml(e.name)}`
               + (wb ? `<span class="wettbewerb">${escapeHtml(wb)}</span>` : '')
               + `</span></div></td>`;
        case 'art2':
          // Aufgeklappt gehört in die Zeile nur die Kategorie der ersten
          // Strecke - die übrigen stehen in ihren eigenen Zeilen.
          if (offen) return cellHtml(col, e);
          return `<td class="col-art2"><div class="cell-clamp">${kategorien.length ? escapeHtml(kategorien.join(' · ')) : '–'}</div></td>`;
        case 'laenge_km':
          if (offen) return cellHtml(col, e);
          return `<td class="col-laenge_km"><div class="cell-clamp">${escapeHtml(laengeSpanne(g))}</div></td>`;
        default:
          return cellHtml(col, e);
      }
    }).join('');
  }

  // ---------- Die Tabelle zeichnen ----------
  //
  // Alle Zeilen entstehen als EIN HTML-String und werden in einem Zug
  // gesetzt. Vorher baute render() jede Zeile einzeln: createElement,
  // tr.innerHTML (ein eigener HTML-Parser-Lauf pro Zeile), ein eigener
  // Click-Listener, appendChild - bei 4.155 Einträgen also 4.155-mal
  // alles davon. Ein einzelner Klick auf eine Zeile kostete damit 157 ms
  // auf dem Entwicklungsrechner, auf einem Handy ein Mehrfaches.
  //
  // Die Klicks laufen jetzt über EINEN Listener am <tbody>
  // (Event-Delegation), die angeklickte Zeile verrät sich über
  // data-idx (welches Event) und data-g (zu welcher Gruppe sie gehört).
  // Zwei Folgen davon, beide beabsichtigt:
  //   - eine Zeile auswählen zeichnet die Tabelle NICHT neu (waehleZeile),
  //   - auf-/zuklappen rührt nur die Zeilen dieser Gruppe an
  //     (klappeGruppe).

  // ---------- Das Fenster: nur die ersten N Einträge im DOM ----------
  //
  // Gemessen mit 20.770 Events (synthetisch, unter Handy-Bedingungen):
  // Alle Zeilen in den DOM zu legen kostete 317.913 Knoten und 12,2 MB
  // HTML, und JEDE Änderung baute sie neu - Sortieren 4,6 s,
  // Zusammenfassen 8,2 s, Filter zurücksetzen 4,4 s. Mit 4.154 Events
  // waren es 0,7-1,0 s, deshalb fiel es bisher nicht auf.
  //
  // Gefiltert und sortiert wird weiter über ALLE Events - nur das
  // Zeichnen ist begrenzt. Die Trefferzahl nennt deshalb unverändert
  // die volle Zahl; im DOM stehen `FENSTER_SCHRITT` Einträge, und beim
  // Scrollen kommt der nächste Schub dazu (zeigeMehr). Das ist dieselbe
  // Linie wie bei klappeGruppe(): anhängen statt neu zeichnen.
  function zeilenHtml(liste, cols) {
    return liste.map(({ e, idx }) =>
      `<tr data-idx="${idx}" tabindex="-1"${idx === selectedIndex ? ' class="active"' : ''}>`
      + cols.map(col => cellHtml(col, e)).join('')
      + '</tr>'
    ).join('');
  }

  // startNr: die Nummer der ersten Gruppe dieses Schubs. `data-g` muss
  // die ABSOLUTE Nummer tragen - klappeGruppe() liest damit in
  // gruppenAktuell nach.
  function gruppenHtml(liste, cols, startNr) {
    const teile = [];
    liste.forEach((g, i) => {
      const nr = startNr + i;
      const einzeln = istEinzelgruppe(g);
      const offen = !einzeln && state.offeneGruppen.has(g.key);
      // Zugeklappt steht die Veranstaltungszeile für die gewählte Strecke
      // darin und wird markiert; aufgeklappt ist sie selbst die erste
      // Strecke, und markiert wird nur die Zeile, die wirklich gewählt
      // ist (siehe markiereAuswahl). Sonst sähen zwei Zeilen im Block
      // ausgewählt aus.
      const aktiv = offen
        ? g.rows[0].idx === selectedIndex
        : g.rows.some(({ idx }) => idx === selectedIndex);
      // data-klapp und aria-expanded nur an Zeilen, die sich wirklich
      // aufklappen - eine einzelne Strecke wäre sonst dauerhaft
      // "zugeklappt", ohne dass es etwas zu öffnen gäbe.
      teile.push(`<tr class="group-row${einzeln ? ' single' : ''}${offen ? ' open' : ''}${aktiv ? ' active' : ''}"`
        + ` data-g="${nr}" data-idx="${g.rows[0].idx}" tabindex="-1"`
        + (einzeln ? '' : ` data-klapp="1" aria-expanded="${offen ? 'true' : 'false'}"`)
        + `>${groupRowHtml(g, cols)}</tr>`);
      if (offen) teile.push(subRowsHtml(g, cols));
    });
    return teile.join('');
  }

  // Die letzte Zeile der Tabelle, solange noch etwas fehlt: ein Knopf.
  // Er ist nicht nur Zierde - beim Scrollen lädt der nächste Schub von
  // selbst nach, aber mit der Tastatur und für Screenreader braucht es
  // etwas Anfassbares, und die Zahl sagt ehrlich, wie viel noch kommt.
  function mehrZeileSetzen() {
    const alt = bodyEl.querySelector('tr.mehr-row');
    if (alt) alt.remove();
    if (!fenster || fenster.gezeigt >= fenster.gesamt) return;
    const rest = fenster.gesamt - fenster.gezeigt;
    const schritt = Math.min(FENSTER_SCHRITT, rest);
    bodyEl.insertAdjacentHTML('beforeend',
      `<tr class="mehr-row"><td colspan="${fenster.cols.length}">`
      + `<span class="mehr-inner">`
      + `<button type="button" class="mehr-btn">${escapeHtml(t('mehr_btn', schritt, rest))}</button>`
      + `</span></td></tr>`);
  }

  function zeigeMehr() {
    if (!fenster || fenster.gezeigt >= fenster.gesamt) return false;
    const bis = Math.min(fenster.gezeigt + FENSTER_SCHRITT, fenster.gesamt);
    const teil = fenster.daten.slice(fenster.gezeigt, bis);
    const html = fenster.art === 'gruppen'
      ? gruppenHtml(teil, fenster.cols, fenster.gezeigt)
      : zeilenHtml(teil, fenster.cols);
    const mehr = bodyEl.querySelector('tr.mehr-row');
    if (mehr) mehr.remove();
    bodyEl.insertAdjacentHTML('beforeend', html);
    fenster.gezeigt = bis;
    mehrZeileSetzen();
    // Der Tab-Stopp kann im vorigen Schub gestanden haben (oder es gab
    // noch keinen) - dann hier setzen, sonst ist die Tabelle per Tab
    // nicht erreichbar.
    if (!tabStopZeile || !tabStopZeile.isConnected) {
      setzeTabStop(bodyEl.querySelector('tr.active[data-idx]') || bodyEl.querySelector('tr[data-idx]'));
    }
    return true;
  }

  // Ist der "Mehr"-Knopf schon fast im Bild? Dann nachladen, ohne dass
  // jemand tippen muss. Gemessen wird gegen das Fenster UND gegen den
  // scrollenden Tabellen-Container (`.table-wrap` ist bis 78vh hoch und
  // scrollt selbst).
  function fastImBild() {
    const mehr = bodyEl.querySelector('tr.mehr-row');
    if (!mehr) return false;
    const unten = wrapEl
      ? Math.min(window.innerHeight, wrapEl.getBoundingClientRect().bottom)
      : window.innerHeight;
    return mehr.getBoundingClientRect().top <= unten + 400;
  }

  // `nachladeFrame` steht oben bei `state` (Temporal Dead Zone).
  function pruefeNachladen() {
    if (nachladeFrame !== null) return;
    nachladeFrame = requestAnimationFrame(() => {
      nachladeFrame = null;
      // Schleife, weil ein Schub kürzer sein kann als der sichtbare
      // Bereich (am Rechner ist die Tabelle 78vh hoch). Die Obergrenze
      // ist eine Sicherung gegen eine Endlosschleife, falls der Knopf
      // aus anderen Gründen nie aus dem Bild wandert.
      let schutz = 0;
      while (schutz++ < 25 && fastImBild()) {
        if (!zeigeMehr()) break;
      }
    });
  }

  // Ohne die erste Strecke: die steht aufgeklappt in der
  // Veranstaltungszeile selbst (groupRowHtml).
  //
  // Die LETZTE Unterzeile trägt zusätzlich `letzte` - sie schließt den
  // Rahmen um die aufgeklappte Veranstaltung nach unten ab (siehe die
  // box-shadow-Regeln im Stylesheet). Bewusst eine Klasse und kein
  // CSS-Selektor wie `.sub-row:not(:has(+ .sub-row))`: Der müsste bei
  // über 4.000 Zeilen für jede davon die Nachbarschaft prüfen, und die
  // Tabelle ist genau an dieser Stelle auf Tempo gebaut.
  function subRowsHtml(g, cols) {
    const unter = g.rows.slice(1);
    return unter.map(({ e, idx }, i) =>
      `<tr class="sub-row${i === unter.length - 1 ? ' letzte' : ''}`
      + `${idx === selectedIndex ? ' active' : ''}" data-idx="${idx}" tabindex="-1">`
      + cols.map(col => cellHtml(col, e, { zweiteZeile: true })).join('')
      + '</tr>'
    ).join('');
  }

  function render() {
    ui.updateIndicators();
    renderChips();
    ui.refresh();
    const filtered = getFiltered();
    countEl.textContent = t('result_count', EF.formatInt(filtered.length, currentLang));

    const cols = activeColumns();
    tableEl.classList.toggle('with-distance', !!state.origin);

    gruppenAktuell = [];
    idxZuGruppe.clear();

    if (filtered.length === 0) {
      fenster = null;
      bodyEl.innerHTML = `<tr class="empty-row"><td colspan="${cols.length}">${escapeHtml(t('empty_events'))}</td></tr>`;
      renderNotifyPrompt();
    } else if (state.gruppiert) {
      // Eine Zeile pro Veranstaltung, Klick klappt die Strecken auf. Die
      // Daten bleiben unangetastet - Datenregel 1 gilt weiter, das hier
      // ist nur die Anzeige.
      gruppenAktuell = buildGroups(filtered);
      countEl.textContent = t('result_count_grouped', EF.formatInt(gruppenAktuell.length, currentLang));
      // idxZuGruppe für ALLE Gruppen, nicht nur die gezeichneten:
      // markiereAuswahl() fragt danach, und ausgewählt sein kann auch
      // eine Strecke, die noch nicht im DOM steht.
      gruppenAktuell.forEach((g, nr) => g.rows.forEach(({ idx }) => idxZuGruppe.set(idx, nr)));
      fenster = { art: 'gruppen', daten: gruppenAktuell, cols, gezeigt: 0, gesamt: gruppenAktuell.length };
      bodyEl.innerHTML = '';
      zeigeMehr();
      removeNotifyPrompt();
    } else {
      fenster = { art: 'zeilen', daten: filtered, cols, gezeigt: 0, gesamt: filtered.length };
      bodyEl.innerHTML = '';
      zeigeMehr();
      removeNotifyPrompt();
    }

    renderDetail();
    syncMasterSearch();
    // Füllt der erste Schub das Bild nicht (kurze Liste, hoher
    // Bildschirm), gleich den nächsten anhängen - sonst müsste jemand
    // auf einen Knopf tippen, obwohl noch Platz ist.
    pruefeNachladen();
    // Eine Zeile bleibt per Tab erreichbar (siehe setzeTabStop).
    setzeTabStop(bodyEl.querySelector('tr.active[data-idx]') || bodyEl.querySelector('tr[data-idx]'));
    writeUrlState();
    updateMapLink();
    // Zum Schluss, nicht früher: Die Spaltenbreiten stehen erst jetzt fest
    // (die Klasse `with-distance` schaltet sie um, wenn ein Ausgangspunkt
    // dazukommt). Ein offenes Filter-Panel hinge sonst an der alten
    // Position seines Knopfes.
    ui.reposition();
  }

  // Beim Scrollen den nächsten Schub anhängen. Zwei Quellen, weil die
  // Tabelle in einem eigenen Behälter scrollt, die Seite aber auch:
  // auf dem Handy bewegt man meist die Seite, am Rechner den Behälter.
  if (wrapEl) wrapEl.addEventListener('scroll', pruefeNachladen, { passive: true });
  window.addEventListener('scroll', pruefeNachladen, { passive: true });
  window.addEventListener('resize', pruefeNachladen);

  // Ein Listener für die ganze Tabelle. Der Klick auf eine Unterzeile
  // braucht kein stopPropagation mehr: sie trägt kein data-klapp, also
  // wählt sie nur aus, statt die Gruppe darüber zuzuklappen.
  bodyEl.addEventListener('click', (ev) => {
    // Der "Mehr"-Knopf ist keine Event-Zeile: er trägt kein data-idx und
    // würde sonst durchfallen.
    if (ev.target.closest && ev.target.closest('.mehr-row')) {
      zeigeMehr();
      return;
    }
    const tr = ev.target.closest && ev.target.closest('tr[data-idx]');
    if (!tr || !bodyEl.contains(tr)) return;
    setzeTabStop(tr);
    let geklappt = false;
    if (tr.dataset.klapp) {
      const g = gruppenAktuell[Number(tr.dataset.g)];
      if (g) { klappeGruppe(tr, g); geklappt = true; }
    }
    // Zum Detailbereich scrollen (auf dem Handy steht er weit unten) -
    // aber NICHT, wenn der Klick eine Veranstaltung auf- oder zugeklappt
    // hat: dann will man die Strecken sehen, die gerade an dieser Stelle
    // erscheinen.
    waehleZeile(Number(tr.dataset.idx), { zeigeDetail: !geklappt });
  });

  // ---------- Tastaturbedienung der Tabelle ----------
  //
  // Die Zeilen sind <tr> mit einem Listener am <tbody> - ohne
  // Zutun also weder fokussierbar noch auslösbar, die Liste war mit
  // der Tastatur nicht zu bedienen. Nachgerüstet ohne das schnelle
  // Ein-String-Zeichnen aufzugeben:
  //
  // - Jede Zeile trägt `tabindex="-1"` (steht in den Vorlagen, kostet
  //   nichts), erreichbar per Tab ist aber nur EINE ("roving tabindex",
  //   das übliche Muster für lange Listen). 4.155 Tab-Stopps wären eine
  //   Falle: man käme aus der Tabelle nicht mehr heraus.
  // - Bewegt wird mit den Pfeiltasten, weiterhin über EINEN Listener am
  //   <tbody> - kein Listener je Zeile.
  //
  // Tasten: ↑/↓ Zeile, Home/End erste/letzte, →/← Veranstaltung auf-/
  // zuklappen, Leertaste klappt um, Enter springt in die Angaben (von
  // dort erreicht Tab die Links: Veranstalter, Kalender, Fehler melden).
  //
  // `tabStopZeile` steht oben bei `state` (Temporal Dead Zone).
  function setzeTabStop(zeile) {
    if (tabStopZeile && tabStopZeile !== zeile && tabStopZeile.isConnected) {
      tabStopZeile.tabIndex = -1;
    }
    tabStopZeile = zeile || null;
    if (tabStopZeile) tabStopZeile.tabIndex = 0;
  }

  // Eine Zeile mit der Tastatur ansteuern heißt auch: sie auswählen. Der
  // Detailbereich zeigt sofort, wo man ist (kein zusätzliches Enter).
  // Gescrollt wird dabei NICHT zu den Angaben - das würde die Tabelle,
  // in der man gerade navigiert, aus dem Bild schieben.
  function fokussiereZeile(zeile) {
    if (!zeile) return;
    setzeTabStop(zeile);
    zeile.focus();
    waehleZeile(Number(zeile.dataset.idx));
  }

  function nachbarZeile(tr, vorwaerts) {
    let n = vorwaerts ? tr.nextElementSibling : tr.previousElementSibling;
    while (n && !(n.dataset && n.dataset.idx != null)) {
      n = vorwaerts ? n.nextElementSibling : n.previousElementSibling;
    }
    // Am unteren Rand des Fensters den nächsten Schub holen: sonst wäre
    // mit der Tastatur nur die erste Seite der Liste erreichbar (das
    // Nachladen beim Scrollen hilft dort nicht).
    if (!n && vorwaerts && zeigeMehr()) return nachbarZeile(tr, true);
    return n;
  }

  bodyEl.addEventListener('keydown', (ev) => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const tr = ev.target.closest && ev.target.closest('tr[data-idx]');
    if (!tr || !bodyEl.contains(tr)) return;
    const k = ev.key;
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      const ziel = nachbarZeile(tr, k === 'ArrowDown');
      if (!ziel) return;
      ev.preventDefault();
      fokussiereZeile(ziel);
      return;
    }
    if (k === 'Home' || k === 'End') {
      ev.preventDefault();
      // End heißt "ans Ende des Geladenen". Steht der Fokus schon dort,
      // holt End den nächsten Schub - so kommt man auch mit der Tastatur
      // durch die ganze Liste, ohne dass ein Tastendruck 20.000 Zeilen
      // in den DOM legt.
      if (k === 'End' && !nachbarZeile(tr, true)) zeigeMehr();
      const zeilen = bodyEl.querySelectorAll('tr[data-idx]');
      if (!zeilen.length) return;
      fokussiereZeile(k === 'Home' ? zeilen[0] : zeilen[zeilen.length - 1]);
      return;
    }
    if (k === 'ArrowRight' || k === 'ArrowLeft') {
      if (!tr.dataset.klapp) return;
      const offen = tr.getAttribute('aria-expanded') === 'true';
      // Schon im gewünschten Zustand: nichts tun (nicht umklappen).
      if ((k === 'ArrowRight') === offen) return;
      const g = gruppenAktuell[Number(tr.dataset.g)];
      if (!g) return;
      ev.preventDefault();
      klappeGruppe(tr, g);
      // klappeGruppe baut den Inhalt der Zeile neu; der Fokus bleibt an
      // der Zeile selbst, sie wird nicht ersetzt.
      return;
    }
    if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
      // Die Leertaste würde sonst die Seite weiterblättern.
      ev.preventDefault();
      // Die LEERTASTE klappt um (wie →/←). ENTER nicht: Umklappen hat
      // mit ihnen schon drei Wege, und Enter ist der EINZIGE Weg in den
      // Detailbereich - dort stehen Kalenderdatei, Veranstalter-Seite
      // und „Fehler melden".
      //
      // Vorher stand hier ein gemeinsamer Zweig mit `return` davor, und
      // damit kam ein Tastatur-Nutzer bei einer Veranstaltung mit
      // MEHREREN Strecken nie an diese Links. Aufgefallen ist es erst,
      // als die Einzelprüfung der Events 201-400 fünf Zeilen entfernt
      // hat und dadurch eine aufklappbare Zeile ans Ende des Fensters
      // rutschte, wo der Rauchtest Enter drückt - vorher lag dort
      // zufällig immer eine einzelne Strecke.
      if (tr.dataset.klapp && k !== 'Enter') {
        const g = gruppenAktuell[Number(tr.dataset.g)];
        if (g) klappeGruppe(tr, g);
        waehleZeile(Number(tr.dataset.idx));
        return;
      }
      waehleZeile(Number(tr.dataset.idx));
      if (k === 'Enter') {
        zeigeDetailbereich();
        // tabindex="-1" am Detailbereich (siehe HTML): ansteuerbar, aber
        // kein zusätzlicher Tab-Stopp.
        if (detailEl) detailEl.focus();
      }
    }
  });

  // Auf- und Zuklappen rührt nur die Zeilen dieser einen Veranstaltung an.
  // Die Tabelle dafür komplett neu zu zeichnen (so war es vorher) heißt
  // bei 4.155 Zeilen: erneut filtern, sortieren und alles neu aufbauen -
  // für eine Handvoll Unterzeilen. Die Trefferzahl ändert sich dabei
  // ohnehin nicht, das Zusammenfassen ist reine Anzeige.
  function klappeGruppe(tr, g) {
    const warOffen = state.offeneGruppen.has(g.key);
    if (warOffen) state.offeneGruppen.delete(g.key);
    else state.offeneGruppen.add(g.key);
    // Erst die alten Unterzeilen weg (in beide Richtungen: aufgeklappt
    // wandert die erste Strecke in die Veranstaltungszeile).
    let n = tr.nextElementSibling;
    while (n && n.classList.contains('sub-row')) {
      const weg = n;
      n = n.nextElementSibling;
      weg.remove();
    }
    const cols = activeColumns();
    // Die Veranstaltungszeile wechselt ihren Inhalt: zugeklappt die
    // Zusammenfassung, aufgeklappt die erste Strecke. groupRowHtml liest
    // den schon umgesetzten Zustand, der Pfeil steckt darin.
    tr.classList.toggle('open', !warOffen);
    tr.innerHTML = groupRowHtml(g, cols);
    tr.setAttribute('aria-expanded', warOffen ? 'false' : 'true');
    if (!warOffen) tr.insertAdjacentHTML('afterend', subRowsHtml(g, cols));
    // Zuklappen kann die Zeile entfernt haben, die den Tab-Stopp trug -
    // dann übernimmt ihn die Veranstaltungszeile, sonst wäre die Tabelle
    // per Tab nicht mehr erreichbar.
    if (!tabStopZeile || !tabStopZeile.isConnected) setzeTabStop(tr);
  }

  // Eine Zeile auswählen heißt: Detailbereich füllen und die Markierung
  // umhängen. Vorher lief dafür das komplette render() - filtern,
  // sortieren, alle Zeilen neu bauen, nur damit eine Zeile eine Klasse
  // bekommt. `selectedIndex` steht in keinem Link (siehe currentParams),
  // also ist auch writeUrlState() hier nichts zu tun.
  function waehleZeile(idx, opts) {
    selectedIndex = idx;
    markiereAuswahl();
    renderDetail();
    if (opts && opts.zeigeDetail) zeigeDetailbereich();
  }

  // Auf dem Handy wirkte ein Tippen auf eine Zeile folgenlos: unter 900 px
  // hat die Seite nur EINE Spalte, der Detailbereich steht also unter der
  // Tabelle - und die ist 78vh hoch. Die Angaben erschienen damit rund
  // einen Bildschirm weiter unten, ohne dass irgendetwas darauf hinwies.
  //
  // Gescrollt wird nur, wenn der Bereich wirklich außerhalb des Bildes
  // liegt: am Rechner steht er neben der Tabelle, dort darf sich nichts
  // bewegen. `prefers-reduced-motion` schaltet das sanfte Scrollen ab -
  // dieselbe Rücksicht wie bei den Übergängen im Stylesheet.
  function zeigeDetailbereich() {
    if (!detailEl) return;
    const box = detailEl.getBoundingClientRect();
    const sichtbar = box.top < window.innerHeight - 80 && box.bottom > 80;
    if (sichtbar) return;
    let sanft = true;
    try {
      sanft = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) { /* ältere Browser: dann sanft */ }
    try {
      detailEl.scrollIntoView({ behavior: sanft ? 'smooth' : 'auto', block: 'start' });
    } catch (e) {
      detailEl.scrollIntoView();
    }
  }

  // Bei Gruppierung sind zwei Zeilen zu markieren: die Unterzeile selbst
  // und die Veranstaltungszeile darüber (sie kann zugeklappt sein).
  // Die Gruppenzeile trägt data-g, die Unterzeilen nicht - daher das
  // :not([data-g]).
  function markiereAuswahl() {
    bodyEl.querySelectorAll('tr.active').forEach(tr => tr.classList.remove('active'));
    if (selectedIndex === null) return;
    const zeile = bodyEl.querySelector(`tr[data-idx="${selectedIndex}"]:not([data-g])`);
    if (zeile) zeile.classList.add('active');
    const nr = idxZuGruppe.get(selectedIndex);
    if (nr != null) {
      const gz = bodyEl.querySelector(`tr[data-g="${nr}"]`);
      // Aufgeklappt zeigt die Veranstaltungszeile die ERSTE Strecke selbst
      // - dann ist sie nur markiert, wenn genau diese gewählt ist. Sonst
      // trüge der Block zwei markierte Zeilen (der ganze Block ist ohnehin
      // blau hinterlegt, die Auswahl darin einen Ton kräftiger).
      if (gz && !(gz.classList.contains('open') && Number(gz.dataset.idx) !== selectedIndex)) {
        gz.classList.add('active');
      }
    }
  }

  // Der Kartenknopf nimmt den Filterzustand mit: karte.html liest
  // dieselben Parameter (filters.js) und zeigt genau die Events, die hier
  // in der Liste stehen. Ohne das fing man auf der Karte wieder bei allen
  // ~4.100 Events an.
  function updateMapLink() {
    const suffix = currentParams().toString();
    const href = 'karte.html' + (suffix ? '?' + suffix : '');
    mapBtnEl.href = href;
    navMapEl.href = href;
  }

  // ---------- Filter in der Adresse (teilbarer Link) ----------

  // Die Adresse trägt den vollständigen Filterzustand, damit eine
  // gefilterte Liste weitergegeben werden kann ("alle Trails im Umkreis
  // von 50 km um Stuttgart"). history.replaceState statt pushState: jeder
  // Häkchen-Klick würde sonst einen Eintrag in der Zurück-Geschichte
  // anlegen, und der Zurück-Knopf wäre nicht mehr zu gebrauchen.
  //
  // Den Filterteil baut filters.js (toParams) - die Karte liest und
  // schreibt genau dieselben Parameter, deshalb nimmt der Wechsel
  // zwischen Liste und Karte die Filter mit. Hier kommen nur die beiden
  // Ansichts-Parameter der Liste dazu (Sortierung, Zusammenfassen).
  function currentParams() {
    const p = EF.toParams(state);
    if (state.sortKey !== 'datum' || state.sortDir !== 'asc') {
      p.set('sort', `${state.sortKey}:${state.sortDir}`);
    }
    // In der Adresse steht nur die ABWEICHUNG von der Voreinstellung
    // (an): "gruppiert=0", wenn jemand die Strecken einzeln sehen will.
    // Die Karte reicht den Wert unverändert zurück, und ohne ihn wäre
    // der Weg Liste (aus) -> Karte -> Liste wieder zusammengefasst.
    // Alte Links mit "gruppiert=1" bleiben gültig (readUrlState).
    if (!state.gruppiert) p.set('gruppiert', '0');
    return p;
  }

  function writeUrlState() {
    if (!urlZustandGelesen) return;
    if (!window.history || !window.history.replaceState) return;
    const p = currentParams();
    // Ein geteiltes Event bleibt in der Adresse stehen, solange es
    // ausgewählt ist - damit ein Neuladen oder Weitergeben des Links
    // dasselbe Event zeigt. NICHT in currentParams(): Das speist auch
    // den Kartenknopf, und die Karte kennt kein einzelnes Event.
    //
    // Eine andere Zeile auszuwählen schreibt die Adresse gar nicht neu
    // (waehleZeile ruft kein writeUrlState - siehe "Tempo"); der
    // Parameter verschwindet daher erst beim nächsten Filterwechsel,
    // und genau dann ist er auch nicht mehr wahr.
    if (deepEventSlug && selectedIndex !== null && events[selectedIndex]
        && eventSlug(events[selectedIndex]) === deepEventSlug) {
      p.set('event', deepEventSlug);
    }
    const suffix = p.toString();
    const neu = window.location.pathname + (suffix ? '?' + suffix : '');
    if (neu !== window.location.pathname + window.location.search) {
      try { window.history.replaceState(null, '', neu); } catch (e) { /* ignorieren */ }
    }
  }

  function readUrlState() {
    let p;
    try { p = new URLSearchParams(window.location.search); } catch (e) { return; }
    // Die Filter selbst liest filters.js - damit versteht die Karte
    // dieselben Links (auch die beiden alten: ?sportart=Fahrrad von der
    // Willkommensseite, ?standort=Frankfurt vom Kartenmarker).
    EF.readParams(state, window.location.search, {
      knownStandort: v => events.some(e => e.standort === v),
      alleTage: uniqueSorted(events.map(e => e.datum_start)),
      geoLabel: t('geo_current_label'),
      // Ein Ausgangspunkt schaltet in der Liste zusätzlich die
      // Entfernungs-Spalte samt Sortierung zu.
      setOrigin: (_state, origin) => setOrigin(origin)
    });
    const sort = p.get('sort');
    if (sort) {
      const [key, dir] = sort.split(':');
      // Nach Entfernung sortieren geht nur mit Ausgangspunkt - ohne einen
      // gibt es die Spalte nicht, und die Liste stünde ohne sichtbare
      // Sortierung da. Kommt so aus der Karte zurück, wenn dort der
      // Umkreis entfernt wurde (oder aus einem von Hand gekürzten Link).
      if (SORT_KEYS[key] && (key !== 'entfernung' || state.origin)) {
        state.sortKey = key;
        state.sortDir = dir === 'desc' ? 'desc' : 'asc';
      }
    }
    // "1" und "0" sind beide gültig; fehlt der Parameter, bleibt es bei
    // der Voreinstellung bzw. der gemerkten Wahl des Nutzers.
    if (p.get('gruppiert') === '1') state.gruppiert = true;
    else if (p.get('gruppiert') === '0') state.gruppiert = false;
    // Ein geteiltes Event (?event=…): die Zeile auswählen, damit die Box
    // sie zeigt. Die Kennung ist der eventSlug - eine laufende Nummer
    // wäre wertlos, sie verschiebt sich mit jedem neuen Event.
    //
    // Bewusst OHNE Filter: Wer ein Event teilt, teilt nicht seine Suche.
    // Steht das Event trotz eines Filters nicht in der Tabelle, zeigt die
    // Box es trotzdem - markiereAuswahl() findet dann eben keine Zeile.
    // Abo-Verwaltung öffnen (Abmelde-Link der E-Mails). Hier gelesen,
    // weil writeUrlState() die Adresse gleich danach auf die
    // Filter-Parameter zurückschreibt.
    if (p.get('abos') === '1') aboGewuenscht = true;
    const gesucht = p.get('event');
    if (gesucht) {
      const treffer = events.findIndex(e => eventSlug(e) === gesucht);
      if (treffer >= 0) {
        selectedIndex = treffer;
        deepEventSlug = gesucht;
        // ?melden=1 dazu: der Melde-Knopf in der Box auf der KARTE führt
        // hierher, weil der Melde-Dialog (Firestore) nur in der Liste
        // lebt. Der Parameter verschwindet mit dem nächsten
        // writeUrlState() von selbst - er soll nicht in einem geteilten
        // Link landen.
        deepMelden = p.get('melden') === '1';
      }
    }
  }

  // ---------- "Benachrichtige mich"-Box (0 Treffer) ----------

  // Die aktuell aktiven Filter als einfaches, JSON-serialisierbares Objekt
  // (Sets -> Arrays) für die Firestore-Ablage. Bewusst OHNE Datumsfilter
  // (state.selectedDays): das gesuchte Event liegt annahmegemäß in der
  // Zukunft und ist deshalb noch nicht in events.json - ein Datumsfilter
  // würde eine spätere Benachrichtigung dafür also nie zulassen.
  // `quelle` ist der Filterzustand, aus dem das Abo entsteht - beim
  // Abo-Dialog `aboState`, nicht die laufende Suche.
  function serializeFiltersForNotify(quelle) {
    const state = quelle || aboState;
    return {
      // Der Namensfilter gehört dazu: Wer „marathon" gesucht hat und
      // dann abonniert, will Marathons - nicht alles. Ohne dieses Feld
      // wäre das Abo stillschweigend weiter gefasst als die Suche, aus
      // der es entstand. functions/index.js prüft es mit.
      nameQuery: state.nameQuery.trim(),
      // Die Mastersuche gehört aus demselben Grund dazu: Wer „München"
      // gesucht hat und dann abonniert, will Events aus München.
      // functions/index.js prüft sie mit.
      suche: state.suche.trim(),
      land: Array.from(state.land),
      art1: Array.from(state.art1),
      art2: Array.from(state.art2),
      standort: Array.from(state.standort),
      laengeMin: state.laengeMin || null,
      laengeMax: state.laengeMax || null,
      distanceCategories: Array.from(state.distanceCategories),
      radiusKm: state.radiusKm,
      origin: state.origin ? { lat: state.origin.lat, lon: state.origin.lon, label: state.origin.label } : null
    };
  }

  // ---------- Abo: "Neue Events per E-Mail" ----------
  //
  // Ein Abo ist: DIESE Filter + EIN Rhythmus. Der Knopf steht in der
  // Werkzeugleiste und ist immer erreichbar - die alte Box erschien nur
  // bei null Treffern, wer also "alle neuen Schwimm-Events in Thüringen"
  // wollte, kam nie an sie heran.
  //
  // Was NICHT ins Abo geht: der Datumsfilter. Ein Abo blickt in die
  // Zukunft, ein Datumsfilter in die Vergangenheit dieser Suche - mit
  // ihm könnte nie ein neues Event passen (siehe
  // serializeFiltersForNotify).
  // aboOverlay/aboBodyEl und die drei Zustände stehen oben bei den
  // übrigen Element-Konstanten (Temporal Dead Zone: der ?abos=1-Zweig
  // läuft beim Laden, also weit vor dieser Zeile).

  function aboRhythmen() {
    // Die Liste kommt aus auth.js, damit sie nicht an zwei Stellen steht.
    const aus = window.EndauranceAuth && window.EndauranceAuth.ABO_RHYTHMEN;
    return Array.isArray(aus) && aus.length ? aus : ['sofort', 'woechentlich', 'monatlich'];
  }

  // Was dieses Abo abdeckt, in einem Satz - gebaut aus GENAU den Feldern,
  // die auch gespeichert werden. Nicht aus den Chips: die zeigen auch den
  // Datumsfilter, und der gehört nicht dazu.
  function aboBeschreibung(f) {
    const teile = [];
    if (f.suche) teile.push(`„${f.suche}"`);
    if (f.nameQuery) teile.push(`„${f.nameQuery}"`);
    if (f.art1 && f.art1.length) teile.push(f.art1.map(v => tv('art1', v)).join(', '));
    if (f.art2 && f.art2.length) teile.push(f.art2.map(v => tv('art2', v)).join(', '));
    if (f.distanceCategories && f.distanceCategories.length) {
      const labels = EF.DISTANCE_CATEGORY_LABELS[currentLang] || {};
      teile.push(f.distanceCategories.map(k => labels[k] || k).join(', '));
    }
    // Auch hier das Dezimaltrennzeichen der Sprache (siehe EF.formatNumber).
    const kmZahl = (v) => EF.formatNumber(v, currentLang, 1);
    if (f.laengeMin && f.laengeMax) teile.push(`${kmZahl(f.laengeMin)}–${kmZahl(f.laengeMax)} km`);
    else if (f.laengeMin) teile.push(t('abo_von_km', kmZahl(f.laengeMin)));
    else if (f.laengeMax) teile.push(t('abo_bis_km', kmZahl(f.laengeMax)));
    if (f.origin && f.radiusKm != null) {
      teile.push(t('abo_umkreis', f.radiusKm, f.origin.label));
    } else if (f.standort && f.standort.length) {
      const orte = f.standort.slice(0, 3).join(', ');
      teile.push(f.standort.length > 3 ? t('abo_orte_mehr', orte, f.standort.length - 3) : orte);
    }
    if (f.land && f.land.length) teile.push(f.land.map(v => tv('land', v)).join(', '));
    return teile.length ? teile.join(' · ') : t('abo_alles');
  }

  function oeffneAboDialog() {
    if (!window.EndauranceAuth) return;
    // Ein offenes Filter-Panel der Liste stünde sonst hinter dem Dialog
    // (und sein Knopf bekäme keinen Klick mehr ab).
    ui.close();
    // Mit der aktuellen Suche starten (ohne Datum) - wer die Liste schon
    // gefiltert hat, findet seine Auswahl vor und kann sie hier
    // nachschärfen.
    uebernehmeSucheInAbo();
    if (window.EndauranceAuth.prepareFirestore) window.EndauranceAuth.prepareFirestore();
    if (!aboFesselGesetzt && window.EndauranceAuth.dialogTasten) {
      window.EndauranceAuth.dialogTasten(aboOverlay, schliesseAboDialog);
      aboFesselGesetzt = true;
    }
    aboFokusVorher = document.activeElement;
    aboOverlay.hidden = false;
    zeichneAboDialog();
    const dlg = aboOverlay.querySelector('.ee-modal');
    if (dlg) { try { dlg.focus({ preventScroll: true }); } catch (e) { dlg.focus(); } }
  }

  function schliesseAboDialog() {
    // Ein offenes Filter-Panel hängt an <body>, nicht am Dialog - ohne
    // das bliebe es über der Liste stehen.
    aboUi.close();
    aboOverlay.hidden = true;
    aboBodyEl.innerHTML = '';
    if (aboFokusVorher && aboFokusVorher.isConnected) {
      try { aboFokusVorher.focus(); } catch (e) { /* ignorieren */ }
    }
    aboFokusVorher = null;
  }

  // Die Suche der Liste in den Abo-Zustand übernehmen. Als Kopie, damit
  // das Umstellen im Dialog die Liste nicht anfasst.
  function uebernehmeSucheInAbo() {
    const kopie = EF.copyState(state, true);   // true = ohne Datumsfilter
    Object.keys(kopie).forEach(k => { aboState[k] = kopie[k]; });
    aboUi.resetTransient();
  }

  // Nur den Kasten „Dieses Abo umfasst" neu schreiben - der Rest des
  // Dialogs (Rhythmus-Auswahl, Knöpfe) bleibt stehen, sonst verlöre ein
  // Klick im Filter-Panel den Rhythmus oder den Fokus.
  function zeichneAboZusammenfassung() {
    const kasten = aboBodyEl.querySelector('#abo-umfasst');
    if (!kasten) return;
    kasten.textContent = aboBeschreibung(serializeFiltersForNotify());
    aboUi.updateIndicators();
  }

  function zeichneAboDialog(meldung) {
    const filter = serializeFiltersForNotify();
    const user = window.EndauranceAuth.getUser();
    const rhythmen = aboRhythmen().map(key => `
      <label>
        <input type="radio" name="abo-rhythmus" value="${key}"${key === aboRhythmus ? ' checked' : ''}>
        <span>
          <strong>${escapeHtml(t('abo_r_' + key))}</strong>
          <span class="abo-rhythm-note">${escapeHtml(t('abo_r_' + key + '_note'))}</span>
        </span>
      </label>`).join('');

    aboBodyEl.innerHTML = `
      <h2 id="abo-heading">${escapeHtml(t('abo_titel'))}</h2>
      <p class="report-intro">${escapeHtml(t('abo_intro'))}</p>
      <div class="abo-filter">
        <strong>${escapeHtml(t('abo_welche'))}</strong>
        <div class="abo-filter-bar" id="abo-filter-bar"></div>
      </div>
      <div class="abo-summary">
        <strong>${escapeHtml(t('abo_summary_titel'))}</strong>
        <span id="abo-umfasst">${escapeHtml(aboBeschreibung(filter))}</span>
        <span class="abo-hint">${escapeHtml(t('abo_ohne_datum'))}</span>
      </div>
      <strong class="abo-abschnitt">${escapeHtml(t('abo_wie_oft'))}</strong>
      <div class="abo-rhythm">${rhythmen}</div>
      ${user
        ? `<button type="button" class="ee-submit-btn" id="abo-save-btn">${escapeHtml(t('abo_speichern'))}</button>
           <div class="abo-hint" style="margin-top:8px">${escapeHtml(t('abo_an', user.email))}</div>`
        : `<button type="button" class="ee-submit-btn" id="abo-login-btn">${escapeHtml(t('abo_login'))}</button>
           <div class="abo-hint" style="margin-top:8px">${escapeHtml(t('abo_login_grund'))}</div>`}
      <div id="abo-status">${meldung
        ? `<div class="abo-status ${meldung.art}">${escapeHtml(meldung.text)}</div>` : ''}</div>
      <div class="abo-list" id="abo-list" hidden></div>
    `;

    // Dieselben Filterknöpfe und Panels wie die Liste - nur ohne „Datum"
    // (ein Abo schaut in die Zukunft) und auf dem eigenen Zustand.
    aboUi.buildButtonBar(aboBodyEl.querySelector('#abo-filter-bar'), { ohne: ['datum'], order: FILTER_ORDER });

    aboBodyEl.querySelectorAll('input[name="abo-rhythmus"]').forEach(el => {
      el.addEventListener('change', () => { aboRhythmus = el.value; });
    });

    const loginBtn = aboBodyEl.querySelector('#abo-login-btn');
    if (loginBtn) loginBtn.addEventListener('click', () => window.EndauranceAuth.openModal('login'));

    const saveBtn = aboBodyEl.querySelector('#abo-save-btn');
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        saveBtn.disabled = true;
        window.EndauranceAuth.saveFilterSubscription(filter, {
          rhythmus: aboRhythmus,
          name: aboBeschreibung(filter)
        })
          .then(() => { zeichneAboDialog({ art: 'ok', text: t('abo_gespeichert') }); ladeAboListe(); })
          .catch(() => {
            saveBtn.disabled = false;
            const st = aboBodyEl.querySelector('#abo-status');
            if (st) st.innerHTML = `<div class="abo-status fehler">${escapeHtml(t('abo_fehler'))}</div>`;
          });
      });
    }

    if (user) ladeAboListe();
  }

  // Die eigenen Abos zeigen - ohne sie käme man nur über den Link in der
  // E-Mail wieder heraus.
  function ladeAboListe() {
    const kasten = aboBodyEl.querySelector('#abo-list');
    if (!kasten || !window.EndauranceAuth.listFilterSubscriptions) return;
    window.EndauranceAuth.listFilterSubscriptions().then(abos => {
      const offen = abos.filter(a => a.aktiv !== false);
      if (!offen.length) { kasten.hidden = true; return; }
      kasten.hidden = false;
      kasten.innerHTML = `<h3>${escapeHtml(t('abo_meine'))}</h3>` + offen.map(a => `
        <div class="abo-item" data-abo="${escapeHtml(a.id)}">
          <span>
            ${escapeHtml(a.name || t('abo_alles'))}
            <span class="abo-item-rhythm">${escapeHtml(t('abo_r_' + (a.rhythmus || 'sofort')))}</span>
          </span>
          <button type="button">${escapeHtml(t('abo_loeschen'))}</button>
        </div>`).join('');
      kasten.querySelectorAll('.abo-item button').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.closest('.abo-item').dataset.abo;
          btn.disabled = true;
          window.EndauranceAuth.deleteFilterSubscription(id)
            .then(() => ladeAboListe())
            .catch(() => { btn.disabled = false; });
        });
      });
    }).catch(() => { kasten.hidden = true; });
  }

  document.getElementById('abo-open-btn').addEventListener('click', oeffneAboDialog);
  document.getElementById('abo-close').addEventListener('click', schliesseAboDialog);
  aboOverlay.addEventListener('click', (ev) => {
    if (ev.target === aboOverlay) schliesseAboDialog();
  });

  function renderNotifyPrompt() {
    if (!window.EndauranceAuth) { notifyBoxEl.hidden = true; return; }
    notifyBoxEl.hidden = false;
    // Wie im Melde-Dialog: Firestore schon jetzt nachladen lassen.
    if (window.EndauranceAuth.prepareFirestore) window.EndauranceAuth.prepareFirestore();
    // Ein Weg, nicht zwei: Die Box bei null Treffern führt in denselben
    // Dialog wie der Knopf in der Werkzeugleiste. Früher hatte sie ihren
    // eigenen Speichern-Knopf - damit gab es zwei Stellen, an denen ein
    // Abo entstand, und nur eine davon kannte den Rhythmus.
    // Zwei Wege, weil es zwei Gründe für null Treffer gibt: Das Event
    // findet noch nicht statt (dann hilft ein Abo) - oder es findet
    // statt, steht aber nicht in unserer Liste. Der zweite Fall war
    // vorher gar nicht vorgesehen.
    notifyBoxEl.innerHTML = `
      <p>${escapeHtml(t('notify_text'))}<br><span class="notify-status">${escapeHtml(t('notify_fehlt'))}</span></p>
      <button type="button" id="notify-open-btn">${escapeHtml(t('abo_open'))}</button>
      <button type="button" class="fehlt-btn" id="notify-fehlt-btn">${escapeHtml(t('fehlt_open'))}</button>
    `;
    notifyBoxEl.querySelector('#notify-open-btn')
      .addEventListener('click', oeffneAboDialog);
    notifyBoxEl.querySelector('#notify-fehlt-btn')
      .addEventListener('click', openSuggestModal);
  }

  function removeNotifyPrompt() {
    notifyBoxEl.hidden = true;
  }

  // Die Box selbst baut event-detail.js (Liste UND Karte, dieselbe
  // Struktur - vom Nutzer so gewünscht). Hier bleibt nur, was die Liste
  // beisteuert: das Event und der Melde-Dialog.
  function detailKontext() {
    return { t, tv, lang: currentLang, onReport: (e) => openReportModal(e) };
  }

  // Die Strecken derselben Veranstaltung (Name + Datum + Ort, wie beim
  // Zusammenfassen) - über ALLE Events, nicht nur die gefilterten: Die
  // Box zeigt, was die Veranstaltung anbietet, nicht, was der Filter
  // gerade durchlässt.
  function geschwisterVon(e) {
    const key = groupKey(e);
    const liste = [];
    events.forEach((x, idx) => { if (groupKey(x) === key) liste.push({ e: x, idx }); });
    return liste;
  }

  function renderDetail() {
    if (selectedIndex === null || !events[selectedIndex]) {
      EED.renderEmpty(detailEl, detailKontext());
      return;
    }
    const e = events[selectedIndex];
    EED.render(detailEl, e, Object.assign(detailKontext(), {
      siblings: geschwisterVon(e),
      // Eine andere Strecke in der Box wählen: nur die Auswahl wechselt,
      // die Tabelle bleibt, wo sie ist.
      onSelect: (idx) => waehleZeile(idx, { zeigeDetail: false }),
      // Die Karte mit genau dieser Veranstaltung (Mastersuche auf den Namen).
      mapLink: 'karte.html?s=' + encodeURIComponent(e.name || '')
    }));
  }

  // Die dauerhafte Kennung eines Events (Datum, Name, Maßzahl, Ort) -
  // steht in event-detail.js, weil Kalenderdatei und geteilter Link
  // darauf aufbauen und die Karte beides auch braucht.
  function eventSlug(e) {
    return EED.eventSlug(e);
  }

  // ---------- Fehler melden ----------
  // Reihenfolge = Reihenfolge im Drop-down. Die Schluessel landen
  // unveraendert in Firestore (Feld "kategorie") und werden von
  // scripts/review_reports.py wieder erkannt - also nicht umbenennen,
  // ohne dort nachzuziehen.
  const REPORT_CATEGORIES = [
    'laenge', 'datum', 'ort', 'url', 'sportart', 'name', 'doppelt', 'abgesagt', 'sonstiges'
  ];
  const REPORT_DESC_MAX = 600;
  const REPORT_DESC_MIN = 10;

  const reportOverlay = document.getElementById('report-overlay');
  const reportDialogEl = reportOverlay.querySelector('.ee-modal');
  const reportBodyEl = document.getElementById('report-body');

  document.getElementById('report-close').addEventListener('click', closeReportModal);
  reportOverlay.addEventListener('click', (evt) => {
    if (evt.target === reportOverlay) closeReportModal();
  });
  document.addEventListener('keydown', (evt) => {
    if (evt.key === 'Escape' && !reportOverlay.hidden) closeReportModal();
  });
  // Escape und die Fokusfessel kommen aus auth.js (dialogTasten) - der
  // Anmelde-Dialog dort braucht genau dasselbe, und zwei Kopien laufen
  // auseinander.
  //
  // Erst beim ersten Öffnen eingehängt, nicht hier: auth.js trägt
  // `defer`, dieses Inline-Skript läuft davor - window.EndauranceAuth
  // gibt es an dieser Stelle noch nicht (dieselbe Reihenfolge wie bei
  // EE_AUTH_QUEUE). Ohne auth.js bleibt es beim Escape-Listener oben.
  let reportFesselGesetzt = false;

  function setzeReportFessel() {
    if (reportFesselGesetzt) return;
    if (!window.EndauranceAuth || !window.EndauranceAuth.dialogTasten) return;
    window.EndauranceAuth.dialogTasten(reportOverlay, closeReportModal);
    reportFesselGesetzt = true;
  }

  // Wohin der Fokus zurückgeht: auf "Fehler zu diesem Event melden".
  let reportFokusVorher = null;

  function closeReportModal() {
    reportOverlay.hidden = true;
    reportBodyEl.innerHTML = '';
    if (reportFokusVorher && reportFokusVorher.isConnected) {
      try { reportFokusVorher.focus(); } catch (e) { /* ignorieren */ }
    }
    reportFokusVorher = null;
  }

  function openReportModal(e) {
    // Das Firestore-SDK haengt nicht mehr im HTML (344 KB fuer jeden
    // Seitenaufruf); auth.js laedt es nach. Hier schon anstossen, damit
    // beim Abschicken nichts mehr zu warten ist.
    if (window.EndauranceAuth && window.EndauranceAuth.prepareFirestore) {
      window.EndauranceAuth.prepareFirestore();
    }
    setzeReportFessel();
    reportFokusVorher = document.activeElement;
    const kmText = formatLength(e);
    const wb = displayWettbewerb(e);
    reportBodyEl.innerHTML = `
      <h2 id="report-heading">${escapeHtml(t('report_title'))}</h2>
      <div class="report-event-summary">
        <strong>${escapeHtml(e.name)}</strong>
        <span>${escapeHtml(formatRange(e.datum_start, e.datum_ende))} &middot; ${escapeHtml(tv('standort', e.standort))} &middot; ${escapeHtml(kmText)}${wb ? ' &middot; ' + escapeHtml(wb) : ''}</span>
      </div>
      <p class="report-intro">${escapeHtml(t('report_intro'))}</p>
      <div id="report-msg"></div>
      <form id="report-form">
        <div class="ee-field">
          <label for="report-kategorie">${escapeHtml(t('report_field_label'))}</label>
          <select id="report-kategorie" autocomplete="off">
            <!-- Leere Vorauswahl: es soll bewusst nichts vorbelegt sein,
                 sonst wandert eine unbeabsichtigte Kategorie in die
                 Meldung. Die Pflicht-Pruefung sitzt im submit-Handler. -->
            <option value="" selected>${escapeHtml(t('report_field_placeholder'))}</option>
            ${REPORT_CATEGORIES.map(k => `<option value="${k}">${escapeHtml(t('report_cat_' + k))}</option>`).join('')}
          </select>
        </div>
        <div class="ee-field">
          <label for="report-desc">${escapeHtml(t('report_desc_label'))}</label>
          <textarea id="report-desc" maxlength="${REPORT_DESC_MAX}" placeholder="${escapeHtml(t('report_desc_placeholder'))}"></textarea>
          <div class="report-counter" id="report-counter">0 / ${REPORT_DESC_MAX}</div>
        </div>
        <button type="submit" class="ee-submit-btn" id="report-submit">${escapeHtml(t('report_send'))}</button>
      </form>
    `;
    reportOverlay.hidden = false;

    // Bewusst ohne required-Attribute: die Browser-Blase ist nicht
    // uebersetzt und passt optisch nicht zum Dialog - validiert wird
    // unten im submit-Handler mit den eigenen i18n-Texten.
    const form = reportBodyEl.querySelector('#report-form');
    const selectEl = reportBodyEl.querySelector('#report-kategorie');
    const descEl = reportBodyEl.querySelector('#report-desc');
    const counterEl = reportBodyEl.querySelector('#report-counter');
    const msgEl = reportBodyEl.querySelector('#report-msg');
    const submitEl = reportBodyEl.querySelector('#report-submit');

    descEl.addEventListener('input', () => {
      counterEl.textContent = `${descEl.value.length} / ${REPORT_DESC_MAX}`;
    });
    // Bewusst KEIN focus() auf das Drop-down: ein fokussiertes <select>
    // klappt in mehreren Browsern sofort auf, und der Dialog begruesst
    // einen dann mit einer offenen Liste. Stattdessen den Dialog selbst
    // fokussieren - damit liegt der Tastaturfokus im Dialog, die Auswahl
    // bleibt aber leer und zu, bis jemand sie anfasst.
    reportDialogEl.focus({ preventScroll: true });

    function setMsg(text, kind) {
      msgEl.innerHTML = text ? `<div class="ee-form-msg ${kind}">${escapeHtml(text)}</div>` : '';
    }

    form.addEventListener('submit', (evt) => {
      evt.preventDefault();
      const kategorie = selectEl.value;
      const beschreibung = descEl.value.trim();
      if (!kategorie) { setMsg(t('report_err_field'), 'error'); return; }
      if (beschreibung.length < REPORT_DESC_MIN) { setMsg(t('report_err_desc'), 'error'); descEl.focus(); return; }
      setMsg(null);
      submitEl.disabled = true;
      submitEl.textContent = t('report_sending');
      window.EndauranceAuth.reportEventError({ event: e, kategorie, beschreibung })
        .then(() => {
          setMsg(t('report_thanks'), 'success');
          // Formular nach dem Absenden entfernen, damit dieselbe Meldung
          // nicht versehentlich zweimal abgeschickt wird.
          form.querySelectorAll('.ee-field').forEach(el => el.remove());
          submitEl.remove();
          window.setTimeout(() => { if (!reportOverlay.hidden) closeReportModal(); }, 2500);
        })
        .catch((err) => {
          submitEl.disabled = false;
          submitEl.textContent = t('report_send');
          setMsg(reportErrorMessage(err), 'error');
        });
    });
  }

  // Firebase-Fehlercodes in verstaendliche Saetze uebersetzen. Der Fall
  // "auth/operation-not-allowed" bzw. "auth/admin-restricted-operation"
  // heisst konkret: der Anbieter "Anonym" ist in der Firebase-Konsole
  // noch nicht aktiviert (Authentication -> Sign-in method).
  function reportErrorMessage(err) {
    const code = (err && (err.code || err.message)) || '';
    if (code === 'not-configured') return t('report_err_config');
    if (code === 'auth/operation-not-allowed' || code === 'auth/admin-restricted-operation') {
      return t('report_err_anon');
    }
    return t('report_err_save');
  }

  // ---------- "Wir haben dein Event nicht?" ----------
  //
  // Zwei Wege führen hierher: die Leiste unter der Liste (immer da) und
  // die Box bei null Treffern (dort neben dem Abo). Beide öffnen DIESEN
  // Dialog - dieselbe Linie wie bei den Abos, an denen es auch nur einen
  // Weg gibt.
  //
  // Gefragt wird nur nach der Adresse der offiziellen Seite und dem
  // Namen. Datum, Strecken, Ort und Sportart holen wir uns von genau
  // dieser Seite: Abgetippte Angaben wären eine dritte Datenquelle neben
  // Scraper und manual_overrides.json, und die offizielle Seite brauchen
  // wir nach Datenregel 2 ohnehin. Übernommen wird ein Vorschlag NIE
  // automatisch (siehe CLAUDE.md).
  const SUGGEST_NAME_MAX = 200;
  const SUGGEST_HINWEIS_MAX = 600;
  const SUGGEST_URL_MAX = 500;

  const suggestOverlay = document.getElementById('suggest-overlay');
  const suggestDialogEl = suggestOverlay.querySelector('.ee-modal');
  const suggestBodyEl = document.getElementById('suggest-body');
  let suggestFesselGesetzt = false;
  let suggestFokusVorher = null;

  document.getElementById('suggest-close').addEventListener('click', closeSuggestModal);
  suggestOverlay.addEventListener('click', (evt) => {
    if (evt.target === suggestOverlay) closeSuggestModal();
  });
  document.getElementById('fehlt-open-btn').addEventListener('click', openSuggestModal);

  function closeSuggestModal() {
    suggestOverlay.hidden = true;
    suggestBodyEl.innerHTML = '';
    if (suggestFokusVorher && suggestFokusVorher.isConnected) {
      try { suggestFokusVorher.focus(); } catch (e) { /* ignorieren */ }
    }
    suggestFokusVorher = null;
  }

  function openSuggestModal() {
    if (!window.EndauranceAuth) return;
    // Firestore schon jetzt nachladen lassen (344 KB, hängt nicht im
    // HTML) - dieselbe Vorsorge wie im Melde- und im Abo-Dialog.
    if (window.EndauranceAuth.prepareFirestore) window.EndauranceAuth.prepareFirestore();
    // Escape + Fokusfessel aus auth.js, erst beim ersten Öffnen: auth.js
    // trägt `defer` und existiert beim Inline-Skript noch nicht.
    if (!suggestFesselGesetzt && window.EndauranceAuth.dialogTasten) {
      window.EndauranceAuth.dialogTasten(suggestOverlay, closeSuggestModal);
      suggestFesselGesetzt = true;
    }
    suggestFokusVorher = document.activeElement;
    suggestBodyEl.innerHTML = `
      <h2 id="suggest-heading">${escapeHtml(t('fehlt_titel'))}</h2>
      <p class="report-intro">${escapeHtml(t('fehlt_intro'))}</p>
      <div id="suggest-msg"></div>
      <form id="suggest-form">
        <div class="ee-field">
          <label for="suggest-url">${escapeHtml(t('fehlt_url_label'))}</label>
          <input type="url" id="suggest-url" inputmode="url" autocomplete="off"
                 maxlength="${SUGGEST_URL_MAX}" placeholder="${escapeHtml(t('fehlt_url_placeholder'))}">
        </div>
        <div class="ee-field">
          <label for="suggest-name">${escapeHtml(t('fehlt_name_label'))}</label>
          <input type="text" id="suggest-name" autocomplete="off"
                 maxlength="${SUGGEST_NAME_MAX}" placeholder="${escapeHtml(t('fehlt_name_placeholder'))}">
        </div>
        <div class="ee-field">
          <label for="suggest-hinweis">${escapeHtml(t('fehlt_hinweis_label'))}</label>
          <textarea id="suggest-hinweis" maxlength="${SUGGEST_HINWEIS_MAX}"
                    placeholder="${escapeHtml(t('fehlt_hinweis_placeholder'))}"></textarea>
          <div class="report-counter" id="suggest-counter">0 / ${SUGGEST_HINWEIS_MAX}</div>
        </div>
        <button type="submit" class="ee-submit-btn" id="suggest-submit">${escapeHtml(t('fehlt_send'))}</button>
      </form>
    `;
    suggestOverlay.hidden = false;

    const form = suggestBodyEl.querySelector('#suggest-form');
    const urlEl = suggestBodyEl.querySelector('#suggest-url');
    const nameEl = suggestBodyEl.querySelector('#suggest-name');
    const hinweisEl = suggestBodyEl.querySelector('#suggest-hinweis');
    const counterEl = suggestBodyEl.querySelector('#suggest-counter');
    const msgEl = suggestBodyEl.querySelector('#suggest-msg');
    const submitEl = suggestBodyEl.querySelector('#suggest-submit');

    hinweisEl.addEventListener('input', () => {
      counterEl.textContent = `${hinweisEl.value.length} / ${SUGGEST_HINWEIS_MAX}`;
    });
    urlEl.focus({ preventScroll: true });

    function setMsg(text, kind) {
      msgEl.innerHTML = text ? `<div class="ee-form-msg ${kind}">${escapeHtml(text)}</div>` : '';
    }

    // Bewusst ohne die eingebaute Browser-Prüfung (novalidate-Verhalten,
    // siehe Melde-Dialog): Die Blase ist nicht übersetzt. Geprüft wird
    // hier, mit den eigenen Texten - und so, wie firestore.rules es
    // verlangt (http:// oder https://, Name mindestens zwei Zeichen).
    form.addEventListener('submit', (evt) => {
      evt.preventDefault();
      const name = nameEl.value.trim();
      const hinweis = hinweisEl.value.trim();
      const url = normalisiereUrl(urlEl.value);
      if (!url) { setMsg(t('fehlt_err_url'), 'error'); urlEl.focus(); return; }
      if (name.length < 2) { setMsg(t('fehlt_err_name'), 'error'); nameEl.focus(); return; }
      setMsg(null);
      submitEl.disabled = true;
      submitEl.textContent = t('fehlt_sending');
      window.EndauranceAuth.suggestEvent({ url, name, hinweis })
        .then(() => {
          setMsg(t('fehlt_thanks'), 'success');
          form.querySelectorAll('.ee-field').forEach(el => el.remove());
          submitEl.remove();
          window.setTimeout(() => { if (!suggestOverlay.hidden) closeSuggestModal(); }, 2500);
        })
        .catch((err) => {
          submitEl.disabled = false;
          submitEl.textContent = t('fehlt_send');
          // Dieselben Fehlertexte wie beim Melden: "Anonym" nicht
          // aktiviert, keine Firebase-Konfiguration, sonstiger Fehler.
          setMsg(reportErrorMessage(err), 'error');
        });
    });
  }

  // "zuerich-marathon.ch" ohne Schema ist der häufigste Fall, wenn
  // jemand eine Adresse aus dem Kopf eintippt - dann https:// davor
  // setzen, statt die Eingabe abzulehnen. Ohne einen Punkt im Namen ist
  // es keine Adresse (dann tippt jemand den Namen ins falsche Feld).
  function normalisiereUrl(eingabe) {
    let text = String(eingabe || '').trim();
    if (!text) return null;
    if (!/^https?:\/\//i.test(text)) {
      if (/^[a-z]+:\/\//i.test(text)) return null;   // ftp://, javascript: usw.
      text = 'https://' + text;
    }
    let u;
    try { u = new URL(text); } catch (e) { return null; }
    if (!u.hostname.includes('.')) return null;
    return u.href.slice(0, SUGGEST_URL_MAX);
  }

  function renderChips() {
    // Welche Chips es gibt und was ihr ✕ entfernt, entscheidet
    // filters.js (buildChips) - die Karte zeigt dieselben Chips.
    const chips = EF.buildChips(state, {
      t,
      tv,
      lang: currentLang,
      dayCount: uniqueSorted(events.map(e => e.datum_start)).length,
      // Wie viele Werte ein Mengen-Filter überhaupt hat (für "Land: Alle"
      // statt drei Einzel-Chips) - fragt dieselbe Stelle, die auch die
      // Häkchenliste im Panel füllt.
      optionCount: stateKey => ui.options(stateKey).length,
      // Der Umkreis-Chip nimmt den Ausgangspunkt mit - in der Liste
      // verschwindet dabei auch die Entfernungs-Spalte (setOrigin).
      setOrigin: (_state, origin) => setOrigin(origin)
    });

    chipsEl.innerHTML = '';
    chips.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(c.label)} <button aria-label="✕">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        c.clear();
        selectedIndex = null;
        render();
      });
      chipsEl.appendChild(chip);
    });
  }

  function resetFilters() {
    EF.clearFilters(state);
    state.sortKey = 'datum';
    state.sortDir = 'asc';
    ui.resetTransient();
    selectedIndex = null;
    ui.close();
    buildHeader();
    render();
  }

  // Siehe oben beim Deep-Link: erst hier sind alle Teile des
  // Melde-Dialogs deklariert.
  if (deepMelden && selectedIndex !== null && events[selectedIndex]) {
    openReportModal(events[selectedIndex]);
  }
})();
</script>

<!-- Fußzeile: links der Hinweis, dass die Liste nicht vollständig sein
     muss (führt in denselben Dialog wie der Knopf in der Null-Treffer-Box),
     rechts Impressum und Datenschutz (§ 5 DDG: von jeder Seite aus
     unmittelbar erreichbar). -->
<footer class="site-footer">
  <div class="fehlt-bar">
    <span class="plus" aria-hidden="true">+</span>
    <span id="fehlt-bar-text"></span>
    <button type="button" class="fehlt-btn" id="fehlt-open-btn"></button>
  </div>
  <div class="seiten-footer">
    <a id="footer-impressum" href="impressum.html">Impressum</a>
    <a id="footer-datenschutz" href="datenschutz.html">Datenschutz</a>
  </div>
</footer>
</body>
</html>
