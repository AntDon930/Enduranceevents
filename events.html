<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e0e3e8;
    --text: #1c1f24;
    --text-muted: #6b7280;
    --accent: #14509a;
    --accent-bg: #eaf1ff;
    --row-alt: #f8fafc;
    --row-hover: #eef4ff;
    --hero-gradient: linear-gradient(135deg, #0b2e6b 0%, #14509a 55%, #1d8fa8 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1d2025;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-muted: #9aa1ac;
      --accent: #5b9dff;
      --accent-bg: #1e2a40;
      --row-alt: #202329;
      --row-hover: #22314a;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    text-decoration: none;
  }
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    background: var(--hero-gradient);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: #fff;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 0.85rem;
    margin: 0;
  }
  .top-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    /* Darf schrumpfen und umbrechen: auf 390 px ragte die Knopfreihe
       vorher 10 px über den blauen Kasten hinaus, DE/EN war angeschnitten. */
    min-width: 0;
    max-width: 100%;
    margin-top: 2px;
  }
  .top-actions-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 100%;
  }
  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.92);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
  }
  .share-btn:hover { background: rgba(255,255,255,0.24); color: #fff; }
  .share-btn svg { flex-shrink: 0; }

  /* Kurz aufpoppende Rückmeldung, mittig unten. pointer-events: none,
     damit sie nie einen Klick abfängt. */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translate(-50%, 12px);
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.28);
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 3000;
    pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }
  .toast[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
  }
  .home-btn:hover, .map-btn:hover { background: rgba(255,255,255,0.26); }
  .map-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .lang-btn {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .lang-btn.active {
    background: #fff;
    color: #14315e;
    border-color: #fff;
  }

  /* Dasselbe Raster wie .layout, damit der rechte Rand der ersten Spalte
     exakt auf dem rechten Tabellenrand liegt. Die zweite Spalte bleibt
     leer und hält nur die Breite des Detailbereichs frei - so sitzt der
     Zurücksetzen-Button über der LISTE und nicht über den Details. */
  .toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px;
    margin-bottom: 10px;
  }
  @media (max-width: 900px) {
    .toolbar { grid-template-columns: 1fr; }
  }
  .toolbar-main {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  /* Schiebt den Button an das rechte Ende der Tabellenspalte. */
  .toolbar-actions {
    /* margin-left: auto hält "Alle Filter zurücksetzen" am rechten Rand -
       auch dann, wenn Trefferzahl, Schalter und Chips so breit werden,
       dass der Knopf in eine eigene Zeile rutscht. Versuch, die Chips
       stattdessen wachsen zu lassen (flex: 1): dann rutschte der Knopf
       beim Umbruch nach LINKS. */
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .group-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    /* Etwas Abstand zur Trefferzahl links davon, damit Zahl und Schalter
       nicht ineinanderlaufen. */
    margin-left: 4px;
  }
  .group-toggle:hover { color: var(--text); }
  /* Zusammengefasste Zeile: der Name trägt einen Aufklapp-Pfeil, die
     Längen stehen als kleine Marken nebeneinander. */
  .group-row { cursor: pointer; font-weight: 600; }
  .group-row:hover { background: var(--row-hover); }
  .group-name { display: flex; align-items: center; gap: 6px; }
  .group-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Rundes Feld mit Pfeil, dreht sich beim Aufklappen um 90°. */
  .chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    transition: transform 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .group-row:hover .chevron { color: var(--accent); border-color: var(--accent); }
  /* Veranstaltung mit nur einer Strecke: kein Pfeil, aber derselbe
     Einzug - so beginnen alle Namen der Spalte auf einer Linie. */
  .chevron-spacer { display: inline-block; width: 16px; height: 16px; flex-shrink: 0; }
  .chevron.open { transform: rotate(90deg); color: var(--accent); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }
  /* Anzahl der zusammengefassten Strecken. Auch die 1 wird angezeigt -
     sonst sieht eine einzelne Strecke nach einem fehlenden Wert aus.
     Bewusst ohne Kapsel/Rahmen: als Kapsel war die Zahl breiter als die
     ganze Spalte jetzt ist. */
  /* Die Zahl der zusammengefassten Strecken steht schlicht in der
     Tabelle, am linken Rand der ersten Spalte. Eine Variante, in der sie
     als Kapsel halb über der Rahmenlinie lag, war ausprobiert und wieder
     verworfen - sie wirkte wie ein aufgeklebtes Etikett. */
  .count-pill {
    display: inline-block;
    font-size: 0.76rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    text-align: left;
  }
  .group-row:hover .count-pill { color: var(--text); }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 5px;
    font-size: 0.7rem;
    font-weight: normal;
    white-space: nowrap;
  }
  .badges { row-gap: 3px; }
  tbody tr.sub-row { font-size: 0.82rem; }
  tbody tr.sub-row .col-name { padding-left: 22px; }
  tbody tr.sub-row .col-anzahl { color: var(--text-muted); }
  /* Aufgeklappt zeigt die Veranstaltungszeile die ERSTE Strecke selbst
     (siehe groupRowHtml) - zwei Strecken sind dann auch zwei Zeilen, nicht
     drei. Damit die Zeilen einer Veranstaltung dabei wie ein Block wirken,
     bekommt sie dieselbe Schrift wie ihre Unterzeilen; Pfeil und Anzahl
     bleiben als Kennzeichen der Veranstaltung. */
  tbody tr.group-row.open { font-size: 0.82rem; font-weight: normal; }
  /* Mit Wettbewerbs-Zeile unter dem Namen säße der Pfeil sonst mittig
     zwischen beiden Zeilen. */
  .group-row.open .group-name { align-items: flex-start; }
  .group-row.open .group-name-text { white-space: normal; }
  .result-count { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
  .reset-btn {
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(20,80,154,0.25);
  }
  .reset-btn:hover { opacity: 0.9; }
  .active-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.75rem;
    text-decoration: none;
  }
  .chip button {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0;
  }

  .notify-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-size: 0.86rem;
  }
  .notify-box[hidden] { display: none; }
  .notify-box p { margin: 0; flex: 1; min-width: 200px; color: var(--text); }
  .notify-box button {
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .notify-box button:hover { opacity: 0.9; }
  .notify-box .notify-status { font-size: 0.8rem; color: var(--text-muted); }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
    position: sticky;
    top: 16px;
  }
  .side-panel .detail-panel { width: 100%; }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
    max-height: 78vh;
    overflow-y: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 800px;
    table-layout: fixed;
    font-size: 0.86rem;
  }
  /* Spaltenreihenfolge: 1 Name, 2 Datum, 3 Land, 4 Standort, 5 Sportart,
     6 Kategorie, 7 Länge. Name breiter, Länge schmaler (die Einheit "km"
     steht ohnehin schon in jeder Zelle). Die Anmeldung-Spalte (Offen/
     Geschlossen) wurde entfernt: der Anmeldeschluss lässt sich bei den
     meisten Quellen nicht zuverlässig auslesen und fehlt daher fast
     überall - keine gute Datenbasis für einen Filter/eine Spalte. */
  /* Spaltenbreiten über KLASSEN, nicht über nth-child: die Spalten
     wechseln je nach Zustand (Entfernung nur mit Ausgangspunkt, Anzahl
     nur beim Zusammenfassen), und mit nth-child bräuchte jede Kombination
     ihren eigenen Satz Regeln. Die Summe muss nicht genau 100 % sein -
     table-layout: fixed verteilt proportional. */
  /* Die Zusammenfassung soll so wenig Platz wie möglich kosten: die
     Anzahl steht als kleine Zahl ganz links am Tabellenrand, gleich
     danach kommt der Name. Feste Pixelbreite statt Prozent - die Zahl
     ist ein- bis zweistellig, ein Anteil an der Tabellenbreite wäre
     immer zu breit. */
  .col-anzahl { width: 28px; text-align: left; }
  thead th.col-anzahl .th-inner { padding-left: 8px; padding-right: 0; }
  tbody td.col-anzahl { padding-left: 8px; padding-right: 0; }
  .col-name { width: 22%; }
  .col-datum { width: 13%; }
  /* 13 %, nicht 11 %: Bei 11 % (93 px auf Handybreite) brach
     "Deutschland" mitten im Wort um ("Deutschl" / "and") - das Wort
     braucht 76 px, der Inhalt hatte 73 px. Die Spaltenbreiten summieren
     sich ohnehin nur auf 95 %, die zwei Prozentpunkte kosten also keine
     andere Spalte. */
  .col-land { width: 13%; }
  .col-standort { width: 14%; }
  .col-entfernung { width: 11%; }
  .col-art1 { width: 11%; }
  .col-art2 { width: 13%; }
  .col-laenge_km { width: 11%; }
  table.with-distance { min-width: 900px; }

  /* Der Browser ueberspringt Layout und Zeichnen fuer Zeilen, die gerade
     nicht im Bild sind. Bei ueber 4.000 Zeilen ist das der Unterschied
     zwischen einer zaeh aufbauenden und einer sofort da stehenden Liste.
     Moeglich ist es nur, weil die Spaltenbreiten fest sind
     (table-layout: fixed) - sonst muesste der Browser doch jede Zeile
     ausmessen, um die Spalten zu verteilen. contain-intrinsic-size nennt
     die geschaetzte Zeilenhoehe, damit die Bildlaufleiste von Anfang an
     stimmt. Browser ohne content-visibility ignorieren beide Zeilen. */
  tbody tr {
    content-visibility: auto;
    contain-intrinsic-size: auto 41px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 2;
    border-bottom: 1px solid var(--border);
    text-align: left;
    padding: 0;
    font-weight: 600;
  }
  .th-inner {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .th-inner span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Der Spaltenname ist ein Knopf (Sortierung), soll aber wie eine
     Kopfzeile aussehen - deshalb ohne Rahmen und Hintergrund. */
  .th-sort {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .th-sort:hover { color: var(--accent); }
  .th-sort.active { color: var(--accent); }
  .sort-arrow { font-size: 0.7em; flex-shrink: 0; }

  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    text-align: left;
    color: var(--text);
    text-decoration: none;
    font-weight: normal;
  }
  .cell-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
  }
  /* Bezeichnung des konkreten Wettbewerbs unter dem Veranstaltungsnamen.
     Eine Veranstaltung mit mehreren Strecken steht mit je einer Zeile pro
     Strecke in der Liste - ohne diese Zeile wären die Zeilen bis auf die
     Längenangabe identisch. */
  .wettbewerb {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.active { background: var(--accent-bg); }
  /* Tastaturbedienung: die Zeile, auf der der Fokus steht, muss zu sehen
     sein. `:focus-visible` statt `:focus`, damit ein Mausklick (der die
     Zeile ebenfalls fokussiert) keinen Rahmen hinterlässt. `-2px` legt
     ihn nach innen - außen würde ihn der scrollende Tabellen-Container
     abschneiden. */
  tbody tr:focus { outline: none; }
  tbody tr:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: var(--accent-bg);
  }
  /* Enter auf einer Zeile springt in die Angaben - dort muss sichtbar
     sein, dass der Fokus jetzt hier steht. */
  .detail-panel:focus { outline: none; }
  .detail-panel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty-row td {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
  }

  /* Excel-style column filter button + floating panel */
  /* Die Filterknöpfe und das schwebende Panel stehen in filter-ui.css -
     die Karte bindet dieselbe Datei ein (siehe filter-ui.js). */

  .detail-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
  }
  .detail-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 24px 8px;
    font-size: 0.9rem;
  }
  .detail-panel h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .detail-panel .sub { color: var(--text-muted); margin-bottom: 16px; font-size: 0.88rem; }
  .detail-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 9px;
    column-gap: 14px;
    font-size: 0.88rem;
  }
  .detail-grid dt { color: var(--text-muted); font-weight: 500; }
  .detail-grid dd { margin: 0; font-weight: normal; }
  .detail-link {
    display: inline-block;
    margin-top: 20px;
    padding: 9px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.88rem;
  }
  .detail-link:hover { opacity: 0.9; }

  /* "Zum Kalender hinzufügen" steht zwischen dem Veranstalter-Link und
     dem Melde-Knopf und sieht wie eine dritte, gleichwertige Schaltfläche
     aus - nur ohne Akzentfarbe, damit der Link zur offiziellen Seite die
     Hauptaktion bleibt. */
  .cal-box { position: relative; margin-top: 12px; }
  .cal-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: 0.88rem;

<script>
(async function () {
  // Gemeinsamer Filterzustand (filters.js). Alles, was Liste UND Karte
  // brauchen, steht dort - hier bleibt nur, was die Liste ausmacht
  // (Spalten, Sortierung, Zusammenfassen, Filter-Panels).
  const EF = window.EnduranceFilters;
  const EFU = window.EnduranceFilterUI;

  // Sicherung gegen eine halb alte Seite: GitHub Pages liefert jede Datei
  // mit max-age=600, ein Browser kann also diese Seite mit einer zehn
  // Minuten alten filters.js kombinieren. Fehlt darin eine Funktion,
  // bricht das Skript in seiner ersten Zeile ab - die Seite blieb dann
  // LEER (blauer Kopf, sonst nichts; genau das ist passiert). Die
  // ?v=<Stempel>-Anhänge an den Skripten sollen das verhindern
  // (scripts/stamp_assets.py), hier steht die Notbremse, falls doch.
  if (!EF || !EFU || !EF.uniqueSorted || !EFU.create) {

  // ---------- Übersetzungen / i18n ----------

  const I18N = {

      report_err_save: 'Die Meldung konnte nicht gespeichert werden. Bitte später erneut versuchen.',

      report_err_config: 'Melden ist noch nicht eingerichtet (Firebase-Konfiguration fehlt).',
      report_cat_laenge: 'Länge / Distanz',
      report_cat_datum: 'Datum',
      report_cat_ort: 'Stadt / Ort oder Land',
      report_cat_url: 'Link zur Veranstalter-Website',
      report_cat_sportart: 'Sportart oder Kategorie',
      report_cat_name: 'Name der Veranstaltung',
      report_cat_doppelt: 'Event ist doppelt in der Liste',
      report_cat_abgesagt: 'Event findet nicht statt / ist abgesagt',
