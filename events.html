  // ---------- Ein einzelnes Event teilen ----------
  //
  // Geteilt wird ein LINK auf genau dieses Event plus die Angaben, die
  // in der Box stehen - kein PDF und kein Bild. Gründe, der Reihe nach:
  //
  //   - Die Box enthält eine Handvoll Fakten und zwei Links. Wer den
  //     Link antippt, landet genau hier: mit "Zum Kalender hinzufügen",
  //     der Veranstalter-Seite und der Karte daneben. Ein PDF kann das
  //     alles nicht, und es veraltet - verlegt der Veranstalter das
  //     Rennen, ist das PDF für immer falsch.
  //   - `navigator.share()` öffnet den Teilen-Dialog des Geräts.
  //     Damit funktionieren WhatsApp, iMessage, Mail, Signal, Notizen
  //     und AirDrop auf einmal, ohne dass die Seite einen einzigen
  //     Dienst kennen muss.
  //   - Ein PDF bräuchte eine Bibliothek (jsPDF o. Ä., ~150-400 KB) für
  //     ein schlechteres Ergebnis. Wo ein PDF sinnvoll wäre: die ganze
  //     gefilterte Liste als Saisonplan - das ist eine andere Funktion,
  //     und dafür reicht später ein Druck-Stylesheet (der Browser
  //     schreibt daraus selbst ein PDF).
  //
  // Ohne `navigator.share` (Firefox am Rechner, Safari am Mac je nach
  // Version) wird Text + Link in die Ablage kopiert.

  // Der Link auf genau dieses Event. Absolut, damit er in einer
  // Nachricht anklickbar ist.
  function eventLink(e) {
    const basis = window.location.origin + window.location.pathname;
    return `${basis}?event=${encodeURIComponent(eventSlug(e))}`;
  }

  // Die Angaben aus der Box, in der Reihenfolge, in der sie dort stehen.
  function eventShareText(e) {
    const zeilen = [
      e.name,
      `${formatRange(e.datum_start, e.datum_ende)} · ${e.standort}, ${tv('land', e.land)}`,
      `${tv('art1', e.art1)}${e.art2 ? ' / ' + tv('art2', e.art2) : ''} · ${formatLength(e)}`
    ];
    const wb = displayWettbewerb(e);
    if (wb) zeilen.splice(2, 0, wb);
    return zeilen.join('\n');
  }

  function teileEvent(e) {
    const url = eventLink(e);
    const text = eventShareText(e);
    if (navigator.share) {
      // Bricht jemand den Dialog ab, kommt ein AbortError - das ist
      // keine Panne und darf keine Meldung auslösen.
      navigator.share({ title: e.name, text, url }).catch((err) => {
        if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
        kopiereInAblage(text + '\n' + url);
      });
      return;
    }
    kopiereInAblage(text + '\n' + url);
  }

  // Kopieren mit Rückfallweg: `navigator.clipboard` braucht einen
  // sicheren Kontext (https oder localhost). Ohne den hilft ein
  // unsichtbares Textfeld samt execCommand - alt, aber es funktioniert
  // überall.
  function kopiereInAblage(text) {
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(text)
        .then(() => showToast(t('share_event_done')))
        .catch(() => showToast(t('share_fail')));
      return;
    }
    try {
      const feld = document.createElement('textarea');
      feld.value = text;
      feld.setAttribute('readonly', '');
      feld.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(feld);
      feld.select();
      const ok = document.execCommand('copy');
      feld.remove();
      showToast(ok ? t('share_event_done') : t('share_fail'));
    } catch (err) {
      showToast(t('share_fail'));
    }
  }

  // ---------- Zum Kalender hinzufügen ----------

  // Alle Termine sind GANZTÄGIG. Startzeiten stehen in keiner Quelle
  // verlässlich (und wenn, dann pro Wettbewerb verschieden) - ein
  // ganztägiger Eintrag behauptet keine Uhrzeit, die wir nicht kennen.
  //
  // Ganztägige Termine enden im iCalendar-Format (RFC 5545) am FOLGETAG:
  // DTEND ist exklusiv. Dasselbe gilt für den dates-Parameter von Google
  // und startdt/enddt von Outlook. Ohne das +1 fehlt der letzte Tag.
  function calDatePlusDays(iso, tage) {
    const [j, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(j, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + tage);
    return dt.toISOString().slice(0, 10);
  }

  function calFields(e) {
    const start = e.datum_start;
    const endeInklusiv = e.datum_ende && e.datum_ende > start ? e.datum_ende : start;
    const wb = displayWettbewerb(e);
    const titel = wb ? `${e.name} – ${wb}` : e.name;
    const zeilen = [
      `${t('detail_sportart')}: ${tv('art1', e.art1)}${e.art2 ? ' / ' + tv('art2', e.art2) : ''}`,
      `${t('detail_laenge')}: ${formatLength(e)}`
    ];
    if (e.veranstalter_url) zeilen.push(e.veranstalter_url);
    return {
      titel,
      ort: `${e.standort}${e.land ? ', ' + tv('land', e.land) : ''}`,
      beschreibung: zeilen.join('\n'),
      start,
      endeExklusiv: calDatePlusDays(endeInklusiv, 1),
      url: e.veranstalter_url || ''
    };
  }

  function setupCalendarBox(e) {
    const btn = detailEl.querySelector('#cal-open-btn');
    const menu = detailEl.querySelector('#cal-menu');
    if (!btn || !menu) return;
    const f = calFields(e);
    const kompakt = (iso) => iso.replace(/-/g, '');

    detailEl.querySelector('#cal-google').href =
      'https://calendar.google.com/calendar/render?action=TEMPLATE'
      + `&text=${encodeURIComponent(f.titel)}`
      + `&dates=${kompakt(f.start)}/${kompakt(f.endeExklusiv)}`
      + `&details=${encodeURIComponent(f.beschreibung)}`
      + `&location=${encodeURIComponent(f.ort)}`;

    // Outlook.com deckt private Konten ab; Outlook für Arbeit/Schule
    // (outlook.office.com) versteht dieselbe Adresse und leitet um.
    detailEl.querySelector('#cal-outlook').href =
      'https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent'
      + '&allday=true'
      + `&subject=${encodeURIComponent(f.titel)}`
      + `&startdt=${f.start}`
      + `&enddt=${f.endeExklusiv}`
      + `&body=${encodeURIComponent(f.beschreibung)}`
      + `&location=${encodeURIComponent(f.ort)}`;

    // Die .ics-Datei liegt fertig im Ordner kalender/ (erzeugt von
    // scripts/build_ics.py, eine je Event). Ein einfacher Link genügt -
    // und nur so kommt die Datei mit dem Inhaltstyp text/calendar vom
    // Server, den iOS braucht, um den Termin dem Kalender anzubieten.
    // Alles, was die Seite selbst erzeugte (Blob, data-URI, sogar eine
    // vom Service Worker erfundene Antwort), war für Safari ein Download.
    //
    // Bewusst OHNE download-Attribut: das würde Safari das Übergeben an
    // den Kalender wieder verbieten.
    const icsEl = detailEl.querySelector('#cal-ics');
    icsEl.href = `kalender/${icsFileName(e)}`;
    const noteEl = detailEl.querySelector('#cal-note');
    if (noteEl) noteEl.textContent = t(istAppleGeraet() ? 'cal_note_apple' : 'cal_note');

    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const offen = !menu.hidden;
      menu.hidden = offen;
      btn.setAttribute('aria-expanded', offen ? 'false' : 'true');
    });
    menu.addEventListener('click', () => {
      menu.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    });

    // Klick daneben oder Escape schließt das Menü. Der Zuhörer wird nur
    // EINMAL angemeldet (renderDetail baut den Bereich bei jedem Klick
    // neu, sonst sammelten sich die Zuhörer an).
    if (!setupCalendarBox.listenersAttached) {
      setupCalendarBox.listenersAttached = true;
      document.addEventListener('click', (ev) => {
        const m = detailEl.querySelector('#cal-menu');
        if (!m || m.hidden) return;
        if (m.contains(ev.target) || detailEl.querySelector('#cal-open-btn').contains(ev.target)) return;
        m.hidden = true;
        detailEl.querySelector('#cal-open-btn').setAttribute('aria-expanded', 'false');
      });
      document.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Escape') return;
        const m = detailEl.querySelector('#cal-menu');
        if (!m || m.hidden) return;
        m.hidden = true;
        detailEl.querySelector('#cal-open-btn').setAttribute('aria-expanded', 'false');
      });
    }
  }

  // Dateiname der fertigen .ics-Datei. **Muss mit ics_dateiname() in
  // scripts/build_ics.py übereinstimmen** - sonst zeigt der Knopf auf
  // eine Datei, die es nicht gibt. scripts/test_scraper_lib.py prüft
  // beide Umsetzungen gegeneinander (ruft dafür node auf), also beim
  // Ändern immer beide anfassen.
  //
  // Aufbau: <datum>-<name>-<distanz>-<ort>.ics. Der Ort gehört dazu, weil
  // Name + Datum + Distanz nicht eindeutig sind (der
  // "Königsforst-Marathon" steht mit 42,2 km zweimal in den Daten, für
  // Bensberg und für Bergisch Gladbach).
  function icsSlug(text) {
    return (text || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/ß/g, 'ss')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 48)
      .replace(/^-+|-+$/g, '');
  }

  function icsMasszahl(e) {
    if (e.laenge_km != null) {
      return `${(Math.round(Number(e.laenge_km) * 10) / 10)}km`.replace('.', '-');
    }
    if (e.dauer_h != null) {
      return `${(Math.round(Number(e.dauer_h) * 10) / 10)}h`.replace('.', '-');
    }
    return 'x';
  }

  // Die dauerhafte Kennung eines Events: Datum, Name, Maßzahl, Ort.
  // Zwei Dinge hängen daran, deshalb steht sie nur EINMAL hier:
  //   - der Name der Kalenderdatei (icsFileName, muss zu build_ics.py
  //     passen - test_scraper_lib.py prüft beide gegeneinander),
  //   - der Link auf ein einzelnes Event (?event=…, siehe teileEvent).
  // Eine ID in events.json gibt es nicht, und eine laufende Nummer wäre
  // wertlos: Sie verschiebt sich, sobald ein Event dazukommt oder ein
  // vergangenes wegfällt - ein geteilter Link zeigte dann auf ein
  // fremdes Rennen.
  function eventSlug(e) {
    const teile = [e.datum_start || 'ohne-datum', icsSlug(e.name), icsMasszahl(e)];
    const ort = icsSlug(e.standort);
    if (ort) teile.push(ort);
    return teile.join('-');
  }

  function icsFileName(e) {
    return eventSlug(e) + '.ics';
  }

  // ---------- Fehler melden ----------
  // Reihenfolge = Reihenfolge im Drop-down. Die Schluessel landen
  // unveraendert in Firestore (Feld "kategorie") und werden von
  // scripts/review_reports.py wieder erkannt - also nicht umbenennen,
  // ohne dort nachzuziehen.
  const REPORT_CATEGORIES = [
    'laenge', 'datum', 'ort', 'url', 'sportart', 'name', 'doppelt', 'abgesagt', 'sonstiges'
  ];
  const REPORT_DESC_MAX = 600;
  const REPORT_DESC_MIN = 10;

  const reportOverlay = document.getElementById('report-overlay');
  const reportDialogEl = reportOverlay.querySelector('.ee-modal');
  const reportBodyEl = document.getElementById('report-body');

  document.getElementById('report-close').addEventListener('click', closeReportModal);
  reportOverlay.addEventListener('click', (evt) => {
    if (evt.target === reportOverlay) closeReportModal();
  });
  document.addEventListener('keydown', (evt) => {
    if (evt.key === 'Escape' && !reportOverlay.hidden) closeReportModal();
  });
  // Escape und die Fokusfessel kommen aus auth.js (dialogTasten) - der
  // Anmelde-Dialog dort braucht genau dasselbe, und zwei Kopien laufen
  // auseinander.
  //
  // Erst beim ersten Öffnen eingehängt, nicht hier: auth.js trägt
  // `defer`, dieses Inline-Skript läuft davor - window.EndauranceAuth
  // gibt es an dieser Stelle noch nicht (dieselbe Reihenfolge wie bei
  // EE_AUTH_QUEUE). Ohne auth.js bleibt es beim Escape-Listener oben.
  let reportFesselGesetzt = false;

  function setzeReportFessel() {
    if (reportFesselGesetzt) return;
    if (!window.EndauranceAuth || !window.EndauranceAuth.dialogTasten) return;
    window.EndauranceAuth.dialogTasten(reportOverlay, closeReportModal);
    reportFesselGesetzt = true;
  }

  // Wohin der Fokus zurückgeht: auf "Fehler zu diesem Event melden".
  let reportFokusVorher = null;

  function closeReportModal() {
    reportOverlay.hidden = true;
    reportBodyEl.innerHTML = '';
    if (reportFokusVorher && reportFokusVorher.isConnected) {
      try { reportFokusVorher.focus(); } catch (e) { /* ignorieren */ }
    }
    reportFokusVorher = null;
  }

  function openReportModal(e) {
    // Das Firestore-SDK haengt nicht mehr im HTML (344 KB fuer jeden
    // Seitenaufruf); auth.js laedt es nach. Hier schon anstossen, damit
    // beim Abschicken nichts mehr zu warten ist.
    if (window.EndauranceAuth && window.EndauranceAuth.prepareFirestore) {
      window.EndauranceAuth.prepareFirestore();
    }
    setzeReportFessel();
    reportFokusVorher = document.activeElement;
    const kmText = formatLength(e);
    const wb = displayWettbewerb(e);
    reportBodyEl.innerHTML = `
      <h2 id="report-heading">${escapeHtml(t('report_title'))}</h2>
      <div class="report-event-summary">
        <strong>${escapeHtml(e.name)}</strong>
        <span>${escapeHtml(formatRange(e.datum_start, e.datum_ende))} &middot; ${escapeHtml(e.standort)} &middot; ${escapeHtml(kmText)}${wb ? ' &middot; ' + escapeHtml(wb) : ''}</span>
      </div>
      <p class="report-intro">${escapeHtml(t('report_intro'))}</p>
      <div id="report-msg"></div>
      <form id="report-form">
        <div class="ee-field">
          <label for="report-kategorie">${escapeHtml(t('report_field_label'))}</label>
          <select id="report-kategorie" autocomplete="off">
            <!-- Leere Vorauswahl: es soll bewusst nichts vorbelegt sein,
                 sonst wandert eine unbeabsichtigte Kategorie in die
                 Meldung. Die Pflicht-Pruefung sitzt im submit-Handler. -->
            <option value="" selected>${escapeHtml(t('report_field_placeholder'))}</option>
            ${REPORT_CATEGORIES.map(k => `<option value="${k}">${escapeHtml(t('report_cat_' + k))}</option>`).join('')}
          </select>
        </div>
        <div class="ee-field">
          <label for="report-desc">${escapeHtml(t('report_desc_label'))}</label>
          <textarea id="report-desc" maxlength="${REPORT_DESC_MAX}" placeholder="${escapeHtml(t('report_desc_placeholder'))}"></textarea>
          <div class="report-counter" id="report-counter">0 / ${REPORT_DESC_MAX}</div>
        </div>
        <button type="submit" class="ee-submit-btn" id="report-submit">${escapeHtml(t('report_send'))}</button>
      </form>
    `;
    reportOverlay.hidden = false;

    // Bewusst ohne required-Attribute: die Browser-Blase ist nicht
    // uebersetzt und passt optisch nicht zum Dialog - validiert wird
    // unten im submit-Handler mit den eigenen i18n-Texten.
    const form = reportBodyEl.querySelector('#report-form');
    const selectEl = reportBodyEl.querySelector('#report-kategorie');
    const descEl = reportBodyEl.querySelector('#report-desc');
    const counterEl = reportBodyEl.querySelector('#report-counter');
    const msgEl = reportBodyEl.querySelector('#report-msg');
    const submitEl = reportBodyEl.querySelector('#report-submit');

    descEl.addEventListener('input', () => {
      counterEl.textContent = `${descEl.value.length} / ${REPORT_DESC_MAX}`;
    });
    // Bewusst KEIN focus() auf das Drop-down: ein fokussiertes <select>
    // klappt in mehreren Browsern sofort auf, und der Dialog begruesst
    // einen dann mit einer offenen Liste. Stattdessen den Dialog selbst
    // fokussieren - damit liegt der Tastaturfokus im Dialog, die Auswahl
    // bleibt aber leer und zu, bis jemand sie anfasst.
    reportDialogEl.focus({ preventScroll: true });

    function setMsg(text, kind) {
      msgEl.innerHTML = text ? `<div class="ee-form-msg ${kind}">${escapeHtml(text)}</div>` : '';
    }

    form.addEventListener('submit', (evt) => {
      evt.preventDefault();
      const kategorie = selectEl.value;
      const beschreibung = descEl.value.trim();
      if (!kategorie) { setMsg(t('report_err_field'), 'error'); return; }
      if (beschreibung.length < REPORT_DESC_MIN) { setMsg(t('report_err_desc'), 'error'); descEl.focus(); return; }
      setMsg(null);
      submitEl.disabled = true;
      submitEl.textContent = t('report_sending');
      window.EndauranceAuth.reportEventError({ event: e, kategorie, beschreibung })
        .then(() => {
          setMsg(t('report_thanks'), 'success');
          // Formular nach dem Absenden entfernen, damit dieselbe Meldung
          // nicht versehentlich zweimal abgeschickt wird.
          form.querySelectorAll('.ee-field').forEach(el => el.remove());
          submitEl.remove();
          window.setTimeout(() => { if (!reportOverlay.hidden) closeReportModal(); }, 2500);
        })
        .catch((err) => {
          submitEl.disabled = false;
          submitEl.textContent = t('report_send');
          setMsg(reportErrorMessage(err), 'error');
        });
    });
  }

  // Firebase-Fehlercodes in verstaendliche Saetze uebersetzen. Der Fall
  // "auth/operation-not-allowed" bzw. "auth/admin-restricted-operation"
  // heisst konkret: der Anbieter "Anonym" ist in der Firebase-Konsole
  // noch nicht aktiviert (Authentication -> Sign-in method).
  function reportErrorMessage(err) {
    const code = (err && (err.code || err.message)) || '';
    if (code === 'not-configured') return t('report_err_config');
    if (code === 'auth/operation-not-allowed' || code === 'auth/admin-restricted-operation') {
      return t('report_err_anon');
    }
    return t('report_err_save');
  }

  // ---------- "Wir haben dein Event nicht?" ----------
  //
  // Zwei Wege führen hierher: die Leiste unter der Liste (immer da) und
  // die Box bei null Treffern (dort neben dem Abo). Beide öffnen DIESEN
  // Dialog - dieselbe Linie wie bei den Abos, an denen es auch nur einen
  // Weg gibt.
  //
  // Gefragt wird nur nach der Adresse der offiziellen Seite und dem
  // Namen. Datum, Strecken, Ort und Sportart holen wir uns von genau
  // dieser Seite: Abgetippte Angaben wären eine dritte Datenquelle neben
  // Scraper und manual_overrides.json, und die offizielle Seite brauchen
  // wir nach Datenregel 2 ohnehin. Übernommen wird ein Vorschlag NIE
  // automatisch (siehe CLAUDE.md).
  const SUGGEST_NAME_MAX = 200;
  const SUGGEST_HINWEIS_MAX = 600;
  const SUGGEST_URL_MAX = 500;

  const suggestOverlay = document.getElementById('suggest-overlay');
  const suggestDialogEl = suggestOverlay.querySelector('.ee-modal');
  const suggestBodyEl = document.getElementById('suggest-body');
  let suggestFesselGesetzt = false;
  let suggestFokusVorher = null;

  document.getElementById('suggest-close').addEventListener('click', closeSuggestModal);
  suggestOverlay.addEventListener('click', (evt) => {
    if (evt.target === suggestOverlay) closeSuggestModal();
  });
  document.getElementById('fehlt-open-btn').addEventListener('click', openSuggestModal);

  function closeSuggestModal() {
    suggestOverlay.hidden = true;
    suggestBodyEl.innerHTML = '';
    if (suggestFokusVorher && suggestFokusVorher.isConnected) {
      try { suggestFokusVorher.focus(); } catch (e) { /* ignorieren */ }
    }
    suggestFokusVorher = null;
  }

  function openSuggestModal() {
    if (!window.EndauranceAuth) return;
    // Firestore schon jetzt nachladen lassen (344 KB, hängt nicht im
    // HTML) - dieselbe Vorsorge wie im Melde- und im Abo-Dialog.
    if (window.EndauranceAuth.prepareFirestore) window.EndauranceAuth.prepareFirestore();
    // Escape + Fokusfessel aus auth.js, erst beim ersten Öffnen: auth.js
    // trägt `defer` und existiert beim Inline-Skript noch nicht.
    if (!suggestFesselGesetzt && window.EndauranceAuth.dialogTasten) {
      window.EndauranceAuth.dialogTasten(suggestOverlay, closeSuggestModal);
      suggestFesselGesetzt = true;
    }
    suggestFokusVorher = document.activeElement;
    suggestBodyEl.innerHTML = `
      <h2 id="suggest-heading">${escapeHtml(t('fehlt_titel'))}</h2>
      <p class="report-intro">${escapeHtml(t('fehlt_intro'))}</p>
      <div id="suggest-msg"></div>
      <form id="suggest-form">
        <div class="ee-field">
          <label for="suggest-url">${escapeHtml(t('fehlt_url_label'))}</label>
          <input type="url" id="suggest-url" inputmode="url" autocomplete="off"
                 maxlength="${SUGGEST_URL_MAX}" placeholder="${escapeHtml(t('fehlt_url_placeholder'))}">
        </div>
        <div class="ee-field">
          <label for="suggest-name">${escapeHtml(t('fehlt_name_label'))}</label>
          <input type="text" id="suggest-name" autocomplete="off"
                 maxlength="${SUGGEST_NAME_MAX}" placeholder="${escapeHtml(t('fehlt_name_placeholder'))}">
        </div>
        <div class="ee-field">
          <label for="suggest-hinweis">${escapeHtml(t('fehlt_hinweis_label'))}</label>
          <textarea id="suggest-hinweis" maxlength="${SUGGEST_HINWEIS_MAX}"
                    placeholder="${escapeHtml(t('fehlt_hinweis_placeholder'))}"></textarea>
          <div class="report-counter" id="suggest-counter">0 / ${SUGGEST_HINWEIS_MAX}</div>
        </div>
        <button type="submit" class="ee-submit-btn" id="suggest-submit">${escapeHtml(t('fehlt_send'))}</button>
      </form>
    `;
    suggestOverlay.hidden = false;

    const form = suggestBodyEl.querySelector('#suggest-form');
    const urlEl = suggestBodyEl.querySelector('#suggest-url');
    const nameEl = suggestBodyEl.querySelector('#suggest-name');
    const hinweisEl = suggestBodyEl.querySelector('#suggest-hinweis');
    const counterEl = suggestBodyEl.querySelector('#suggest-counter');
    const msgEl = suggestBodyEl.querySelector('#suggest-msg');
    const submitEl = suggestBodyEl.querySelector('#suggest-submit');

    hinweisEl.addEventListener('input', () => {
      counterEl.textContent = `${hinweisEl.value.length} / ${SUGGEST_HINWEIS_MAX}`;
    });
    urlEl.focus({ preventScroll: true });

    function setMsg(text, kind) {
      msgEl.innerHTML = text ? `<div class="ee-form-msg ${kind}">${escapeHtml(text)}</div>` : '';
    }

    // Bewusst ohne die eingebaute Browser-Prüfung (novalidate-Verhalten,
    // siehe Melde-Dialog): Die Blase ist nicht übersetzt. Geprüft wird
    // hier, mit den eigenen Texten - und so, wie firestore.rules es
    // verlangt (http:// oder https://, Name mindestens zwei Zeichen).
    form.addEventListener('submit', (evt) => {
      evt.preventDefault();
      const name = nameEl.value.trim();
      const hinweis = hinweisEl.value.trim();
      const url = normalisiereUrl(urlEl.value);
      if (!url) { setMsg(t('fehlt_err_url'), 'error'); urlEl.focus(); return; }
      if (name.length < 2) { setMsg(t('fehlt_err_name'), 'error'); nameEl.focus(); return; }
      setMsg(null);
      submitEl.disabled = true;
      submitEl.textContent = t('fehlt_sending');
      window.EndauranceAuth.suggestEvent({ url, name, hinweis })
        .then(() => {
          setMsg(t('fehlt_thanks'), 'success');
          form.querySelectorAll('.ee-field').forEach(el => el.remove());
          submitEl.remove();
          window.setTimeout(() => { if (!suggestOverlay.hidden) closeSuggestModal(); }, 2500);
        })
        .catch((err) => {
          submitEl.disabled = false;
          submitEl.textContent = t('fehlt_send');
          // Dieselben Fehlertexte wie beim Melden: "Anonym" nicht
          // aktiviert, keine Firebase-Konfiguration, sonstiger Fehler.
          setMsg(reportErrorMessage(err), 'error');
        });
    });
  }

  // "zuerich-marathon.ch" ohne Schema ist der häufigste Fall, wenn
  // jemand eine Adresse aus dem Kopf eintippt - dann https:// davor
  // setzen, statt die Eingabe abzulehnen. Ohne einen Punkt im Namen ist
  // es keine Adresse (dann tippt jemand den Namen ins falsche Feld).
  function normalisiereUrl(eingabe) {
    let text = String(eingabe || '').trim();
    if (!text) return null;
    if (!/^https?:\/\//i.test(text)) {
      if (/^[a-z]+:\/\//i.test(text)) return null;   // ftp://, javascript: usw.
      text = 'https://' + text;
    }
    let u;
    try { u = new URL(text); } catch (e) { return null; }
    if (!u.hostname.includes('.')) return null;
    return u.href.slice(0, SUGGEST_URL_MAX);
  }

  function renderChips() {
    // Welche Chips es gibt und was ihr ✕ entfernt, entscheidet
    // filters.js (buildChips) - die Karte zeigt dieselben Chips.
    const chips = EF.buildChips(state, {
      t,
      tv,
      lang: currentLang,
      dayCount: uniqueSorted(events.map(e => e.datum_start)).length,
      // Wie viele Werte ein Mengen-Filter überhaupt hat (für "Land: Alle"
      // statt drei Einzel-Chips) - fragt dieselbe Stelle, die auch die
      // Häkchenliste im Panel füllt.
      optionCount: stateKey => ui.options(stateKey).length,
      // Der Umkreis-Chip nimmt den Ausgangspunkt mit - in der Liste
      // verschwindet dabei auch die Entfernungs-Spalte (setOrigin).
      setOrigin: (_state, origin) => setOrigin(origin)
    });

    chipsEl.innerHTML = '';
    chips.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(c.label)} <button aria-label="✕">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        c.clear();
        selectedIndex = null;
        render();
      });
      chipsEl.appendChild(chip);
    });
  }

  function resetFilters() {
    EF.clearFilters(state);
    state.sortKey = 'datum';
    state.sortDir = 'asc';
    ui.resetTransient();
    selectedIndex = null;
    ui.close();
    buildHeader();
    render();
  }
})();
</script>
