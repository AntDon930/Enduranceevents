<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Ausdauersport-Events D/A/CH</title>
<!-- Seitensymbol. Ohne diese Zeilen fragt jeder Browser von sich aus
     /favicon.ico an und bekommt von GitHub Pages die 404-Seite - der Tab
     bleibt leer. Eine SVG-Datei reicht fuer alle Groessen; das PNG
     braucht nur iOS fuer den Startbildschirm (dort rundet das System die
     Ecken selbst, deshalb ist es randvoll). -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b1220">
<!-- Vorschau beim Teilen ("Suche mit Freunden teilen" schickt einen Link
     auf events.html). Ohne diese Angaben zeigen WhatsApp, iMessage und Co.
     nur die nackte Adresse. Ein og:image fehlt bewusst: es braucht eine
     absolute Adresse, und die Domain steht noch nicht fest. -->
<meta name="description" content="Laufen, Schwimmen, Radfahren und Triathlon in Deutschland, Österreich und der Schweiz – filterbar nach Datum, Ort, Sportart und Distanz, mit Umkreissuche, Karte und Kalender-Eintrag.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ausdauersport-Events D/A/CH">
<meta property="og:title" content="Ausdauersport-Events D/A/CH – die Liste">
<meta property="og:description" content="Laufen, Schwimmen, Radfahren und Triathlon in Deutschland, Österreich und der Schweiz – filterbar nach Datum, Ort, Sportart und Distanz, mit Umkreissuche, Karte und Kalender-Eintrag.">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary">
<!-- events.json ist das, worauf die Seite wartet - deshalb wird der
     Download hier angestossen, noch bevor der Browser das Stylesheet und
     die Skripte gesehen hat. Ohne diese Zeile begann er erst, nachdem
     filters.js und filter-ui.js geladen UND ausgefuehrt waren. -->
<link rel="preload" href="events.json" as="fetch" type="application/json" crossorigin="anonymous">
<!-- Farben, Kopfzeile, Filterleiste, Fußzeile: geteilt mit Karte und Startseite. -->
<link rel="stylesheet" href="site.css?v=7bd0d7ec">
<!-- Filterknöpfe und Filter-Panel: dieselbe Datei nutzt karte.html. -->
<link rel="stylesheet" href="filter-ui.css?v=389055b9">
<link rel="stylesheet" href="event-detail.css?v=02379c86">
<style>
  /* Farben, Kopfzeile, Filterleiste, Werkzeugleiste und Fußzeile stehen
     in site.css (geteilt mit Karte und Startseite); hier nur, was allein
     die Liste hat: Tabelle, Detailbereich, Dialoge. */
  .notify-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin: 0 var(--seite-rand) 12px;
    background: var(--accent-bg);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.86rem;
  }
  .notify-box[hidden] { display: none; }
  .notify-box p { margin: 0; flex: 1; min-width: 200px; color: var(--text); }
  .notify-box button {
    padding: 9px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
    font: inherit;
    font-size: 0.84rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .notify-box button:hover { opacity: 0.9; }
  .notify-box .notify-status { font-size: 0.8rem; color: var(--text-muted); }

  /* ---------- Tabelle und Detailbereich ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 340px);
    gap: 20px;
    align-items: start;
    padding: 0 var(--seite-rand);
  }
  @media (min-width: 1300px) {
    .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 440px); }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
    position: sticky;
    top: 16px;
  }
  .side-panel .detail-panel { width: 100%; }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow-x: auto;
    max-height: 78vh;
    overflow-y: auto;
  }
  /* Ab 901 px ist die SEITE genau fensterhoch, nur die Liste scrollt.
     Vorher scrollte man in zwei verschiedenen Dingen (vom Nutzer
     gemeldet). min-height: 0 an beiden Stellen ist keine Kosmetik: ohne
     das wächst das Grid auf seine Inhaltshöhe und schiebt die Fußzeile
     aus dem Bild. Auf dem Handy bleibt der Seiten-Scroll, weil der
     Detailbereich dort UNTER der Tabelle steht (zeigeDetailbereich). */
  @media (min-width: 901px) {
    html { height: 100%; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .layout { flex: 1 1 auto; min-height: 0; align-items: stretch; padding-bottom: 12px; }
    .layout > * { min-height: 0; }
    .table-wrap { max-height: 100%; height: 100%; }
    .side-panel { max-height: 100%; overflow-y: auto; }
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
    table-layout: fixed;
    font-size: 0.9rem;
  }
  /* Spaltenbreiten über KLASSEN, nicht über nth-child: die
     Entfernungs-Spalte kommt und geht. Reihenfolge (Vorlage): Datum,
     Name, Sportart, Ort, Land, Kategorie, Länge. */
  .col-datum { width: 13%; }
  .col-name { width: 24%; }
  .col-art1 { width: 12%; }
  .col-standort { width: 13%; }
  .col-entfernung { width: 10%; }
  .col-land { width: 12%; }
  .col-art2 { width: 13%; }
  .col-laenge_km { width: 12%; }
  table.with-distance { min-width: 960px; }
  /* Datum und Länge stehen in EINER Zeile ("So 27.09.2026", "9,5–28,5 km");
     ein mehrtägiges Rennen bricht über sein <br>. */
  td.col-datum .cell-clamp, td.col-laenge_km .cell-clamp { white-space: nowrap; }
  /* Der Browser überspringt Layout und Zeichnen für Zeilen außerhalb
     des Bildes - möglich nur wegen table-layout: fixed. Jede Zeile ist
     gleich hoch (52 px, wie eine Mindesthöhe), kein Text geht über zwei
     Zeilen hinaus (.cell-clamp, .group-name-text, laengeSpanne). */
  tbody tr {
    content-visibility: auto;
    contain-intrinsic-size: auto 52px;
    height: 52px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 2;
    border-bottom: 1px solid var(--border);
    text-align: left;
    padding: 0;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .th-inner {
    padding: 15px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .th-inner span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Der Spaltenname ist der Sortier-Knopf, sieht aber wie eine
     Kopfzeile aus. */
  .th-sort {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .th-sort:hover { color: var(--text); }
  .th-sort.active { color: var(--text); }
  .sort-arrow { font-size: 0.7em; flex-shrink: 0; }

  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    text-align: left;
    color: var(--text);
    text-decoration: none;
    font-weight: normal;
  }
  .cell-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
  }
  /* Sportart mit Symbol in der Markenfarbe (event-detail.js, sportIcon). */
  .sport-cell { display: flex; align-items: center; gap: 6px; }
  .sport-cell .sport-icon { color: var(--brand); flex-shrink: 0; }
  /* Bezeichnung des konkreten Wettbewerbs unter dem Namen. */
  .wettbewerb {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  /* Der aufgeklappte Block ist durchgehend in EINEM Ton hinterlegt,
     auch die gewählte Strecke (so vom Nutzer entschieden, 19.09.2026);
     `active` bleibt an der Zeile für Tastatur und Rauchtest. */
  tbody tr.group-row.open,
  tbody tr.sub-row { background: var(--accent-bg); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.active { background: var(--accent-bg); }
  tbody tr:focus { outline: none; }
  tbody tr:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: var(--accent-bg);
  }
  .detail-panel:focus { outline: none; }
  .detail-panel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Zusammengefasste Zeile: Pfeil im runden Feld ganz links im Namen. */
  .group-row { cursor: pointer; font-weight: 700; }
  .group-row:hover { background: var(--row-hover); }
  .group-name { display: flex; align-items: center; gap: 10px; }
  .group-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text-muted);
    transition: transform 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .group-row:hover .chevron { color: var(--text); border-color: var(--text-muted); }
  /* Eine Strecke allein: kein Pfeil, aber derselbe Einzug. */
  .chevron-spacer { display: inline-block; width: 22px; height: 22px; flex-shrink: 0; }
  .chevron.open { transform: rotate(90deg); color: var(--text); border-color: var(--text-muted); }
  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }
  tbody tr.sub-row .col-name { padding-left: 44px; }
  tbody tr.group-row.open { font-weight: normal; }
  .group-row.open .group-name { align-items: flex-start; }
  .group-row.open .group-name-text {
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* Der RAHMEN um die aufgeklappte Veranstaltung (Linie oben, Linie
     unten, Strich links UND rechts) - als inset box-shadow, damit keine
     Zeile um einen Pixel wächst (alle Zeilen sind 52 px, der Rauchtest
     misst das). Reihenfolge der acht Regeln ist bedeutungstragend: die
     Eckzellen mit zwei Schatten müssen NACH den allgemeinen stehen. Die
     Farbe ist --frame, nicht der helle Akzent. */
  tbody tr.group-row.open > td:first-child,
  tbody tr.sub-row > td:first-child { box-shadow: inset 3px 0 0 var(--frame); }
  tbody tr.group-row.open > td:last-child,
  tbody tr.sub-row > td:last-child { box-shadow: inset -3px 0 0 var(--frame); }
  tbody tr.group-row.open > td { box-shadow: inset 0 2px 0 var(--frame); }
  tbody tr.group-row.open > td:first-child {
    box-shadow: inset 3px 0 0 var(--frame), inset 0 2px 0 var(--frame);
  }
  tbody tr.group-row.open > td:last-child {
    box-shadow: inset -3px 0 0 var(--frame), inset 0 2px 0 var(--frame);
  }
  tbody tr.sub-row.letzte > td { box-shadow: inset 0 -2px 0 var(--frame); }
  tbody tr.sub-row.letzte > td:first-child {
    box-shadow: inset 3px 0 0 var(--frame), inset 0 -2px 0 var(--frame);
  }
  tbody tr.sub-row.letzte > td:last-child {
    box-shadow: inset -3px 0 0 var(--frame), inset 0 -2px 0 var(--frame);
  }

  /* Die letzte Zeile, solange noch Einträge fehlen (zeigeMehr): der
     Knopf bleibt per position: sticky am linken Rand des SICHTBAREN
     Bereichs, egal wie weit die Tabelle geschoben ist. */
  .mehr-row td { padding: 0; background: var(--panel); }
  .mehr-row .mehr-inner {
    position: sticky;
    left: 0;
    display: block;
    width: -moz-fit-content;
    width: fit-content;
    padding: 10px 12px;
  }
  .mehr-row .mehr-btn {
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 16px;
    font: inherit;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
  }
  .mehr-row .mehr-btn:hover { background: var(--accent-bg); }
  .empty-row td { text-align: center; padding: 28px; color: var(--text-muted); }

  /* ---------- Dialoge (Abo, Fehler melden, Event fehlt) ---------- */
  .ee-submit-btn { color: var(--on-accent) !important; }
  .abo-btn { }
  .abo-summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 0 14px;
    font-size: 0.86rem;
  }
  .abo-summary strong { display: block; margin-bottom: 2px; }
  .abo-summary .abo-hint { display: block; margin-top: 5px; color: var(--text-muted); font-size: 0.82rem; }
  .abo-filter { margin: 0 0 12px; }
  .abo-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .abo-abschnitt { display: block; margin: 0 0 6px; }
  .abo-filter > strong { display: block; }
  .abo-rhythm { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
  .abo-rhythm label {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .abo-rhythm label:hover { background: var(--row-hover); }
  .abo-rhythm input { margin-top: 3px; }
  .abo-rhythm .abo-rhythm-note { display: block; color: var(--text-muted); font-size: 0.8rem; }
  .abo-list { margin: 18px 0 0; border-top: 1px solid var(--border); padding-top: 14px; }
  .abo-list h3 { margin: 0 0 8px; font-size: 0.92rem; }
  .abo-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 0.84rem;
  }
  .abo-item .abo-item-rhythm { color: var(--text-muted); font-size: 0.8rem; }
  .abo-item button {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 8px;
    padding: 3px 9px;
    font: inherit;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .abo-item button:hover { color: #ff8a80; border-color: #ff8a80; }
  .abo-status { font-size: 0.85rem; margin-top: 10px; }
  .abo-status.ok { color: #6fdc8c; }
  .abo-status.fehler { color: #ff8a80; }

  .report-event-summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 0.85rem;
  }
  .report-event-summary strong { display: block; margin-bottom: 2px; }
  .report-event-summary span { color: var(--text-muted); }
  .report-intro { margin: 0 0 14px; font-size: 0.86rem; color: var(--text-muted); }
  .ee-field select,
  .ee-field textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
  }
  .ee-field textarea { resize: vertical; min-height: 90px; }
  .report-counter { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 4px; }
  .ee-field input[type="url"] { font-family: inherit; }

  @media (max-width: 900px) {
    .layout { padding: 0 var(--seite-rand); }
  }
</style>
</head>
<body>

<!-- Kopfzeile: Marke (führt zur Startseite), Navigation, rechts Teilen,
     DE/EN und Anmelden. Dieselbe Kopfzeile wie auf Karte und Startseite.
     .top-bar/.top-actions bleiben als Klassen für den Rauchtest. -->
<header class="site-header top-bar">
  <a class="brand" href="index.html">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 46 L26 20 L38 34 L51 17"/><circle cx="51" cy="17" r="5" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <h1 class="brand-name" id="page-title">Endurance Events</h1>
  </a>
  <nav class="site-nav" aria-label="Seiten">
    <a class="nav-link active" href="events.html" id="nav-events" aria-current="page">Events</a>
    <a class="nav-link" href="karte.html" id="nav-map">Karte</a>
  </nav>
  <div class="top-actions">
    <!-- Teilen gehört zur Seite als Ganzem (die aktuelle Suche). -->
    <button type="button" class="icon-btn share-btn" id="share-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/>
        <path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>
      </svg>
      <span class="sr-only" id="share-btn-label"></span>
    </button>
    <div class="lang-switch" id="lang-switch">
      <button type="button" class="lang-btn" data-lang="de">DE</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
    <div id="auth-mount"></div>
  </div>
</header>
<!-- Leer, solange alles in Ordnung ist; die Notbremse im Skript schreibt
     hierhin ("Bitte neu laden"). -->
<p class="page-note" id="subtitle"></p>

<!-- Die kurze Rückmeldung nach dem Kopieren (Toast) erzeugt
     event-detail.js beim ersten Aufruf selbst. -->

<!-- Filterleiste: Suchfeld, die Filterpillen (dieselben wie auf der
     Karte, filter-ui.js), rechts die Karte mit diesen Filtern und das
     E-Mail-Abo. -->
<div class="filter-bar" id="filter-bar">
  <div class="master-search" id="master-search-box"></div>
  <div class="filter-btn-bar" id="filter-buttons"></div>
  <div class="filter-bar-actions">
    <a class="bar-btn map-link" href="karte.html" id="map-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>
      </svg>
      <span id="map-btn-label"></span>
    </a>
    <!-- Abo-Knopf: immer erreichbar, nicht nur bei null Treffern. -->
    <button type="button" class="bar-btn abo-btn" id="abo-open-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
      <span id="abo-open-label"></span>
    </button>
  </div>
</div>

<!-- Werkzeugleiste: Trefferzahl, der Schalter (verändert, wie die Zahl
     zu lesen ist), die gesetzten Filter als Chips, "Filter löschen" und
     rechts der Stand der Daten. -->
<div class="toolbar">
  <div class="result-count" id="result-count"></div>
  <label class="group-toggle"><input type="checkbox" id="group-toggle"><span class="switch" aria-hidden="true"></span><span id="group-toggle-label"></span></label>
  <div class="active-chips" id="active-chips"></div>
  <button type="button" class="reset-btn" id="reset-btn"></button>
  <div class="stand" id="stand-box" hidden>
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>
    </svg>
    <span id="stand"></span>
  </div>
</div>

<div class="notify-box" id="notify-box" hidden></div>

<!-- Abo-Dialog ("Neue Events per E-Mail"). Nutzt die Modal-Stile aus
     auth.js (.ee-modal-overlay/.ee-modal) und dieselbe Fokusfessel
     (dialogTasten) wie der Melde-Dialog. -->
<div class="ee-modal-overlay" id="abo-overlay" hidden>
  <div class="ee-modal" role="dialog" aria-modal="true" aria-labelledby="abo-heading" tabindex="-1">
    <button type="button" class="ee-modal-close" id="abo-close" aria-label="Schliessen">&#10005;</button>
    <div id="abo-body"></div>
  </div>
</div>

<div class="layout">
  <div class="table-wrap">
    <table id="event-table">
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="event-body"></tbody>
    </table>
  </div>
  <div class="side-panel">
    <!-- tabindex="-1": Enter auf einer Zeile springt hierher (siehe
         Tastaturbedienung), ein eigener Tab-Stopp ist es aber nicht. -->
    <div class="detail-panel" id="detail-panel" tabindex="-1"></div>
  </div>
</div>


<!-- "Wir haben dein Event nicht?" - gespeichert wird via
     EndauranceAuth.suggestEvent() in der Firestore-Collection
     "eventSuggestions" (anonyme Anmeldung, wie bei den

      // Chip- und Zeitraum-Texte: siehe filters.js (unten eingemischt)
    
      // Texte der Filter-Panels und die Spaltennamen: filter-ui.js
      // (unten eingemischt) - die Karte zeigt dieselben Knöpfe.

  // Chip-/Zeitraum-Texte und die Übersetzung der Datenwerte

  // dieselben Chips, und zwei Kopien derselben Texte wären mit der Zeit
  // auseinandergelaufen. Die gespeicherten Filterwerte bleiben intern
  // immer auf Deutsch (Datenformat), übersetzt wird nur die ANZEIGE.
  Object.assign(I18N.de, EF.I18N.de, EFU.I18N.de, EED.I18N.de);
  Object.assign(I18N.en, EF.I18N.en, EFU.I18N.en, EED.I18N.en);
  const VALUE_TRANSLATIONS = EF.VALUE_TRANSLATIONS;

  let currentLang = 'de';
  try {
    const saved = localStorage.getItem('endurance-lang');
    if (saved === 'de' || saved === 'en') currentLang = saved;
  } catch (e) { /* localStorage evtl. nicht verfügbar */ }

  function t(key, ...args) {
    const entry = I18N[currentLang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  }

  function tv(field, value) {
    if (value == null) return value;
    const entry = VALUE_TRANSLATIONS[field] && VALUE_TRANSLATIONS[field][value];
    return entry ? entry[currentLang] : value;
  }

  const DISTANCE_CATEGORY_LABELS = EF.DISTANCE_CATEGORY_LABELS;
  const RADIUS_MIN_KM = EF.RADIUS_MIN_KM;
  const RADIUS_MAX_KM = EF.RADIUS_MAX_KM;
  const RADIUS_DEFAULT_KM = EF.RADIUS_DEFAULT_KM;

  // hochgezogen und damit auch vor ihrer Textstelle aufrufbar - genau
  // die Temporal-Dead-Zone-Falle, die dieses Skript schon zweimal
  // erwischt hat.
  function matchesDistanceCategory(e) {
    return EF.matchesDistanceCategory(state, e);
  }

  // Kanonische Distanz-Bezeichnungen und ihre Länge in km. Steht so ein
  // Wort allein im Wettbewerbs-Feld und passt zur Länge, sagt es nichts
  // Neues (siehe displayWettbewerb).

  // Die Wettbewerbs-Bezeichnung, ODER null wenn sie nur die Länge
  // wiederholt (Begründung in event-detail.js).

  // Reihenfolge der Spalten: Name, Datum, Land, Standort, Sportart,
  // Kategorie, Länge - die Liste steht in filter-ui.js, weil dieselbe

  // Keine Anmeldung-Spalte/-Filter: der Anmeldeschluss lässt sich bei
  // den meisten gescrapten Quellen nicht zuverlässig auslesen (fehlt fast
  // überall) - keine gute Datenbasis, siehe Docstrings der Scraper-Skripte.
  const COLUMNS = EFU.COLUMNS;

  // Sortierschlüssel pro Spalte. Jede Funktion gibt [Gruppe, Wert] zurück:
  // die Gruppe sortiert Einträge ohne verwertbare Angabe ans Ende, egal in
  // welche Richtung sortiert wird (eine Zeile ohne Distanz soll nicht bei
  // "aufsteigend" ganz oben stehen).
  const SORT_KEYS = {
    name: e => [0, `${e.name || ''} ${e.wettbewerb || ''}`.toLowerCase()],
    datum: e => [0, e.datum_start || ''],
    land: e => [0, tv('land', e.land).toLowerCase()],
    standort: e => [0, (e.standort || '').toLowerCase()],
    art1: e => [0, tv('art1', e.art1).toLowerCase()],
    art2: e => [0, e.art2 ? tv('art2', e.art2).toLowerCase() : ''],
    // Drei Stufen: bekannte Distanz, dann Zeitrennen (nach Dauer), dann
    // Einträge ohne beides. Km und Stunden sind nicht vergleichbar - sie
    // in eine Zahlenreihe zu mischen würde eine Ordnung behaupten, die es
    // nicht gibt.
    laenge_km: e => e.laenge_km != null ? [0, e.laenge_km]
                  : e.dauer_h != null ? [1, e.dauer_h] : [2, 0],
    entfernung: e => {
      const d = distanceFromOrigin(e);
      return d == null ? [1, 0] : [0, d];
    }
  };

  // Die Entfernungs-Spalte gibt es nur mit Ausgangspunkt - ohne einen
  // wäre sie eine Spalte voller Striche. Sie steht direkt hinter
  // Stadt/Ort, weil sie dieselbe Frage beantwortet ("wie weit weg?").
  const DISTANCE_COLUMN = { key: 'entfernung', labelKey: 'col_entfernung', type: 'none' };

  // Beim Zusammenfassen steht ganz vorn, aus wie vielen Zeilen eine
  // Veranstaltung besteht - eine einzelne Strecke zeigt "1". Die Spalte
  // ist nicht sortierbar (SORT_KEYS kennt sie nicht): sortiert werden
  // einzelne Strecken, die Gruppen entstehen erst danach.
  // Die Spalte „#" (Anzahl der Strecken) ist WEG. Sie stand beim
  // Zusammenfassen ganz links und wurde als Durchnummerierung der Events
  // gelesen - „1, 2, 1, 1, 3" sah nach einer kaputten Liste aus (vom
  // Nutzer gemeldet). Wie viele Strecken sich hinter einer Veranstaltung
  // verbergen, muss man vorher auch nicht wissen; dass sie sich
  // aufklappt, sagt der Pfeil, der jetzt an dieser Stelle steht (er
  // saß immer schon im Namensfeld, hat aber ohne die Zahl davor den
  // Platz ganz links). Die Gesamtzahl steht weiter in der Trefferzeile
  // („7 Veranstaltungen (10 Strecken)").

  // Reihenfolge der Tabelle (Vorlage des Nutzers, 21.09.2026): Datum,
  // Name, Sportart, Ort, Land, Kategorie, Länge - die Filterpillen über
  // der Tabelle stehen in ihrer eigenen Reihenfolge (FILTER_ORDER).
  const TABLE_ORDER = ['datum', 'name', 'art1', 'standort', 'land', 'art2', 'laenge_km'];
  const FILTER_ORDER = ['datum', 'art1', 'art2', 'laenge_km', 'standort', 'land', 'name'];

  function activeColumns() {
    const cols = TABLE_ORDER.map(key => COLUMNS.find(c => c.key === key)).filter(Boolean);
    if (state.origin) cols.splice(cols.findIndex(c => c.key === 'standort') + 1, 0, DISTANCE_COLUMN);
    return cols;
  }

  function distanceFromOrigin(e) {
    if (!state.origin || e.lat == null || e.lon == null) return null;
    return haversineKm(state.origin.lat, state.origin.lon, e.lat, e.lon);
  }

  function formatDistance(e) {
    const d = distanceFromOrigin(e);
    if (d == null) return '–';
    // Unter 10 km mit einer Nachkommastelle (dort macht sie einen
    // Unterschied), darüber gerundet - und immer mit dem
    // Trennzeichen der gewählten Sprache.
    return d < 10
      ? `${EF.formatNumber(d, currentLang, 1)} km`
      : `${Math.round(d)} km`;
  }

  // Ab wie vielen ausgewählten Werten ein Mengen-Filter zu EINEM Chip
  // zusammengefasst wird (siehe buildChips in filters.js).
  const MAX_VALUE_CHIPS = EF.MAX_VALUE_CHIPS;

  // Aufklapp-Zeichen der zusammengefassten Zeilen: ein Pfeil in einem
  // runden Feld, der sich beim Öffnen dreht. Das frühere "▸" war ein
  // Schriftzeichen - in jeder Schrift anders groß, nicht mittig und ohne

  // die Tabelle neu, setOrigin schaltet zusätzlich die Entfernungs-Spalte
  // samt Sortierung.
  const ui = EFU.create({
    state,
    getEvents: () => events,
    t,

  // Der Abo-Dialog bekommt seine EIGENE Bedieneinheit mit eigenem

  const aboState = EF.createState();
  const aboUi = EFU.create({

    tv,
    getLang: () => currentLang,
    // Nur die Zusammenfassung im Dialog neu schreiben - keine Tabelle,
    // keine Adresse, nichts an der Liste.
    onChange: () => zeichneAboZusammenfassung(),

    alleWerte: true,

    setOrigin: (origin) => {

  const filterButtonsEl = document.getElementById('filter-buttons');
  const standEl = document.getElementById('stand');
  const navMapEl = document.getElementById('nav-map');
  let datenStand = null;   // ISO-Datum aus dem Last-Modified von events.json

  // ---------- Mastersuche ----------
  //
  // Ein Feld über Eventname, Wettbewerb und Ort (EF.matchEvent, Feld
  // `suche`), samt Vorschlägen ("Iron" → "Ironman"). Gebaut von
  // filter-ui.js (ui.buildSearch), weil die Karte dasselbe Feld zeigt -

  const suche = ui.buildSearch(document.getElementById('master-search-box'));

  const groupToggleEl = document.getElementById('group-toggle');
  const groupToggleLabelEl = document.getElementById('group-toggle-label');
  // Merken, wie der Nutzer die Liste lieber sieht - die Einstellung
  // gehört zur Ansicht, nicht zum Filter, und überlebt deshalb den
  // Seitenwechsel (wie die Sprache).
  // Gemerkt wird nur, was jemand SELBST umgestellt hat. Fehlt der
  // Eintrag (erster Besuch, gelöschter Speicher), gilt die
  // Voreinstellung aus `state` - nicht "aus". Ein `=== '1'` hätte hier
  // beides gleich behandelt und die Voreinstellung stillschweigend
  // ausgehebelt.
  try {
    const gemerkt = localStorage.getItem('endurance-gruppiert');
    if (gemerkt !== null) state.gruppiert = gemerkt === '1';
  } catch (e) { /* ignorieren */ }
  groupToggleEl.checked = state.gruppiert;
  groupToggleEl.addEventListener('change', () => {

  const shareBtnEl = document.getElementById('share-btn');
  const shareBtnLabelEl = document.getElementById('share-btn-label');

  shareBtnEl.addEventListener('click', () => {

    // navigator.clipboard braucht einen sicheren Kontext; ohne den (oder

    // Adresszeile - dort steht die vollständige Adresse ja bereits.

        .then(() => showToast(t('share_done')))

  const mapBtnLabelEl = document.getElementById('map-btn-label');

  // auth.js haengt mit `defer` im HTML und ist an dieser Stelle noch nicht
  // da - das ist Absicht, damit der Abruf von events.json nicht auf

  if (window.EndauranceAuth) {

  if (aboGewuenscht) {

  // ---------- helpers ----------

  function formatKm(km) {

  }

  //

  function formatLength(e) {

  }

  }
