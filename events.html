      cal_note: 'Ganztägiger Termin. Die .ics-Datei wird geladen – zum Eintragen öffnen.',
      cal_note_apple: 'Ganztägiger Termin. Öffnet sich im Kalender – dort auf „Hinzufügen" tippen. Lädt Safari stattdessen eine Datei, diese in „Dateien" antippen.',
      empty_events: 'Keine Events gefunden.',
      notify_text: 'Kein Event entspricht deinen Filtern? Lass dich per E-Mail benachrichtigen, sobald ein passendes Event hinzugefügt wird.',
      notify_btn: 'Benachrichtigen, sobald verfügbar',
      notify_login_btn: 'Anmelden, um benachrichtigt zu werden',
      notify_saved: '✓ Gespeichert – wir melden uns per E-Mail.',
      notify_error: 'Fehler beim Speichern – bitte später erneut versuchen.',
      load_error: (msg) => `Konnte events.json nicht laden: ${msg}`,
      // Chip- und Zeitraum-Texte: siehe filters.js (unten eingemischt)
      // Texte der Filter-Panels und die Spaltennamen: filter-ui.js
      // (unten eingemischt) - die Karte zeigt dieselben Knöpfe.
    },
    en: {
      tab_title: 'Endurance Events D/A/CH',
      title: 'Endurance Events – Germany / Austria / Switzerland',
      subtitle: 'Click a column filter button (▾) to narrow the list. Click a row for details – by keyboard: ↑ ↓ and Enter.',
      reset: 'Reset all filters',
      home: 'Home',
      map: 'Map',
      result_count: (n, total) => `${n} of ${total} events`,
      col_entfernung: 'Distance',
      col_anzahl: 'Count',
      sort_hint: 'Click to sort',
      group_toggle: 'Group by event',
      result_count_grouped: (g, n, total) => `${g} events (${n} races) of ${total}`,
      share_search: 'Share this search',
      share_done: '✓ Link copied!',
      share_fail: 'Could not copy – please use the address bar',
      detail_empty: 'Select a row to see details.',
      detail_datum: 'Date', detail_sportart: 'Sport', detail_kategorie: 'Category',
      detail_standort: 'City', detail_land: 'Country', detail_laenge: 'Length',
      detail_wettbewerb: 'Race',
      report_btn: 'Report an error in this event',
      report_title: 'Report an error',
      report_intro: 'Thanks for helping! What is wrong with this event?',
      report_field_label: 'Where is the error?',
      report_field_placeholder: 'Please choose …',
      report_desc_label: 'What is wrong? (short description)',
      report_desc_placeholder: 'e.g. "The race is 12.4 km, not 10 km" or "The website is outdated, the new one is …"',
      report_send: 'Send report',
      report_sending: 'Sending …',
      report_thanks: '✓ Thank you! Your report has been received and will be reviewed.',
      report_err_field: 'Please choose where the error is.',
      report_err_desc: 'Please describe the error briefly (at least 10 characters).',
      report_err_save: 'Could not save the report. Please try again later.',
      report_err_anon: 'Anonymous reporting is not enabled yet for this project (Firebase provider "Anonymous").',
      report_err_config: 'Reporting is not set up yet (Firebase configuration missing).',
      report_cat_laenge: 'Length / distance',
      report_cat_datum: 'Date',
      report_cat_ort: 'City or country',
      report_cat_url: 'Link to the organizer website',
      report_cat_sportart: 'Sport or category',
      report_cat_name: 'Event name',
      report_cat_doppelt: 'Event is listed twice',
      report_cat_abgesagt: 'Event is cancelled / not happening',
      report_cat_sonstiges: 'Something else',
      detail_link: 'Visit organizer website ↗',
      cal_btn: 'Add to calendar',
      cal_google: 'Google Calendar / Gmail',
      cal_outlook: 'Outlook',
      cal_ics: 'Apple Calendar & others (.ics)',
      cal_note: 'All-day event. The .ics file is downloaded – open it to add the event.',
      cal_note_apple: 'All-day event. Opens in Calendar – tap “Add” there. If Safari downloads a file instead, tap it in the Files app.',
      empty_events: 'No events found.',
      notify_text: 'No event matches your filters? Get notified by email as soon as a matching event is added.',
      notify_btn: 'Notify me when available',
      notify_login_btn: 'Sign in to get notified',
      notify_saved: '✓ Saved – we’ll email you.',
      notify_error: 'Could not save – please try again later.',
      load_error: (msg) => `Could not load events.json: ${msg}`,
      // Chip- und Zeitraum-Texte: siehe filters.js (unten eingemischt)
    
      // Texte der Filter-Panels und die Spaltennamen: filter-ui.js
      // (unten eingemischt) - die Karte zeigt dieselben Knöpfe.
    }
  };

  // Chip-/Zeitraum-Texte und die Übersetzung der Datenwerte
  // (Land/Sportart/Kategorie) kommen aus filters.js - die Karte zeigt
  // dieselben Chips, und zwei Kopien derselben Texte wären mit der Zeit
  // auseinandergelaufen. Die gespeicherten Filterwerte bleiben intern
  // immer auf Deutsch (Datenformat), übersetzt wird nur die ANZEIGE.
  Object.assign(I18N.de, EF.I18N.de, EFU.I18N.de);
  Object.assign(I18N.en, EF.I18N.en, EFU.I18N.en);
  const VALUE_TRANSLATIONS = EF.VALUE_TRANSLATIONS;

  let currentLang = 'de';
  try {
    const saved = localStorage.getItem('endurance-lang');
    if (saved === 'de' || saved === 'en') currentLang = saved;
  } catch (e) { /* localStorage evtl. nicht verfügbar */ }

  function t(key, ...args) {
    const entry = I18N[currentLang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  }

  function tv(field, value) {
    if (value == null) return value;
    const entry = VALUE_TRANSLATIONS[field] && VALUE_TRANSLATIONS[field][value];
    return entry ? entry[currentLang] : value;
  }

  // ---------- Distanzkategorien (nach Sportart) ----------

  // Die Tabellen selbst (welche Distanz zu welcher Kategorie zählt) und
  // die Grenzen des Umkreis-Reglers stehen in filters.js: die Karte
  // filtert mit genau denselben Kategorien.
  const DISTANCE_CATEGORIES = EF.DISTANCE_CATEGORIES;
  const DISTANCE_CATEGORY_LABELS = EF.DISTANCE_CATEGORY_LABELS;
  const RADIUS_MIN_KM = EF.RADIUS_MIN_KM;
  const RADIUS_MAX_KM = EF.RADIUS_MAX_KM;
  const RADIUS_DEFAULT_KM = EF.RADIUS_DEFAULT_KM;

  // Bewusst eine Funktions-Deklaration (keine const-Zuweisung): sie ist
  // hochgezogen und damit auch vor ihrer Textstelle aufrufbar - genau
  // die Temporal-Dead-Zone-Falle, die dieses Skript schon zweimal
  // erwischt hat.
  function matchesDistanceCategory(e) {
    return EF.matchesDistanceCategory(state, e);
  }

  // Kanonische Distanz-Bezeichnungen und ihre Länge in km. Steht so ein
  // Wort allein im Wettbewerbs-Feld und passt zur Länge, sagt es nichts
  // Neues (siehe displayWettbewerb).
  const CANONICAL_RACE_NAMES = {
    'marathon': 42.2,
    'halbmarathon': 21.1,
    'half marathon': 21.1,
    'halbmarathon (hm)': 21.1
  };

  // Die Wettbewerbs-Bezeichnung, ODER null wenn sie nur die Länge
  // wiederholt.
  //
  // Die Quellen benennen einen Wettbewerb oft schlicht mit seiner Distanz
  // ("50 km", "6 km") oder mit deren kanonischem Namen ("Halbmarathon").
  // Beides steht schon in der Längen-Spalte; im Detailbereich erschien es
  // dadurch zweimal ("Race 50 km" über "Length 50 km"), in der Liste als
  // Unterzeile unter dem Namen. Bei gerundeten Quellenangaben sah es sogar
  // nach einem Widerspruch aus: Unterzeile "6 km" über der Spalte "5.5 km".
  //
  // Bezeichnungen mit eigener Aussage bleiben: "Laufen", "Wandern",
  // "Moslig 8000", "5×5 km Staffel", "26 km Trail". Das Feld selbst bleibt
  // in events.json erhalten - die Duplikat-Erkennung der Scraper braucht
  // es (über "Halbmarathon" wurde der doppelte München-Halbmarathon
  // gefunden).
  function displayWettbewerb(e) {
    const label = (e.wettbewerb || '').trim();
    if (!label) return null;
    const km = e.laenge_km;

    // Kanonischer Name, der genau die gespeicherte Länge bezeichnet?
    const canonical = CANONICAL_RACE_NAMES[label.toLowerCase()];
    if (canonical != null && km != null && Math.abs(canonical - Number(km)) <= 0.5) return null;

    // Bleibt nach Abzug der Distanzangaben und Füllwörter noch etwas übrig?
    const rest = label
      .replace(/\d{1,3}(?:[.,]\d+)?\s*(?:km|kilometer)\b/gi, ' ')
      .replace(/\b(?:ca|circa|etwa|rund|ungefähr|approx|ungefaehr)\b\.?/gi, ' ')
      .replace(/[\s.,;:\-–|~()]+/g, '')
      .trim();
    return rest ? label : null;
  }

  // Reihenfolge der Spalten: Name, Datum, Land, Standort, Sportart,
  // Kategorie, Länge - die Liste steht in filter-ui.js, weil dieselbe
  // hier die Tabellenköpfe und auf der Karte die Knopfreihe baut.
  // Keine Anmeldung-Spalte/-Filter: der Anmeldeschluss lässt sich bei
  // den meisten gescrapten Quellen nicht zuverlässig auslesen (fehlt fast
  // überall) - keine gute Datenbasis, siehe Docstrings der Scraper-Skripte.
  const COLUMNS = EFU.COLUMNS;

  // Sortierschlüssel pro Spalte. Jede Funktion gibt [Gruppe, Wert] zurück:
  // die Gruppe sortiert Einträge ohne verwertbare Angabe ans Ende, egal in
  // welche Richtung sortiert wird (eine Zeile ohne Distanz soll nicht bei
  // "aufsteigend" ganz oben stehen).
  const SORT_KEYS = {
    name: e => [0, `${e.name || ''} ${e.wettbewerb || ''}`.toLowerCase()],
    datum: e => [0, e.datum_start || ''],
    land: e => [0, tv('land', e.land).toLowerCase()],
    standort: e => [0, (e.standort || '').toLowerCase()],
    art1: e => [0, tv('art1', e.art1).toLowerCase()],
    art2: e => [0, e.art2 ? tv('art2', e.art2).toLowerCase() : ''],
    // Drei Stufen: bekannte Distanz, dann Zeitrennen (nach Dauer), dann
    // Einträge ohne beides. Km und Stunden sind nicht vergleichbar - sie
    // in eine Zahlenreihe zu mischen würde eine Ordnung behaupten, die es
    // nicht gibt.
    laenge_km: e => e.laenge_km != null ? [0, e.laenge_km]
                  : e.dauer_h != null ? [1, e.dauer_h] : [2, 0],
    entfernung: e => {
      const d = distanceFromOrigin(e);
      return d == null ? [1, 0] : [0, d];
    }
  };

  // Die Entfernungs-Spalte gibt es nur mit Ausgangspunkt - ohne einen
  // wäre sie eine Spalte voller Striche. Sie steht direkt hinter
  // Stadt/Ort, weil sie dieselbe Frage beantwortet ("wie weit weg?").
  const DISTANCE_COLUMN = { key: 'entfernung', labelKey: 'col_entfernung', type: 'none' };

  // Beim Zusammenfassen steht ganz vorn, aus wie vielen Zeilen eine
  // Veranstaltung besteht - eine einzelne Strecke zeigt "1". Die Spalte
  // ist nicht sortierbar (SORT_KEYS kennt sie nicht): sortiert werden
  // einzelne Strecken, die Gruppen entstehen erst danach.
  const COUNT_COLUMN = { key: 'anzahl', labelKey: 'col_anzahl', short: '#', type: 'none' };

  function activeColumns() {
    const cols = COLUMNS.slice();
    if (state.origin) cols.splice(4, 0, DISTANCE_COLUMN);
    if (state.gruppiert) cols.unshift(COUNT_COLUMN);
    return cols;
  }

  function distanceFromOrigin(e) {
    if (!state.origin || e.lat == null || e.lon == null) return null;
    return haversineKm(state.origin.lat, state.origin.lon, e.lat, e.lon);
  }

  function formatDistance(e) {
    const d = distanceFromOrigin(e);
    if (d == null) return '–';
    return d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d)} km`;
  }

  // Ab wie vielen ausgewählten Werten ein Mengen-Filter zu EINEM Chip
  // zusammengefasst wird (siehe buildChips in filters.js).
  const MAX_VALUE_CHIPS = EF.MAX_VALUE_CHIPS;

  // Aufklapp-Zeichen der zusammengefassten Zeilen: ein Pfeil in einem
  // runden Feld, der sich beim Öffnen dreht. Das frühere "▸" war ein
  // Schriftzeichen - in jeder Schrift anders groß, nicht mittig und ohne
  // Bewegung. Steht hier oben, weil der erste render() (siehe
  // urlZustandGelesen) es bei aktiver Gruppierung sofort braucht.
  const CHEVRON_SVG = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" '
    + 'stroke="currentColor" stroke-width="2.5" stroke-linecap="round" '
    + 'stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  // Zeitraum-Schnellfilter (dieses Wochenende, nächste 30 Tage …):
  // Tabelle in filters.js. Sie setzen dieselben state.selectedDays wie
  // der Jahr/Monat/Tag-Baum, es kommt also kein zweiter
  // Filtermechanismus dazu.
  const DATE_PRESETS = EF.DATE_PRESETS;

  // iPadOS meldet sich in Safari als "Macintosh"; der Touch-Zähler
  // verrät trotzdem, dass ein iPad davorsteht. Gebraucht an zwei Stellen:
  // für den richtigen Einstellungs-Pfad in der Standort-Hilfe und für den
  // Kalender-Eintrag (siehe setupCalendarBox).
  function istIosGeraet() {
    const ua = navigator.userAgent || '';
    return /iPhone|iPad|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
  }

  // Mac ohne Touch = Schreibtisch-macOS. Dort ist der Kalender die
  // Standard-App für .ics, das Öffnen lohnt also genauso.
  function istAppleGeraet() {
    return istIosGeraet() || /Mac/.test(navigator.userAgent || '');
  }

  function applyDatePreset(preset) {
    EF.applyDatePreset(state, preset, uniqueSorted(events.map(e => e.datum_start)));
    selectedIndex = null;
  }

  // ^ DATE_PRESETS steht hier oben, NICHT beim Datums-Panel: readUrlState()
  // liest den Zeitraum schon beim Laden der Seite, und eine const-Tabelle
  // weiter unten wäre zu diesem Zeitpunkt noch nicht initialisiert
  // ("Cannot access 'DATE_PRESETS' before initialization" - genau dieser
  // Fehler ist beim Bauen passiert).


  let events = [];
  let selectedIndex = null;

  // Stehen hier oben, NICHT beim Zeichnen der Tabelle: `const`/`let` auf
  // oberster Ebene sind vor ihrer Textstelle nicht benutzbar (Temporal
  // Dead Zone), und render() läuft schon viel früher - setLanguage()
  // ruft es auf, bevor die Tabelle überhaupt zum ersten Mal entsteht.
  let gruppenAktuell = [];         // Gruppen der aktuellen Anzeige
  const idxZuGruppe = new Map();   // Event-Index -> Nummer seiner Gruppe
  // Die eine Zeile, die per Tab erreichbar ist (Tastaturbedienung der
  // Tabelle, siehe setzeTabStop). Aus demselben Grund hier oben: render()
  // setzt sie am Ende, und render() läuft lange vor ihrer Textstelle -
  // dort deklariert warf sie "Cannot access 'tabStopZeile' before
  // initialization" und brach render() nach dem Detailbereich ab.
  let tabStopZeile = null;

  // Vor dem ersten readUrlState() darf writeUrlState() NICHTS schreiben,
  // sonst löscht der erste render() die Parameter eines geteilten Links
  // wieder: window.EndauranceAuth meldet den Anmeldestatus schon, während
  // events.json noch lädt, und ruft dabei render() auf - mit leerem
  // Filterzustand. Die Flagge steht hier oben und nicht beim
  // Deep-Link-Abschnitt, weil genau dieser frühe render() sie sonst noch
  // nicht sieht ("Cannot access ... before initialization").
  let urlZustandGelesen = false;

  // Filterzustand: die eigentlichen Filter kommen aus filters.js
  // (createState), damit die Karte denselben Zustand lesen kann. Dazu
  // kommen hier die Dinge, die nur die Liste hat.
  const state = Object.assign(EF.createState(), {
    treeExpanded: new Set(),      // aufgeklappte Knoten im Datum-Baum (UI-Zustand)
    sortKey: 'datum',             // Spalte, nach der sortiert wird (siehe SORT_KEYS)
    sortDir: 'asc',               // 'asc' | 'desc'
    // Zusammenfassen ist reine ANZEIGE: die Daten bleiben eine Zeile pro
    // Strecke (Datenregel 1), die Tabelle zeigt sie nur gebündelt.
    gruppiert: false,
    offeneGruppen: new Set()      // aufgeklappte Gruppen (Schlüssel siehe groupKey)
  });

  // Die Filter-Bedienelemente (Knöpfe + schwebendes Panel) kommen aus
  // filter-ui.js - die Karte benutzt genau dieselben. Was die Liste
  // darüber hinaus tun muss, steckt in den beiden Haken: onChange zeichnet
  // die Tabelle neu, setOrigin schaltet zusätzlich die Entfernungs-Spalte
  // samt Sortierung.
  const ui = EFU.create({
    state,
    getEvents: () => events,
    t,
    tv,
    getLang: () => currentLang,
    onChange: () => { selectedIndex = null; render(); },
    setOrigin: (origin) => setOrigin(origin)
  });

  const bodyEl = document.getElementById('event-body');
  const tableEl = document.getElementById('event-table');
  const headerRowEl = document.getElementById('header-row');
  const countEl = document.getElementById('result-count');
  const chipsEl = document.getElementById('active-chips');
  const detailEl = document.getElementById('detail-panel');
  const titleEl = document.getElementById('page-title');
  const subtitleEl = document.getElementById('subtitle');
  const resetBtnEl = document.getElementById('reset-btn');
  resetBtnEl.addEventListener('click', resetFilters);

  const groupToggleEl = document.getElementById('group-toggle');
  const groupToggleLabelEl = document.getElementById('group-toggle-label');
  // Merken, wie der Nutzer die Liste lieber sieht - die Einstellung
  // gehört zur Ansicht, nicht zum Filter, und überlebt deshalb den
  // Seitenwechsel (wie die Sprache).
  try { state.gruppiert = localStorage.getItem('endurance-gruppiert') === '1'; } catch (e) { /* ignorieren */ }
  groupToggleEl.checked = state.gruppiert;
  groupToggleEl.addEventListener('change', () => {
    state.gruppiert = groupToggleEl.checked;
    try { localStorage.setItem('endurance-gruppiert', state.gruppiert ? '1' : '0'); } catch (e) { /* ignorieren */ }
    state.offeneGruppen.clear();
    selectedIndex = null;
    // buildHeader() muss mit: das Zusammenfassen schaltet die Spalte
    // "Anzahl" zu bzw. ab (activeColumns). Ohne den Aufruf bekam der
    // Tabellenkörper eine Zelle mehr als die Kopfzeile Spalten hatte -
    // alle Überschriften standen um eine Spalte verschoben, bis die
    // Seite neu geladen wurde.
    buildHeader();
    render();
  });

  const shareBtnEl = document.getElementById('share-btn');
  const shareBtnLabelEl = document.getElementById('share-btn-label');
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  // Kleines Fenster, das knapp zwei Sekunden lang sichtbar ist. Zwei
  // Zeitgeber: einer für das Ausblenden (Deckkraft), einer fürs
  // Wegnehmen aus dem Layout danach.
  function showToast(text) {
    window.clearTimeout(toastTimer);
    toastEl.textContent = text;
    toastEl.hidden = false;
    // Ein Bildaufbau muss zwischen hidden=false und der Klasse liegen,
    // sonst gibt es keinen Übergang, sondern einen Sprung.
    window.requestAnimationFrame(() => toastEl.classList.add('visible'));
    toastTimer = window.setTimeout(() => {
      toastEl.classList.remove('visible');
      toastTimer = window.setTimeout(() => { toastEl.hidden = true; }, 220);
    }, 1800);
  }

  shareBtnEl.addEventListener('click', () => {
    const url = window.location.href;
    // navigator.clipboard braucht einen sicheren Kontext; ohne den (oder
    // bei verweigerter Erlaubnis) bleibt nur der Hinweis auf die
    // Adresszeile - dort steht die vollständige Adresse ja bereits.
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(url)
        .then(() => showToast(t('share_done')))
        .catch(() => showToast(t('share_fail')));
    } else {
      showToast(t('share_fail'));
    }
  });
  const homeBtnLabelEl = document.getElementById('home-btn-label');
  const mapBtnEl = document.getElementById('map-btn');
  const mapBtnLabelEl = document.getElementById('map-btn-label');
  const notifyBoxEl = document.getElementById('notify-box');

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  // "Benachrichtige mich"-Box neu rendern, sobald sich der Login-Status
  // ändert (z. B. nachdem sich der Nutzer im Modal erfolgreich angemeldet
  // hat, während die Box wegen 0 Treffern sichtbar war).
  // auth.js haengt mit `defer` im HTML und ist an dieser Stelle noch nicht
  // da - das ist Absicht, damit der Abruf von events.json nicht auf
  // Firebase wartet. Die Warteschlange nimmt den Listener auf, auth.js
  // meldet ihn nach (siehe EE_AUTH_QUEUE dort).
  if (window.EndauranceAuth) {
    window.EndauranceAuth.onAuthChange(() => render());
  } else {
    (window.EE_AUTH_QUEUE = window.EE_AUTH_QUEUE || []).push(() => render());
  }

  try {
    const res = await fetch('events.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    events = dropPastEvents(await res.json());
  } catch (err) {
    setLanguage(currentLang, { skipRender: true });
    bodyEl.innerHTML = `<tr><td colspan="7" class="empty-row">${escapeHtml(t('load_error', err.message))}</td></tr>`;
    return;
  }

  // Filterzustand aus der Adresse übernehmen (siehe readUrlState). Deckt
  // auch die beiden alten Deep-Links ab, die es vorher schon gab:
  // ?sportart=Fahrrad von der Willkommensseite und ?standort=Frankfurt
  // vom Marker in karte.html.
  readUrlState();
  urlZustandGelesen = true;
  groupToggleEl.checked = state.gruppiert;

  setLanguage(currentLang);

  // ---------- helpers ----------

  // Vergangene Events erscheinen gar nicht (Datenregel 10). Die Regel
  // steht in filters.js, weil die Karte beim Laden genauso filtert.
  function dropPastEvents(list) {
    return EF.dropPastEvents(list);
  }

  // Die drei kleinen Helfer stehen in filters.js: die Filter-Panels
  // brauchen sie genauso (Datums-Baum, Häkchenlisten).
  function uniqueSorted(values) {
    return EF.uniqueSorted(values, currentLang);
  }

  // Wrapper statt const-Zuweisung: hochgezogen und damit auch vor
  // dieser Zeile aufrufbar (siehe matchesDistanceCategory).
  function haversineKm(lat1, lon1, lat2, lon2) {
    return EF.haversineKm(lat1, lon1, lat2, lon2);
  }

  function formatDate(iso) {
    return EF.formatDate(iso, currentLang);
  }

  function formatRange(start, end) {
    if (start === end) return formatDate(start);
    return `${formatDate(start)} – ${formatDate(end)}`;
  }

  // Längenangaben immer auf EINE Dezimalstelle: die Quellen geben dieselbe
  // Strecke unterschiedlich genau an (Marathon als "42,195 km"), angezeigt
  // wird einheitlich "42.2 km". Runde Distanzen bleiben ohne Nachkomma-
  // stelle ("10 km" statt "10.0 km").
  function formatKm(km) {
    if (km == null || Number.isNaN(Number(km))) return '–';
    const rounded = Math.round(Number(km) * 10) / 10;
    return `${Number.isInteger(rounded) ? rounded : rounded.toFixed(1)} km`;
  }

  // Was in der Spalte "Länge" steht. Nicht jedes Rennen hat eine Strecke:
  // ein 24-Stunden-Lauf ist über die ZEIT begrenzt, gelaufen wird so weit
  // man kommt. Solche Einträge tragen `dauer_h` statt `laenge_km` und
  // zeigen hier "24 h".
  //
  // Eine bekannte Distanz hat dabei VORRANG, auch wenn beide Felder
  // gesetzt sind: Beim "24h Mad Chicken Run | Marathon, 42 km" ist das
  // "24h" der Name der Veranstaltung, die Zeile selbst aber eine feste
  // 42-km-Strecke. Sie als "24 h" anzuzeigen würde die Distanz
  // verschlucken.
  function formatLength(e) {
    if (e.laenge_km != null) return formatKm(e.laenge_km);
    if (e.dauer_h != null && !Number.isNaN(Number(e.dauer_h))) {
      const h = Math.round(Number(e.dauer_h) * 10) / 10;
      return `${Number.isInteger(h) ? h : h.toFixed(1)} h`;
    }
    // Backyard Ultra ohne Zeitbegrenzung: bewusst "–". Der Lauf endet,
    // wenn nur noch eine Person weiterläuft - es gibt keine Länge, und
    // die Rundenlänge ist keine (siehe clear_backyard_lap_km()).
    return formatKm(null);
  }

  function escapeHtml(str) {
    return EF.escapeHtml(str);
  }

  // ---------- Sprache ----------

  function setLanguage(lang, opts) {
    currentLang = lang;
    try { localStorage.setItem('endurance-lang', lang); } catch (e) { /* ignorieren */ }
    document.documentElement.lang = lang;
    document.title = t('tab_title');
    titleEl.textContent = t('title');
    subtitleEl.textContent = t('subtitle');
    resetBtnEl.textContent = t('reset');
    groupToggleLabelEl.textContent = t('group_toggle');
    shareBtnLabelEl.textContent = t('share_search');
    shareBtnEl.title = t('share_search');
    homeBtnLabelEl.textContent = t('home');
    mapBtnLabelEl.textContent = t('map');
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    // Das offene Panel trägt Texte in der alten Sprache - zu machen ist
    // einfacher (und für den Nutzer verständlicher) als es umzubauen.
    ui.close();
    if (opts && opts.skipRender) return;
    buildHeader();
    render();
  }

  // ---------- header / filter ----------

  // Was ein Ausgangspunkt in der LISTE auslöst. Das Setzen selbst steckt
  // in filters.js (setOriginPlain), hier kommt dazu, was nur die Tabelle
  // betrifft: Mit einem Ausgangspunkt ist "was ist am nächsten?" die
  // naheliegende Frage - also nach Entfernung sortieren, solange noch die
  // Standard-Sortierung aktiv ist. Eine selbst gewählte Sortierung wird
  // nicht überschrieben. Fällt der Ausgangspunkt weg, verschwindet die
  // Spalte und mit ihr die Sortierung. Die Filter-Panels rufen das über
  // den setOrigin-Haken (siehe EFU.create oben).
  function setOrigin(origin) {
    const hatteOrigin = !!state.origin;
    EF.setOriginPlain(state, origin);
    if (origin && !hatteOrigin && state.sortKey === 'datum') {
      state.sortKey = 'entfernung';
      state.sortDir = 'asc';
    }
    if (!origin && state.sortKey === 'entfernung') {
      state.sortKey = 'datum';
      state.sortDir = 'asc';
    }
    selectedIndex = null;
    buildHeader();
  }

  function buildHeader() {
    headerRowEl.innerHTML = '';
    activeColumns().forEach(col => {
      const th = document.createElement('th');
      th.className = `col-${col.key}`;
      const inner = document.createElement('div');
      inner.className = 'th-inner';

      // Der Spaltenname selbst ist der Sortier-Knopf. Vorher sortierte die
      // Liste ausschließlich nach Datum - bei 4000 Zeilen (und später
      // 20.000) war das der größte Mangel. Spalten ohne Sortierschlüssel
      // (Anzahl) bekommen nur eine Beschriftung, keinen toten Knopf.
      if (SORT_KEYS[col.key]) {
        const sortBtn = document.createElement('button');
        sortBtn.type = 'button';
        sortBtn.className = 'th-sort' + (state.sortKey === col.key ? ' active' : '');
        sortBtn.title = `${t(col.labelKey)} – ${t('sort_hint')}`;
        sortBtn.innerHTML = `<span>${escapeHtml(t(col.labelKey))}</span>`
          + (state.sortKey === col.key
               ? `<span class="sort-arrow">${state.sortDir === 'asc' ? '▲' : '▼'}</span>`
               : '');
        sortBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          toggleSort(col.key);
        });
        th.setAttribute('aria-sort', state.sortKey === col.key
          ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
        inner.appendChild(sortBtn);
      } else {
        const label = document.createElement('span');
        // In die schmale Anzahl-Spalte passt kein Wort - dort steht "#",
        // der volle Name bleibt als Tooltip erhalten.
        label.textContent = col.short || t(col.labelKey);
        label.title = t(col.labelKey);
        inner.appendChild(label);
      }

      // Die Entfernungs-Spalte hat kein eigenes Filter-Panel: gefiltert
      // wird sie über den Umkreis-Regler im Stadt/Ort-Filter.
      if (col.type !== 'none') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'col-filter-btn';
        btn.dataset.col = col.key;
        btn.textContent = '▾';
        ui.attachButton(btn, col);
        inner.appendChild(btn);
      }

      th.appendChild(inner);
      headerRowEl.appendChild(th);
    });

  }

  // ---------- filtering / rendering ----------

  function getFiltered() {
    return events
      .map((e, idx) => ({ e, idx }))
      // Welche Filter ein Event treffen müssen, entscheidet
      // EF.matchEvent - dieselbe Funktion nutzt die Karte.
      .filter(({ e }) => EF.matchEvent(state, e))
      // Sortiert nach der angeklickten Spalte, Standard ist das Datum
      // aufsteigend (nächster Termin zuerst). Vergangene Events brauchen
      // keinen Sonderfall mehr - sie kommen gar nicht in die Liste
      // (siehe dropPastEvents beim Laden).
      .sort((a, b) => compareEvents(a.e, b.e));
  }

  // Erster Klick auf eine Spalte sortiert aufsteigend, der zweite dreht
  // die Richtung. Datum und Entfernung fangen aufsteigend an (nächster
  // Termin / nächstgelegener Ort zuerst) - das ist auch bei allen anderen
  // Spalten die erwartete Leserichtung.
  function toggleSort(key) {
    if (!SORT_KEYS[key]) return;
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = 'asc';
    }
    buildHeader();
    render();
  }

  function compareEvents(a, b) {
    const fn = SORT_KEYS[state.sortKey] || SORT_KEYS.datum;
    const [ga, va] = fn(a);
    const [gb, vb] = fn(b);
    // Einträge ohne Angabe stehen immer hinten, unabhängig von der Richtung.
    if (ga !== gb) return ga - gb;
    let cmp;
    if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), currentLang === 'de' ? 'de' : 'en');
    if (cmp === 0) {
      // Gleichstand: Datum, dann Name - sonst wechselt die Reihenfolge
      // gleichwertiger Zeilen bei jedem Neuzeichnen.
      cmp = (a.datum_start || '').localeCompare(b.datum_start || '')
         || (a.name || '').localeCompare(b.name || '');
      return cmp;
    }
    return state.sortDir === 'asc' ? cmp : -cmp;
  }

  // Eine Tabellenzelle. Die Zellen werden aus activeColumns() aufgebaut
  // statt fest untereinander geschrieben - nur so lässt sich die
  // Entfernungs-Spalte an der richtigen Stelle einschieben, ohne die
  // Reihenfolge an zwei Orten pflegen zu müssen.
  function cellHtml(col, e) {
    const td = (inhalt, extra) =>
      `<td class="col-${col.key}${extra ? ' ' + extra : ''}">${inhalt}</td>`;
    switch (col.key) {
      case 'anzahl': return td('');   // nur in Gruppenzeilen gefüllt
      case 'name': {
        const wb = displayWettbewerb(e);
        return td(`<div class="cell-clamp" title="${escapeHtml(wb ? e.name + ' – ' + wb : e.name)}">`
             + `${escapeHtml(e.name)}${wb ? `<span class="wettbewerb">${escapeHtml(wb)}</span>` : ''}</div>`);
      }
      case 'datum': return td(`<div class="cell-clamp">${formatRange(e.datum_start, e.datum_ende)}</div>`);
      case 'land': return td(`<div class="cell-clamp">${escapeHtml(tv('land', e.land))}</div>`);
      case 'standort': return td(`<div class="cell-clamp">${escapeHtml(e.standort)}</div>`);
      case 'entfernung': return td(`<div class="cell-clamp">${escapeHtml(formatDistance(e))}</div>`);
      case 'art1': return td(`<div class="cell-clamp">${escapeHtml(tv('art1', e.art1))}</div>`);
      case 'art2': return td(`<div class="cell-clamp">${e.art2 ? escapeHtml(tv('art2', e.art2)) : '–'}</div>`);
      case 'laenge_km': return td(`<div class="cell-clamp">${formatLength(e)}</div>`);
      default: return td('');
    }
  }


  // Schlüssel einer Veranstaltung: Name + Datum + Ort. Genau die drei
  // Felder machen aus mehreren Strecken eine Veranstaltung - die Distanz
  // ist gerade das, was sie unterscheidet.
  function groupKey(e) {
    return `${(e.name || '').toLowerCase()}|${e.datum_start}|${(e.standort || '').toLowerCase()}`;
  }

  // Gruppiert die (schon sortierten) Zeilen in der Reihenfolge, in der
  // sie auftreten - so bleibt die gewählte Sortierung sichtbar.
  function buildGroups(filtered) {
    const gruppen = [];
    const index = new Map();
    filtered.forEach(row => {
      const key = groupKey(row.e);
      let g = index.get(key);
      if (!g) {
        g = { key, rows: [] };
        index.set(key, g);
        gruppen.push(g);
      }
      g.rows.push(row);
    });
    return gruppen;
  }

  // Besteht eine Veranstaltung nur aus einer Strecke, gibt es nichts
  // aufzuklappen: die Unterzeile würde Wort für Wort dasselbe zeigen wie
  // die Zeile darüber. Solche Zeilen bekommen deshalb keinen Pfeil (und
  // in render() auch kein Klick-Verhalten zum Aufklappen).
  function istEinzelgruppe(g) {
    return g.rows.length === 1;
  }

  // Zugeklappt fasst diese Zeile die ganze Veranstaltung zusammen (alle
  // Längen als Marken). Aufgeklappt zeigt sie die ERSTE Strecke wie eine
  // gewöhnliche Zeile - die übrigen folgen als Unterzeilen. Eine
  // Veranstaltung mit zwei Strecken steht dadurch aufgeklappt in zwei
  // Zeilen; vorher waren es drei (Zusammenfassung + beide Strecken), und
  // die Zusammenfassung wiederholte nur, was direkt darunter stand.
  function groupRowHtml(g, cols) {
    const e = g.rows[0].e;
    const einzeln = istEinzelgruppe(g);
    const offen = !einzeln && state.offeneGruppen.has(g.key);
    const wb = offen ? displayWettbewerb(e) : null;
    const laengen = [];
    const kategorien = [];
    g.rows.forEach(({ e: r }) => {
      const l = formatLength(r);
      if (l !== '–' && !laengen.includes(l)) laengen.push(l);
      const k = r.art2 ? tv('art2', r.art2) : null;
      if (k && !kategorien.includes(k)) kategorien.push(k);
    });
    return cols.map(col => {
      switch (col.key) {
        case 'anzahl':
          return `<td class="col-anzahl"><span class="count-pill">${g.rows.length}</span></td>`;
        case 'name':
          // Statt des Pfeils ein gleich breiter Platzhalter: sonst
          // beginnen die Namen einzelner Strecken weiter links als die
          // der aufklappbaren Veranstaltungen.
          return `<td class="col-name"><div class="group-name" title="${escapeHtml(wb ? e.name + ' – ' + wb : e.name)}">`
               + (einzeln
                   ? `<span class="chevron-spacer" aria-hidden="true"></span>`
                   : `<span class="chevron${offen ? ' open' : ''}">${CHEVRON_SVG}</span>`)
               + `<span class="group-name-text">${escapeHtml(e.name)}`
               + (wb ? `<span class="wettbewerb">${escapeHtml(wb)}</span>` : '')
               + `</span></div></td>`;
        case 'art2':
          // Aufgeklappt gehört in die Zeile nur die Kategorie der ersten
          // Strecke - die übrigen stehen in ihren eigenen Zeilen.
          if (offen) return cellHtml(col, e);
          return `<td class="col-art2"><div class="cell-clamp">${kategorien.length ? escapeHtml(kategorien.join(' · ')) : '–'}</div></td>`;
        case 'laenge_km':
          if (offen) return cellHtml(col, e);
          return `<td class="col-laenge_km"><div class="badges">`
               + (laengen.length ? laengen.map(l => `<span class="badge">${escapeHtml(l)}</span>`).join('') : '–')
               + `</div></td>`;
        default:
          return cellHtml(col, e);
      }
    }).join('');
  }

  // ---------- Die Tabelle zeichnen ----------
  //
  // Alle Zeilen entstehen als EIN HTML-String und werden in einem Zug
  // gesetzt. Vorher baute render() jede Zeile einzeln: createElement,
  // tr.innerHTML (ein eigener HTML-Parser-Lauf pro Zeile), ein eigener
  // Click-Listener, appendChild - bei 4.155 Einträgen also 4.155-mal
  // alles davon. Ein einzelner Klick auf eine Zeile kostete damit 157 ms
  // auf dem Entwicklungsrechner, auf einem Handy ein Mehrfaches.
  //
  // Die Klicks laufen jetzt über EINEN Listener am <tbody>
  // (Event-Delegation), die angeklickte Zeile verrät sich über
  // data-idx (welches Event) und data-g (zu welcher Gruppe sie gehört).
  // Zwei Folgen davon, beide beabsichtigt:
  //   - eine Zeile auswählen zeichnet die Tabelle NICHT neu (waehleZeile),
  //   - auf-/zuklappen rührt nur die Zeilen dieser Gruppe an
  //     (klappeGruppe).

  // Ohne die erste Strecke: die steht aufgeklappt in der
  // Veranstaltungszeile selbst (groupRowHtml).
  function subRowsHtml(g, cols) {
    return g.rows.slice(1).map(({ e, idx }) =>
      `<tr class="sub-row${idx === selectedIndex ? ' active' : ''}" data-idx="${idx}" tabindex="-1">`
      + cols.map(col => cellHtml(col, e)).join('')
      + '</tr>'
    ).join('');
  }

  function render() {
    ui.updateIndicators();
    renderChips();
    ui.refresh();
    const filtered = getFiltered();
    countEl.textContent = t('result_count', filtered.length, events.length);

    const cols = activeColumns();
    tableEl.classList.toggle('with-distance', !!state.origin);

    gruppenAktuell = [];
    idxZuGruppe.clear();

    if (filtered.length === 0) {
      bodyEl.innerHTML = `<tr class="empty-row"><td colspan="${cols.length}">${escapeHtml(t('empty_events'))}</td></tr>`;
      renderNotifyPrompt();
    } else if (state.gruppiert) {
      // Eine Zeile pro Veranstaltung, Klick klappt die Strecken auf. Die
      // Daten bleiben unangetastet - Datenregel 1 gilt weiter, das hier
      // ist nur die Anzeige.
      gruppenAktuell = buildGroups(filtered);
      countEl.textContent = t('result_count_grouped', gruppenAktuell.length, filtered.length, events.length);
      const teile = [];
      gruppenAktuell.forEach((g, nr) => {
        const einzeln = istEinzelgruppe(g);
        let aktiv = false;
        g.rows.forEach(({ idx }) => {
          idxZuGruppe.set(idx, nr);
          if (idx === selectedIndex) aktiv = true;
        });
        const offen = !einzeln && state.offeneGruppen.has(g.key);
        // data-klapp und aria-expanded nur an Zeilen, die sich wirklich
        // aufklappen - eine einzelne Strecke wäre sonst dauerhaft
        // "zugeklappt", ohne dass es etwas zu öffnen gäbe.
        teile.push(`<tr class="group-row${einzeln ? ' single' : ''}${offen ? ' open' : ''}${aktiv ? ' active' : ''}"`
          + ` data-g="${nr}" data-idx="${g.rows[0].idx}" tabindex="-1"`
          + (einzeln ? '' : ` data-klapp="1" aria-expanded="${offen ? 'true' : 'false'}"`)
          + `>${groupRowHtml(g, cols)}</tr>`);
        if (offen) teile.push(subRowsHtml(g, cols));
      });
      bodyEl.innerHTML = teile.join('');
      removeNotifyPrompt();
    } else {
      bodyEl.innerHTML = filtered.map(({ e, idx }) =>
        `<tr data-idx="${idx}" tabindex="-1"${idx === selectedIndex ? ' class="active"' : ''}>`
        + cols.map(col => cellHtml(col, e)).join('')
        + '</tr>'
      ).join('');
      removeNotifyPrompt();
    }

    renderDetail();
    // Eine Zeile bleibt per Tab erreichbar (siehe setzeTabStop).
    setzeTabStop(bodyEl.querySelector('tr.active[data-idx]') || bodyEl.querySelector('tr[data-idx]'));
    writeUrlState();
    updateMapLink();
    // Zum Schluss, nicht früher: Die Spaltenbreiten stehen erst jetzt fest
    // (die Klasse `with-distance` schaltet sie um, wenn ein Ausgangspunkt
    // dazukommt). Ein offenes Filter-Panel hinge sonst an der alten
    // Position seines Knopfes.
    ui.reposition();
  }

  // Ein Listener für die ganze Tabelle. Der Klick auf eine Unterzeile
  // braucht kein stopPropagation mehr: sie trägt kein data-klapp, also
  // wählt sie nur aus, statt die Gruppe darüber zuzuklappen.
  bodyEl.addEventListener('click', (ev) => {
    const tr = ev.target.closest && ev.target.closest('tr[data-idx]');
    if (!tr || !bodyEl.contains(tr)) return;
    setzeTabStop(tr);
    let geklappt = false;
    if (tr.dataset.klapp) {
      const g = gruppenAktuell[Number(tr.dataset.g)];
      if (g) { klappeGruppe(tr, g); geklappt = true; }
    }
    // Zum Detailbereich scrollen (auf dem Handy steht er weit unten) -
    // aber NICHT, wenn der Klick eine Veranstaltung auf- oder zugeklappt
    // hat: dann will man die Strecken sehen, die gerade an dieser Stelle
    // erscheinen.
    waehleZeile(Number(tr.dataset.idx), { zeigeDetail: !geklappt });
  });

  // ---------- Tastaturbedienung der Tabelle ----------
  //
  // Die Zeilen sind <tr> mit einem Listener am <tbody> - ohne
  // Zutun also weder fokussierbar noch auslösbar, die Liste war mit
  // der Tastatur nicht zu bedienen. Nachgerüstet ohne das schnelle
  // Ein-String-Zeichnen aufzugeben:
  //
  // - Jede Zeile trägt `tabindex="-1"` (steht in den Vorlagen, kostet
  //   nichts), erreichbar per Tab ist aber nur EINE ("roving tabindex",
  //   das übliche Muster für lange Listen). 4.155 Tab-Stopps wären eine
  //   Falle: man käme aus der Tabelle nicht mehr heraus.
  // - Bewegt wird mit den Pfeiltasten, weiterhin über EINEN Listener am
  //   <tbody> - kein Listener je Zeile.
  //
  // Tasten: ↑/↓ Zeile, Home/End erste/letzte, →/← Veranstaltung auf-/
  // zuklappen, Leertaste klappt um, Enter springt in die Angaben (von
  // dort erreicht Tab die Links: Veranstalter, Kalender, Fehler melden).
  //
  // `tabStopZeile` steht oben bei `state` (Temporal Dead Zone).
  function setzeTabStop(zeile) {
    if (tabStopZeile && tabStopZeile !== zeile && tabStopZeile.isConnected) {
      tabStopZeile.tabIndex = -1;
    }
    tabStopZeile = zeile || null;
    if (tabStopZeile) tabStopZeile.tabIndex = 0;
  }

  // Eine Zeile mit der Tastatur ansteuern heißt auch: sie auswählen. Der
  // Detailbereich zeigt sofort, wo man ist (kein zusätzliches Enter).
  // Gescrollt wird dabei NICHT zu den Angaben - das würde die Tabelle,
  // in der man gerade navigiert, aus dem Bild schieben.
  function fokussiereZeile(zeile) {
    if (!zeile) return;
    setzeTabStop(zeile);
    zeile.focus();
    waehleZeile(Number(zeile.dataset.idx));
  }

  function nachbarZeile(tr, vorwaerts) {
    let n = vorwaerts ? tr.nextElementSibling : tr.previousElementSibling;
    while (n && !(n.dataset && n.dataset.idx != null)) {
      n = vorwaerts ? n.nextElementSibling : n.previousElementSibling;
    }
    return n;
  }

  bodyEl.addEventListener('keydown', (ev) => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const tr = ev.target.closest && ev.target.closest('tr[data-idx]');
    if (!tr || !bodyEl.contains(tr)) return;
    const k = ev.key;
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      const ziel = nachbarZeile(tr, k === 'ArrowDown');
      if (!ziel) return;
      ev.preventDefault();
      fokussiereZeile(ziel);
      return;
    }
    if (k === 'Home' || k === 'End') {
      const zeilen = bodyEl.querySelectorAll('tr[data-idx]');
      if (!zeilen.length) return;
      ev.preventDefault();
      fokussiereZeile(k === 'Home' ? zeilen[0] : zeilen[zeilen.length - 1]);
      return;
    }
    if (k === 'ArrowRight' || k === 'ArrowLeft') {
      if (!tr.dataset.klapp) return;
      const offen = tr.getAttribute('aria-expanded') === 'true';
      // Schon im gewünschten Zustand: nichts tun (nicht umklappen).
      if ((k === 'ArrowRight') === offen) return;
      const g = gruppenAktuell[Number(tr.dataset.g)];
      if (!g) return;
      ev.preventDefault();
      klappeGruppe(tr, g);
      // klappeGruppe baut den Inhalt der Zeile neu; der Fokus bleibt an
      // der Zeile selbst, sie wird nicht ersetzt.
      return;
    }
    if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
      // Die Leertaste würde sonst die Seite weiterblättern.
      ev.preventDefault();
      if (tr.dataset.klapp) {
        const g = gruppenAktuell[Number(tr.dataset.g)];
        if (g) klappeGruppe(tr, g);
        waehleZeile(Number(tr.dataset.idx));
        return;
      }
      waehleZeile(Number(tr.dataset.idx));
      if (k === 'Enter') {
        zeigeDetailbereich();
        // tabindex="-1" am Detailbereich (siehe HTML): ansteuerbar, aber
        // kein zusätzlicher Tab-Stopp.
        if (detailEl) detailEl.focus();
      }
    }
  });

  // Auf- und Zuklappen rührt nur die Zeilen dieser einen Veranstaltung an.
  // Die Tabelle dafür komplett neu zu zeichnen (so war es vorher) heißt
  // bei 4.155 Zeilen: erneut filtern, sortieren und alles neu aufbauen -
  // für eine Handvoll Unterzeilen. Die Trefferzahl ändert sich dabei
  // ohnehin nicht, das Zusammenfassen ist reine Anzeige.
  function klappeGruppe(tr, g) {
    const warOffen = state.offeneGruppen.has(g.key);
    if (warOffen) state.offeneGruppen.delete(g.key);
    else state.offeneGruppen.add(g.key);
    // Erst die alten Unterzeilen weg (in beide Richtungen: aufgeklappt
    // wandert die erste Strecke in die Veranstaltungszeile).
    let n = tr.nextElementSibling;
    while (n && n.classList.contains('sub-row')) {
      const weg = n;
      n = n.nextElementSibling;
      weg.remove();
    }
    const cols = activeColumns();
    // Die Veranstaltungszeile wechselt ihren Inhalt: zugeklappt die
    // Zusammenfassung, aufgeklappt die erste Strecke. groupRowHtml liest
    // den schon umgesetzten Zustand, der Pfeil steckt darin.
    tr.classList.toggle('open', !warOffen);
    tr.innerHTML = groupRowHtml(g, cols);
    tr.setAttribute('aria-expanded', warOffen ? 'false' : 'true');
    if (!warOffen) tr.insertAdjacentHTML('afterend', subRowsHtml(g, cols));
    // Zuklappen kann die Zeile entfernt haben, die den Tab-Stopp trug -
    // dann übernimmt ihn die Veranstaltungszeile, sonst wäre die Tabelle
    // per Tab nicht mehr erreichbar.
    if (!tabStopZeile || !tabStopZeile.isConnected) setzeTabStop(tr);
  }

  // Eine Zeile auswählen heißt: Detailbereich füllen und die Markierung
  // umhängen. Vorher lief dafür das komplette render() - filtern,
  // sortieren, alle Zeilen neu bauen, nur damit eine Zeile eine Klasse
  // bekommt. `selectedIndex` steht in keinem Link (siehe currentParams),
  // also ist auch writeUrlState() hier nichts zu tun.
  function waehleZeile(idx, opts) {
    selectedIndex = idx;
    markiereAuswahl();
    renderDetail();
    if (opts && opts.zeigeDetail) zeigeDetailbereich();
  }

  // Auf dem Handy wirkte ein Tippen auf eine Zeile folgenlos: unter 900 px
  // hat die Seite nur EINE Spalte, der Detailbereich steht also unter der
  // Tabelle - und die ist 78vh hoch. Die Angaben erschienen damit rund
  // einen Bildschirm weiter unten, ohne dass irgendetwas darauf hinwies.
  //
  // Gescrollt wird nur, wenn der Bereich wirklich außerhalb des Bildes
  // liegt: am Rechner steht er neben der Tabelle, dort darf sich nichts
  // bewegen. `prefers-reduced-motion` schaltet das sanfte Scrollen ab -
  // dieselbe Rücksicht wie bei den Übergängen im Stylesheet.
  function zeigeDetailbereich() {
    if (!detailEl) return;
    const box = detailEl.getBoundingClientRect();
    const sichtbar = box.top < window.innerHeight - 80 && box.bottom > 80;
    if (sichtbar) return;
    let sanft = true;
    try {
      sanft = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) { /* ältere Browser: dann sanft */ }
    try {
      detailEl.scrollIntoView({ behavior: sanft ? 'smooth' : 'auto', block: 'start' });
    } catch (e) {
      detailEl.scrollIntoView();
    }
  }

  // Bei Gruppierung sind zwei Zeilen zu markieren: die Unterzeile selbst
  // und die Veranstaltungszeile darüber (sie kann zugeklappt sein).
  // Die Gruppenzeile trägt data-g, die Unterzeilen nicht - daher das
  // :not([data-g]).
  function markiereAuswahl() {
    bodyEl.querySelectorAll('tr.active').forEach(tr => tr.classList.remove('active'));
    if (selectedIndex === null) return;
    const zeile = bodyEl.querySelector(`tr[data-idx="${selectedIndex}"]:not([data-g])`);
    if (zeile) zeile.classList.add('active');
    const nr = idxZuGruppe.get(selectedIndex);
    if (nr != null) {
      const gz = bodyEl.querySelector(`tr[data-g="${nr}"]`);
      if (gz) gz.classList.add('active');
    }
  }

  // Der Kartenknopf nimmt den Filterzustand mit: karte.html liest
  // dieselben Parameter (filters.js) und zeigt genau die Events, die hier
  // in der Liste stehen. Ohne das fing man auf der Karte wieder bei allen
  // ~4.100 Events an.
  function updateMapLink() {
    const suffix = currentParams().toString();
    mapBtnEl.href = 'karte.html' + (suffix ? '?' + suffix : '');
  }

  // ---------- Filter in der Adresse (teilbarer Link) ----------

  // Die Adresse trägt den vollständigen Filterzustand, damit eine
  // gefilterte Liste weitergegeben werden kann ("alle Trails im Umkreis
  // von 50 km um Stuttgart"). history.replaceState statt pushState: jeder
  // Häkchen-Klick würde sonst einen Eintrag in der Zurück-Geschichte
  // anlegen, und der Zurück-Knopf wäre nicht mehr zu gebrauchen.
  //
  // Den Filterteil baut filters.js (toParams) - die Karte liest und
  // schreibt genau dieselben Parameter, deshalb nimmt der Wechsel
  // zwischen Liste und Karte die Filter mit. Hier kommen nur die beiden
  // Ansichts-Parameter der Liste dazu (Sortierung, Zusammenfassen).
  function currentParams() {
    const p = EF.toParams(state);
    if (state.sortKey !== 'datum' || state.sortDir !== 'asc') {
      p.set('sort', `${state.sortKey}:${state.sortDir}`);
    }
    if (state.gruppiert) p.set('gruppiert', '1');
    return p;
  }

  function writeUrlState() {
    if (!urlZustandGelesen) return;
    if (!window.history || !window.history.replaceState) return;
    const suffix = currentParams().toString();
    const neu = window.location.pathname + (suffix ? '?' + suffix : '');
    if (neu !== window.location.pathname + window.location.search) {
      try { window.history.replaceState(null, '', neu); } catch (e) { /* ignorieren */ }
    }
  }

  function readUrlState() {
    let p;
    try { p = new URLSearchParams(window.location.search); } catch (e) { return; }
    // Die Filter selbst liest filters.js - damit versteht die Karte
    // dieselben Links (auch die beiden alten: ?sportart=Fahrrad von der
    // Willkommensseite, ?standort=Frankfurt vom Kartenmarker).
    EF.readParams(state, window.location.search, {
      knownStandort: v => events.some(e => e.standort === v),
      alleTage: uniqueSorted(events.map(e => e.datum_start)),
      geoLabel: t('geo_current_label'),
      // Ein Ausgangspunkt schaltet in der Liste zusätzlich die
      // Entfernungs-Spalte samt Sortierung zu.
      setOrigin: (_state, origin) => setOrigin(origin)
    });
    const sort = p.get('sort');
    if (sort) {
      const [key, dir] = sort.split(':');
      // Nach Entfernung sortieren geht nur mit Ausgangspunkt - ohne einen
      // gibt es die Spalte nicht, und die Liste stünde ohne sichtbare
      // Sortierung da. Kommt so aus der Karte zurück, wenn dort der
      // Umkreis entfernt wurde (oder aus einem von Hand gekürzten Link).
      if (SORT_KEYS[key] && (key !== 'entfernung' || state.origin)) {
        state.sortKey = key;
        state.sortDir = dir === 'desc' ? 'desc' : 'asc';
      }
    }
    if (p.get('gruppiert') === '1') state.gruppiert = true;
  }

  // ---------- "Benachrichtige mich"-Box (0 Treffer) ----------

  // Die aktuell aktiven Filter als einfaches, JSON-serialisierbares Objekt
  // (Sets -> Arrays) für die Firestore-Ablage. Bewusst OHNE Datumsfilter
  // (state.selectedDays): das gesuchte Event liegt annahmegemäß in der
  // Zukunft und ist deshalb noch nicht in events.json - ein Datumsfilter
  // würde eine spätere Benachrichtigung dafür also nie zulassen.
  function serializeFiltersForNotify() {
    return {
      land: Array.from(state.land),
      art1: Array.from(state.art1),
      art2: Array.from(state.art2),
      standort: Array.from(state.standort),
      laengeMin: state.laengeMin || null,
      laengeMax: state.laengeMax || null,
      distanceCategories: Array.from(state.distanceCategories),
      radiusKm: state.radiusKm,
      origin: state.origin ? { lat: state.origin.lat, lon: state.origin.lon, label: state.origin.label } : null
    };
  }

  function renderNotifyPrompt() {
    if (!window.EndauranceAuth) { notifyBoxEl.hidden = true; return; }
    notifyBoxEl.hidden = false;
    // Wie im Melde-Dialog: Firestore schon jetzt nachladen lassen.
    if (window.EndauranceAuth.prepareFirestore) window.EndauranceAuth.prepareFirestore();
    const user = window.EndauranceAuth.getUser();
    if (user) {
      notifyBoxEl.innerHTML = `
        <p>${escapeHtml(t('notify_text'))}</p>
        <button type="button" id="notify-save-btn">${escapeHtml(t('notify_btn'))}</button>
        <span class="notify-status" id="notify-status"></span>
      `;
      notifyBoxEl.querySelector('#notify-save-btn').addEventListener('click', () => {
        const statusEl = notifyBoxEl.querySelector('#notify-status');
        statusEl.textContent = '';
        window.EndauranceAuth.saveFilterSubscription(serializeFiltersForNotify())
          .then(() => { statusEl.textContent = t('notify_saved'); })
          .catch(() => { statusEl.textContent = t('notify_error'); });
      });
    } else {
      notifyBoxEl.innerHTML = `
        <p>${escapeHtml(t('notify_text'))}</p>
        <button type="button" id="notify-login-btn">${escapeHtml(t('notify_login_btn'))}</button>
      `;
      notifyBoxEl.querySelector('#notify-login-btn').addEventListener('click', () => {
        window.EndauranceAuth.openModal('login');
      });
    }
  }

  function removeNotifyPrompt() {
    notifyBoxEl.hidden = true;
  }

  function renderDetail() {
    if (selectedIndex === null || !events[selectedIndex]) {
      detailEl.innerHTML = `<div class="detail-empty">${escapeHtml(t('detail_empty'))}</div>`;
      return;
    }
    const e = events[selectedIndex];
    detailEl.innerHTML = `
      <h2>${escapeHtml(e.name)}</h2>
      <div class="sub">${escapeHtml(e.standort)}, ${escapeHtml(tv('land', e.land))}</div>
      <dl class="detail-grid">
        <dt>${escapeHtml(t('detail_datum'))}</dt><dd>${formatRange(e.datum_start, e.datum_ende)}</dd>
        <dt>${escapeHtml(t('detail_land'))}</dt><dd>${escapeHtml(tv('land', e.land))}</dd>
        <dt>${escapeHtml(t('detail_standort'))}</dt><dd>${escapeHtml(e.standort)}</dd>
        <dt>${escapeHtml(t('detail_sportart'))}</dt><dd>${escapeHtml(tv('art1', e.art1))}</dd>
        <dt>${escapeHtml(t('detail_kategorie'))}</dt><dd>${escapeHtml(e.art2 ? tv('art2', e.art2) : '–')}</dd>
        ${displayWettbewerb(e) ? `<dt>${escapeHtml(t('detail_wettbewerb'))}</dt><dd>${escapeHtml(displayWettbewerb(e))}</dd>` : ''}
        <dt>${escapeHtml(t('detail_laenge'))}</dt><dd>${formatLength(e)}</dd>
      </dl>
      ${e.veranstalter_url ? `<a class="detail-link" href="${escapeHtml(e.veranstalter_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t('detail_link'))}</a>` : ''}
      <div class="cal-box">
        <button type="button" class="cal-btn" id="cal-open-btn" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>
          </svg>
          <span>${escapeHtml(t('cal_btn'))}</span>
        </button>
        <div class="cal-menu" id="cal-menu" hidden>
          <a id="cal-google" target="_blank" rel="noopener noreferrer">${escapeHtml(t('cal_google'))}</a>
          <a id="cal-outlook" target="_blank" rel="noopener noreferrer">${escapeHtml(t('cal_outlook'))}</a>
          <a id="cal-ics">${escapeHtml(t('cal_ics'))}</a>
          <div class="cal-note" id="cal-note"></div>
        </div>
      </div>
      <button type="button" class="report-btn" id="report-open-btn">${escapeHtml(t('report_btn'))}</button>
    `;
    detailEl.querySelector('#report-open-btn').addEventListener('click', () => openReportModal(e));
    setupCalendarBox(e);
  }

  // ---------- Zum Kalender hinzufügen ----------

  // Alle Termine sind GANZTÄGIG. Startzeiten stehen in keiner Quelle
  // verlässlich (und wenn, dann pro Wettbewerb verschieden) - ein
  // ganztägiger Eintrag behauptet keine Uhrzeit, die wir nicht kennen.
  //
  // Ganztägige Termine enden im iCalendar-Format (RFC 5545) am FOLGETAG:
  // DTEND ist exklusiv. Dasselbe gilt für den dates-Parameter von Google
  // und startdt/enddt von Outlook. Ohne das +1 fehlt der letzte Tag.
  function calDatePlusDays(iso, tage) {
    const [j, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(j, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + tage);
    return dt.toISOString().slice(0, 10);
  }

  function calFields(e) {
    const start = e.datum_start;
    const endeInklusiv = e.datum_ende && e.datum_ende > start ? e.datum_ende : start;
    const wb = displayWettbewerb(e);
    const titel = wb ? `${e.name} – ${wb}` : e.name;
    const zeilen = [
      `${t('detail_sportart')}: ${tv('art1', e.art1)}${e.art2 ? ' / ' + tv('art2', e.art2) : ''}`,
      `${t('detail_laenge')}: ${formatLength(e)}`
    ];
    if (e.veranstalter_url) zeilen.push(e.veranstalter_url);
    return {
      titel,
      ort: `${e.standort}${e.land ? ', ' + tv('land', e.land) : ''}`,
      beschreibung: zeilen.join('\n'),
      start,
      endeExklusiv: calDatePlusDays(endeInklusiv, 1),
      url: e.veranstalter_url || ''
    };
  }

  function setupCalendarBox(e) {
    const btn = detailEl.querySelector('#cal-open-btn');
    const menu = detailEl.querySelector('#cal-menu');
    if (!btn || !menu) return;
    const f = calFields(e);
    const kompakt = (iso) => iso.replace(/-/g, '');

    detailEl.querySelector('#cal-google').href =
      'https://calendar.google.com/calendar/render?action=TEMPLATE'
      + `&text=${encodeURIComponent(f.titel)}`
      + `&dates=${kompakt(f.start)}/${kompakt(f.endeExklusiv)}`
      + `&details=${encodeURIComponent(f.beschreibung)}`
      + `&location=${encodeURIComponent(f.ort)}`;

    // Outlook.com deckt private Konten ab; Outlook für Arbeit/Schule
    // (outlook.office.com) versteht dieselbe Adresse und leitet um.
    detailEl.querySelector('#cal-outlook').href =
      'https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent'
      + '&allday=true'
      + `&subject=${encodeURIComponent(f.titel)}`
      + `&startdt=${f.start}`
      + `&enddt=${f.endeExklusiv}`
      + `&body=${encodeURIComponent(f.beschreibung)}`
      + `&location=${encodeURIComponent(f.ort)}`;

    // Die .ics-Datei liegt fertig im Ordner kalender/ (erzeugt von
    // scripts/build_ics.py, eine je Event). Ein einfacher Link genügt -
    // und nur so kommt die Datei mit dem Inhaltstyp text/calendar vom
    // Server, den iOS braucht, um den Termin dem Kalender anzubieten.
    // Alles, was die Seite selbst erzeugte (Blob, data-URI, sogar eine
    // vom Service Worker erfundene Antwort), war für Safari ein Download.
    //
    // Bewusst OHNE download-Attribut: das würde Safari das Übergeben an
    // den Kalender wieder verbieten.
    const icsEl = detailEl.querySelector('#cal-ics');
    icsEl.href = `kalender/${icsFileName(e)}`;
    const noteEl = detailEl.querySelector('#cal-note');
    if (noteEl) noteEl.textContent = t(istAppleGeraet() ? 'cal_note_apple' : 'cal_note');

    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const offen = !menu.hidden;
      menu.hidden = offen;
      btn.setAttribute('aria-expanded', offen ? 'false' : 'true');
    });
    menu.addEventListener('click', () => {
      menu.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    });

    // Klick daneben oder Escape schließt das Menü. Der Zuhörer wird nur
    // EINMAL angemeldet (renderDetail baut den Bereich bei jedem Klick
    // neu, sonst sammelten sich die Zuhörer an).
    if (!setupCalendarBox.listenersAttached) {
      setupCalendarBox.listenersAttached = true;
      document.addEventListener('click', (ev) => {
        const m = detailEl.querySelector('#cal-menu');
        if (!m || m.hidden) return;
        if (m.contains(ev.target) || detailEl.querySelector('#cal-open-btn').contains(ev.target)) return;
        m.hidden = true;
        detailEl.querySelector('#cal-open-btn').setAttribute('aria-expanded', 'false');
      });
      document.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Escape') return;
        const m = detailEl.querySelector('#cal-menu');
        if (!m || m.hidden) return;
        m.hidden = true;
        detailEl.querySelector('#cal-open-btn').setAttribute('aria-expanded', 'false');
      });
    }
  }

  // Dateiname der fertigen .ics-Datei. **Muss mit ics_dateiname() in
  // scripts/build_ics.py übereinstimmen** - sonst zeigt der Knopf auf
  // eine Datei, die es nicht gibt. scripts/test_scraper_lib.py prüft
  // beide Umsetzungen gegeneinander (ruft dafür node auf), also beim
  // Ändern immer beide anfassen.
  //
  // Aufbau: <datum>-<name>-<distanz>-<ort>.ics. Der Ort gehört dazu, weil
  // Name + Datum + Distanz nicht eindeutig sind (der
  // "Königsforst-Marathon" steht mit 42,2 km zweimal in den Daten, für
  // Bensberg und für Bergisch Gladbach).
  function icsSlug(text) {
    return (text || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/ß/g, 'ss')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 48)
      .replace(/^-+|-+$/g, '');
  }

  function icsMasszahl(e) {
    if (e.laenge_km != null) {
      return `${(Math.round(Number(e.laenge_km) * 10) / 10)}km`.replace('.', '-');
    }
    if (e.dauer_h != null) {
      return `${(Math.round(Number(e.dauer_h) * 10) / 10)}h`.replace('.', '-');
    }
    return 'x';
  }

  function icsFileName(e) {
    const teile = [e.datum_start || 'ohne-datum', icsSlug(e.name), icsMasszahl(e)];
    const ort = icsSlug(e.standort);
    if (ort) teile.push(ort);
    return teile.join('-') + '.ics';
  }

  // ---------- Fehler melden ----------
  // Reihenfolge = Reihenfolge im Drop-down. Die Schluessel landen
  // unveraendert in Firestore (Feld "kategorie") und werden von
  // scripts/review_reports.py wieder erkannt - also nicht umbenennen,
  // ohne dort nachzuziehen.
  const REPORT_CATEGORIES = [
    'laenge', 'datum', 'ort', 'url', 'sportart', 'name', 'doppelt', 'abgesagt', 'sonstiges'
  ];
  const REPORT_DESC_MAX = 600;
  const REPORT_DESC_MIN = 10;

  const reportOverlay = document.getElementById('report-overlay');
  const reportDialogEl = reportOverlay.querySelector('.ee-modal');
  const reportBodyEl = document.getElementById('report-body');

  document.getElementById('report-close').addEventListener('click', closeReportModal);
  reportOverlay.addEventListener('click', (evt) => {
    if (evt.target === reportOverlay) closeReportModal();
  });
  document.addEventListener('keydown', (evt) => {
    if (evt.key === 'Escape' && !reportOverlay.hidden) closeReportModal();
  });
  // Escape und die Fokusfessel kommen aus auth.js (dialogTasten) - der
  // Anmelde-Dialog dort braucht genau dasselbe, und zwei Kopien laufen
  // auseinander.
  //
  // Erst beim ersten Öffnen eingehängt, nicht hier: auth.js trägt
  // `defer`, dieses Inline-Skript läuft davor - window.EndauranceAuth
  // gibt es an dieser Stelle noch nicht (dieselbe Reihenfolge wie bei
  // EE_AUTH_QUEUE). Ohne auth.js bleibt es beim Escape-Listener oben.
  let reportFesselGesetzt = false;

  function setzeReportFessel() {
    if (reportFesselGesetzt) return;
    if (!window.EndauranceAuth || !window.EndauranceAuth.dialogTasten) return;
    window.EndauranceAuth.dialogTasten(reportOverlay, closeReportModal);
    reportFesselGesetzt = true;
  }

  // Wohin der Fokus zurückgeht: auf "Fehler zu diesem Event melden".
  let reportFokusVorher = null;

  function closeReportModal() {
    reportOverlay.hidden = true;
    reportBodyEl.innerHTML = '';
    if (reportFokusVorher && reportFokusVorher.isConnected) {
      try { reportFokusVorher.focus(); } catch (e) { /* ignorieren */ }
    }
    reportFokusVorher = null;
  }

  function openReportModal(e) {
    // Das Firestore-SDK haengt nicht mehr im HTML (344 KB fuer jeden
    // Seitenaufruf); auth.js laedt es nach. Hier schon anstossen, damit
    // beim Abschicken nichts mehr zu warten ist.
    if (window.EndauranceAuth && window.EndauranceAuth.prepareFirestore) {
      window.EndauranceAuth.prepareFirestore();
    }
    setzeReportFessel();
    reportFokusVorher = document.activeElement;
    const kmText = formatLength(e);
    const wb = displayWettbewerb(e);
    reportBodyEl.innerHTML = `
      <h2 id="report-heading">${escapeHtml(t('report_title'))}</h2>
      <div class="report-event-summary">
        <strong>${escapeHtml(e.name)}</strong>
        <span>${escapeHtml(formatRange(e.datum_start, e.datum_ende))} &middot; ${escapeHtml(e.standort)} &middot; ${escapeHtml(kmText)}${wb ? ' &middot; ' + escapeHtml(wb) : ''}</span>
      </div>
      <p class="report-intro">${escapeHtml(t('report_intro'))}</p>
      <div id="report-msg"></div>
      <form id="report-form">
        <div class="ee-field">
          <label for="report-kategorie">${escapeHtml(t('report_field_label'))}</label>
          <select id="report-kategorie" autocomplete="off">
            <!-- Leere Vorauswahl: es soll bewusst nichts vorbelegt sein,
                 sonst wandert eine unbeabsichtigte Kategorie in die
                 Meldung. Die Pflicht-Pruefung sitzt im submit-Handler. -->
            <option value="" selected>${escapeHtml(t('report_field_placeholder'))}</option>
            ${REPORT_CATEGORIES.map(k => `<option value="${k}">${escapeHtml(t('report_cat_' + k))}</option>`).join('')}
          </select>
        </div>
        <div class="ee-field">
          <label for="report-desc">${escapeHtml(t('report_desc_label'))}</label>
          <textarea id="report-desc" maxlength="${REPORT_DESC_MAX}" placeholder="${escapeHtml(t('report_desc_placeholder'))}"></textarea>
          <div class="report-counter" id="report-counter">0 / ${REPORT_DESC_MAX}</div>
        </div>
        <button type="submit" class="ee-submit-btn" id="report-submit">${escapeHtml(t('report_send'))}</button>
      </form>
    `;
    reportOverlay.hidden = false;

    // Bewusst ohne required-Attribute: die Browser-Blase ist nicht
    // uebersetzt und passt optisch nicht zum Dialog - validiert wird
    // unten im submit-Handler mit den eigenen i18n-Texten.
    const form = reportBodyEl.querySelector('#report-form');
    const selectEl = reportBodyEl.querySelector('#report-kategorie');
    const descEl = reportBodyEl.querySelector('#report-desc');
    const counterEl = reportBodyEl.querySelector('#report-counter');
    const msgEl = reportBodyEl.querySelector('#report-msg');
    const submitEl = reportBodyEl.querySelector('#report-submit');

    descEl.addEventListener('input', () => {
      counterEl.textContent = `${descEl.value.length} / ${REPORT_DESC_MAX}`;
    });
    // Bewusst KEIN focus() auf das Drop-down: ein fokussiertes <select>
    // klappt in mehreren Browsern sofort auf, und der Dialog begruesst
    // einen dann mit einer offenen Liste. Stattdessen den Dialog selbst
    // fokussieren - damit liegt der Tastaturfokus im Dialog, die Auswahl
    // bleibt aber leer und zu, bis jemand sie anfasst.
    reportDialogEl.focus({ preventScroll: true });

    function setMsg(text, kind) {
      msgEl.innerHTML = text ? `<div class="ee-form-msg ${kind}">${escapeHtml(text)}</div>` : '';
    }

    form.addEventListener('submit', (evt) => {
      evt.preventDefault();
      const kategorie = selectEl.value;
      const beschreibung = descEl.value.trim();
      if (!kategorie) { setMsg(t('report_err_field'), 'error'); return; }
      if (beschreibung.length < REPORT_DESC_MIN) { setMsg(t('report_err_desc'), 'error'); descEl.focus(); return; }
      setMsg(null);
      submitEl.disabled = true;
      submitEl.textContent = t('report_sending');
      window.EndauranceAuth.reportEventError({ event: e, kategorie, beschreibung })
        .then(() => {
          setMsg(t('report_thanks'), 'success');
          // Formular nach dem Absenden entfernen, damit dieselbe Meldung
          // nicht versehentlich zweimal abgeschickt wird.
          form.querySelectorAll('.ee-field').forEach(el => el.remove());
          submitEl.remove();
          window.setTimeout(() => { if (!reportOverlay.hidden) closeReportModal(); }, 2500);
        })
        .catch((err) => {
          submitEl.disabled = false;
          submitEl.textContent = t('report_send');
          setMsg(reportErrorMessage(err), 'error');
        });
    });
  }

  // Firebase-Fehlercodes in verstaendliche Saetze uebersetzen. Der Fall
  // "auth/operation-not-allowed" bzw. "auth/admin-restricted-operation"
  // heisst konkret: der Anbieter "Anonym" ist in der Firebase-Konsole
  // noch nicht aktiviert (Authentication -> Sign-in method).
  function reportErrorMessage(err) {
    const code = (err && (err.code || err.message)) || '';
    if (code === 'not-configured') return t('report_err_config');
    if (code === 'auth/operation-not-allowed' || code === 'auth/admin-restricted-operation') {
      return t('report_err_anon');
    }
    return t('report_err_save');
  }

  function renderChips() {
    // Welche Chips es gibt und was ihr ✕ entfernt, entscheidet
    // filters.js (buildChips) - die Karte zeigt dieselben Chips.
    const chips = EF.buildChips(state, {
      t,
      tv,
      lang: currentLang,
      dayCount: uniqueSorted(events.map(e => e.datum_start)).length,
      // Wie viele Werte ein Mengen-Filter überhaupt hat (für "Land: Alle"
      // statt drei Einzel-Chips) - fragt dieselbe Stelle, die auch die
      // Häkchenliste im Panel füllt.
      optionCount: stateKey => ui.options(stateKey).length,
      // Der Umkreis-Chip nimmt den Ausgangspunkt mit - in der Liste
      // verschwindet dabei auch die Entfernungs-Spalte (setOrigin).
      setOrigin: (_state, origin) => setOrigin(origin)
    });

    chipsEl.innerHTML = '';
    chips.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(c.label)} <button aria-label="✕">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        c.clear();
        selectedIndex = null;
        render();
      });
      chipsEl.appendChild(chip);
    });
  }

  function resetFilters() {
    EF.clearFilters(state);
    state.sortKey = 'datum';
    state.sortDir = 'asc';
    ui.resetTransient();
    selectedIndex = null;
    ui.close();
    buildHeader();
    render();
  }
})();
</script>
</body>
</html>
