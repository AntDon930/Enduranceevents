<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Ausdauersport-Events D/A/CH</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e0e3e8;
    --text: #1c1f24;
    --text-muted: #6b7280;
    --accent: #14509a;
    --accent-bg: #eaf1ff;
    --row-alt: #f8fafc;
    --row-hover: #eef4ff;
    --hero-gradient: linear-gradient(135deg, #0b2e6b 0%, #14509a 55%, #1d8fa8 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1d2025;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-muted: #9aa1ac;
      --accent: #5b9dff;
      --accent-bg: #1e2a40;
      --row-alt: #202329;
      --row-hover: #22314a;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    text-decoration: none;
  }
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    background: var(--hero-gradient);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: #fff;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 0.85rem;
    margin: 0;
  }
  .top-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    /* Darf schrumpfen und umbrechen: auf 390 px ragte die Knopfreihe
       vorher 10 px über den blauen Kasten hinaus, DE/EN war angeschnitten. */
    min-width: 0;
    max-width: 100%;
    margin-top: 2px;
  }
  .top-actions-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 100%;
  }
  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.92);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
  }
  .share-btn:hover { background: rgba(255,255,255,0.24); color: #fff; }
  .share-btn svg { flex-shrink: 0; }

  /* Kurz aufpoppende Rückmeldung, mittig unten. pointer-events: none,
     damit sie nie einen Klick abfängt. */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translate(-50%, 12px);
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.28);
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 3000;
    pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }
  .toast[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
  }
  .home-btn:hover, .map-btn:hover { background: rgba(255,255,255,0.26); }
  .map-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .lang-btn {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .lang-btn.active {
    background: #fff;
    color: #14315e;
    border-color: #fff;
  }

  /* Dasselbe Raster wie .layout, damit der rechte Rand der ersten Spalte
     exakt auf dem rechten Tabellenrand liegt. Die zweite Spalte bleibt
     leer und hält nur die Breite des Detailbereichs frei - so sitzt der
     Zurücksetzen-Button über der LISTE und nicht über den Details. */
  .toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px;
    margin-bottom: 10px;
  }
  @media (max-width: 900px) {
    .toolbar { grid-template-columns: 1fr; }
  }
  .toolbar-main {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  /* Schiebt den Button an das rechte Ende der Tabellenspalte. */
  .toolbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .group-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
  }
  /* Zusammengefasste Zeile: der Name trägt einen Aufklapp-Pfeil, die
     Längen stehen als kleine Marken nebeneinander. */
  .group-row { cursor: pointer; font-weight: 600; }
  .group-row:hover { background: var(--row-hover); }
  .group-name { display: flex; align-items: center; gap: 6px; }
  .group-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Rundes Feld mit Pfeil, dreht sich beim Aufklappen um 90°. */
  .chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    transition: transform 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .group-row:hover .chevron { color: var(--accent); border-color: var(--accent); }
  .chevron.open { transform: rotate(90deg); color: var(--accent); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }
  /* Anzahl der zusammengefassten Strecken. Auch die 1 wird angezeigt -
     sonst sieht eine einzelne Strecke nach einem fehlenden Wert aus.
     Bewusst ohne Kapsel/Rahmen: als Kapsel war die Zahl breiter als die
     ganze Spalte jetzt ist. */
  /* Die Zahl der zusammengefassten Strecken steht schlicht in der
     Tabelle, am linken Rand der ersten Spalte. Eine Variante, in der sie
     als Kapsel halb über der Rahmenlinie lag, war ausprobiert und wieder
     verworfen - sie wirkte wie ein aufgeklebtes Etikett. */
  .count-pill {
    display: inline-block;
    font-size: 0.76rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    text-align: left;
  }
  .group-row:hover .count-pill { color: var(--text); }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 5px;
    font-size: 0.7rem;
    font-weight: normal;
    white-space: nowrap;
  }
  .badges { row-gap: 3px; }
  tbody tr.sub-row { font-size: 0.82rem; }
  tbody tr.sub-row .col-name { padding-left: 22px; }
  tbody tr.sub-row .col-anzahl { color: var(--text-muted); }
  .result-count { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
  .reset-btn {
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(20,80,154,0.25);
  }
  .reset-btn:hover { opacity: 0.9; }
  .active-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.75rem;
    text-decoration: none;
  }
  .chip button {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0;
  }

  .notify-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-size: 0.86rem;
  }
  .notify-box[hidden] { display: none; }
  .notify-box p { margin: 0; flex: 1; min-width: 200px; color: var(--text); }
  .notify-box button {
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .notify-box button:hover { opacity: 0.9; }
  .notify-box .notify-status { font-size: 0.8rem; color: var(--text-muted); }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
    position: sticky;
    top: 16px;
  }
  .side-panel .detail-panel { width: 100%; }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
    max-height: 78vh;
    overflow-y: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 800px;
    table-layout: fixed;
    font-size: 0.86rem;
  }
  /* Spaltenreihenfolge: 1 Name, 2 Datum, 3 Land, 4 Standort, 5 Sportart,
     6 Kategorie, 7 Länge. Name breiter, Länge schmaler (die Einheit "km"
     steht ohnehin schon in jeder Zelle). Die Anmeldung-Spalte (Offen/
     Geschlossen) wurde entfernt: der Anmeldeschluss lässt sich bei den
     meisten Quellen nicht zuverlässig auslesen und fehlt daher fast
     überall - keine gute Datenbasis für einen Filter/eine Spalte. */
  /* Spaltenbreiten über KLASSEN, nicht über nth-child: die Spalten
     wechseln je nach Zustand (Entfernung nur mit Ausgangspunkt, Anzahl
     nur beim Zusammenfassen), und mit nth-child bräuchte jede Kombination
     ihren eigenen Satz Regeln. Die Summe muss nicht genau 100 % sein -
     table-layout: fixed verteilt proportional. */
  /* Die Zusammenfassung soll so wenig Platz wie möglich kosten: die
     Anzahl steht als kleine Zahl ganz links am Tabellenrand, gleich
     danach kommt der Name. Feste Pixelbreite statt Prozent - die Zahl
     ist ein- bis zweistellig, ein Anteil an der Tabellenbreite wäre
     immer zu breit. */
  .col-anzahl { width: 28px; text-align: left; }
  thead th.col-anzahl .th-inner { padding-left: 8px; padding-right: 0; }
  tbody td.col-anzahl { padding-left: 8px; padding-right: 0; }
  .col-name { width: 22%; }
  .col-datum { width: 13%; }
  .col-land { width: 11%; }
  .col-standort { width: 14%; }
  .col-entfernung { width: 11%; }
  .col-art1 { width: 11%; }
  .col-art2 { width: 13%; }
  .col-laenge_km { width: 11%; }
  table.with-distance { min-width: 900px; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 2;
    border-bottom: 1px solid var(--border);
    text-align: left;
    padding: 0;
    font-weight: 600;
  }
  .th-inner {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .th-inner span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Der Spaltenname ist ein Knopf (Sortierung), soll aber wie eine
     Kopfzeile aussehen - deshalb ohne Rahmen und Hintergrund. */
  .th-sort {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .th-sort:hover { color: var(--accent); }
  .th-sort.active { color: var(--accent); }
  .sort-arrow { font-size: 0.7em; flex-shrink: 0; }

  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    text-align: left;
    color: var(--text);
    text-decoration: none;
    font-weight: normal;
  }
  .cell-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
  }
  /* Bezeichnung des konkreten Wettbewerbs unter dem Veranstaltungsnamen.
     Eine Veranstaltung mit mehreren Strecken steht mit je einer Zeile pro
     Strecke in der Liste - ohne diese Zeile wären die Zeilen bis auf die
     Längenangabe identisch. */
  .wettbewerb {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.active { background: var(--accent-bg); }
  .empty-row td {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
  }

  /* Excel-style column filter button + floating panel */
  .col-filter-btn {
    list-style: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    background: transparent;
    user-select: none;
    flex-shrink: 0;
  }
  .col-filter-btn.open,
  .col-filter-btn.has-filter {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .filter-panel {
    position: fixed;
    z-index: 100;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    padding: 10px;
    min-width: 220px;
    max-width: 280px;
    font-weight: normal;
    white-space: normal;
    font-size: 0.86rem;
  }
  .filter-panel[hidden] { display: none; }
  .filter-panel .fp-actions {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    margin-bottom: 6px;
  }
  .filter-panel .fp-actions a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }
  .filter-list {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-list label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: normal;
    cursor: pointer;
  }
  .filter-panel .fp-empty {
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .filter-panel .range-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .filter-panel .range-row label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .filter-panel input[type="date"],
  .filter-panel input[type="number"],
  .filter-panel input[type="text"] {
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.82rem;
    width: 100%;
  }
  .radius-section .radius-title {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  /* Umkreis-Regler: 1-200 km */
  .radius-slider-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 8px;
  }
  .radius-slider-row .radius-value {
    font-size: 0.78rem;
    color: var(--text);
  }
  .radius-slider-row input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    margin: 0;
  }
  .radius-slider-row.disabled .radius-value { color: var(--text-muted); }
  .radius-scale {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--text-muted);
  }
  /* Ortssuche (places.json): Eingabefeld + Trefferliste */
  .place-search { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .place-results {
    max-height: 190px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 4px;
  }
  .place-result {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    padding: 4px 6px;
    font-size: 0.82rem;
    line-height: 1.25;
  }
  .place-result:hover,
  .place-result:focus { background: var(--accent-bg); border-color: var(--accent); }
  .place-result .place-meta {
    display: block;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .place-note {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .origin-clear {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.72rem;
    padding: 0;
    margin-bottom: 6px;
  }
  .geo-btn {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 0.78rem;
    margin-bottom: 6px;
  }
  .geo-btn:hover { background: var(--accent-bg); }
  .radius-status {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    min-height: 1.1em;
  }
  .geo-help {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin: 0 0 6px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    line-height: 1.35;
  }
  .geo-help ol {
    margin: 0 0 4px;
    padding-left: 1.1em;
  }
  .geo-help li { margin-bottom: 3px; }
  .geo-help .geo-help-fallback { display: block; margin-top: 4px; }
  .filter-panel select {
    width: 100%;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.82rem;
    margin-bottom: 6px;
  }

  /* Länge-Filter: Sportart-Tabs + Distanzkategorien */
  .distance-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }
  .distance-tab {
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 0.75rem;
    cursor: pointer;
  }
  .distance-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .distance-categories {
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* Datum-Baum (Jahr > Monat > Tag) */
  .date-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .date-preset {
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
  }
  .date-preset:hover { background: var(--row-hover); }
  .date-preset.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .date-tree {
    max-height: 240px;
    overflow-y: auto;
  }
  .tree-node { margin-bottom: 2px; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tree-toggle {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.7rem;
    width: 14px;
    flex-shrink: 0;
    padding: 0;
  }
  .tree-spacer {
    width: 14px;
    flex-shrink: 0;
    display: inline-block;
  }
  .tree-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: normal;
    cursor: pointer;
  }
  .tree-children { margin-left: 18px; }

  .detail-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
  }
  .detail-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 24px 8px;
    font-size: 0.9rem;
  }
  .detail-panel h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .detail-panel .sub { color: var(--text-muted); margin-bottom: 16px; font-size: 0.88rem; }
  .detail-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 9px;
    column-gap: 14px;
    font-size: 0.88rem;
  }
  .detail-grid dt { color: var(--text-muted); font-weight: 500; }
  .detail-grid dd { margin: 0; font-weight: normal; }
  .detail-link {
    display: inline-block;
    margin-top: 20px;
    padding: 9px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.88rem;
  }
  .detail-link:hover { opacity: 0.9; }

  /* "Zum Kalender hinzufügen" steht zwischen dem Veranstalter-Link und
     dem Melde-Knopf und sieht wie eine dritte, gleichwertige Schaltfläche
     aus - nur ohne Akzentfarbe, damit der Link zur offiziellen Seite die
     Hauptaktion bleibt. */
  .cal-box { position: relative; margin-top: 12px; }
  .cal-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .cal-btn:hover { background: var(--row-hover); border-color: var(--accent); color: var(--accent); }
  .cal-btn svg { flex-shrink: 0; }
  .cal-menu {
    margin-top: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .cal-menu[hidden] { display: none; }
  .cal-menu a,
  .cal-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--text);
    text-decoration: none;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .cal-menu a:hover,
  .cal-menu button:hover { background: var(--row-hover); color: var(--accent); }
  .cal-note {
    padding: 8px 12px;
    font-size: 0.76rem;
    color: var(--text-muted);
    background: var(--bg);
  }

  /* "Fehler zu diesem Event melden" - bewusst als unauffaelliger
     Sekundaer-Button unter dem Veranstalter-Link: er soll auffindbar
     sein, aber nicht mit dem Link zur offiziellen Seite konkurrieren. */
  .report-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 8px 12px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
  }
  .report-btn:hover { background: var(--row-hover); color: var(--text); }

  /* Das Melde-Formular nutzt die Modal-Styles aus auth.js
     (.ee-modal-overlay, .ee-modal, .ee-field, .ee-submit-btn,
     .ee-form-msg) - hier nur die Ergaenzungen fuer Select/Textarea
     und die Event-Zusammenfassung im Dialog. */
  .report-event-summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 0.85rem;
  }
  .report-event-summary strong { display: block; margin-bottom: 2px; }
  .report-event-summary span { color: var(--text-muted); }
  .report-intro { margin: 0 0 14px; font-size: 0.86rem; color: var(--text-muted); }
  .ee-field select,
  .ee-field textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
  }
  .ee-field textarea { resize: vertical; min-height: 90px; }
  .report-counter { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 4px; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1 id="page-title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="top-actions">
    <div class="top-actions-row">
      <a class="home-btn" href="index.html" id="home-btn"><span id="home-btn-label"></span></a>
      <a class="map-btn" href="karte.html" id="map-btn"><span id="map-btn-label"></span></a>
      <div id="auth-mount"></div>
      <div class="lang-switch" id="lang-switch">
        <button type="button" class="lang-btn" data-lang="de">DE</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
    <!-- Teilen-Knopf unter DE/EN: Er gehört zur Seite als Ganzem (die
         aktuelle Suche), nicht zur Tabelle - in der Werkzeugleiste stand
         er zwischen Filter-Chips und Zurücksetzen und ging dort unter. -->
    <button type="button" class="share-btn" id="share-btn">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/>
        <path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>
      </svg>
      <span id="share-btn-label"></span>
    </button>
  </div>
</div>

<!-- Kurze Rückmeldung nach dem Kopieren. Bewusst ein eigenes, kleines
     Fenster statt einer Textänderung am Knopf: man sieht es auch, wenn
     der Blick gerade auf der Liste liegt. -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="toolbar">
  <div class="toolbar-main">
    <div class="result-count" id="result-count"></div>
    <div class="active-chips" id="active-chips"></div>
    <div class="toolbar-actions">
      <label class="group-toggle"><input type="checkbox" id="group-toggle"><span id="group-toggle-label"></span></label>
      <button class="reset-btn" id="reset-btn"></button>
    </div>
  </div>
</div>

<div class="notify-box" id="notify-box" hidden></div>

<div class="layout">
  <div class="table-wrap">
    <table id="event-table">
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="event-body"></tbody>
    </table>
  </div>
  <div class="side-panel">
    <div class="detail-panel" id="detail-panel"></div>
  </div>
</div>

<!-- Melde-Dialog fuer falsche Event-Daten. Nutzt die Modal-Optik aus
     auth.js; gespeichert wird via EndauranceAuth.reportEventError() in
     der Firestore-Collection "errorReports" (anonyme Anmeldung, damit
     die Security Rules request.auth verlangen koennen). -->
<div class="ee-modal-overlay" id="report-overlay" hidden>
  <div class="ee-modal" role="dialog" aria-modal="true" aria-labelledby="report-heading" tabindex="-1">
    <button type="button" class="ee-modal-close" id="report-close" aria-label="Schliessen">&#10005;</button>
    <div id="report-body"></div>
  </div>
</div>

<!-- Login/Registrierung (Google + E-Mail/Passwort), siehe auth.js und
     firebase-config.js. Ohne ausgefüllte Firebase-Config zeigt der
     "Anmelden"-Button einen Hinweis statt kaputter Funktionalität. -->

      'Österreich': { de: 'Österreich', en: 'Austria' },
      'Schweiz': { de: 'Schweiz', en: 'Switzerland' }
    },
    art1: {
      'Laufen': { de: 'Laufen', en: 'Running' },
      'Schwimmen': { de: 'Schwimmen', en: 'Swimming' },
      'Fahrrad': { de: 'Fahrrad', en: 'Cycling' },
      'Triathlon': { de: 'Triathlon', en: 'Triathlon' }
    },
    art2: {
      'Straße': { de: 'Straße', en: 'Road' },
      'Trail': { de: 'Trail', en: 'Trail' },
      'Bahn': { de: 'Bahn', en: 'Track' },
      'Berg': { de: 'Berg', en: 'Mountain' },
      'Cross': { de: 'Cross', en: 'Cross Country' },
      'Hindernis': { de: 'Hindernis', en: 'Obstacle' },
      // Englischer Fachbegriff, in beiden Sprachen gleich: abseits
      // ausgebauter Wege, oft ohne Verpflegung und teils zeitlich
      // begrenzt statt über eine feste Strecke.
      'Backcountry Ultra': { de: 'Backcountry Ultra', en: 'Backcountry Ultra' },
      'Freiwasser': { de: 'Freiwasser', en: 'Open Water' },
      'Becken': { de: 'Becken', en: 'Pool' },
      'Zeitfahren': { de: 'Zeitfahren', en: 'Time Trial' },
      'Mountainbike': { de: 'Mountainbike', en: 'Mountain Bike' },
      'Gravel': { de: 'Gravel', en: 'Gravel' },
      'Cyclecross': { de: 'Cyclecross', en: 'Cyclocross' }
    }
  };

  // ISO-Ländercode -> der Landname, wie er in events.json steht
  // (places.json speichert DE/AT/CH, die Anzeige übersetzt tv('land', …)).
  const LAND_BY_CODE = { DE: 'Deutschland', AT: 'Österreich', CH: 'Schweiz' };

  const MONTH_NAMES = {
    de: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'],
    en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
  };

  let currentLang = 'de';
  try {
    const saved = localStorage.getItem('endurance-lang');
    if (saved === 'de' || saved === 'en') currentLang = saved;
  } catch (e) { /* localStorage evtl. nicht verfügbar */ }

  function t(key, ...args) {
    const entry = I18N[currentLang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  }

  function tv(field, value) {
    if (value == null) return value;
    const entry = VALUE_TRANSLATIONS[field] && VALUE_TRANSLATIONS[field][value];
    return entry ? entry[currentLang] : value;
  }

  // ---------- Distanzkategorien (nach Sportart) ----------

  // "Rundet nach oben": z. B. ein 4-km-Lauf erscheint unter der 5-km-Kategorie.
  // Halbmarathon/Marathon sind nur die offiziellen Distanzen (mit kleiner Toleranz
  // für Rundungsunterschiede in den Daten), Ultramarathon ist alles darüber.
  const DISTANCE_CATEGORIES = {
    'Laufen': [
      { key: '5k', test: km => km > 0 && km <= 5 },
      { key: '10k', test: km => km > 5 && km <= 10 },
      { key: 'half', test: km => Math.abs(km - 21.0975) <= 0.5 },
      { key: 'marathon', test: km => Math.abs(km - 42.195) <= 0.5 },
      { key: 'ultra', test: km => km > 42.195 + 0.5 },
      // Zeitlich begrenzte Rennen haben keine Distanz, auf die sich ein
      // Test anwenden ließe - `zeit: true` trifft jedes Event mit
      // gesetztem dauer_h (siehe matchesDistanceCategory).
      { key: 'zeit', zeit: true }
    ],
    'Fahrrad': [
      { key: 'r50', test: km => km > 0 && km <= 50 },
      { key: 'r100', test: km => km > 50 && km <= 100 },
      { key: 'r150', test: km => km > 100 && km <= 150 },
      { key: 'r200', test: km => km > 150 && km <= 200 },
      { key: 'rultra', test: km => km > 200 },
      { key: 'zeit', zeit: true }
    ],
    'Schwimmen': [
      { key: 's1', test: km => km > 0 && km <= 1 },
      { key: 's2', test: km => km > 1 && km <= 2 },
      { key: 's3', test: km => km > 2 && km <= 3 },
      { key: 's5', test: km => km > 3 && km <= 5 },
      { key: 's10', test: km => km > 5 },
      { key: 'zeit', zeit: true }
    ],
    'Triathlon': [
      { key: 'sprint', test: km => km > 0 && km < 40 },
      { key: 'olympic', test: km => Math.abs(km - 51.5) <= 3 },
      { key: 'middle', test: km => Math.abs(km - 113) <= 5 },
      { key: 'long', test: km => Math.abs(km - 226) <= 8 },
      { key: 'zeit', zeit: true }
    ]
  };

  const DISTANCE_CATEGORY_LABELS = {
    de: {
      '5k': '5 km', '10k': '10 km', 'half': 'Halbmarathon', 'marathon': 'Marathon', 'ultra': 'Ultramarathon',
      'r50': 'bis 50 km', 'r100': '50–100 km', 'r150': '100–150 km', 'r200': '150–200 km', 'rultra': '200+ km',
      's1': '1 km', 's2': '2 km', 's3': '3 km', 's5': '5 km', 's10': '10+ km (Marathonschwimmen)',
      'sprint': 'Sprintdistanz', 'olympic': 'Olympische Distanz (51.5 km)',
      'middle': 'Mitteldistanz / 70.3 (113 km)', 'long': 'Langdistanz / Ironman (226 km)',
      'zeit': 'Zeitrennen (6 h, 12 h, 24 h …)'
    },
    en: {
      '5k': '5 km', '10k': '10 km', 'half': 'Half Marathon', 'marathon': 'Marathon', 'ultra': 'Ultramarathon',
      'r50': 'up to 50 km', 'r100': '50–100 km', 'r150': '100–150 km', 'r200': '150–200 km', 'rultra': '200+ km',
      's1': '1 km', 's2': '2 km', 's3': '3 km', 's5': '5 km', 's10': '10+ km (marathon swim)',
      'sprint': 'Sprint Distance', 'olympic': 'Olympic Distance (51.5 km)',
      'middle': 'Middle Distance / 70.3 (113 km)', 'long': 'Long Distance / Ironman (226 km)',
      'zeit': 'Timed race (6 h, 12 h, 24 h …)'
    }
  };

  let activeDistanceSportTab = 'Laufen';

  function matchesDistanceCategory(e) {
    if (state.distanceCategories.size === 0) return true;
    for (const compositeKey of state.distanceCategories) {
      const sep = compositeKey.indexOf(':');
      const sport = compositeKey.slice(0, sep);
      const catKey = compositeKey.slice(sep + 1);
      if (e.art1 !== sport) continue;
      const cat = (DISTANCE_CATEGORIES[sport] || []).find(c => c.key === catKey);
      if (!cat) continue;
      // Zeitrennen: die Dauer entscheidet, nicht die (fehlende) Distanz.
      if (cat.zeit) {
        if (e.dauer_h != null) return true;
        continue;
      }
      if (e.laenge_km == null) continue;
      if (cat.test(e.laenge_km)) return true;
    }
    return false;
  }

  // Grenzen des Umkreis-Reglers. Früher gab es vier feste Stufen
  // (0-5, 5-20, 20-50, 50+ km) - ein Regler trifft genauer, was jemand
  // sucht ("alles im Umkreis von 40 km"), und braucht weniger Platz.
  const RADIUS_MIN_KM = 1;
  const RADIUS_MAX_KM = 200;
  // Voreinstellung, sobald ein Ausgangspunkt feststeht: ohne Umkreis
  // hätte der Ausgangspunkt gar keine Wirkung.
  const RADIUS_DEFAULT_KM = 25;

  // Reihenfolge der Spalten: Name, Datum, Land, Standort, Sportart, Kategorie, Länge
  // Keine Anmeldung-Spalte/-Filter mehr: der Anmeldeschluss lässt sich bei
  // den meisten gescrapten Quellen nicht zuverlässig auslesen (fehlt fast
  // überall) - keine gute Datenbasis, siehe Docstrings der Scraper-Skripte.
  // Kanonische Distanz-Bezeichnungen und ihre Länge in km. Steht so ein
  // Wort allein im Wettbewerbs-Feld und passt zur Länge, sagt es nichts
  // Neues (siehe displayWettbewerb).
  const CANONICAL_RACE_NAMES = {
    'marathon': 42.2,
    'halbmarathon': 21.1,
    'half marathon': 21.1,
    'halbmarathon (hm)': 21.1
  };

  // Die Wettbewerbs-Bezeichnung, ODER null wenn sie nur die Länge
  // wiederholt.
  //
  // Die Quellen benennen einen Wettbewerb oft schlicht mit seiner Distanz
  // ("50 km", "6 km") oder mit deren kanonischem Namen ("Halbmarathon").
  // Beides steht schon in der Längen-Spalte; im Detailbereich erschien es
  // dadurch zweimal ("Race 50 km" über "Length 50 km"), in der Liste als
  // Unterzeile unter dem Namen. Bei gerundeten Quellenangaben sah es sogar
  // nach einem Widerspruch aus: Unterzeile "6 km" über der Spalte "5.5 km".
  //
  // Bezeichnungen mit eigener Aussage bleiben: "Laufen", "Wandern",
  // "Moslig 8000", "5×5 km Staffel", "26 km Trail". Das Feld selbst bleibt
  // in events.json erhalten - die Duplikat-Erkennung der Scraper braucht
  // es (über "Halbmarathon" wurde der doppelte München-Halbmarathon
  // gefunden).
  function displayWettbewerb(e) {
    const label = (e.wettbewerb || '').trim();
    if (!label) return null;
    const km = e.laenge_km;

    // Kanonischer Name, der genau die gespeicherte Länge bezeichnet?
    const canonical = CANONICAL_RACE_NAMES[label.toLowerCase()];
    if (canonical != null && km != null && Math.abs(canonical - Number(km)) <= 0.5) return null;

    // Bleibt nach Abzug der Distanzangaben und Füllwörter noch etwas übrig?
    const rest = label
      .replace(/\d{1,3}(?:[.,]\d+)?\s*(?:km|kilometer)\b/gi, ' ')
      .replace(/\b(?:ca|circa|etwa|rund|ungefähr|approx|ungefaehr)\b\.?/gi, ' ')
      .replace(/[\s.,;:\-–|~()]+/g, '')
      .trim();
    return rest ? label : null;
  }

  const COLUMNS = [
    { key: 'name', labelKey: 'col_name', type: 'text' },
    { key: 'datum', labelKey: 'col_datum', type: 'date-tree' },
    { key: 'land', labelKey: 'col_land', type: 'checkbox', options: () => uniqueSorted(events.map(e => e.land)) },
    { key: 'standort', labelKey: 'col_standort', type: 'standort' },
    { key: 'art1', labelKey: 'col_sportart', type: 'checkbox', options: () => uniqueSorted(events.map(e => e.art1)) },
    { key: 'art2', labelKey: 'col_kategorie', type: 'checkbox', options: () => availableArt2Options() },
    { key: 'laenge_km', labelKey: 'col_laenge', type: 'number-range' }
  ];

  // Sortierschlüssel pro Spalte. Jede Funktion gibt [Gruppe, Wert] zurück:
  // die Gruppe sortiert Einträge ohne verwertbare Angabe ans Ende, egal in
  // welche Richtung sortiert wird (eine Zeile ohne Distanz soll nicht bei
  // "aufsteigend" ganz oben stehen).
  const SORT_KEYS = {
    name: e => [0, `${e.name || ''} ${e.wettbewerb || ''}`.toLowerCase()],
    datum: e => [0, e.datum_start || ''],
    land: e => [0, tv('land', e.land).toLowerCase()],
    standort: e => [0, (e.standort || '').toLowerCase()],
    art1: e => [0, tv('art1', e.art1).toLowerCase()],
    art2: e => [0, e.art2 ? tv('art2', e.art2).toLowerCase() : ''],
    // Drei Stufen: bekannte Distanz, dann Zeitrennen (nach Dauer), dann
    // Einträge ohne beides. Km und Stunden sind nicht vergleichbar - sie
    // in eine Zahlenreihe zu mischen würde eine Ordnung behaupten, die es
    // nicht gibt.
    laenge_km: e => e.laenge_km != null ? [0, e.laenge_km]
                  : e.dauer_h != null ? [1, e.dauer_h] : [2, 0],
    entfernung: e => {
      const d = distanceFromOrigin(e);
      return d == null ? [1, 0] : [0, d];
    }
  };

  // Die Entfernungs-Spalte gibt es nur mit Ausgangspunkt - ohne einen
  // wäre sie eine Spalte voller Striche. Sie steht direkt hinter
  // Stadt/Ort, weil sie dieselbe Frage beantwortet ("wie weit weg?").
  const DISTANCE_COLUMN = { key: 'entfernung', labelKey: 'col_entfernung', type: 'none' };

  // Beim Zusammenfassen steht ganz vorn, aus wie vielen Zeilen eine
  // Veranstaltung besteht - eine einzelne Strecke zeigt "1". Die Spalte
  // ist nicht sortierbar (SORT_KEYS kennt sie nicht): sortiert werden
  // einzelne Strecken, die Gruppen entstehen erst danach.
  const COUNT_COLUMN = { key: 'anzahl', labelKey: 'col_anzahl', short: '#', type: 'none' };

  function activeColumns() {
    const cols = COLUMNS.slice();
    if (state.origin) cols.splice(4, 0, DISTANCE_COLUMN);
    if (state.gruppiert) cols.unshift(COUNT_COLUMN);
    return cols;
  }

  function distanceFromOrigin(e) {
    if (!state.origin || e.lat == null || e.lon == null) return null;
    return haversineKm(state.origin.lat, state.origin.lon, e.lat, e.lon);
  }

  function formatDistance(e) {
    const d = distanceFromOrigin(e);
    if (d == null) return '–';
    return d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d)} km`;
  }

  // Zuordnung Sportart -> erlaubte Kategorie-Werte.
  const ART2_BY_ART1 = {
    'Laufen': ['Straße', 'Trail', 'Bahn', 'Berg', 'Cross', 'Hindernis', 'Backcountry Ultra'],
    'Schwimmen': ['Freiwasser', 'Becken'],
    'Fahrrad': ['Straße', 'Zeitfahren', 'Mountainbike', 'Gravel', 'Bahn', 'Cyclecross']
  };

  // Ab wie vielen ausgewählten Werten ein Mengen-Filter zu EINEM Chip
  // zusammengefasst wird (siehe pushSetChips in renderChips). Fünf Chips
  // sind noch lesbar, fünfzig nicht mehr.
  const MAX_VALUE_CHIPS = 5;

  // Aufklapp-Zeichen der zusammengefassten Zeilen: ein Pfeil in einem
  // runden Feld, der sich beim Öffnen dreht. Das frühere "▸" war ein
  // Schriftzeichen - in jeder Schrift anders groß, nicht mittig und ohne
  // Bewegung. Steht hier oben, weil der erste render() (siehe
  // urlZustandGelesen) es bei aktiver Gruppierung sofort braucht.
  const CHEVRON_SVG = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" '
    + 'stroke="currentColor" stroke-width="2.5" stroke-linecap="round" '
    + 'stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  // Zeitraum-Schnellfilter. Der Jahr/Monat/Tag-Baum ist genau, aber für
  // "dieses Wochenende" oder "die nächsten drei Monate" muss man sich
  // durchklicken - diese vier Knöpfe kosten eine Zeile Platz und nehmen
  // den häufigsten Fällen die Arbeit ab. Sie setzen dieselben
  // state.selectedDays wie der Baum, es kommt also kein zweiter
  // Filtermechanismus dazu.
  const DATE_PRESETS = [
    { key: 'weekend', labelKey: 'preset_weekend', range: () => {
        // Kommendes Wochenende; ist heute schon Samstag oder Sonntag, ist
        // dieses Wochenende gemeint.
        const heute = new Date();
        const wt = heute.getDay();                 // 0 = So, 6 = Sa
        if (wt === 0) return [isoOf(heute), isoOf(heute)];
        const von = new Date(heute);
        von.setDate(heute.getDate() + (6 - wt));
        const bis = new Date(von);
        bis.setDate(von.getDate() + 1);
        return [isoOf(wt === 6 ? heute : von), isoOf(bis)];
      } },
    { key: 'd30', labelKey: 'preset_d30', range: () => {
        const heute = new Date(); const bis = new Date();
        bis.setDate(heute.getDate() + 30);
        return [isoOf(heute), isoOf(bis)];
      } },
    { key: 'm3', labelKey: 'preset_m3', range: () => {
        const heute = new Date(); const bis = new Date();
        bis.setMonth(heute.getMonth() + 3);
        return [isoOf(heute), isoOf(bis)];
      } },
    { key: 'year', labelKey: 'preset_year', range: () => {
        const heute = new Date();
        return [isoOf(heute), `${heute.getFullYear()}-12-31`];
      } }
  ];

  // iPadOS meldet sich in Safari als "Macintosh"; der Touch-Zähler
  // verrät trotzdem, dass ein iPad davorsteht. Gebraucht an zwei Stellen:
  // für den richtigen Einstellungs-Pfad in der Standort-Hilfe und für den
  // Kalender-Eintrag (siehe openIcs).
  function istIosGeraet() {
    const ua = navigator.userAgent || '';
    return /iPhone|iPad|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
  }

  // Mac ohne Touch = Schreibtisch-macOS. Dort ist der Kalender die
  // Standard-App für .ics, das Öffnen lohnt also genauso.
  function istAppleGeraet() {
    return istIosGeraet() || /Mac/.test(navigator.userAgent || '');
  }

  function isoOf(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function applyDatePreset(preset) {
    const [von, bis] = preset.range();
    state.selectedDays.clear();
    uniqueSorted(events.map(e => e.datum_start))
      .filter(d => d >= von && d <= bis)
      .forEach(d => state.selectedDays.add(d));
    state.datePreset = preset.key;
    selectedIndex = null;
  }

  // ^ DATE_PRESETS steht hier oben, NICHT beim Datums-Panel: readUrlState()
  // liest den Zeitraum schon beim Laden der Seite, und eine const-Tabelle
  // weiter unten wäre zu diesem Zeitpunkt noch nicht initialisiert
  // ("Cannot access 'DATE_PRESETS' before initialization" - genau dieser
  // Fehler ist beim Bauen passiert).


  let events = [];
  let selectedIndex = null;

  // Vor dem ersten readUrlState() darf writeUrlState() NICHTS schreiben,
  // sonst löscht der erste render() die Parameter eines geteilten Links
  // wieder: window.EndauranceAuth meldet den Anmeldestatus schon, während
  // events.json noch lädt, und ruft dabei render() auf - mit leerem
  // Filterzustand. Die Flagge steht hier oben und nicht beim
  // Deep-Link-Abschnitt, weil genau dieser frühe render() sie sonst noch
  // nicht sieht ("Cannot access ... before initialization").
  let urlZustandGelesen = false;

  // Filter state
  const state = {
    land: new Set(),
    art1: new Set(),
    art2: new Set(),
    standort: new Set(),
    nameQuery: '',
    selectedDays: new Set(),      // ausgewählte datum_start-Werte (aus dem Jahr/Monat/Tag-Baum)
    treeExpanded: new Set(),      // aufgeklappte Knoten im Datum-Baum (UI-Zustand)
    datePreset: null,             // 'weekend' | 'd30' | 'm3' | 'year' - nur fürs Etikett
    laengeMin: '',
    laengeMax: '',
    distanceCategories: new Set(), // "Sportart:kategorieKey", z. B. "Laufen:marathon"
    origin: null,                 // { lat, lon, label }
    radiusKm: null,               // Umkreis in km (1-200) oder null = kein Umkreis-Filter
    sortKey: 'datum',             // Spalte, nach der sortiert wird (siehe SORT_KEYS)
    sortDir: 'asc',               // 'asc' | 'desc'
    // Zusammenfassen ist reine ANZEIGE: die Daten bleiben eine Zeile pro
    // Strecke (Datenregel 1), die Tabelle zeigt sie nur gebündelt.
    gruppiert: false,
    offeneGruppen: new Set()      // aufgeklappte Gruppen (Schlüssel siehe groupKey)
  };

  // Ein einziges, an <body> gehängtes Filter-Panel (fixed positioniert), damit es nie
  // vom scrollenden Tabellen-Container abgeschnitten wird.
  let openColKey = null;
  let openTriggerEl = null;
  const floatingPanel = document.createElement('div');
  floatingPanel.className = 'filter-panel';
  floatingPanel.hidden = true;
  document.body.appendChild(floatingPanel);

  const bodyEl = document.getElementById('event-body');
  const tableEl = document.getElementById('event-table');
  const headerRowEl = document.getElementById('header-row');
  const countEl = document.getElementById('result-count');
  const chipsEl = document.getElementById('active-chips');
  const detailEl = document.getElementById('detail-panel');
  const titleEl = document.getElementById('page-title');
  const subtitleEl = document.getElementById('subtitle');
  const resetBtnEl = document.getElementById('reset-btn');
  resetBtnEl.addEventListener('click', resetFilters);

  const groupToggleEl = document.getElementById('group-toggle');
  const groupToggleLabelEl = document.getElementById('group-toggle-label');
  // Merken, wie der Nutzer die Liste lieber sieht - die Einstellung
  // gehört zur Ansicht, nicht zum Filter, und überlebt deshalb den
  // Seitenwechsel (wie die Sprache).
  try { state.gruppiert = localStorage.getItem('endurance-gruppiert') === '1'; } catch (e) { /* ignorieren */ }
  groupToggleEl.checked = state.gruppiert;
  groupToggleEl.addEventListener('change', () => {
    state.gruppiert = groupToggleEl.checked;
    try { localStorage.setItem('endurance-gruppiert', state.gruppiert ? '1' : '0'); } catch (e) { /* ignorieren */ }
    state.offeneGruppen.clear();
    selectedIndex = null;
    // buildHeader() muss mit: das Zusammenfassen schaltet die Spalte
    // "Anzahl" zu bzw. ab (activeColumns). Ohne den Aufruf bekam der
    // Tabellenkörper eine Zelle mehr als die Kopfzeile Spalten hatte -
    // alle Überschriften standen um eine Spalte verschoben, bis die
    // Seite neu geladen wurde.
    buildHeader();
    render();
  });

  // Service Worker anmelden. Er hat genau einen Zweck: eine .ics-Datei
  // mit dem Inhaltstyp text/calendar ausliefern, damit iOS und macOS den
  // Termin dem Kalender anbieten (siehe sw.js und openIcs()). Schlägt die
  // Anmeldung fehl - privates Fenster, In-App-Browser, alte Version -,
  // bleibt der Herunterladen-Weg.
  if ('serviceWorker' in navigator && window.isSecureContext !== false) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* dann eben ohne */ });
  }

  const shareBtnEl = document.getElementById('share-btn');
  const shareBtnLabelEl = document.getElementById('share-btn-label');
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  // Kleines Fenster, das knapp zwei Sekunden lang sichtbar ist. Zwei
  // Zeitgeber: einer für das Ausblenden (Deckkraft), einer fürs
  // Wegnehmen aus dem Layout danach.
  function showToast(text) {
    window.clearTimeout(toastTimer);
    toastEl.textContent = text;
    toastEl.hidden = false;
    // Ein Bildaufbau muss zwischen hidden=false und der Klasse liegen,
    // sonst gibt es keinen Übergang, sondern einen Sprung.
    window.requestAnimationFrame(() => toastEl.classList.add('visible'));
    toastTimer = window.setTimeout(() => {
      toastEl.classList.remove('visible');
      toastTimer = window.setTimeout(() => { toastEl.hidden = true; }, 220);
    }, 1800);
  }

  shareBtnEl.addEventListener('click', () => {
    const url = window.location.href;
    // navigator.clipboard braucht einen sicheren Kontext; ohne den (oder
    // bei verweigerter Erlaubnis) bleibt nur der Hinweis auf die
    // Adresszeile - dort steht die vollständige Adresse ja bereits.
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(url)
        .then(() => showToast(t('share_done')))
        .catch(() => showToast(t('share_fail')));
    } else {
      showToast(t('share_fail'));
    }
  });
  const homeBtnLabelEl = document.getElementById('home-btn-label');
  const mapBtnLabelEl = document.getElementById('map-btn-label');
  const notifyBoxEl = document.getElementById('notify-box');

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  // "Benachrichtige mich"-Box neu rendern, sobald sich der Login-Status
  // ändert (z. B. nachdem sich der Nutzer im Modal erfolgreich angemeldet
  // hat, während die Box wegen 0 Treffern sichtbar war).
  if (window.EndauranceAuth) {
    window.EndauranceAuth.onAuthChange(() => render());
  }

  try {
    const res = await fetch('events.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    events = dropPastEvents(await res.json());
  } catch (err) {
    setLanguage(currentLang, { skipRender: true });
    bodyEl.innerHTML = `<tr><td colspan="7" class="empty-row">${escapeHtml(t('load_error', err.message))}</td></tr>`;
    return;
  }

  // Filterzustand aus der Adresse übernehmen (siehe readUrlState). Deckt
  // auch die beiden alten Deep-Links ab, die es vorher schon gab:
  // ?sportart=Fahrrad von der Willkommensseite und ?standort=Frankfurt
  // vom Marker in karte.html.
  readUrlState();
  urlZustandGelesen = true;
  groupToggleEl.checked = state.gruppiert;

  setLanguage(currentLang);

  // ---------- helpers ----------

  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // Vergangene Events erscheinen gar nicht. Aufgeräumt wird events.json
  // zwar auch serverseitig (clean_events.drop_past_events), aber nur
  // einmal pro Woche - ohne diesen Filter stünden dazwischen bis zu
  // sieben Tage Vergangenheit in der Liste. Maßgeblich ist das Ende:
  // ein mehrtägiges Rennen bleibt bis zu seinem letzten Tag; ein Event
  // ohne verwertbares Datum bleibt drin (nicht auf Unsicherheit hin
  // ausblenden).
  function dropPastEvents(list) {
    const today = todayIso();
    return list.filter(e => {
      const ende = e.datum_ende || e.datum_start;
      if (typeof ende !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(ende)) return true;
      return ende >= today;
    });
  }

  function uniqueSorted(values) {
    return Array.from(new Set(values.filter(v => v !== undefined && v !== null && v !== ''))).sort((a, b) => String(a).localeCompare(String(b), currentLang === 'de' ? 'de' : 'en'));
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    if (currentLang === 'en') {
      const date = new Date(Date.UTC(y, m - 1, d));
      return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
    }
    return `${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${y}`;
  }

  function formatRange(start, end) {
    if (start === end) return formatDate(start);
    return `${formatDate(start)} – ${formatDate(end)}`;
  }

  // Längenangaben immer auf EINE Dezimalstelle: die Quellen geben dieselbe
  // Strecke unterschiedlich genau an (Marathon als "42,195 km"), angezeigt
  // wird einheitlich "42.2 km". Runde Distanzen bleiben ohne Nachkomma-
  // stelle ("10 km" statt "10.0 km").
  function formatKm(km) {
    if (km == null || Number.isNaN(Number(km))) return '–';
    const rounded = Math.round(Number(km) * 10) / 10;
    return `${Number.isInteger(rounded) ? rounded : rounded.toFixed(1)} km`;
  }

  // Was in der Spalte "Länge" steht. Nicht jedes Rennen hat eine Strecke:
  // ein 24-Stunden-Lauf ist über die ZEIT begrenzt, gelaufen wird so weit
  // man kommt. Solche Einträge tragen `dauer_h` statt `laenge_km` und
  // zeigen hier "24 h".
  //
  // Eine bekannte Distanz hat dabei VORRANG, auch wenn beide Felder
  // gesetzt sind: Beim "24h Mad Chicken Run | Marathon, 42 km" ist das
  // "24h" der Name der Veranstaltung, die Zeile selbst aber eine feste
  // 42-km-Strecke. Sie als "24 h" anzuzeigen würde die Distanz
  // verschlucken.
  function formatLength(e) {
    if (e.laenge_km != null) return formatKm(e.laenge_km);
    if (e.dauer_h != null && !Number.isNaN(Number(e.dauer_h))) {
      const h = Math.round(Number(e.dauer_h) * 10) / 10;
      return `${Number.isInteger(h) ? h : h.toFixed(1)} h`;
    }
    // Backyard Ultra ohne Zeitbegrenzung: bewusst "–". Der Lauf endet,
    // wenn nur noch eine Person weiterläuft - es gibt keine Länge, und
    // die Rundenlänge ist keine (siehe clear_backyard_lap_km()).
    return formatKm(null);
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function availableArt2Options() {
    const presentArt2 = uniqueSorted(events.map(e => e.art2));
    if (state.art1.size === 0) return presentArt2;
    const allowed = new Set();
    state.art1.forEach(a1 => (ART2_BY_ART1[a1] || []).forEach(a2 => allowed.add(a2)));
    return presentArt2.filter(a2 => allowed.has(a2));
  }

  function buildDateTreeNodes() {
    const byYear = {};
    events.forEach(e => {
      const [y, m] = e.datum_start.split('-');
      byYear[y] = byYear[y] || {};
      byYear[y][m] = byYear[y][m] || new Set();
      byYear[y][m].add(e.datum_start);
    });
    return Object.keys(byYear).sort().map(year => {
      const months = byYear[year];
      const yearDays = Object.values(months).flatMap(s => Array.from(s));
      return {
        key: year,
        label: year,
        days: yearDays,
        children: Object.keys(months).sort().map(month => {
          const monthDays = Array.from(months[month]).sort();
          return {
            key: `${year}-${month}`,
            label: `${MONTH_NAMES[currentLang][parseInt(month, 10) - 1]} ${year}`,
            days: monthDays,
            children: monthDays.map(day => ({
              key: day,
              label: formatDate(day),
              days: [day],
              children: null
            }))
          };
        })
      };
    });
  }

  // ---------- Sprache ----------

  function setLanguage(lang, opts) {
    currentLang = lang;
    try { localStorage.setItem('endurance-lang', lang); } catch (e) { /* ignorieren */ }
    document.documentElement.lang = lang;
    document.title = t('tab_title');
    titleEl.textContent = t('title');
    subtitleEl.textContent = t('subtitle');
    resetBtnEl.textContent = t('reset');
    groupToggleLabelEl.textContent = t('group_toggle');
    shareBtnLabelEl.textContent = t('share_search');
    shareBtnEl.title = t('share_search');
    homeBtnLabelEl.textContent = t('home');
    mapBtnLabelEl.textContent = t('map');
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    closeFloatingPanel();
