  // ---------- header / floating filter panel ----------

  function buildHeader() {
    headerRowEl.innerHTML = '';
    activeColumns().forEach(col => {
      const th = document.createElement('th');
      th.className = `col-${col.key}`;
      const inner = document.createElement('div');
      inner.className = 'th-inner';

      // Der Spaltenname selbst ist der Sortier-Knopf. Vorher sortierte die
      // Liste ausschließlich nach Datum - bei 4000 Zeilen (und später
      // 20.000) war das der größte Mangel. Spalten ohne Sortierschlüssel
      // (Anzahl) bekommen nur eine Beschriftung, keinen toten Knopf.
      if (SORT_KEYS[col.key]) {
        const sortBtn = document.createElement('button');
        sortBtn.type = 'button';
        sortBtn.className = 'th-sort' + (state.sortKey === col.key ? ' active' : '');
        sortBtn.title = `${t(col.labelKey)} – ${t('sort_hint')}`;
        sortBtn.innerHTML = `<span>${escapeHtml(t(col.labelKey))}</span>`
          + (state.sortKey === col.key
               ? `<span class="sort-arrow">${state.sortDir === 'asc' ? '▲' : '▼'}</span>`
               : '');
        sortBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          toggleSort(col.key);
        });
        th.setAttribute('aria-sort', state.sortKey === col.key
          ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
        inner.appendChild(sortBtn);
      } else {
        const label = document.createElement('span');
        // In die schmale Anzahl-Spalte passt kein Wort - dort steht "#",
        // der volle Name bleibt als Tooltip erhalten.
        label.textContent = col.short || t(col.labelKey);
        label.title = t(col.labelKey);
        inner.appendChild(label);
      }

      // Die Entfernungs-Spalte hat kein eigenes Filter-Panel: gefiltert
      // wird sie über den Umkreis-Regler im Stadt/Ort-Filter.
      if (col.type !== 'none') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'col-filter-btn';
        btn.dataset.col = col.key;
        btn.textContent = '▾';
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (openColKey === col.key) {
            closeFloatingPanel();
          } else {
            openFloatingPanel(col, btn);
          }
        });
        inner.appendChild(btn);
      }

      th.appendChild(inner);
      headerRowEl.appendChild(th);
    });

    if (!buildHeader.listenersAttached) {
      document.addEventListener('click', (ev) => {
        if (openColKey === null) return;
        // composedPath() statt ev.target/.contains(): ein Klick auf ein Element,
        // das sein eigener Handler synchron neu rendert (z. B. Sportart-Tabs),
        // hängt das Zielelement aus - .contains() würde das fälschlich als
        // "Klick außerhalb" werten und das Panel sofort wieder schließen.
        const path = ev.composedPath ? ev.composedPath() : [ev.target];
        if (!path.includes(floatingPanel)) {
          closeFloatingPanel();
        }
      });
      // Das Panel ist `fixed` positioniert und hängt optisch an seinem
      // Spaltenknopf. Scrollt die Seite oder die Tabelle, wandert es
      // deshalb mit - statt sich, wie früher, einfach zu schließen.
      //
      // Das Schließen ging auf schmalen Bildschirmen schief: Dort ist
      // die Tabelle breiter als das Fenster, die Spalten ab "Stadt/Ort"
      // erreicht man nur durch waagerechtes Scrollen. Ein Scroll-Ereignis,
      // das kurz vor dem Tippen ausgelöst wurde (iOS scrollt nach dem
      // Wischen noch nach), wird erst NACH dem Klick zugestellt: Das
      // Panel ging auf und sofort wieder zu. Auf 390 px Breite ließ sich
      // der Stadt/Ort-Filter so gar nicht öffnen.
      //
      // Dasselbe beim Verkleinern: Auf Android schiebt die
      // Bildschirmtastatur das Fenster zusammen und löst `resize` aus -
      // ein Tippen ins Namens- oder Ortssuchfeld hätte das Panel
      // geschlossen, bevor der erste Buchstabe drin war.
      let folgeFrame = null;
      const folgeDemKnopf = () => {
        if (openColKey === null || !openTriggerEl || folgeFrame !== null) return;
        // requestAnimationFrame: Während eines Schwungs feuern
        // Scroll-Ereignisse dicht an dicht, neu positioniert werden muss
        // aber höchstens einmal pro Bild.
        folgeFrame = requestAnimationFrame(() => {
          folgeFrame = null;
          if (openColKey === null || !openTriggerEl) return;
          if (isTriggerVisible(openTriggerEl)) positionFloatingPanel(openTriggerEl);
          else closeFloatingPanel();   // ohne sichtbaren Anker schwebt es nur herum
        });
      };
      window.addEventListener('scroll', folgeDemKnopf, true);
      window.addEventListener('resize', folgeDemKnopf);
      buildHeader.listenersAttached = true;
    }
  }

  function openFloatingPanel(col, triggerEl) {
    openColKey = col.key;
    openTriggerEl = triggerEl;
    floatingPanel.hidden = false;
    renderFilterPanel(col, floatingPanel);
    positionFloatingPanel(triggerEl);
    updateFilterIndicators();
  }

  function closeFloatingPanel() {
    openColKey = null;
    openTriggerEl = null;
    floatingPanel.hidden = true;
    floatingPanel.innerHTML = '';
    updateFilterIndicators();
  }

  // Ist der Spaltenknopf noch zu sehen? Geprüft wird gegen das Fenster
  // UND gegen den scrollenden Tabellen-Container: Waagerecht aus der
  // Tabelle geschobene Spaltenköpfe liegen zwar noch im Fenster, sind
  // aber vom Container abgeschnitten.
  function isTriggerVisible(triggerEl) {
    const rect = triggerEl.getBoundingClientRect();
    const schneidet = (box) => rect.bottom > box.top && rect.top < box.bottom
      && rect.right > box.left && rect.left < box.right;
    if (!schneidet({ top: 0, bottom: window.innerHeight, left: 0, right: window.innerWidth })) return false;
    const wrap = triggerEl.closest('.table-wrap');
    return !wrap || schneidet(wrap.getBoundingClientRect());
  }

  function positionFloatingPanel(triggerEl) {
    const rect = triggerEl.getBoundingClientRect();
    const panelWidth = floatingPanel.offsetWidth || 260;
    const panelHeight = floatingPanel.offsetHeight || 200;
    let left = rect.right - panelWidth;
    left = Math.max(8, Math.min(left, window.innerWidth - panelWidth - 8));
    let top = rect.bottom + 6;
    if (top + panelHeight > window.innerHeight - 8) {
      top = Math.max(8, rect.top - panelHeight - 6);
    }
    floatingPanel.style.left = left + 'px';
    floatingPanel.style.top = top + 'px';
  }

  function renderFilterPanel(col, panel) {
    if (col.type === 'checkbox') renderCheckboxPanel(col, panel);
    else if (col.type === 'standort') renderStandortPanel(panel);
    else if (col.type === 'date-tree') renderDateTreePanel(panel);
    else if (col.type === 'text') renderTextPanel(panel);
    else if (col.type === 'number-range') renderNumberRangePanel(panel);
  }

  function renderCheckboxPanel(col, panel) {
    const options = col.options();
    const selectedSet = state[col.key];
    Array.from(selectedSet).forEach(v => { if (!options.includes(v)) selectedSet.delete(v); });

    panel.innerHTML = '';
    const actions = document.createElement('div');
    actions.className = 'fp-actions';
    actions.innerHTML = `<a data-act="all">${escapeHtml(t('select_all'))}</a><a data-act="none">${escapeHtml(t('select_none'))}</a>`;
    panel.appendChild(actions);

    if (options.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'fp-empty';
      empty.textContent = t('no_values');
      panel.appendChild(empty);
    } else {
      const list = document.createElement('div');
      list.className = 'filter-list';
      options.forEach(opt => {
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = opt;
        cb.checked = selectedSet.has(opt);
        cb.addEventListener('change', () => {
          if (cb.checked) selectedSet.add(opt); else selectedSet.delete(opt);
          if (col.key === 'art1') {
            const valid = new Set(availableArt2Options());
            Array.from(state.art2).forEach(v => { if (!valid.has(v)) state.art2.delete(v); });
            pruneDistanceCategoriesForArt1();
          }
          selectedIndex = null;
          render();
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(tv(col.key, opt)));
        list.appendChild(label);
      });
      panel.appendChild(list);
    }

    actions.querySelector('[data-act="all"]').addEventListener('click', () => {
      options.forEach(o => selectedSet.add(o));
      if (col.key === 'art1') {
        const valid = new Set(availableArt2Options());
        Array.from(state.art2).forEach(v => { if (!valid.has(v)) state.art2.delete(v); });
        pruneDistanceCategoriesForArt1();
      }
      selectedIndex = null;
      render();
    });
    actions.querySelector('[data-act="none"]').addEventListener('click', () => {
      selectedSet.clear();
      if (col.key === 'art1') pruneDistanceCategoriesForArt1();
      selectedIndex = null;
      render();
    });
  }

  // Entfernt Distanzkategorie-Auswahlen für Sportarten, die nach einer
  // Sportart-Filteränderung nicht mehr ausgewählt sind (sonst würde die
  // Länge-Auswahl "ins Leere laufen", weil kein Event mehr passt).
  function pruneDistanceCategoriesForArt1() {
    if (state.art1.size === 0) return;
    Array.from(state.distanceCategories).forEach(compositeKey => {
      const sport = compositeKey.slice(0, compositeKey.indexOf(':'));
      if (!state.art1.has(sport)) state.distanceCategories.delete(compositeKey);
    });
  }

  // ---------- Ortsverzeichnis für die Umkreissuche ----------

  // `places.json` enthält alle Orte und Postleitzahlen von Deutschland,
  // Österreich und der Schweiz (~35.000 Einträge, gebaut von
  // scripts/build_places.py aus GeoNames-Daten). Die Datei ist rund
  // 1,6 MB groß und wird deshalb erst geladen, wenn jemand den
  // Stadt/Ort-Filter öffnet - nicht schon beim Seitenaufruf.
  let placesIndex = null;
  let placesState = 'idle';   // 'idle' | 'loading' | 'ready' | 'error'
  let placesPromise = null;
  // Die letzte Eingabe im Suchfeld. Liegt außerhalb von `state`, weil sie
  // kein Filter ist - sie überlebt nur das Neuzeichnen des Panels.
  let placeQuery = '';

  // Suchschlüssel für Ortsnamen: klein, ohne Umlaute, ohne Sonderzeichen.
  // Muss zu `normalisiere()` in scripts/build_places.py passen, damit
  // "muenchen", "München" und "munchen" denselben Ort finden und
  // "Sankt Anton" den Ort erwischt, der in den Daten "St. Anton" heißt.
  function normalizePlaceText(text) {
    return (text || '')
      .toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim()
      .replace(/\b(sankt|saint|ste)\b/g, 'st');
  }

  function loadPlaces() {
    if (placesPromise) return placesPromise;
    placesState = 'loading';
    placesPromise = fetch('places.json')
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(data => {
        const laender = data.laender || [];
        const regionen = data.regionen || [];
        // Kompaktes Zeilenformat: [name, landIdx, regionIdx, lat, lon,
        // einwohner, "plz plz …"] - siehe Kopf von build_places.py.
        // Die Reihenfolge (größte Orte zuerst) bleibt erhalten und
        // dient in searchPlaces() als Rangfolge bei Gleichstand.
        placesIndex = (data.orte || []).map(row => ({
          name: row[0],
          land: laender[row[1]] || '',
          region: regionen[row[2]] || '',
          lat: row[3],
          lon: row[4],
          norm: normalizePlaceText(row[0]),
          plz: row[6] ? row[6].split(' ') : []
        }));
        placesState = 'ready';
      })
      .catch(() => { placesState = 'error'; });
    return placesPromise;
  }

  // Wie viele Treffer die Vorschlagsliste höchstens zeigt.
  const MAX_PLACE_RESULTS = 25;

  // Trefferliste zur Eingabe. Gesucht wird in Ortsnamen UND
  // Postleitzahlen; eine Eingabe aus Ziffern ist eine PLZ-Suche.
  function searchPlaces(query) {
    if (!placesIndex) return [];
    const raw = (query || '').trim();
    const digits = raw.replace(/[^0-9]/g, '');
    const norm = normalizePlaceText(raw);
    if (norm.length < 2 && digits.length < 2) return [];

    const treffer = [];
    for (const ort of placesIndex) {
      let rang = -1;
      if (digits.length >= 2 && ort.plz.some(plz => plz.startsWith(digits))) rang = 0;
      else if (norm.length >= 2) {
        if (ort.norm.startsWith(norm)) rang = 1;
        else if (ort.norm.includes(' ' + norm)) rang = 2;   // "Frankfurt" findet "Bad Frankfurt…"
        else if (ort.norm.includes(norm)) rang = 3;
      }
      if (rang >= 0) treffer.push({ ort, rang });
    }
    // Stabile Sortierung: innerhalb eines Rangs bleibt die Reihenfolge
    // aus der Datei - und die ist nach Einwohnerzahl absteigend. So
    // steht bei "mün" München vor Münchendorf.
    treffer.sort((a, b) => a.rang - b.rang);
    return treffer.slice(0, MAX_PLACE_RESULTS).map(x => x.ort);
  }

  // Setzt den Ausgangspunkt der Umkreissuche und schaltet den Umkreis
  // ein, falls er noch aus ist (sonst passiert sichtbar nichts).
  function setOrigin(origin) {
    const hatteOrigin = !!state.origin;
    state.origin = origin;
    if (origin && state.radiusKm == null) state.radiusKm = RADIUS_DEFAULT_KM;
    if (!origin) state.radiusKm = null;
    // Mit einem Ausgangspunkt ist "was ist am nächsten?" die naheliegende
    // Frage - also nach Entfernung sortieren, solange noch die
    // Standard-Sortierung aktiv ist. Eine selbst gewählte Sortierung wird
    // nicht überschrieben. Fällt der Ausgangspunkt weg, verschwindet die
    // Spalte und mit ihr die Sortierung.
    if (origin && !hatteOrigin && state.sortKey === 'datum') {
      state.sortKey = 'entfernung';
      state.sortDir = 'asc';
    }
    if (!origin && state.sortKey === 'entfernung') {
      state.sortKey = 'datum';
      state.sortDir = 'asc';
    }
    selectedIndex = null;
    buildHeader();
  }

  // Der Stadt/Ort-Filter ist reine Umkreissuche: erst der Ausgangspunkt
  // (aktueller Standort oder eingetippter Ort/PLZ), dann der Regler.
  //
  // Die frühere Liste mit Häkchen für jeden Ort aus events.json ist
  // bewusst weg: das waren ~2000 Einträge, und wer in einem Ort ohne
  // Event wohnt, fand seinen eigenen dort nie. Ein Ortsfilter aus einem
  // Kartenlink (?standort=…) wirkt weiter und lässt sich über seinen
  // Chip entfernen.
  function renderStandortPanel(panel) {
    panel.innerHTML = '';

    const section = document.createElement('div');
    section.className = 'radius-section';
    const radiusTitle = document.createElement('div');
    radiusTitle.className = 'radius-title';
    radiusTitle.textContent = t('radius_title');
    section.appendChild(radiusTitle);

    // 1. Aktueller Standort
    const geoBtn = document.createElement('button');
    geoBtn.type = 'button';
    geoBtn.className = 'geo-btn';
    geoBtn.textContent = t('geo_btn');
    section.appendChild(geoBtn);

    const statusEl = document.createElement('div');
    statusEl.className = 'radius-status';
    statusEl.textContent = state.origin ? t('geo_origin_set', state.origin.label) : t('geo_no_origin');
    section.appendChild(statusEl);

    // Erscheint erst, wenn der Browser den Zugriff gespeichert verweigert:
    // dann hilft kein zweiter Klick, sondern nur die Einstellung.
    const geoHelp = document.createElement('div');
    geoHelp.className = 'geo-help';
    geoHelp.hidden = true;
    section.appendChild(geoHelp);

    if (state.origin) {
      const clearBtn = document.createElement('button');
      clearBtn.type = 'button';
      clearBtn.className = 'origin-clear';
      clearBtn.textContent = '✕ ' + t('origin_clear');
      clearBtn.addEventListener('click', () => {
        setOrigin(null);
        clearBtn.blur();   // sonst zeichnet refreshOpenPanel() nicht neu
        render();
      });
      section.appendChild(clearBtn);
    }

    // 2. Umkreis-Regler (1-200 km)
    const sliderRow = document.createElement('div');
    sliderRow.className = 'radius-slider-row' + (state.origin ? '' : ' disabled');
    const sliderValue = document.createElement('div');
    sliderValue.className = 'radius-value';
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = String(RADIUS_MIN_KM);
    slider.max = String(RADIUS_MAX_KM);
    slider.step = '1';
    slider.value = String(state.radiusKm != null ? state.radiusKm : RADIUS_DEFAULT_KM);
    slider.disabled = !state.origin;
    slider.setAttribute('aria-label', t('radius_title'));
    sliderValue.textContent = state.origin ? t('radius_value', slider.value) : t('radius_disabled');
    sliderRow.appendChild(sliderValue);
    sliderRow.appendChild(slider);

    const scale = document.createElement('div');
    scale.className = 'radius-scale';
    scale.innerHTML = `<span>${RADIUS_MIN_KM} km</span><span>${RADIUS_MAX_KM} km</span>`;
    sliderRow.appendChild(scale);
    section.appendChild(sliderRow);

    // Beim Ziehen nur die Beschriftung mitlaufen lassen; neu gefiltert
    // wird erst beim Loslassen ('change'). Sonst würde die ganze
    // Tabelle bei jedem Pixel Fingerbewegung neu aufgebaut.
    slider.addEventListener('input', () => {
      sliderValue.textContent = t('radius_value', slider.value);
    });
    slider.addEventListener('change', () => {
      state.radiusKm = Number(slider.value);
      selectedIndex = null;
      // Kein blur() hier: der Regler soll für die Pfeiltasten den Fokus
      // behalten. Dass refreshOpenPanel() deswegen nicht neu zeichnet,
      // ist richtig - Beschriftung und Reglerstellung stimmen bereits.
      render();
    });

    // 3. Ortssuche über places.json
    const searchWrap = document.createElement('div');
    searchWrap.className = 'place-search';
    const searchLabel = document.createElement('div');
    searchLabel.className = 'radius-title';
    searchLabel.textContent = t('place_search_label');
    searchWrap.appendChild(searchLabel);

    const searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.autocomplete = 'off';
    searchInput.placeholder = t('place_search_placeholder');
    searchInput.value = placeQuery;
    searchWrap.appendChild(searchInput);

    const results = document.createElement('div');
    results.className = 'place-results';
    searchWrap.appendChild(results);

    // Meldezeile für "wird geladen", "nichts gefunden" und Ladefehler.
    // Ohne Eingabe bleibt sie leer: Das Feld erklärt sich über seinen
    // Platzhalter, und die Quellenangabe zu den Ortsdaten steht in der
    // Fußzeile der Startseite, nicht hier im Weg.
    const note = document.createElement('div');
    note.className = 'place-note';
    searchWrap.appendChild(note);
    section.appendChild(searchWrap);

    function renderResults() {
      results.innerHTML = '';
      if (placesState === 'loading') { note.textContent = t('places_loading'); return; }
      if (placesState === 'error') { note.textContent = t('places_error'); return; }
      const query = searchInput.value.trim();
      if (!query) { note.textContent = ''; return; }
      const treffer = searchPlaces(query);
      if (treffer.length === 0) { note.textContent = t('places_empty'); return; }
      note.textContent = '';
      treffer.forEach(ort => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'place-result';
        const meta = [ort.region, tv('land', LAND_BY_CODE[ort.land] || ort.land)]
          .filter(Boolean).join(' · ');
        btn.innerHTML = `${escapeHtml(ort.name)}<span class="place-meta">${escapeHtml(meta)} · ${escapeHtml(ort.plz.slice(0, 3).join(', '))}${ort.plz.length > 3 ? ' …' : ''}</span>`;
        btn.addEventListener('click', () => {
          setOrigin({ lat: ort.lat, lon: ort.lon, label: ort.name });
          placeQuery = searchInput.value;
          // Fokus abgeben, sonst zeichnet refreshOpenPanel() das Panel
          // nicht neu und der Regler bliebe ausgegraut.
          btn.blur();
          render();
        });
        results.appendChild(btn);
      });
    }

    searchInput.addEventListener('input', () => {
      placeQuery = searchInput.value;
      renderResults();
    });

    renderResults();
    if (placesState === 'idle' || placesState === 'loading') {
      loadPlaces().then(renderResults);
    }

    function zeigeGeoHilfe() {
      const schritte = t(istIosGeraet() ? 'geo_help_ios' : 'geo_help_other');
      geoHelp.innerHTML = '<ol>' + schritte.map(zeile => `<li>${escapeHtml(zeile)}</li>`).join('') +
        `</ol><span class="geo-help-fallback">${escapeHtml(t('geo_help_fallback'))}</span>`;
      geoHelp.hidden = false;
    }

    geoBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        statusEl.textContent = t('geo_unsupported');
        return;
      }
      // Ohne sicheren Kontext (http:// außer localhost) lehnen die Browser
      // die Abfrage mit einem nichtssagenden "User denied Geolocation" ab -
      // besser vorher sagen, woran es liegt.
      if (window.isSecureContext === false) {
        statusEl.textContent = t('geo_insecure');
        return;
      }
      geoHelp.hidden = true;
      statusEl.textContent = t('geo_locating');
      geoBtn.disabled = true;
      const gestartet = Date.now();
      navigator.geolocation.getCurrentPosition(
        pos => {
          setOrigin({ lat: pos.coords.latitude, lon: pos.coords.longitude, label: t('geo_current_label') });
          // WICHTIG: erst den Fokus vom Button nehmen. refreshOpenPanel()
          // zeichnet das offene Filter-Panel NICHT neu, solange der Fokus
          // darin liegt (damit eine Eingabe im Namensfeld nicht abreißt) -
          // und der geklickte Button liegt genau dort. Ohne das blieb der
          // Standort zwar gespeichert, das Panel zeigte aber weiter
          // "Standort wird ermittelt…" und der Umkreis-Regler blieb
          // ausgegraut: die Funktion sah aus wie kaputt.
          geoBtn.blur();
          render();
        },
        err => {
          geoBtn.disabled = false;
          if (err.code === 1) {
            // Fehlercode 1 hat zwei sehr verschiedene Ursachen, und der
            // Unterschied entscheidet, was der Nutzer tun muss:
            // Kommt die Absage praktisch sofort, hat der Browser gar nicht
            // gefragt - die Entscheidung steht schon fest (einmal abgelehnt
            // und gemerkt) oder die Ortungsdienste sind systemweit aus.
            // Dann hilft nur die Einstellung, ein zweiter Klick nicht.
            // Hat der Nutzer dagegen eben selbst "Nicht erlauben" getippt,
            // vergehen Sekunden - und beim nächsten Klick fragt der Browser
            // wieder.
            const sofort = Date.now() - gestartet < 800;
            statusEl.textContent = sofort ? t('geo_denied_blocked') : t('geo_denied');
            geoBtn.textContent = t('geo_retry');
            if (sofort) zeigeGeoHilfe();
          }
          else if (err.code === 3) statusEl.textContent = t('geo_timeout');
          else statusEl.textContent = t('geo_unavailable', err.message || String(err.code));
        },
        // maximumAge: eine Position aus den letzten fünf Minuten darf der
        // Browser direkt zurückgeben - das spart beim zweiten Öffnen des
        // Panels die volle Ortung.
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    });

    // Zusatz, kein Ersatz: Safari unterstützt navigator.permissions für
    // "geolocation" nicht überall (und wirft dort beim Namen eine
    // Ausnahme). Wo es geht, sagen wir schon beim Öffnen des Panels, dass
    // der Zugriff gespeichert abgelehnt ist - sonst tippt der Nutzer auf
    // einen Knopf, der nie etwas tun kann.
    if (!state.origin && navigator.permissions && navigator.permissions.query) {
      try {
        navigator.permissions.query({ name: 'geolocation' })
          .then(res => {
            if (res.state === 'denied' && !state.origin && geoHelp.hidden) {
              statusEl.textContent = t('geo_denied_blocked');
              geoBtn.textContent = t('geo_retry');
              zeigeGeoHilfe();
            }
          })
          .catch(() => {});
      } catch (e) {
        /* Browser ohne Unterstützung: dann eben erst nach dem Klick. */
      }
    }

    panel.appendChild(section);
  }

  function renderDateTreePanel(panel) {
    panel.innerHTML = '';
    const actions = document.createElement('div');
    actions.className = 'fp-actions';
    actions.innerHTML = `<a data-act="all">${escapeHtml(t('select_all'))}</a><a data-act="none">${escapeHtml(t('select_none'))}</a>`;
    panel.appendChild(actions);

    const presetWrap = document.createElement('div');

    DATE_PRESETS.forEach(preset => {

      btn.className = 'date-preset' + (state.datePreset === preset.key ? ' active' : '');
      btn.textContent = t(preset.labelKey);
      btn.addEventListener('click', () => {

          state.datePreset = null;
        } else {
          applyDatePreset(preset);
        }
        render();

      });

  function buildTreeCheckboxLabel(node) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    const allSelected = node.days.every(d => state.selectedDays.has(d));
    const noneSelected = node.days.every(d => !state.selectedDays.has(d));
    cb.checked = allSelected;
    cb.indeterminate = !allSelected && !noneSelected;
    cb.addEventListener('change', () => {
      if (cb.checked) node.days.forEach(d => state.selectedDays.add(d));
      else node.days.forEach(d => state.selectedDays.delete(d));
      // Von Hand angefasst: das Zeitraum-Etikett stimmt dann nicht mehr.
      state.datePreset = null;
      selectedIndex = null;
      render();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(node.label));
    return label;
  }

  function buildTreeNode(node) {
    const wrap = document.createElement('div');
    wrap.className = 'tree-node';
    const row = document.createElement('div');
    row.className = 'tree-row';
    const hasChildren = Array.isArray(node.children) && node.children.length > 0;

    if (hasChildren) {
      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'tree-toggle';
      const expanded = state.treeExpanded.has(node.key);
      toggleBtn.textContent = expanded ? '▾' : '▸';
      row.appendChild(toggleBtn);
      row.appendChild(buildTreeCheckboxLabel(node));
      wrap.appendChild(row);

      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'tree-children';
      childrenWrap.hidden = !expanded;
      node.children.forEach(child => childrenWrap.appendChild(buildTreeNode(child)));
      wrap.appendChild(childrenWrap);

      toggleBtn.addEventListener('click', () => {
        if (state.treeExpanded.has(node.key)) state.treeExpanded.delete(node.key);
        else state.treeExpanded.add(node.key);
        const nowExpanded = state.treeExpanded.has(node.key);
        childrenWrap.hidden = !nowExpanded;
        toggleBtn.textContent = nowExpanded ? '▾' : '▸';
        if (openTriggerEl) positionFloatingPanel(openTriggerEl);
      });
    } else {
      const spacer = document.createElement('span');
      spacer.className = 'tree-spacer';
      row.appendChild(spacer);
      row.appendChild(buildTreeCheckboxLabel(node));
      wrap.appendChild(row);
    }

    return wrap;
  }

  function renderTextPanel(panel) {
    panel.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = t('name_search_placeholder');
    input.value = state.nameQuery;
    input.addEventListener('input', () => {

      selectedIndex = null;

  function renderNumberRangePanel(panel) {
    panel.innerHTML = '';

    // Sportart-Tabs für die Distanzkategorien: nur Sportarten anzeigen, die
    // auch im Sportart-Filter ausgewählt sind (ist dort nichts gewählt,
    // stehen alle zur Wahl). Ist nur eine Sportart relevant, brauchen wir
    // keine Tabs - dann direkt deren Kategorien zeigen.
    const allSports = Object.keys(DISTANCE_CATEGORIES);
    const visibleSports = state.art1.size > 0
      ? allSports.filter(s => state.art1.has(s))
      : allSports;
    if (visibleSports.length === 0) visibleSports.push(...allSports);
    if (!visibleSports.includes(activeDistanceSportTab)) {
      activeDistanceSportTab = visibleSports[0];
    }

    if (visibleSports.length > 1) {
      const tabsWrap = document.createElement('div');
      tabsWrap.className = 'distance-tabs';
      visibleSports.forEach(sport => {
        const tabBtn = document.createElement('button');
        tabBtn.type = 'button';
        tabBtn.className = 'distance-tab' + (activeDistanceSportTab === sport ? ' active' : '');
        tabBtn.textContent = tv('art1', sport);
        tabBtn.addEventListener('click', () => {
          activeDistanceSportTab = sport;
          renderNumberRangePanel(panel);
          if (openTriggerEl) positionFloatingPanel(openTriggerEl);
        });
        tabsWrap.appendChild(tabBtn);
      });
      panel.appendChild(tabsWrap);
    }

    const catList = document.createElement('div');
    catList.className = 'filter-list distance-categories';
    // Die Zeitrennen-Kategorie nur anbieten, wenn diese Sportart überhaupt
    // ein zeitlich begrenztes Event hat - eine Auswahl, die garantiert 0
    // Treffer liefert, ist nur Ballast im Panel.
    const hatZeitrennen = events.some(
      e => e.art1 === activeDistanceSportTab && e.dauer_h != null);
    (DISTANCE_CATEGORIES[activeDistanceSportTab] || [])
      .filter(cat => !cat.zeit || hatZeitrennen)
      .forEach(cat => {
      const compositeKey = `${activeDistanceSportTab}:${cat.key}`;
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = state.distanceCategories.has(compositeKey);
      cb.addEventListener('change', () => {
        if (cb.checked) state.distanceCategories.add(compositeKey);
        else state.distanceCategories.delete(compositeKey);
        selectedIndex = null;
        render();
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(DISTANCE_CATEGORY_LABELS[currentLang][cat.key]));
      catList.appendChild(label);
    });
    panel.appendChild(catList);

    const wrap = document.createElement('div');
    wrap.className = 'range-row';
    const minLabel = document.createElement('label');
    minLabel.textContent = t('range_von_km');
    const minInput = document.createElement('input');
    minInput.type = 'number';
    minInput.min = '0';
    minInput.step = '0.1';
    minLabel.appendChild(minInput);
    const maxLabel = document.createElement('label');
    maxLabel.textContent = t('range_bis_km');
    const maxInput = document.createElement('input');
    maxInput.type = 'number';
    maxInput.min = '0';
    maxInput.step = '0.1';
    maxLabel.appendChild(maxInput);
    wrap.appendChild(minLabel);
    wrap.appendChild(maxLabel);
    panel.appendChild(wrap);

    minInput.value = state.laengeMin;
    maxInput.value = state.laengeMax;
    minInput.addEventListener('input', () => { state.laengeMin = minInput.value; selectedIndex = null; render(); });
    maxInput.addEventListener('input', () => { state.laengeMax = maxInput.value; selectedIndex = null; render(); });
  }

  // ---------- filtering / rendering ----------

  function getFiltered() {
    return events
      .map((e, idx) => ({ e, idx }))
      .filter(({ e }) => {
        if (state.land.size && !state.land.has(e.land)) return false;
        if (state.art1.size && !state.art1.has(e.art1)) return false;
        if (state.art2.size && !state.art2.has(e.art2)) return false;
        if (state.standort.size && !state.standort.has(e.standort)) return false;
        // Die Suche greift auch auf die Wettbewerbsbezeichnung zu, damit
        // z. B. "Halbmarathon" die Halbmarathon-Strecke einer Veranstaltung
        // findet, die diesen Begriff nicht im Namen trägt.
        if (state.nameQuery.trim()) {
          const needle = state.nameQuery.trim().toLowerCase();
          const haystack = `${e.name || ''} ${e.wettbewerb || ''}`.toLowerCase();
          if (!haystack.includes(needle)) return false;
        }
        if (state.selectedDays.size && !state.selectedDays.has(e.datum_start)) return false;
        if (state.laengeMin !== '' && e.laenge_km != null && e.laenge_km < parseFloat(state.laengeMin)) return false;
        if (state.laengeMax !== '' && e.laenge_km != null && e.laenge_km > parseFloat(state.laengeMax)) return false;
        if (!matchesDistanceCategory(e)) return false;
        if (state.radiusKm != null && state.origin) {
          if (e.lat == null || e.lon == null) return false;
          if (haversineKm(state.origin.lat, state.origin.lon, e.lat, e.lon) > state.radiusKm) return false;
        }
        return true;
      })
      // Sortiert nach der angeklickten Spalte, Standard ist das Datum
      // aufsteigend (nächster Termin zuerst). Vergangene Events brauchen
      // keinen Sonderfall mehr - sie kommen gar nicht in die Liste
      // (siehe dropPastEvents beim Laden).
      .sort((a, b) => compareEvents(a.e, b.e));
  }

  // Erster Klick auf eine Spalte sortiert aufsteigend, der zweite dreht
  // die Richtung. Datum und Entfernung fangen aufsteigend an (nächster
  // Termin / nächstgelegener Ort zuerst) - das ist auch bei allen anderen
  // Spalten die erwartete Leserichtung.
  function toggleSort(key) {
    if (!SORT_KEYS[key]) return;
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = 'asc';
    }
    buildHeader();
    render();
  }

  function compareEvents(a, b) {
    const fn = SORT_KEYS[state.sortKey] || SORT_KEYS.datum;
    const [ga, va] = fn(a);
    const [gb, vb] = fn(b);
    // Einträge ohne Angabe stehen immer hinten, unabhängig von der Richtung.
    if (ga !== gb) return ga - gb;
    let cmp;
    if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), currentLang === 'de' ? 'de' : 'en');
    if (cmp === 0) {
      // Gleichstand: Datum, dann Name - sonst wechselt die Reihenfolge
      // gleichwertiger Zeilen bei jedem Neuzeichnen.
      cmp = (a.datum_start || '').localeCompare(b.datum_start || '')
         || (a.name || '').localeCompare(b.name || '');
      return cmp;
    }
    return state.sortDir === 'asc' ? cmp : -cmp;
  }

  function refreshOpenPanel() {
    if (openColKey === null) return;
    if (floatingPanel.contains(document.activeElement)) return;
    const col = COLUMNS.find(c => c.key === openColKey);
    if (col) {
      renderFilterPanel(col, floatingPanel);
      if (openTriggerEl) positionFloatingPanel(openTriggerEl);
    }
  }

  // Eine Tabellenzelle. Die Zellen werden aus activeColumns() aufgebaut
  // statt fest untereinander geschrieben - nur so lässt sich die
  // Entfernungs-Spalte an der richtigen Stelle einschieben, ohne die
  // Reihenfolge an zwei Orten pflegen zu müssen.
  function cellHtml(col, e) {
    const td = (inhalt, extra) =>
      `<td class="col-${col.key}${extra ? ' ' + extra : ''}">${inhalt}</td>`;
    switch (col.key) {
      case 'anzahl': return td('');   // nur in Gruppenzeilen gefüllt
      case 'name': {
        const wb = displayWettbewerb(e);
        return td(`<div class="cell-clamp" title="${escapeHtml(wb ? e.name + ' – ' + wb : e.name)}">`
             + `${escapeHtml(e.name)}${wb ? `<span class="wettbewerb">${escapeHtml(wb)}</span>` : ''}</div>`);
      }
      case 'datum': return td(`<div class="cell-clamp">${formatRange(e.datum_start, e.datum_ende)}</div>`);
      case 'land': return td(`<div class="cell-clamp">${escapeHtml(tv('land', e.land))}</div>`);
      case 'standort': return td(`<div class="cell-clamp">${escapeHtml(e.standort)}</div>`);
      case 'entfernung': return td(`<div class="cell-clamp">${escapeHtml(formatDistance(e))}</div>`);
      case 'art1': return td(`<div class="cell-clamp">${escapeHtml(tv('art1', e.art1))}</div>`);
      case 'art2': return td(`<div class="cell-clamp">${e.art2 ? escapeHtml(tv('art2', e.art2)) : '–'}</div>`);
      case 'laenge_km': return td(`<div class="cell-clamp">${formatLength(e)}</div>`);
      default: return td('');
    }
  }


  // Schlüssel einer Veranstaltung: Name + Datum + Ort. Genau die drei
  // Felder machen aus mehreren Strecken eine Veranstaltung - die Distanz
  // ist gerade das, was sie unterscheidet.
  function groupKey(e) {
    return `${(e.name || '').toLowerCase()}|${e.datum_start}|${(e.standort || '').toLowerCase()}`;
  }

  // Gruppiert die (schon sortierten) Zeilen in der Reihenfolge, in der
  // sie auftreten - so bleibt die gewählte Sortierung sichtbar.
  function buildGroups(filtered) {
    const gruppen = [];
    const index = new Map();
    filtered.forEach(row => {
      const key = groupKey(row.e);
      let g = index.get(key);
      if (!g) {
        g = { key, rows: [] };
        index.set(key, g);
        gruppen.push(g);
      }
      g.rows.push(row);
    });
    return gruppen;
  }

  function groupRowHtml(g, cols) {
    const e = g.rows[0].e;
    const offen = state.offeneGruppen.has(g.key);
    const laengen = [];
    const kategorien = [];
    g.rows.forEach(({ e: r }) => {
      const l = formatLength(r);
      if (l !== '–' && !laengen.includes(l)) laengen.push(l);
      const k = r.art2 ? tv('art2', r.art2) : null;
      if (k && !kategorien.includes(k)) kategorien.push(k);
    });
    return cols.map(col => {
      switch (col.key) {
        case 'anzahl':
          return `<td class="col-anzahl"><span class="count-pill">${g.rows.length}</span></td>`;
        case 'name':
          return `<td class="col-name"><div class="group-name" title="${escapeHtml(e.name)}">`
               + `<span class="chevron${offen ? ' open' : ''}">${CHEVRON_SVG}</span>`
               + `<span class="group-name-text">${escapeHtml(e.name)}</span></div></td>`;
        case 'art2':
          return `<td class="col-art2"><div class="cell-clamp">${kategorien.length ? escapeHtml(kategorien.join(' · ')) : '–'}</div></td>`;
        case 'laenge_km':
          return `<td class="col-laenge_km"><div class="badges">`
               + (laengen.length ? laengen.map(l => `<span class="badge">${escapeHtml(l)}</span>`).join('') : '–')
               + `</div></td>`;
        default:
          return cellHtml(col, e);
      }
    }).join('');
  }

  function render() {
    updateFilterIndicators();
    renderChips();
    refreshOpenPanel();
    const filtered = getFiltered();
    countEl.textContent = t('result_count', filtered.length, events.length);

    const cols = activeColumns();
    tableEl.classList.toggle('with-distance', !!state.origin);

    if (filtered.length === 0) {
      bodyEl.innerHTML = `<tr class="empty-row"><td colspan="${cols.length}">${escapeHtml(t('empty_events'))}</td></tr>`;
      renderNotifyPrompt();
    } else if (state.gruppiert) {
      // Eine Zeile pro Veranstaltung, Klick klappt die Strecken auf. Die
      // Daten bleiben unangetastet - Datenregel 1 gilt weiter, das hier
      // ist nur die Anzeige.
      const gruppen = buildGroups(filtered);
      countEl.textContent = t('result_count_grouped', gruppen.length, filtered.length, events.length);
      bodyEl.innerHTML = '';
      gruppen.forEach(g => {
        const tr = document.createElement('tr');
        tr.className = 'group-row';
        tr.setAttribute('aria-expanded', state.offeneGruppen.has(g.key) ? 'true' : 'false');
        if (g.rows.some(r => r.idx === selectedIndex)) tr.classList.add('active');
        tr.innerHTML = groupRowHtml(g, cols);
        tr.addEventListener('click', () => {
          if (state.offeneGruppen.has(g.key)) state.offeneGruppen.delete(g.key);
          else state.offeneGruppen.add(g.key);
          selectedIndex = g.rows[0].idx;
          render();
        });
        bodyEl.appendChild(tr);

        if (state.offeneGruppen.has(g.key)) {
          g.rows.forEach(({ e, idx }) => {
            const sub = document.createElement('tr');
            sub.className = 'sub-row';
            if (idx === selectedIndex) sub.classList.add('active');
            sub.innerHTML = cols.map(col => cellHtml(col, e)).join('');
            sub.addEventListener('click', (ev) => {
              ev.stopPropagation();
              selectedIndex = idx;
              render();
            });
            bodyEl.appendChild(sub);
          });
        }
      });
      removeNotifyPrompt();
    } else {
      bodyEl.innerHTML = '';
      filtered.forEach(({ e, idx }) => {
        const tr = document.createElement('tr');
        if (idx === selectedIndex) tr.classList.add('active');
        tr.innerHTML = cols.map(col => cellHtml(col, e)).join('');
        tr.addEventListener('click', () => { selectedIndex = idx; render(); });
        bodyEl.appendChild(tr);
      });
      removeNotifyPrompt();
    }

    renderDetail();
    writeUrlState();
  }

  // ---------- Filter in der Adresse (teilbarer Link) ----------

  // Die Adresse trägt den vollständigen Filterzustand, damit eine
  // gefilterte Liste weitergegeben werden kann ("alle Trails im Umkreis
  // von 50 km um Stuttgart"). history.replaceState statt pushState: jeder
  // Häkchen-Klick würde sonst einen Eintrag in der Zurück-Geschichte
  // anlegen, und der Zurück-Knopf wäre nicht mehr zu gebrauchen.
  const URL_MAX_DAYS = 60;

  function writeUrlState() {
    if (!urlZustandGelesen) return;
    if (!window.history || !window.history.replaceState) return;
    const p = new URLSearchParams();
    if (state.nameQuery.trim()) p.set('q', state.nameQuery.trim());
    if (state.land.size) p.set('land', Array.from(state.land).join(','));
    if (state.art1.size) p.set('sportart', Array.from(state.art1).join(','));
    if (state.art2.size) p.set('art2', Array.from(state.art2).join(','));
    if (state.standort.size) p.set('standort', Array.from(state.standort).join(','));
    if (state.laengeMin !== '') p.set('kmmin', state.laengeMin);
    if (state.laengeMax !== '') p.set('kmmax', state.laengeMax);
    if (state.distanceCategories.size) p.set('kat', Array.from(state.distanceCategories).join(','));
    if (state.datePreset) p.set('zeitraum', state.datePreset);
    else if (state.selectedDays.size && state.selectedDays.size <= URL_MAX_DAYS) {
      // Bewusste Grenze: eine Auswahl von Hunderten Tagen würde die
      // Adresse unbrauchbar lang machen. Die vier Zeitraum-Knöpfe decken
      // genau diese großen Bereiche ab und stehen als 'zeitraum' drin.
      p.set('tage', Array.from(state.selectedDays).sort().join(','));
    }
    if (state.origin) {
      p.set('ort', `${state.origin.lat.toFixed(4)},${state.origin.lon.toFixed(4)},${state.origin.label}`);
      if (state.radiusKm != null) p.set('umkreis', String(state.radiusKm));
    }
    if (state.sortKey !== 'datum' || state.sortDir !== 'asc') {
      p.set('sort', `${state.sortKey}:${state.sortDir}`);
    }
    if (state.gruppiert) p.set('gruppiert', '1');
    const suffix = p.toString();
    const neu = window.location.pathname + (suffix ? '?' + suffix : '');
    if (neu !== window.location.pathname + window.location.search) {
      try { window.history.replaceState(null, '', neu); } catch (e) { /* ignorieren */ }
    }
  }

  function readUrlState() {
    let p;
    try { p = new URLSearchParams(window.location.search); } catch (e) { return; }
    const mengen = [
      // Sportart und Kategorie gegen die bekannten Werte prüfen: ein
      // Tippfehler in der Adresse soll keine leere Liste erzeugen, die
      // dann nach einem Fehler der Seite aussieht.
      ['land', state.land, v => ['Deutschland', 'Österreich', 'Schweiz'].includes(v)],
      ['sportart', state.art1, v => Object.prototype.hasOwnProperty.call(DISTANCE_CATEGORIES, v)],
      ['art2', state.art2, null],
      ['standort', state.standort, v => events.some(e => e.standort === v)],
      ['kat', state.distanceCategories, null]
    ];
    mengen.forEach(([name, ziel, gueltig]) => {
      const wert = p.get(name);
      if (!wert) return;
      wert.split(',').filter(Boolean).forEach(v => { if (!gueltig || gueltig(v)) ziel.add(v); });
    });
    const q = p.get('q');
    if (q) state.nameQuery = q;
    const kmmin = p.get('kmmin'); if (kmmin) state.laengeMin = kmmin;
    const kmmax = p.get('kmmax'); if (kmmax) state.laengeMax = kmmax;
    const zeitraum = p.get('zeitraum');
    const preset = DATE_PRESETS.find(x => x.key === zeitraum);
    if (preset) applyDatePreset(preset);
    else {
      const tage = p.get('tage');
      if (tage) tage.split(',').filter(Boolean).forEach(d => state.selectedDays.add(d));
    }
    const ort = p.get('ort');
    if (ort) {
      const teile = ort.split(',');
      const lat = parseFloat(teile[0]);
      const lon = parseFloat(teile[1]);
      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        setOrigin({ lat, lon, label: teile.slice(2).join(',') || t('geo_current_label') });
        const umkreis = parseInt(p.get('umkreis') || '', 10);
        if (Number.isFinite(umkreis) && umkreis > 0) state.radiusKm = umkreis;
      }
    }
    const sort = p.get('sort');
    if (sort) {
      const [key, dir] = sort.split(':');
      if (SORT_KEYS[key]) {
        state.sortKey = key;
        state.sortDir = dir === 'desc' ? 'desc' : 'asc';
      }
    }
    if (p.get('gruppiert') === '1') state.gruppiert = true;
  }

  // ---------- Zum Kalender hinzufügen ----------

  // Alle Termine sind GANZTÄGIG. Startzeiten stehen in keiner Quelle
  // verlässlich (und wenn, dann pro Wettbewerb verschieden) - ein
  // ganztägiger Eintrag behauptet keine Uhrzeit, die wir nicht kennen.
  //
  // Ganztägige Termine enden im iCalendar-Format (RFC 5545) am FOLGETAG:
  // DTEND ist exklusiv. Dasselbe gilt für den dates-Parameter von Google
  // und startdt/enddt von Outlook. Ohne das +1 fehlt der letzte Tag.
  function calDatePlusDays(iso, tage) {
    const [j, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(j, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + tage);
    return dt.toISOString().slice(0, 10);
  }

  function calFields(e) {
    const start = e.datum_start;
    const endeInklusiv = e.datum_ende && e.datum_ende > start ? e.datum_ende : start;
    const wb = displayWettbewerb(e);
    const titel = wb ? `${e.name} – ${wb}` : e.name;
    const zeilen = [
      `${t('detail_sportart')}: ${tv('art1', e.art1)}${e.art2 ? ' / ' + tv('art2', e.art2) : ''}`,
      `${t('detail_laenge')}: ${formatLength(e)}`
    ];
    if (e.veranstalter_url) zeilen.push(e.veranstalter_url);
    return {
      titel,
      ort: `${e.standort}${e.land ? ', ' + tv('land', e.land) : ''}`,
      beschreibung: zeilen.join('\n'),
      start,
      endeExklusiv: calDatePlusDays(endeInklusiv, 1),
      url: e.veranstalter_url || ''
    };
  }

  // Text für eine iCalendar-Zeile: Backslash, Semikolon, Komma und
  // Zeilenumbrüche müssen maskiert werden (RFC 5545, 3.3.11).
  function icsEscape(text) {
    return String(text || '')
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  // Zeilen über 75 Oktette faltet das Format mit einem Leerzeichen am
  // Anfang der Folgezeile ("line folding"). Manche Kalender stolpern über
  // zu lange Zeilen, deshalb hier gleich richtig.
  function icsFold(zeile) {
    if (zeile.length <= 74) return zeile;
    const teile = [zeile.slice(0, 74)];
    let rest = zeile.slice(74);
    while (rest.length > 73) {
      teile.push(' ' + rest.slice(0, 73));
      rest = rest.slice(73);
    }
    if (rest) teile.push(' ' + rest);
    return teile.join('\r\n');
  }

  function buildIcs(e) {
    const f = calFields(e);
    const stempel = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const uid = `${f.start.replace(/-/g, '')}-${Math.abs(hashString(f.titel + f.ort))}@antdon930.github.io`;
    const zeilen = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Ausdauersport-Events//events.html//DE',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${stempel}`,
      `DTSTART;VALUE=DATE:${f.start.replace(/-/g, '')}`,
      `DTEND;VALUE=DATE:${f.endeExklusiv.replace(/-/g, '')}`,
      `SUMMARY:${icsEscape(f.titel)}`,
      `LOCATION:${icsEscape(f.ort)}`,
      `DESCRIPTION:${icsEscape(f.beschreibung)}`,
      'TRANSP:TRANSPARENT'
    ];
    if (f.url) zeilen.push(`URL:${icsEscape(f.url)}`);
    zeilen.push('END:VEVENT', 'END:VCALENDAR');
    return zeilen.map(icsFold).join('\r\n') + '\r\n';
  }

  // Kurzer, stabiler Zahlenwert aus einem Text - nur für die UID des
  // Kalendereintrags, damit derselbe Lauf nicht als neuer Termin gilt.
  function hashString(text) {
    let h = 0;
    for (let i = 0; i < text.length; i++) {
      h = (h * 31 + text.charCodeAt(i)) | 0;
    }
    return h;
  }

      + `&details=${encodeURIComponent(f.beschreibung)}`
      + `&location=${encodeURIComponent(f.ort)}`;

      + '&allday=true'

      + `&startdt=${f.start}`

      btn.setAttribute('aria-expanded', 'false');
    });

    // Klick daneben oder Escape schließt das Menü. Der Zuhörer wird nur
    // EINMAL angemeldet (renderDetail baut den Bereich bei jedem Klick

      });

        m.hidden = true;

  // Zwei Wege zur .ics-Datei:
  //
  //   1. Apple-Gerät UND der Service Worker antwortet wirklich ->
  //      Navigation im selben Tab auf "kalender/<Name>.ics?d=<base64>".
  //      sw.js erfindet dort eine Antwort mit Inhaltstyp text/calendar
  //      und Content-Disposition: inline - erst diese Kopfzeilen bringen
  //      Safari dazu, den Termin dem Kalender anzubieten. Ein Blob oder
  //      data-URI hat sie nicht und wird zum Download ("Unknown.ics" in
  //      einem about:blank-Tab, wie vom Nutzer gemeldet).
  //   2. Sonst Download der Datei (Outlook-Programm, Thunderbird und Co.
  //      importieren sie per Doppelklick).
  //
  // WICHTIG: Vor der Navigation wird die Adresse einmal per fetch()
  // GEPRÜFT. Ein vorhandener `controller` heißt auf iOS nämlich nicht,
  // dass der Worker die nächste Navigation auch bedient - wurde die Seite
  // geladen, bevor er die Kontrolle übernahm, geht die Anfrage ins Netz,
  // und dort gibt es den Ordner /kalender/ nicht: Der Nutzer landete auf
  // der 404-Seite von GitHub Pages. Antwortet die Probe nicht mit
  // text/calendar, wird heruntergeladen.
  async function openIcs(e, f) {
    const ics = buildIcs(e);
    const name = calFileName(f.titel) + '.ics';

    if (istAppleGeraet() && navigator.serviceWorker && navigator.serviceWorker.controller) {
      // base64url: die Daten hängen in der Adresse, "+" und "/" hätten
      // dort eine andere Bedeutung. btoa() arbeitet byteweise, deshalb
      // der Umweg über encodeURIComponent für Umlaute.
      const b64 = btoa(unescape(encodeURIComponent(ics)))
        .replace(/\+/g, '-').replace(/\//g, '_');
      const url = `kalender/${name}?d=${b64}`;
      try {
        const probe = await fetch(url, { cache: 'no-store' });
        const typ = probe.headers.get('content-type') || '';
        if (probe.ok && typ.includes('text/calendar')) {
          // Navigation im selben Tab, kein window.open: bleibt Safari doch
          // beim Download, wäre ein geöffnetes Fenster ein leerer
          // about:blank-Tab. Die Filter stehen in der Adresse, die Liste
          // ist mit "Zurück" unverändert wieder da.
          window.location.href = url;
          return;
        }
      } catch (err) {
        /* Netzfehler o. Ä. - dann eben herunterladen */
      }
    }

    downloadIcs(ics, name);
  }

  // Blob-Download. Der Blob entsteht erst beim Klick und wird danach
  // freigegeben; einer pro angezeigtem Event wäre ein Leck.
  function downloadIcs(ics, name) {
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  function calFileName(titel) {
    return (titel || 'event')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-zA-Z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60) || 'event';
  }

  // ---------- Fehler melden ----------
  // Reihenfolge = Reihenfolge im Drop-down. Die Schluessel landen
  // unveraendert in Firestore (Feld "kategorie") und werden von
  // scripts/review_reports.py wieder erkannt - also nicht umbenennen,
  // ohne dort nachzuziehen.
  const REPORT_CATEGORIES = [
    'laenge', 'datum', 'ort', 'url', 'sportart', 'name', 'doppelt', 'abgesagt', 'sonstiges'
  ];
  const REPORT_DESC_MAX = 600;
  const REPORT_DESC_MIN = 10;

  const reportOverlay = document.getElementById('report-overlay');
  const reportDialogEl = reportOverlay.querySelector('.ee-modal');
  const reportBodyEl = document.getElementById('report-body');

  document.getElementById('report-close').addEventListener('click', closeReportModal);
  reportOverlay.addEventListener('click', (evt) => {
    if (evt.target === reportOverlay) closeReportModal();
  });
  document.addEventListener('keydown', (evt) => {
    if (evt.key === 'Escape' && !reportOverlay.hidden) closeReportModal();
  });

  function closeReportModal() {
    reportOverlay.hidden = true;
    reportBodyEl.innerHTML = '';
  }

  function openReportModal(e) {
    const kmText = formatLength(e);
    const wb = displayWettbewerb(e);
    reportBodyEl.innerHTML = `
      <h2 id="report-heading">${escapeHtml(t('report_title'))}</h2>
      <div class="report-event-summary">
        <strong>${escapeHtml(e.name)}</strong>
        <span>${escapeHtml(formatRange(e.datum_start, e.datum_ende))} &middot; ${escapeHtml(e.standort)} &middot; ${escapeHtml(kmText)}${wb ? ' &middot; ' + escapeHtml(wb) : ''}</span>
      </div>
      <p class="report-intro">${escapeHtml(t('report_intro'))}</p>
      <div id="report-msg"></div>
      <form id="report-form">
        <div class="ee-field">
          <label for="report-kategorie">${escapeHtml(t('report_field_label'))}</label>
          <select id="report-kategorie" autocomplete="off">
            <!-- Leere Vorauswahl: es soll bewusst nichts vorbelegt sein,
                 sonst wandert eine unbeabsichtigte Kategorie in die
                 Meldung. Die Pflicht-Pruefung sitzt im submit-Handler. -->
            <option value="" selected>${escapeHtml(t('report_field_placeholder'))}</option>
            ${REPORT_CATEGORIES.map(k => `<option value="${k}">${escapeHtml(t('report_cat_' + k))}</option>`).join('')}
          </select>
        </div>
        <div class="ee-field">
          <label for="report-desc">${escapeHtml(t('report_desc_label'))}</label>
          <textarea id="report-desc" maxlength="${REPORT_DESC_MAX}" placeholder="${escapeHtml(t('report_desc_placeholder'))}"></textarea>
          <div class="report-counter" id="report-counter">0 / ${REPORT_DESC_MAX}</div>
        </div>
        <button type="submit" class="ee-submit-btn" id="report-submit">${escapeHtml(t('report_send'))}</button>
      </form>
    `;
    reportOverlay.hidden = false;

    // Bewusst ohne required-Attribute: die Browser-Blase ist nicht
    // uebersetzt und passt optisch nicht zum Dialog - validiert wird
    // unten im submit-Handler mit den eigenen i18n-Texten.
    const form = reportBodyEl.querySelector('#report-form');
    const selectEl = reportBodyEl.querySelector('#report-kategorie');
    const descEl = reportBodyEl.querySelector('#report-desc');
    const counterEl = reportBodyEl.querySelector('#report-counter');
    const msgEl = reportBodyEl.querySelector('#report-msg');
    const submitEl = reportBodyEl.querySelector('#report-submit');

    descEl.addEventListener('input', () => {
      counterEl.textContent = `${descEl.value.length} / ${REPORT_DESC_MAX}`;
    });
    // Bewusst KEIN focus() auf das Drop-down: ein fokussiertes <select>
    // klappt in mehreren Browsern sofort auf, und der Dialog begruesst
    // einen dann mit einer offenen Liste. Stattdessen den Dialog selbst
    // fokussieren - damit liegt der Tastaturfokus im Dialog, die Auswahl
    // bleibt aber leer und zu, bis jemand sie anfasst.
    reportDialogEl.focus({ preventScroll: true });

    function setMsg(text, kind) {
      msgEl.innerHTML = text ? `<div class="ee-form-msg ${kind}">${escapeHtml(text)}</div>` : '';
    }

    form.addEventListener('submit', (evt) => {
      evt.preventDefault();
      const kategorie = selectEl.value;
      const beschreibung = descEl.value.trim();
      if (!kategorie) { setMsg(t('report_err_field'), 'error'); return; }
      if (beschreibung.length < REPORT_DESC_MIN) { setMsg(t('report_err_desc'), 'error'); descEl.focus(); return; }
      setMsg(null);
      submitEl.disabled = true;
      submitEl.textContent = t('report_sending');
      window.EndauranceAuth.reportEventError({ event: e, kategorie, beschreibung })
        .then(() => {
          setMsg(t('report_thanks'), 'success');
          // Formular nach dem Absenden entfernen, damit dieselbe Meldung
          // nicht versehentlich zweimal abgeschickt wird.
          form.querySelectorAll('.ee-field').forEach(el => el.remove());
          submitEl.remove();
          window.setTimeout(() => { if (!reportOverlay.hidden) closeReportModal(); }, 2500);
        })
        .catch((err) => {
          submitEl.disabled = false;
          submitEl.textContent = t('report_send');
          setMsg(reportErrorMessage(err), 'error');
        });
    });
  }

  // Firebase-Fehlercodes in verstaendliche Saetze uebersetzen. Der Fall
  // "auth/operation-not-allowed" bzw. "auth/admin-restricted-operation"
  // heisst konkret: der Anbieter "Anonym" ist in der Firebase-Konsole
  // noch nicht aktiviert (Authentication -> Sign-in method).
  function reportErrorMessage(err) {
    const code = (err && (err.code || err.message)) || '';
    if (code === 'not-configured') return t('report_err_config');
    if (code === 'auth/operation-not-allowed' || code === 'auth/admin-restricted-operation') {
      return t('report_err_anon');
    }
    return t('report_err_save');
  }

  function updateFilterIndicators() {
    document.querySelectorAll('.col-filter-btn').forEach(btn => {
      const col = btn.dataset.col;
      let active = false;
      if (col === 'land') active = state.land.size > 0;
      else if (col === 'name') active = !!state.nameQuery.trim();
      else if (col === 'art1') active = state.art1.size > 0;
      else if (col === 'art2') active = state.art2.size > 0;
      else if (col === 'standort') active = state.standort.size > 0 || !!(state.origin && state.radiusKm != null);
      else if (col === 'datum') active = state.selectedDays.size > 0;
      else if (col === 'laenge_km') active = state.laengeMin !== '' || state.laengeMax !== '' || state.distanceCategories.size > 0;
      btn.classList.toggle('has-filter', active);
      btn.classList.toggle('open', openColKey === col);
    });
  }

  function renderChips() {
    const chips = [];
    if (state.nameQuery.trim()) chips.push({ label: t('chip_name', state.nameQuery.trim()), clear: () => { state.nameQuery = ''; } });
    if (state.selectedDays.size > 0) {
      // Sind alle vorhandenen Termine ausgewählt, ist "Datum: Alle"
      // aussagekräftiger als "Datum: 812 Tage ausgewählt" - gleiche
      // Logik wie bei den Mengen-Filtern unten.
      const alleTage = uniqueSorted(events.map(e => e.datum_start)).length;
      const preset = DATE_PRESETS.find(p => p.key === state.datePreset);
      const label = preset
        ? t('chip_datum_preset', t(preset.labelKey))
        : state.selectedDays.size >= alleTage
          ? t('chip_datum_all')
          : t('chip_datum', state.selectedDays.size);
      chips.push({ label, clear: () => { state.selectedDays.clear(); state.datePreset = null; } });
    }
    // Mengen-Filter (Land, Stadt/Ort, Sportart, Kategorie): NICHT jeden
    // ausgewählten Wert als eigenen Chip. "Alle" im Stadt/Ort-Filter
    // wählte sonst ~2000 Orte aus und schob die ganze Liste mit
    // "Stadt/Ort: Aachen ×"-Chips aus dem Bild. Stattdessen:
    //   alles ausgewählt      -> ein Chip "Stadt/Ort: Alle"
    //   mehr als MAX_VALUE_CHIPS -> ein Chip "Stadt/Ort: 12 ausgewählt"
    //   wenige Werte          -> wie gehabt ein Chip pro Wert
    // Das ✕ eines Sammel-Chips löscht den ganzen Filter - genau wie beim
    // Datums-Chip, der schon immer so gezählt hat.
    pushSetChips('land', 'chip_land', v => tv('land', v));
    pushSetChips('standort', 'chip_standort', v => v);
    pushSetChips('art1', 'chip_sportart', v => tv('art1', v));
    pushSetChips('art2', 'chip_kategorie', v => tv('art2', v));

    function pushSetChips(stateKey, chipKey, format) {
      const selected = state[stateKey];
      if (selected.size === 0) return;
      const column = COLUMNS.find(c => c.key === stateKey);
      const optionCount = column && column.options
        ? column.options().length
        : uniqueSorted(events.map(e => e[stateKey])).length;
      if (optionCount > 0 && selected.size >= optionCount) {
        chips.push({ label: t(chipKey, t('chip_value_all')), clear: () => selected.clear() });
        return;
      }
      if (selected.size > MAX_VALUE_CHIPS) {
        chips.push({
          label: t(chipKey, t('chip_value_count', selected.size)),
          clear: () => selected.clear()
        });
        return;
      }
      selected.forEach(v => chips.push({ label: t(chipKey, format(v)), clear: () => selected.delete(v) }));
    }
    if (state.laengeMin !== '') chips.push({ label: t('chip_laenge_ab', state.laengeMin), clear: () => { state.laengeMin = ''; } });
    if (state.laengeMax !== '') chips.push({ label: t('chip_laenge_bis', state.laengeMax), clear: () => { state.laengeMax = ''; } });
    if (state.distanceCategories.size > MAX_VALUE_CHIPS) {
      chips.push({
        label: t('chip_distanz_count', state.distanceCategories.size),
        clear: () => state.distanceCategories.clear()
      });
    } else state.distanceCategories.forEach(compositeKey => {
      const sep = compositeKey.indexOf(':');
      const sport = compositeKey.slice(0, sep);
      const catKey = compositeKey.slice(sep + 1);
      const label = DISTANCE_CATEGORY_LABELS[currentLang][catKey] || catKey;
      chips.push({ label: t('chip_distanz', tv('art1', sport), label), clear: () => state.distanceCategories.delete(compositeKey) });
    });
    if (state.origin && state.radiusKm != null) {
      // Das Kreuz am Chip entfernt den Ausgangspunkt gleich mit: ein
      // Ausgangspunkt ohne Umkreis filtert nichts und stünde nur noch
      // unsichtbar im Panel.
      chips.push({
        label: t('chip_umkreis', state.radiusKm, state.origin.label),
        clear: () => { setOrigin(null); }
      });
    }

    chipsEl.innerHTML = '';
    chips.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(c.label)} <button aria-label="✕">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        c.clear();
        selectedIndex = null;
        render();
      });
      chipsEl.appendChild(chip);
    });
  }

  function resetFilters() {
    state.land.clear();
    state.art1.clear();
    state.art2.clear();
    state.standort.clear();
    state.nameQuery = '';
    state.selectedDays.clear();
    state.datePreset = null;
    state.laengeMin = '';
    state.laengeMax = '';
    state.distanceCategories.clear();
    state.origin = null;
    state.radiusKm = null;
    state.sortKey = 'datum';
    state.sortDir = 'asc';
    placeQuery = '';
    selectedIndex = null;
    closeFloatingPanel();
    buildHeader();
    render();
  }
})();
</script>
</body>
</html>
