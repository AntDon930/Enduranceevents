<!-- Seitensymbol. Ohne diese Zeilen fragt jeder Browser von sich aus
     /favicon.ico an und bekommt von GitHub Pages die 404-Seite - der Tab
     bleibt leer. Eine SVG-Datei reicht fuer alle Groessen; das PNG
     braucht nur iOS fuer den Startbildschirm (dort rundet das System die
     Ecken selbst, deshalb ist es randvoll). -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Farbschema hell/dunkel (siehe site.css). Läuft hier im Kopf, damit die
     Seite nicht erst im falschen Schema aufblitzt: gespeicherte Wahl
     (endurance-theme) vor der Systemeinstellung. Der Knopf .theme-btn in
     der Kopfzeile schaltet um. In allen drei Seiten WORTGLEICH -
     test_scraper_lib.py (test_farbschema_skript) vergleicht die Kopien. -->
<script>
(function () {
  var wahl = null;
  try { wahl = localStorage.getItem('endurance-theme'); } catch (e) { /* privater Modus */ }
  var hell = wahl ? wahl === 'light'
    : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  var setze = function (h) {
    document.documentElement.setAttribute('data-theme', h ? 'light' : 'dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', h ? '#ffffff' : '#0b1220');
  };
  setze(hell);
  document.addEventListener('DOMContentLoaded', function () {
    var knopf = document.querySelector('.theme-btn');
    if (!knopf) return;
    knopf.addEventListener('click', function () {
      hell = document.documentElement.getAttribute('data-theme') !== 'light';
      setze(hell);
      try { localStorage.setItem('endurance-theme', hell ? 'light' : 'dark'); } catch (e) { /* ignorieren */ }
    });
  });
})();
</script>

<!-- Leaflet, markercluster und die Firebase-SDKs liegen im Repo
     (vendor/), nicht auf einem CDN. Zwei Gründe:

     1. Datenschutz: Ein CDN-Abruf überträgt die IP-Adresse jedes
        Besuchers an unpkg bzw. Google - und zwar bei JEDEM Aufruf, auch
        wenn niemand sich anmeldet. Was die Seite gar nicht an Dritte
        schickt, muss die Datenschutzerklärung auch nicht erklären.
     2. Verlässlichkeit: Die Version im Ordner ist die Version, die
        ausgeliefert wird. Kein fremder Ausfall, keine stille Änderung,
        keine Integrity-Prüfung nötig (gleiche Herkunft).

     Die Dateien sind die unveränderten Originale; ihre SHA-256-Summen
     stimmen mit den SRI-Werten überein, die vorher im HTML standen
     (geprüft beim Umstellen). Aktualisieren heißt: neue Version in einen
     neuen Ordner legen (vendor/leaflet-1.9.4 -> …-1.9.5) und die
     Verweise umhängen - dann ist der Pfad die Versionsangabe und kein
     Browser-Cache kann einen halben Stand mischen. -->
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css">
<!-- Zusammenfassen der Marker (Leaflet.markercluster). Nur MarkerCluster.css,
     NICHT MarkerCluster.Default.css: das Aussehen der Bündel steht unten bei
     .cluster-badge, das Stylesheet hier bringt allein die Bewegung beim
     Auf- und Zuklappen und die Spinnenbeine. -->

<!-- events.json ist das, worauf die Seite wartet - deshalb wird der

     filters.js und filter-ui.js geladen UND ausgefuehrt waren. -->

<style>
  /* Farben, Kopfzeile, Filterleiste, Werkzeugleiste und Fußzeile stehen
     in site.css (geteilt mit Liste und Startseite); hier nur, was allein
     die Karte hat. Aufbau seit dem 21.09.2026 nach der Vorlage des
     Nutzers: die Karte randlos unter der Filterleiste, FLACH gezeichnet
     (Landfläche hell, außen grau mit feinem Raster, die OSM-Kacheln erst
     ab Zoom TILES_AB_ZOOM), Bündel als Marine-Kreise mit dem Namen des
     größten Ortes, einzelne Orte als Nadel in der Farbe der Sportart,
     Orientierungsorte als graue Punkte, Legende unten links, "Mein
     Standort" unter den Zoom-Knöpfen. Alle Farben aus den Variablen in
     site.css, damit beide Farbschemata stimmen. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }

  .map-wrap {
    flex: 1;
    min-height: 60vh;
    position: relative;
    background: var(--map-bg);
  }
  #map { position: absolute; inset: 0; }
  /* Die Fläche außerhalb der Länder: grau mit feinem Raster. Das Raster
     steht fest und wandert nicht mit - ein Papier, keine
     Gradnetz-Zeichnung. Leaflet setzt selbst ein #ddd, daher die Regel. */
  #map.leaflet-container {
    background-color: var(--map-bg);
    background-image:
      linear-gradient(var(--map-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--map-grid) 1px, transparent 1px);
    background-size: 48px 48px;
    font-family: inherit;
  }
  /* Flach (Zoom < TILES_AB_ZOOM): die Kacheln bleiben geladen, sind aber
     unsichtbar - beim Hineinzoomen sind sie sofort da, und der Rauchtest
     zählt sie (noWrap). Darüber gefiltert, damit sie zur Fläche passen. */
  .leaflet-tile-pane { filter: var(--map-tile-filter); }
  .map-flach .leaflet-tile-pane { visibility: hidden; }
  /* Landfläche, Schleier und Umkreis: Farbe über CSS, damit sie dem
     Farbschema folgt (Leaflet schreibt fill/stroke als Attribut; eine
     CSS-Regel gewinnt gegen ein Attribut). */
  path.land-pfad { fill: var(--map-land); stroke: var(--map-outline); }
  path.maske-pfad { fill: var(--map-mask); fill-opacity: var(--map-mask-opacity); }
  path.umkreis-pfad { stroke: var(--accent); fill: var(--accent); }

  /* Bündel (und Orte mit mehreren Events): Kreis in der Akzentfarbe mit
     der Event-Zahl, Ring in Panelfarbe, der Ortsname rechts daneben. Die
     Zahl steht ALLEIN im Kreis - der Rauchtest addiert die Kreise
     (parseInt) gegen die Legende. */
  .cluster-mark { position: relative; }
  .cluster-badge, .marker-badge {
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.8rem;
    border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--border-strong), 0 4px 12px rgba(0, 0, 0, 0.22);
  }
  .marker-badge { font-size: 0.74rem; border-width: 2px; }
  .cluster-label {
    position: absolute;
    left: calc(100% + 6px);
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    text-shadow: 0 0 3px var(--map-halo), 0 0 3px var(--map-halo), 0 0 6px var(--map-halo);
    pointer-events: none;
  }
  /* Beschriftungen, die einem Nachbarn im Weg wären, wandern nach links
     oder verschwinden (ordneBeschriftungen). */
  .cluster-label.label-links { left: auto; right: calc(100% + 6px); }
  .cluster-label.label-versteckt { visibility: hidden; }
  /* Ein Ort mit genau EINEM Event: eine Nadel in der Farbe der Sportart
     mit deren Symbol. Die "1" darin ist nur für Screenreader und den
     Rauchtest da (.marker-badge.sr-only). */
  .marker-pin { position: relative; width: 30px; height: 40px; color: var(--sport-laufen); }
  .marker-pin.sport-fahrrad { color: var(--sport-fahrrad); }
  .marker-pin.sport-schwimmen { color: var(--sport-schwimmen); }
  .marker-pin.sport-triathlon { color: var(--sport-triathlon); }
  .marker-pin .pin-shape { position: absolute; inset: 0; width: 30px; height: 40px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3)); }
  .marker-pin .pin-icon { position: absolute; left: 8px; top: 7.5px; width: 14px; height: 14px; display: block; }
  .marker-pin .pin-icon svg { display: block; }
  /* Orientierungsorte ohne eigenes Bündel (Basel, Bern, Linz …): grauer
     Punkt mit Namen, nicht anklickbar. Sie verschwinden, sobald ein
     Bündel auf ihnen liegt oder die Kacheln die Namen liefern
     (blendeReferenzAus). */
  .ref-city {
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap; font-size: 0.74rem; color: var(--text-muted);
    text-shadow: 0 0 3px var(--map-halo), 0 0 3px var(--map-halo);
    pointer-events: none;
  }
  .ref-city .ref-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); border: 1.5px solid var(--map-land); flex-shrink: 0; }
  .ref-city.ref-hidden { visibility: hidden; }
  /* Ausgangspunkt der Umkreissuche: deutlich anders als die Marker. */
  .origin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--border-strong), 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  /* Leaflet-Bedienelemente in den Seitenfarben. */
  .leaflet-bar { border: 1px solid var(--border) !important; border-radius: 10px !important; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14) !important; overflow: hidden; }
  .leaflet-bar a { background: var(--panel) !important; color: var(--text) !important; border-bottom-color: var(--border) !important; }
  .leaflet-bar a.leaflet-disabled { color: var(--text-muted) !important; }
  .leaflet-control-attribution { background: var(--panel) !important; color: var(--text-muted) !important; font-size: 0.7rem; border-radius: 8px 0 0 0; padding: 3px 8px; }
  .leaflet-control-attribution a { color: var(--text) !important; }
  /* "Mein Standort" unter den Zoom-Knöpfen (StandortControl). */
  .standort-control { background: none !important; border: none !important; box-shadow: none !important; overflow: visible; }
  .standort-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 12px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
    font: inherit; font-size: 0.84rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .standort-btn:hover { border-color: var(--border-strong); }
  .standort-btn svg { flex-shrink: 0; }
  /* Legende unten links: Trefferzahl (#map-hint - der Rauchtest liest
     die erste Zahl) und die vier Sportfarben. Über der Karte (800),
     unter den Detail-Boxen (900). */
  .map-legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 800;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px;
    max-width: calc(100% - 24px);
    padding: 8px 14px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-muted);
    box-shadow: var(--shadow);
    font-size: 0.82rem;
  }
  .map-legend .result-count { font-size: 0.98rem; color: var(--text); }
  .legend-sep { width: 1px; height: 18px; background: var(--border); }
  .legend-items { display: inline-flex; flex-wrap: wrap; gap: 8px 14px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sport-laufen); flex-shrink: 0; }
  .legend-dot.sport-fahrrad { background: var(--sport-fahrrad); }
  .legend-dot.sport-schwimmen { background: var(--sport-schwimmen); }
  .legend-dot.sport-triathlon { background: var(--sport-triathlon); }
  /* Ohne gesetzten Filter ist die Werkzeugleiste (Chips, "Filter
     löschen") leer und weg - die Pillen zeigen den Stand schon selbst. */
  .toolbar[hidden] { display: none; }
  .toolbar { padding-top: 10px; padding-bottom: 10px; }

  /* Das Leaflet-Popup (ab drei Events an einem Ort) ist immer weiß -
     feste Farben statt der Seitenvariablen, sonst wäre im dunklen
     Schema helle Schrift auf Weiß unlesbar. */
  .popup-title { font-weight: 700; margin-bottom: 2px; color: #1c1f24; }
  .popup-sub { color: #6b7280; font-size: 0.82rem; margin-bottom: 8px; }
  .popup-link {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    background: #0f1b33;
    color: #fff !important;
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .leaflet-popup-content { margin: 10px 12px; min-width: 220px; }
  .popup-events {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
    max-height: 200px;
    overflow-y: auto;
  }
  .popup-event {
    display: block;
    width: 100%;
    text-align: left;
    padding: 5px 6px;
    margin: 0;
    border: none;
    border-radius: 6px;
    background: none;
    color: #1c1f24;
    font: inherit;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .popup-event:hover, .popup-event:focus-visible { background: #eef2f8; color: #0b1220; outline: none; }
  .popup-event .pe-meta { display: block; color: #6b7280; font-size: 0.75rem; }

  /* Die Detail-Boxen oben rechts ÜBER der Karte: dieselbe Box wie in der
     Liste (event-detail.css), bis zu zwei, die neueste zuerst. Über den
     Leaflet-Bedienelementen (800) und dem Popup (700), unter dem
     Filter-Panel (1000). */
  .map-details {
    position: absolute;
    z-index: 900;
    top: 10px;
    right: 10px;
    width: min(360px, calc(100% - 20px));
    max-height: calc(100% - 20px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .map-details:empty { display: none; }
  .map-details .detail-panel {
    padding: 16px;
    box-shadow: var(--shadow);
  }
  /* Breite Karte: zwei Boxen NEBENEINANDER, die neueste rechts außen -
     übereinander passten zwei nicht in die Kartenhöhe. */
  @media (min-width: 900px) {
    .map-details {
      flex-direction: row-reverse;
      align-items: flex-start;
      width: auto;
      max-width: calc(100% - 80px);
    }
    .map-details .detail-panel { width: 340px; flex: none; }
  }
  /* Handy: unter den Zoom-Knöpfen, sonst verdeckt die Box beide; die
     Legende über der Quellenangabe. */
  @media (max-width: 599px) {
    .map-details { top: 60px; max-height: calc(100% - 70px); }
    .map-legend { bottom: 30px; padding: 6px 10px; gap: 6px 10px; font-size: 0.76rem; }
    .map-legend .result-count { font-size: 0.9rem; }
  }
  .map-details .detail-panel .detail-date { font-size: 1.3rem; }
  .map-details .detail-panel h2 { font-size: 1.15rem; }
</style>

<script>
(async function () {
  // Gemeinsamer Filterzustand mit events.html (filters.js): Die Karte
  // liest die Filter aus derselben Adresse und prüft sie mit denselben
  // Funktionen. Ein Marker zeigt damit genau die Events, die in der Liste
  // auch zu sehen wären - vorher zeigte die Karte immer alle.
  const EF = window.EnduranceFilters;
  const EFU = window.EnduranceFilterUI;
  const EED = window.EnduranceDetail;

  // Sicherung gegen eine halb alte Seite: GitHub Pages liefert jede Datei
  // mit max-age=600, ein Browser kann also diese Seite mit einer zehn
  // Minuten alten filters.js kombinieren. Fehlt darin eine Funktion,
  // bricht das Skript in seiner ersten Zeile ab - die Seite blieb dann
  // LEER (blauer Kopf, sonst nichts; genau das ist passiert). Die
  // ?v=<Stempel>-Anhänge an den Skripten sollen das verhindern
  // (scripts/stamp_assets.py), hier steht die Notbremse, falls doch.
  if (!EF || !EFU || !EED || !EF.uniqueSorted || !EFU.create || !EED.render) {
    let spracheDe = true;
    try { spracheDe = localStorage.getItem('endurance-lang') !== 'en'; } catch (e) { /* ignorieren */ }
    document.getElementById('page-title').textContent =
      spracheDe ? 'Bitte neu laden' : 'Please reload';
    document.getElementById('subtitle').textContent = spracheDe
      ? 'Der Browser hat eine veraltete Programmdatei gespeichert. Einmal neu laden genügt (auf dem iPhone/iPad: Seite schließen und wieder öffnen).'
      : 'Your browser kept an outdated script file. Just reload the page (on iPhone/iPad: close the tab and open it again).';
    return;
  }

  const I18N = {
    de: {
      title: 'Karte',
      subtitle: 'Klicke auf einen Marker, um die Events an diesem Ort in der Liste zu sehen.',
      list: 'Liste',
      abo: 'E-Mail-Abo',
      standort_btn: 'Mein Standort',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende',
      nav_events: 'Events',
      datum_fussnote: '* Termin noch nicht veröffentlicht – Monat laut Vorjahr',
      hint: (n) => `${n} Events`,
      hint_empty: 'Kein Event entspricht den Filtern.',
      load_error: (msg) => `Konnte events.json nicht laden: ${msg}`,
      popup_count: (n) => `${n} Event${n === 1 ? '' : 's'}`,
      popup_strecken: (n) => `${n} Strecken`,
      // Ohne "↗": Der Pfeil sah am Knopf aus wie ein Stempel (vom
      // Nutzer gemeldet). Dass der Link in die Liste führt, sagt der
      // Text schon.
      popup_link: (n) => `${n} Event${n === 1 ? '' : 's'} in der Liste anzeigen`,
      filter_label: 'Filter:',
      reset: 'Filter löschen',
      footer_imprint: 'Impressum',
      footer_privacy: 'Datenschutz',
      origin_title: 'Ausgangspunkt'
    },
    en: {
      title: 'Map',
      subtitle: 'Click a marker to see the events at that location in the list.',
      list: 'List',
      abo: 'Email alerts',
      standort_btn: 'My location',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      nav_events: 'Events',
      datum_fussnote: '* exact date not yet published – month as in the previous year',
      hint: (n) => `${n} events`,
      hint_empty: 'No event matches the filters.',
      load_error: (msg) => `Could not load events.json: ${msg}`,
      popup_count: (n) => `${n} event${n === 1 ? '' : 's'}`,
      popup_strecken: (n) => `${n} distances`,
      popup_link: (n) => `View ${n} event${n === 1 ? '' : 's'} in the list`,
      filter_label: 'Filters:',
      reset: 'Clear filters',
      footer_imprint: 'Legal notice',
      footer_privacy: 'Privacy',
      origin_title: 'Starting point'
    }
  };
  // Chip- und Zeitraum-Texte aus filters.js, die Texte der Filter-Panels
  // und die Spaltennamen aus filter-ui.js - die Karte beschriftet die
  // Filter damit wortgleich wie die Liste.
  Object.assign(I18N.de, EF.I18N.de, EFU.I18N.de, EED.I18N.de);
  Object.assign(I18N.en, EF.I18N.en, EFU.I18N.en, EED.I18N.en);

  let currentLang = 'de';
  try {
    const saved = localStorage.getItem('endurance-lang');
    if (saved === 'de' || saved === 'en') currentLang = saved;
  } catch (e) { /* localStorage evtl. nicht verfügbar (privater Modus) */ }

  const t = (key, ...args) => {
    const entry = I18N[currentLang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  };

  const tv = (field, value) => {
    if (value == null) return value;
    const entry = EF.VALUE_TRANSLATIONS[field] && EF.VALUE_TRANSLATIONS[field][value];
    return entry ? entry[currentLang] : value;
  };

  const titleEl = document.getElementById('page-title');
  const subtitleEl = document.getElementById('subtitle');
  const listLabelEl = document.getElementById('list-btn-label');
  const hintEl = document.getElementById('map-hint');
  const listTextEl = document.getElementById('list-btn-text');
  const navEventsEl = document.getElementById('nav-events');
  const filterButtonsEl = document.getElementById('filter-buttons');
  const chipsEl = document.getElementById('active-chips');
  const resetBtnEl = document.getElementById('reset-btn');
  const toolbarEl = document.getElementById('toolbar');
  const aboBtnEl = document.getElementById('abo-btn');
  const legendSportsEl = document.getElementById('legend-sports');

  // Der Filterzustand selbst (Land, Sportart, Umkreis …) - dieselbe
  // Struktur wie in der Liste, gelesen und geschrieben über dieselbe
  // Adresse. Gesetzt wird er hier mit denselben Knöpfen und Panels.
  const state = EF.createState();
  // Die reinen Ansichts-Parameter der Liste (Sortierung, Zusammenfassen)
  // versteht die Karte nicht, sie trägt sie aber unverändert weiter:
  // sonst verlöre der Weg Liste -> Karte -> Liste die Ansicht.
  const listenAnsicht = {};
  let events = [];
  let alleStandorte = new Set();
  let alleTage = [];

  const escapeHtml = EF.escapeHtml;

  // Karte initialisieren, Mittelpunkt/Zoom grob auf D/A/CH.
  // Der Rahmen der Karte: EUROPA, nicht die Welt und nicht nur DACH.
  // Nur Europa - beim Herauszoomen lag Europa vorher als Briefmarke
  // mitten in einer dreifach nebeneinander gezeichneten Weltkarte (vom
  // Nutzer gemeldet). Europa statt DACH, damit die Karte nicht angefasst
  // werden muss, wenn weitere Länder dazukommen (so vom Nutzer
  // entschieden).
  const EUROPA_BOUNDS = L.latLngBounds([34.0, -13.0], [71.5, 42.0]);
  const map = L.map('map', {
    // Begrenzt das Verschieben. `maxBoundsViscosity: 1` heißt: harte
    // Kante, die Karte lässt sich nicht über den Rand hinausziehen (bei
    // 0 federt sie nur zurück, was sich nach Fehler anfühlt).
    maxBounds: EUROPA_BOUNDS,
    maxBoundsViscosity: 1,
    // Der kleinste Zoom wird gleich ausgerechnet (setzeMinZoomAufEuropa):
    // Er hängt von der Fenstergröße ab - auf dem Handy passt Europa erst
    // bei Zoom 3 ins Bild, auf einem breiten Bildschirm schon bei 5.
    minZoom: 3,
    // Der Sprung auf die "nächste" Weltkopie beim Ziehen über den
    // Rand - ohne Weltkopien sinnlos.
    worldCopyJump: false,
    // Die Quellenangabe wird unten selbst gesetzt (ohne "Leaflet"-Vorspann
    // und in der Sprache der Seite, siehe setLanguage).
    attributionControl: false
  }).setView([48.5, 10.5], 6);
  const attributionControl = L.control.attribution({ prefix: false }).addTo(map);
  let attributionText = '';
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    // DAS ist der Punkt gegen die dreifache Weltkarte: Ohne `noWrap`
    // zeichnet Leaflet die Kacheln links und rechts der Datumsgrenze
    // beliebig oft weiter.
    noWrap: true
  }).addTo(map);
  // Flach oder mit Kacheln: Bis Zoom 7 zeigt die Karte nur die
  // Landfläche aus laender.json (Vorlage des Nutzers - eine ruhige
  // Übersicht ohne Straßen und Ortsnamen); ab Zoom 8 kommen die
  // OSM-Kacheln, weil man dann Orte und Wege braucht. Die Kacheln
  // werden nicht abgeschaltet, sondern per CSS ausgeblendet
  // (.map-flach): So sind sie beim Hineinzoomen sofort da, und der
  // Rauchtest kann sie weiter zählen (noWrap-Prüfung). Die
  // Orientierungsorte (graue Punkte) gibt es nur in der flachen
  // Ansicht - darüber stehen die Namen auf den Kacheln.
  const TILES_AB_ZOOM = 8;
  function aktualisiereFlach() {
    const flach = map.getZoom() < TILES_AB_ZOOM;
    map.getContainer().classList.toggle('map-flach', flach);
    if (flach && !map.hasLayer(referenzLayer)) referenzLayer.addTo(map);
    if (!flach && map.hasLayer(referenzLayer)) map.removeLayer(referenzLayer);
  }
  map.on('zoomend', aktualisiereFlach);
  // Alles, was beim Filtern neu gezeichnet wird, liegt in einer eigenen
  // Ebene - so muss nur diese geleert werden, nicht die Kachel-Ebene.
  // Es sind ZWEI Ebenen, und das ist wichtig: Die Event-Marker werden
  // gebuendelt (markercluster), der Ausgangspunkt und sein Umkreis dagegen
  // nicht - sonst verschwaende der rote Punkt in einem Buendel.
  // So weit herauszoomen, dass Europa genau das Bild füllt - und keinen
  // Schritt weiter. Eine feste Zahl geht nicht: Auf 390 px passt Europa
  // erst bei Zoom 3 hinein, auf 1.400 px schon bei 5, und mit einer
  // festen 4 sähe man auf dem breiten Bildschirm halb Asien mit (bei
  // einer festen 5 auf dem Handy nur die Alpen).
  // Gerechnet wird über die BREITE, nicht über die ganze Fläche - und
  // das ist der Kern der Sache. Europa ist hochkant (etwa 55° breit,
  // 37° hoch), ein Browserfenster liegt quer. Beide Naheliegenden
  // Varianten waren daneben:
  //   - "Europa passt ganz ins Bild" (getBoundsZoom) ergab auf einem
  //     breiten, niedrigen Fenster Zoom 3: Europa als Briefmarke,
  //     daneben von Kanada bis China alles mit im Bild - genau das,
  //     was der Nutzer nicht will.
  //   - "Das Fenster liegt ganz in Europa" (getBoundsZoom(…, true))
  //     ergab Zoom 6: Man konnte nicht mehr herauszoomen, bis DACH
  //     am Stück zu sehen war.
  // Maßgeblich ist deshalb, wann Europas BREITE das Fenster füllt.
  // Dafür wird ein flacher Streifen über Europas Längengrade gemessen -
  // die Höhe kann dann nichts verderben. Senkrecht begrenzt `maxBounds`.
  const EUROPA_BREITE = L.latLngBounds([48.5, -13.0], [48.6, 42.0]);
  function setzeMinZoomAufEuropa() {
    const z = map.getBoundsZoom(EUROPA_BREITE);
    map.setMinZoom(Math.max(2, Math.min(z, 8)));
  }
  setzeMinZoomAufEuropa();
  // Beim Drehen des Geräts oder Verkleinern des Fensters neu rechnen -
  // sonst bleibt der Wert des ersten Aufrufs stehen.
  let minZoomFrame = null;
  window.addEventListener('resize', () => {
    if (minZoomFrame !== null) return;
    minZoomFrame = requestAnimationFrame(() => {
      minZoomFrame = null;
      setzeMinZoomAufEuropa();
    });
  });

  // ---------- Die graue Maske über allem außerhalb der abgedeckten Länder ----------
  //
  // Zweck: Der Blick soll auf der Region bleiben. Frankreich und Polen
  // sind auf der Karte zu sehen (sie grenzen an), aber sie sind hier
  // nicht das Thema - und ohne Maske sahen sie genauso aus wie
  // Deutschland (vom Nutzer gemeldet).
  //
  // Die Maske ist EIN Polygon: ein großes Rechteck mit den Ländern als
  // Aussparungen. Die Umrisse liegen in `laender.json` (erzeugt von
  // scripts/build_laender.py aus Natural Earth, Public Domain, ~69 KB /
  // 24 KB gezippt). Bewusst eigene Daten statt eines Kachel-Anbieters
  // mit label-armem Stil: Der wäre ein zweiter fremder Server, an den
  // die IP jedes Besuchers geht (siehe README "Nichts von fremden
  // Servern"); die Maske überträgt nichts.
  //
  // Eigene Ebene (`pane`) mit z-index 250: über den Kacheln (200), aber
  // UNTER den Markern und dem Umkreis (400). Läge sie oben, wären die
  // Bündel-Zahlen matt und der rote Ausgangspunkt halb verdeckt.
  // `pointerEvents: none` und `interactive: false`: Die Maske darf
  // keinen Klick abfangen, sonst wären Marker unter ihr nicht mehr
  // anklickbar.
  map.createPane('maskePane');
  map.getPane('maskePane').style.zIndex = 250;
  map.getPane('maskePane').style.pointerEvents = 'none';
  // Die LANDFLÄCHE der abgedeckten Länder (dieselben Umrisse, hell
  // gefüllt) liegt mit z-index 150 UNTER den Kacheln (200): In der
  // flachen Ansicht (Kacheln ausgeblendet) ist sie die Karte, mit
  // Kacheln verschwindet sie darunter. `fillRule: nonzero`, damit ein
  // Ring innerhalb eines anderen (Büsingen in der Schweiz) mitgefüllt
  // wird - bei der Maske dagegen bleibt evenodd (dort spart jeder Ring
  // aus, und der Rauchtest prüft das).
  map.createPane('landPane');
  map.getPane('landPane').style.zIndex = 150;
  map.getPane('landPane').style.pointerEvents = 'none';
  // Orientierungsorte (graue Punkte mit Namen): über der Maske (250),
  // unter den Markern (600); fangen keine Klicks ab.
  map.createPane('referenzPane');
  map.getPane('referenzPane').style.zIndex = 300;
  map.getPane('referenzPane').style.pointerEvents = 'none';
  const referenzLayer = L.layerGroup();
  aktualisiereFlach();

  // Das Rechteck reicht weit über Europa hinaus - `maxBounds` lässt
  // ohnehin nicht weiter, aber so entsteht auch beim Federn am Rand
  // keine unmaskierte Lücke. ±84° statt ±90°: Mehr kennt die
  // Mercator-Projektion nicht.
  const MASKE_AUSSEN = [[-84, -179.9], [84, -179.9], [84, 179.9], [-84, 179.9]];

  function zeichneMaske(laender) {
    // Reihenfolge: erst das Rechteck, dann alle Ringe der Länder. Mit
    // `fill-rule: evenodd` (Leaflet-Voreinstellung) wird jeder Ring
    // darin zur Aussparung - und ein Loch INNERHALB eines Landes wieder
    // grau. Das ist kein Sonderfall für Sonderfälle: Büsingen am
    // Hochrhein ist deutsch und liegt mitten in der Schweiz.
    const laenderRinge = [];
    Object.keys(laender).forEach(name => {
      (laender[name] || []).forEach(ring => {
        // laender.json speichert [lon, lat] (GeoJSON-Reihenfolge),
        // Leaflet erwartet [lat, lon].
        laenderRinge.push(ring.map(([lon, lat]) => [lat, lon]));
      });
    });
    // Erst die Landfläche (unter den Kacheln, siehe landPane) ...
    L.polygon(laenderRinge, {
      pane: 'landPane',
      interactive: false,
      className: 'land-pfad',
      fillRule: 'nonzero',
      weight: 1,
      color: '#c9c9c4',
      fillColor: '#f8f8f6',
      fillOpacity: 1
    }).addTo(map);
    // ... dann der Schleier über allem außerhalb. Farbe und Deckkraft
    // kommen aus dem Stylesheet (path.maske-pfad), damit sie dem
    // Farbschema folgen; die Werte hier sind nur der Rückfall.
    L.polygon([MASKE_AUSSEN].concat(laenderRinge), {
      pane: 'maskePane',
      interactive: false,
      stroke: false,
      className: 'maske-pfad',
      fillColor: '#dcdedf',
      fillOpacity: 0.6
    }).addTo(map);
  }

  // ---------- Orientierungsorte ----------
  //
  // Die flache Karte hat keine Beschriftung - ohne ein paar bekannte
  // Städte wüsste man nicht, wo man ist. Deshalb graue Punkte mit Namen
  // (Vorlage des Nutzers: Basel, Bern, Linz, Wien, Graz …), fest im
  // Code, weil sie nichts mit den Daten zu tun haben. Sie werden
  // ausgeblendet, sobald ein Bündel oder dessen Beschriftung auf ihnen
  // liegt oder ein Bündel denselben Namen trägt (blendeReferenzAus) -
  // sonst stünde "Köln" zweimal nebeneinander.
  const REFERENZ_ORTE = [
    ['Berlin', 52.52, 13.405], ['Hamburg', 53.55, 9.993], ['München', 48.137, 11.575],
    ['Köln', 50.937, 6.96], ['Frankfurt am Main', 50.11, 8.68], ['Stuttgart', 48.776, 9.18],
    ['Düsseldorf', 51.225, 6.776], ['Leipzig', 51.34, 12.37], ['Dortmund', 51.514, 7.466],
    ['Bremen', 53.08, 8.80], ['Dresden', 51.05, 13.74], ['Hannover', 52.375, 9.73],
    ['Nürnberg', 49.45, 11.08], ['Kiel', 54.32, 10.14], ['Rostock', 54.09, 12.10],
    ['Magdeburg', 52.13, 11.63], ['Erfurt', 50.98, 11.03], ['Saarbrücken', 49.24, 6.99],
    ['Freiburg im Breisgau', 47.995, 7.85], ['Regensburg', 49.01, 12.10], ['Münster', 51.96, 7.63],
    ['Kassel', 51.31, 9.49],
    ['Wien', 48.21, 16.37], ['Graz', 47.07, 15.44], ['Linz', 48.31, 14.29], ['Salzburg', 47.80, 13.04],
    ['Innsbruck', 47.27, 11.40], ['Klagenfurt', 46.62, 14.31],
    ['Zürich', 47.38, 8.54], ['Bern', 46.95, 7.45], ['Basel', 47.56, 7.59], ['Genf', 46.20, 6.15],
    ['Lausanne', 46.52, 6.63], ['Luzern', 47.05, 8.31], ['St. Gallen', 47.42, 9.37],
    ['Lugano', 46.00, 8.95], ['Chur', 46.85, 9.53]
  ];
  function baueReferenzOrte() {
    referenzLayer.clearLayers();
    REFERENZ_ORTE.forEach(([name, lat, lon]) => {
      L.marker([lat, lon], {
        pane: 'referenzPane',
        interactive: false,
        keyboard: false,
        icon: L.divIcon({
          className: '',
          html: `<div class="ref-city"><span class="ref-dot"></span><span>${escapeHtml(tv('standort', name))}</span></div>`,
          iconSize: [0, 0],
          // Der Punkt sitzt links in der Zeile, 8 px groß: sein
          // Mittelpunkt liegt auf der Koordinate.
          iconAnchor: [4, 7]
        })
      }).addTo(referenzLayer);
    });
    blendeReferenzAus();
  }
  // Nach jedem Schwenk, Zoom und nach dem Umbau der Bündel werden die
  // Beschriftungen geordnet (ordneBeschriftungen), in zwei Schritten:
  //
  // 1. Die Ortsnamen der BÜNDEL, größte zuerst: Ein Name, der ein anderes
  //    Bündel oder einen schon gesetzten Namen überschneidet, wandert auf
  //    die linke Seite seines Kreises; hilft auch das nicht, verschwindet
  //    er. Die Zahl im Kreis bleibt immer. Ohne das lag bei Zoom 6 "252
  //    Hamburg" über dem Namen von Bremerhaven, bei Zoom 8 stand jede
  //    zweite Beschriftung in einer anderen.
  // 2. Die ORIENTIERUNGSORTE: Ein grauer Punkt samt Name verschwindet,
  //    wenn er ein Bündel, einen Bündel-Namen oder einen wichtigeren
  //    Orientierungsort (weiter vorn in REFERENZ_ORTE) überschneidet -
  //    oder wenn ein Bündel denselben Namen trägt ("Köln" stünde sonst
  //    zweimal nebeneinander).
  //
  // Ausgeblendet wird mit visibility, nicht display: So behält ein Kasten
  // seine Maße, und der Name kommt zurück, sobald wieder Platz ist.
  // Gerechnet wird aus dem DOM (getBoundingClientRect), in EINEM
  // Animationsframe, nie mehrmals hintereinander.
  let ordnenFrame = null;
  let ordnenNachlauf = null;
  function ueberschneidet(a, b, rand) {
    return a.left < b.right + rand && a.right > b.left - rand && a.top < b.bottom + rand && a.bottom > b.top - rand;
  }
  function ordneBeschriftungen(nachlauf) {
    // Ein zweiter Durchgang nach der Bewegung der Marker: markercluster
    // schiebt sie animiert an ihren Platz (~300 ms), der erste Durchgang
    // sähe sonst noch die alten Lagen ("Magdeburg" halb unter Berlin).
    // Und ein dritter nach 1,2 s: Auf einem langsamen Gerät (oder unter
    // Last) ist die Animation nach 450 ms noch nicht fertig.
    if (!nachlauf) {
      clearTimeout(ordnenNachlauf);
      ordnenNachlauf = setTimeout(() => {
        ordneBeschriftungen(true);
        ordnenNachlauf = setTimeout(() => ordneBeschriftungen(true), 750);
      }, 450);
    }
    if (ordnenFrame !== null) return;
    ordnenFrame = requestAnimationFrame(() => {
      ordnenFrame = null;
      const markerPane = map.getPane('markerPane');
      // Belegte Flächen: erst die Kreise und Nadeln, dann die gesetzten
      // Namen. `el` merkt sich, wem eine Fläche gehört - der eigene Kreis
      // zählt für einen Namen nicht als Hindernis.
      const belegt = Array.from(markerPane.querySelectorAll('.cluster-badge, .marker-badge:not(.sr-only), .marker-pin'))
        .map(el => ({ el, rect: el.getBoundingClientRect() }));
      const beschriftungen = Array.from(markerPane.querySelectorAll('.cluster-label'));
      beschriftungen.forEach(l => l.classList.remove('label-links', 'label-versteckt'));
      // Größte Bündel zuerst: Sie behalten ihren Namen, die kleinen
      // weichen aus.
      const zahl = l => parseInt((l.previousElementSibling || {}).textContent, 10) || 0;
      beschriftungen.sort((a, b) => zahl(b) - zahl(a));
      const frei = (rect, eigener) => !belegt.some(b => b.el !== eigener && ueberschneidet(rect, b.rect, 2));
      beschriftungen.forEach(label => {
        const eigener = label.previousElementSibling;
        let r = label.getBoundingClientRect();
        if (!frei(r, eigener)) {
          label.classList.add('label-links');
          r = label.getBoundingClientRect();
          if (!frei(r, eigener)) { label.classList.add('label-versteckt'); return; }
        }
        belegt.push({ el: label, rect: r });
      });

      if (!map.hasLayer(referenzLayer)) return;
      const namen = new Set(beschriftungen.filter(l => !l.classList.contains('label-versteckt')).map(l => l.textContent));
      referenzLayer.eachLayer(m => {
        const el = m.getElement();
        const kasten = el && el.firstElementChild;
        if (!kasten) return;
        const r = kasten.getBoundingClientRect();
        const verdeckt = namen.has(kasten.textContent)
          || belegt.some(b => ueberschneidet(r, b.rect, 4));
        kasten.classList.toggle('ref-hidden', verdeckt);
        // Die Sichtbaren belegen ihren Platz für die weniger wichtigen.
        if (!verdeckt) belegt.push({ el: kasten, rect: r });
      });
    });
  }
  // Ohne Argument aufrufen - die Ereignis-Objekte von Leaflet dürfen
  // nicht als `nachlauf` ankommen.
  const blendeReferenzAus = () => ordneBeschriftungen();
  map.on('moveend zoomend', blendeReferenzAus);

  // Die Maske ist Beiwerk: Sie wird NACH den Events geladen und ein
  // Fehlschlag bleibt still (dann ist die Karte eben überall gleich
  // hell). Ein `await` hier würde die Marker verzögern.
  function ladeMaske() {
    fetch('laender.json')
      .then(res => (res.ok ? res.json() : null))
      .then(daten => { if (daten && daten.laender) zeichneMaske(daten.laender); })
      .catch(() => { /* ohne Maske ist die Karte vollständig, nur fahler */ });
  }

  const markerLayer = createMarkerLayer();
  markerLayer.addTo(map);
  // markercluster meldet 'animationend', wenn die Bündel neu stehen -
  // erst dann ist bekannt, welche Orientierungsorte verdeckt sind.
  markerLayer.on('animationend', blendeReferenzAus);
  const overlayLayer = L.layerGroup().addTo(map);

  // Ohne das Plugin (unpkg nicht erreichbar, Netzsperre) bleibt es bei
  // einer einfachen Ebene: die Marker liegen dann wieder einzeln da. Eine
  // Karte ohne Buendel ist unuebersichtlich, eine leere Seite waere
  // schlimmer.
  function createMarkerLayer() {
    if (typeof L.markerClusterGroup !== 'function') return L.layerGroup();
    return L.markerClusterGroup({
      // Kein Umriss beim Darueberfahren: auf dem Handy gibt es kein
      // "darueber", und am Rechner blinkte er bei jedem Schwenk auf.
      showCoverageOnHover: false,
      // Liegen mehrere Orte auf derselben Koordinate, faechert ein Klick
      // sie auf statt endlos weiter hineinzuzoomen.
      spiderfyOnMaxZoom: true,
      // Ab dieser Zoomstufe steht jeder Ort fuer sich: wer so weit
      // hineingezoomt hat, will die einzelnen Orte sehen.
      disableClusteringAtZoom: 11,
      // Der Radius in Bildschirmpunkten. Weit draussen (ganz D/A/CH im
      // Bild) darf er groesser sein, sonst klebt ueber jeder Grossstadt
      // ein eigenes Buendel; naeher dran wird er kleiner, damit Nachbar-
      // orte sich trennen.
      maxClusterRadius: zoom => (zoom <= 6 ? 80 : zoom <= 8 ? 60 : 45),
      // Baut die Buendel in Haeppchen auf, damit der Aufbau bei vielen
      // Markern den Bildlauf nicht blockiert (wichtig fuer den geplanten
      // Datenstand mit >20.000 Events).
      chunkedLoading: true,
      iconCreateFunction: clusterIcon
    });
  }

  // Die Zahl im Buendel ist die Summe der Events, nicht die der Marker:
  // ein Marker steht fuer einen Ort und traegt seine Event-Zahl in
  // options.eeCount. Daneben steht der Name des Ortes mit den meisten
  // Events im Bündel (options.eeStandort) - "349 Köln" (Vorlage des
  // Nutzers): so weiß man, was das Bündel ist, ohne hineinzuzoomen.
  function clusterIcon(cluster) {
    let events = 0;
    let groesster = null;
    cluster.getAllChildMarkers().forEach(m => {
      const n = m.options.eeCount || 1;
      events += n;
      if (!groesster || n > (groesster.options.eeCount || 1)) groesster = m;
    });
    const size = events >= 500 ? 56 : events >= 100 ? 48 : events >= 20 ? 40 : 34;
    const ort = groesster && groesster.options.eeStandort ? tv('standort', groesster.options.eeStandort) : '';
    return L.divIcon({
      className: '',
      html: `<div class="cluster-mark" style="width:${size}px;height:${size}px;">`
        + `<div class="cluster-badge" style="width:${size}px;height:${size}px;">${events}</div>`
        + (ort ? `<span class="cluster-label">${escapeHtml(ort)}</span>` : '')
        + '</div>',
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
  }

  // Dieselben Filterknöpfe und Panels wie in der Liste (filter-ui.js).
  // Ein Filter, der hier gesetzt wird, gilt beim Wechsel in die Liste
  // weiter - beide Seiten schreiben ihn in dieselbe Adresse.
  const ui = EFU.create({
    state,
    getEvents: () => events,
    t,
    tv,
    getLang: () => currentLang,
    onChange: () => render()
  });
  // Die Mastersuche: dasselbe Feld wie in der Liste (Name, Wettbewerb,
  // Ort, mit Vorschlägen). Gefiltert wird über EF.matchEvent, also
  // dieselbe Regel, die auch die Liste anwendet - und der Wert steht als
  // ?s= in der Adresse, überlebt also den Seitenwechsel.
  const suche = ui.buildSearch(document.getElementById('master-search-box'));

  // "Mein Standort" unter den Zoom-Knöpfen (Vorlage des Nutzers): öffnet
  // das Ort-Panel an seiner Pille und drückt dort den Standort-Knopf -
  // dieselbe Abfrage, derselbe Umkreis (25 km), dieselben Hinweise bei
  // verweigerter Erlaubnis. Kein zweiter Weg zur Ortung, nur ein
  // zweiter Knopf. `ui.open` statt eines Klicks auf die Pille: Ein
  // künstlicher Klick liefe bis zum Dokument und schlösse das Panel
  // gleich wieder ("Klick außerhalb").
  const TARGET_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"'
    + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
  let standortBtnText = null;
  const StandortControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const div = L.DomUtil.create('div', 'leaflet-bar standort-control');
      const btn = L.DomUtil.create('button', 'standort-btn', div);
      btn.type = 'button';
      btn.innerHTML = TARGET_SVG + '<span></span>';
      standortBtnText = btn.querySelector('span');
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.on(btn, 'click', (ev) => { L.DomEvent.stop(ev); oeffneStandort(); });
      return div;
    }
  });
  new StandortControl().addTo(map);
  function oeffneStandort() {
    const pille = filterButtonsEl.querySelector('.col-filter-btn[data-col="standort"]');
    const spalte = EFU.COLUMNS.find(c => c.key === 'standort');
    if (!pille || !spalte) return;
    ui.open(spalte, pille);
    const geo = document.querySelector('.filter-panel .geo-btn');
    if (geo) geo.click();
  }

  function setLanguage(lang) {
    currentLang = lang;
    try { localStorage.setItem('endurance-lang', lang); } catch (e) { /* ignorieren */ }
    document.title = t('title') + ' – Endurance Events';
    // Die Marke im Kopf heißt in beiden Sprachen gleich; der Untertitel
    // ist weg (die Zeile bleibt der Notbremse).
    listTextEl.textContent = t('list');
    document.getElementById('abo-btn-text').textContent = t('abo');
    if (standortBtnText) standortBtnText.textContent = t('standort_btn');
    navEventsEl.textContent = t('nav_events');
    document.getElementById('nav-map').textContent = t('title');
    resetBtnEl.textContent = t('reset');
    // Quellenangabe der Kacheln in der Sprache der Seite.
    if (attributionText) attributionControl.removeAttribution(attributionText);
    attributionText = t('attribution');
    attributionControl.addAttribution(attributionText);
    // Legende: eine Farbe je Sportart (Klassen aus event-detail.js).
    legendSportsEl.innerHTML = ['Laufen', 'Fahrrad', 'Schwimmen', 'Triathlon'].map(art =>
      `<span class="legend-item"><span class="legend-dot ${EED.sportClass(art)}" aria-hidden="true"></span>${escapeHtml(tv('art1', art))}</span>`
    ).join('');
    baueReferenzOrte();
    const fussnote = document.getElementById('datum-fussnote');
    fussnote.textContent = t('datum_fussnote');
    fussnote.hidden = !events.some(e => e.datum_vorlaeufig);
    // Fußzeile: Impressum und Datenschutz (auf jeder Seite, § 5 DDG).
    document.getElementById('footer-impressum').textContent = t('footer_imprint');
    document.getElementById('footer-datenschutz').textContent = t('footer_privacy');
    // Die Filterknöpfe tragen die Spaltennamen - neu bauen, sonst bleibt
    // "Stadt/Ort" auf Englisch stehen.
    ui.buildButtonBar(filterButtonsEl, { order: ['datum', 'art1', 'art2', 'laenge_km', 'standort', 'land', 'name'] });
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
    // Chips und Popups tragen übersetzte Texte, müssen also mit. Ohne
    // neuen Ausschnitt: ein Sprachwechsel ändert nicht, wohin man schaut.
    if (events.length) render({ refit: false });
  }
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  // ---------- Filter <-> Adresse ----------

  // Der Filterzustand als Parameter - Filterteil aus filters.js, dazu die
  // durchgereichten Ansichts-Parameter der Liste.
  function currentParams() {
    const p = EF.toParams(state);
    Object.keys(listenAnsicht).forEach(k => p.set(k, listenAnsicht[k]));
    return p;
  }

  function linkTo(seite, extra) {
    const p = currentParams();
    if (extra) Object.keys(extra).forEach(k => p.set(k, extra[k]));
    const suffix = p.toString();
    return seite + (suffix ? '?' + suffix : '');
  }

  // Die eigene Adresse mitschreiben: entfernt jemand hier einen Chip, soll
  // der Link auf diese Karte den neuen Stand zeigen (replaceState statt
  // pushState - wie in events.html, damit der Zurück-Knopf brauchbar
  // bleibt).
  function writeUrlState() {
    if (!window.history || !window.history.replaceState) return;
    const suffix = currentParams().toString();
    const neu = window.location.pathname + (suffix ? '?' + suffix : '');
    if (neu !== window.location.pathname + window.location.search) {
      try { window.history.replaceState(null, '', neu); } catch (e) { /* ignorieren */ }
    }
  }

  // ---------- Filterleiste ----------

  function renderChips() {
    const chips = EF.buildChips(state, {
      t,
      tv,
      lang: currentLang,
      dayCount: alleTage.length,
      // Wie viele Werte ein Mengen-Filter hat, weiß dieselbe Stelle, die
      // auch die Häkchenliste im Panel füllt.
      optionCount: stateKey => ui.options(stateKey).length
    });
    chipsEl.innerHTML = '';
    toolbarEl.hidden = chips.length === 0;
    chips.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(c.label)} <button aria-label="✕">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        c.clear();
        render();
      });
      chipsEl.appendChild(chip);
    });
  }

  // "Alle Filter zurücksetzen" - wie in der Liste, samt offenem Panel und
  // der Eingabe im Ortssuchfeld.
  resetBtnEl.addEventListener('click', () => {
    EF.clearFilters(state);
    ui.resetTransient();
    ui.close();
    render();
  });

  // ---------- Marker ----------

  // Ein Ort mit EINEM Event: eine Nadel in der Farbe der Sportart mit
  // deren Symbol (Vorlage des Nutzers). Die Spitze steht auf der
  // Koordinate. Die unsichtbare "1" (.marker-badge.sr-only) hält die
  // Rechnung des Rauchtests am Leben: Summe aller Kreise und Nadeln =
  // Zahl in der Legende.
  const PIN_SVG = '<svg class="pin-shape" viewBox="0 0 30 40" aria-hidden="true">'
    + '<path d="M15 39.5C15 39.5 2.5 24.5 2.5 14.5a12.5 12.5 0 0 1 25 0C27.5 24.5 15 39.5 15 39.5z" fill="currentColor"/>'
    + '<circle cx="15" cy="14.5" r="9.5" fill="#fff"/></svg>';
  function markerIcon(loc) {
    if (loc.count === 1) {
      const art1 = loc.gruppen[0].e.art1;
      return L.divIcon({
        className: '',
        html: `<div class="marker-pin ${EED.sportClass(art1)}">${PIN_SVG}`
          + `<span class="pin-icon">${EED.sportIcon(art1, 14)}</span>`
          + '<span class="marker-badge sr-only">1</span></div>',
        iconSize: [30, 40],
        iconAnchor: [15, 39]
      });
    }
    // Mehrere Events an einem Ort: Kreis mit Zahl und Ortsname, wie ein
    // Bündel, nur kleiner.
    const size = loc.count >= 20 ? 34 : loc.count >= 5 ? 30 : 26;
    return L.divIcon({
      className: '',
      html: `<div class="cluster-mark" style="width:${size}px;height:${size}px;">`
        + `<div class="marker-badge" style="width:${size}px;height:${size}px;">${loc.count}</div>`
        + `<span class="cluster-label">${escapeHtml(tv('standort', loc.standort))}</span></div>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
  }

  // ---------- Detail-Boxen oben rechts ----------
  //
  // Ein Klick auf einen Marker mit einem oder zwei Events öffnet deren
  // Boxen über der Karte, bei mehr Events listet das Popup sie und ein
  // Klick auf einen Eintrag öffnet die Box - dieselbe Box wie in der
  // Liste (event-detail.js: Datum, Land, Ort, Sportart, Kategorie,
  // Länge, Veranstalter-Link, Kalender, Teilen). Höchstens ZWEI
  // zugleich, die neueste oben; die dritte verdrängt die älteste (so vom
  // Nutzer gewünscht: "maximal bis 2"). Jede Box hat ein ✕. Ein zweiter
  // Klick auf ein schon offenes Event hebt es nur nach oben.
  //
  // "Fehler melden" führt in die LISTE (?event=…&melden=1): Der
  // Melde-Dialog mit seiner Firestore-Anbindung lebt nur dort, und eine
  // zweite Kopie liefe auseinander.
  const MAX_DETAILS = 2;
  const detailsEl = document.getElementById('map-details');
  let offeneDetails = [];   // Events, neueste zuerst

  // Die Entfernung vom Ausgangspunkt für die Box ("14 km von deinem
  // Standort") - dieselbe Schreibweise wie die Entfernungs-Spalte der
  // Liste (EF.formatDistanceKm). Ohne Ausgangspunkt zeigt die Box statt
  // dessen den Veranstalter.
  function entfernungText(e) {
    if (!state.origin || e.lat == null || e.lon == null) return null;
    return EF.formatDistanceKm(EF.haversineKm(state.origin.lat, state.origin.lon, e.lat, e.lon), currentLang);
  }

  function detailKontext() {
    return {
      t, tv, lang: currentLang,
      onReport: (e) => { window.location.href = EED.eventLink(e) + '&melden=1'; },
      onClose: (e) => {
        offeneDetails = offeneDetails.filter(x => x !== e);
        zeichneDetails();
      }
    };
  }

  // Die Strecken derselben Veranstaltung (EED.groupKey: Name + Tag +
  // Ort, über ALLE Events, nicht nur die gefilterten) für die Pillen in
  // der Box; ein Klick tauscht das Event dieser Box aus.
  function geschwisterVon(e) {
    const key = EED.groupKey(e);
    const liste = [];
    events.forEach((x, idx) => { if (EED.groupKey(x) === key) liste.push({ e: x, idx }); });
    return liste;
  }

  function zeichneDetails() {
    detailsEl.innerHTML = '';
    offeneDetails.forEach(e => {
      const box = document.createElement('div');
      box.className = 'detail-panel';
      EED.render(box, e, Object.assign(detailKontext(), {
        siblings: geschwisterVon(e),
        // "In der Liste": dieses Event in der Liste, ausgewählt.
        listLink: EED.eventLink(e),
        distanceText: entfernungText(e),
        onSelect: (idx) => {
          const neu = events[idx];
          if (!neu) return;
          offeneDetails = offeneDetails.map(x => (x === e ? neu : x));
          zeichneDetails();
        }
      }));
      detailsEl.appendChild(box);
    });
  }

  function zeigeDetail(e) {
    offeneDetails = [e, ...offeneDetails.filter(x => x !== e)].slice(0, MAX_DETAILS);
    zeichneDetails();
  }

  // Alle Events eines Ortes auf einmal (Marker mit 1 oder 2): Sie
  // ersetzen, was offen war - der Klick auf den Marker ist die Frage
  // "was ist hier?", und die Antwort sind genau diese Boxen.
  function zeigeDetails(liste) {
    offeneDetails = liste.slice(0, MAX_DETAILS);
    zeichneDetails();
  }

  // EIN Zuhörer für alle Popups: Leaflet baut den Popup-Inhalt bei jedem
  // Öffnen neu, ein Zuhörer je Knopf ginge dabei verloren.
  document.getElementById('map').addEventListener('click', (ev) => {
    const knopf = ev.target.closest('.popup-event');
    if (!knopf) return;
    const e = events[Number(knopf.dataset.idx)];
    if (e) zeigeDetail(e);
  });

  // opts.refit === false lässt den Kartenausschnitt, wie er ist.
  function render(opts) {
    ui.updateIndicators();
    renderChips();
    suche.sync();
    // Die Boxen tragen übersetzte Texte - beim Sprachwechsel neu.
    zeichneDetails();
    // Das offene Panel zeigt Häkchen und Regler des Filters - nach einer
    // Änderung muss es mitkommen (es zeichnet sich nicht neu, solange der
    // Fokus darin liegt, siehe filter-ui.js).
    ui.refresh();
    listLabelEl.href = linkTo('events.html');
    navEventsEl.href = linkTo('events.html');
    // Der Abo-Dialog lebt in der Liste: dorthin, mit diesen Filtern,
    // und ?abos=1 öffnet ihn (events.html liest den Parameter).
    aboBtnEl.href = linkTo('events.html', { abos: '1' });
    writeUrlState();
    renderMarkers(!opts || opts.refit !== false);
    blendeReferenzAus();
  }

  function renderMarkers(refit) {
    markerLayer.clearLayers();
    overlayLayer.clearLayers();
    const passend = events.filter(e => EF.matchEvent(state, e));

    // EIN Punkt je VERANSTALTUNG (EED.groupKey: Name + Tag + Ort), nicht
    // je Strecke - vom Nutzer am 21.09.2026 so gewünscht: "auf der Karte
    // gibt es nur die zusammengefassten Events; wenn man draufklickt,
    // sieht man, welche Distanzen möglich sind". Die Strecken zeigt die
    // Box als Pillen (siblings). Die erste Zeile einer Veranstaltung
    // vertritt sie (g.e), ihre Zeilen stehen in g.rows.
    //
    // Ein Marker pro Ort (nicht pro Veranstaltung) - so zeigt Frankfurt
    // EINEN Marker mit der Zahl "10" statt zehn übereinanderliegender
    // Punkte; die Zahl ist die der VERANSTALTUNGEN dort (eeCount, von
    // den Bündeln summiert) - dieselbe Zahl wie "N Events" in der Liste
    // beim Zusammenfassen. Koordinaten der ersten Zeile mit gültigem
    // lat/lon je Ort (alle Zeilen am selben Ort teilen sich ohnehin
    // dieselbe Geocoding-Koordinate).
    const byStandort = new Map();
    const gruppenIndex = new Map();
    let veranstaltungen = 0;
    passend.forEach(e => {
      if (e.lat == null || e.lon == null || !e.standort) return;
      const gk = EED.groupKey(e);
      let g = gruppenIndex.get(gk);
      if (!g) {
        g = { e, rows: [] };
        gruppenIndex.set(gk, g);
        veranstaltungen++;
        if (!byStandort.has(e.standort)) {
          byStandort.set(e.standort, { standort: e.standort, land: e.land, lat: e.lat, lon: e.lon, count: 0, gruppen: [] });
        }
        const loc = byStandort.get(e.standort);
        loc.count++;
        loc.gruppen.push(g);
      }
      g.rows.push(e);
    });

    hintEl.textContent = veranstaltungen === 0
      ? t('hint_empty')
      : t('hint', EF.formatInt(veranstaltungen, currentLang));

    const markers = [];
    byStandort.forEach(loc => {
      // eeCount: die Event-Zahl dieses Ortes. clusterIcon() summiert sie
      // ueber alle Marker eines Buendels - sonst stuende dort die Zahl der
      // ORTE und die Karte widersprueche ihrer eigenen Kopfzeile.
      const marker = L.marker([loc.lat, loc.lon], { icon: markerIcon(loc), eeCount: loc.count, eeStandort: loc.standort });
      // Der Popup-Inhalt entsteht erst beim Öffnen: bindPopup nimmt auch
      // eine FUNKTION. Als fertiger String kostete er bei ~2.000 Orten
      // 2.000 Popups samt 2.000 linkTo()-Aufrufen (jeder baut eigene
      // URLSearchParams) - für höchstens eines, das jemand ansieht.
      //
      // Der Link in die Liste nimmt die aktuellen Filter mit und setzt
      // zusätzlich diesen Ort - sonst führte ein Marker aus einer
      // gefilterten Karte zurück in eine ungefilterte Liste. Weil er erst
      // beim Klick entsteht, trägt er jetzt sogar die Filter von genau
      // diesem Moment.
      //
      // Hat der Ort höchstens so viele Veranstaltungen, wie Boxen Platz
      // haben (zwei), öffnet der Klick auf den Marker die Boxen DIREKT -
      // ohne Popup (vom Nutzer am 19.09.2026 so gewünscht: "wenn ich auf
      // die 1 klicke, soll sich rechts oben einfach die Info öffnen;
      // zeigt der Punkt 2, werden rechts zwei Events angezeigt"). Erst
      // ab drei Veranstaltungen bleibt das Popup mit der Auswahlliste -
      // je Veranstaltung EIN Eintrag mit der Spanne ihrer Strecken
      // ("5–42,2 km · 4 Strecken"); ein Klick dort öffnet die Box
      // (zeigeDetail) mit den Strecken als Pillen. data-idx ist die
      // Nummer der vertretenden Zeile in `events`, der Klick kommt über
      // EINEN Zuhörer am Kartencontainer an (unten).
      if (loc.gruppen.length <= MAX_DETAILS) {
        marker.on('click', () => zeigeDetails(loc.gruppen.map(g => g.e)));
        markers.push(marker);
        return;
      }
      marker.bindPopup(() =>
        // tv(): Städte mit eigenem englischen Namen (München → Munich).
        `<div class="popup-title">${escapeHtml(tv('standort', loc.standort))}</div>` +
        `<div class="popup-sub">${escapeHtml(tv('land', loc.land) || '')} · ${t('popup_count', loc.count)}</div>` +
        `<ul class="popup-events">` + loc.gruppen.map(g => {
          return `<li><button type="button" class="popup-event" data-idx="${events.indexOf(g.e)}">`
            + `<span class="pe-name">${escapeHtml(g.e.name)}</span>`
            + `<span class="pe-meta">${escapeHtml(EF.formatEventDate(g.e, currentLang))}`
            + ` · ${escapeHtml(EED.formatLengthSpan(g.rows, currentLang))}`
            + (g.rows.length > 1 ? ` · ${escapeHtml(t('popup_strecken', g.rows.length))}` : '') + `</span>`
            + `</button></li>`;
        }).join('') + `</ul>` +
        `<a class="popup-link" href="${linkTo('events.html', { standort: loc.standort })}">`
        + `${escapeHtml(t('popup_link', loc.count))}</a>`
      );
      markers.push(marker);
    });
    // In EINEM Zug einhaengen: markercluster rechnet die Buendel dann
    // einmal statt nach jedem Marker neu (bei ~1.500 Orten der
    // Unterschied zwischen ruckelfrei und zaeh).
    if (typeof markerLayer.addLayers === 'function') {
      markerLayer.addLayers(markers);
    } else {
      markers.forEach(m => markerLayer.addLayer(m));
    }

    // Umkreissuche sichtbar machen: der Ausgangspunkt als Punkt, der
    // Umkreis als Kreis. Erst damit ist zu sehen, WARUM außerhalb keine
    // Marker stehen.
    let kreis = null;
    if (state.origin) {
      L.marker([state.origin.lat, state.origin.lon], {
        icon: L.divIcon({ className: '', html: '<div class="origin-dot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }),
        title: `${t('origin_title')}: ${state.origin.label}`
      }).addTo(overlayLayer);
      if (state.radiusKm != null) {
        // Gestrichelt in der Akzentfarbe (Vorlage des Nutzers); die Farbe
        // kommt aus dem Stylesheet (path.umkreis-pfad), hier der Rückfall.
        kreis = L.circle([state.origin.lat, state.origin.lon], {
          radius: state.radiusKm * 1000,
          className: 'umkreis-pfad',
          color: '#0f1b33',
          weight: 1.5,
          dashArray: '6 6',
          fillColor: '#0f1b33',
          fillOpacity: 0.05
        }).addTo(overlayLayer);
      }
    }

    // Ausschnitt: der Umkreis hat Vorrang (er ist die Frage, die gestellt
    // wurde), sonst alle Marker. Ohne beides bleibt der Blick auf D/A/CH.
    if (!refit) {
      return;
    } else if (kreis) {
      map.fitBounds(kreis.getBounds().pad(0.1));
    } else if (markers.length) {
      // Knapp um die Marker: Mit 15 % Rand passte D/A/CH auf 1440×700
      // nicht mehr in Zoom 6 und die Karte sprang auf 5 - die Länder
      // standen dann als Briefmarke in der Mitte.
      // Höchstens Zoom 13 (Ortsebene): Bei einem einzelnen Ort zoomte
      // die Karte sonst bis auf die Hausnummer.
      map.fitBounds(L.featureGroup(markers).getBounds().pad(0.04), { maxZoom: 13 });
    }
  }

  // ---------- Laden ----------

  try {
    const res = await fetch('events.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    // Vergangene Events zählen nicht mit: die Marker-Zahl eines Ortes
    // soll dieselbe sein wie die Trefferzahl in events.html (dort
    // dieselbe Filterung beim Laden, siehe EF.dropPastEvents).
    events = EF.dropPastEvents(await res.json());
  } catch (err) {
    setLanguage(currentLang);
    hintEl.textContent = t('load_error', err.message);
    return;
  }

  // Erst jetzt, damit die Maske nicht mit events.json um die Leitung
  // streitet (sie ist Beiwerk, siehe ladeMaske).
  ladeMaske();

  alleStandorte = new Set(events.map(e => e.standort).filter(v => v));
  alleTage = Array.from(new Set(events.map(e => e.datum_start).filter(v => v))).sort();

  // Filter aus der Adresse übernehmen - dieselben Parameter, die
  // events.html schreibt (?land=…&kat=…&ort=…&umkreis=…). Ein Tippfehler
  // im Ortsnamen wird verworfen statt zu einer leeren Karte zu führen.
  EF.readParams(state, window.location.search, {
    knownStandort: v => alleStandorte.has(v),
    alleTage,
    geoLabel: t('geo_current_label')
  });
  try {
    const p = new URLSearchParams(window.location.search);
    ['sort', 'gruppiert'].forEach(k => { if (p.get(k)) listenAnsicht[k] = p.get(k); });
  } catch (e) { /* ignorieren */ }

  setLanguage(currentLang);
  render();
})();
</script>
