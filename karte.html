<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karte – Ausdauersport-Events D/A/CH</title>
<!-- Seitensymbol. Ohne diese Zeilen fragt jeder Browser von sich aus
     /favicon.ico an und bekommt von GitHub Pages die 404-Seite - der Tab
     bleibt leer. Eine SVG-Datei reicht fuer alle Groessen; das PNG
     braucht nur iOS fuer den Startbildschirm (dort rundet das System die
     Ecken selbst, deshalb ist es randvoll). -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<!-- Vorschau beim Teilen ("Suche mit Freunden teilen" schickt einen Link
     auf events.html). Ohne diese Angaben zeigen WhatsApp, iMessage und Co.
     nur die nackte Adresse. Ein og:image fehlt bewusst: es braucht eine
     absolute Adresse, und die Domain steht noch nicht fest. -->
<meta name="description" content="Laufen, Schwimmen, Radfahren und Triathlon in Deutschland, Österreich und der Schweiz – filterbar nach Datum, Ort, Sportart und Distanz, mit Umkreissuche, Karte und Kalender-Eintrag.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ausdauersport-Events D/A/CH">
<meta property="og:title" content="Ausdauersport-Events D/A/CH – die Karte">
<meta property="og:description" content="Laufen, Schwimmen, Radfahren und Triathlon in Deutschland, Österreich und der Schweiz – filterbar nach Datum, Ort, Sportart und Distanz, mit Umkreissuche, Karte und Kalender-Eintrag.">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<!-- Zusammenfassen der Marker (Leaflet.markercluster). Nur MarkerCluster.css,
     NICHT MarkerCluster.Default.css: das Aussehen der Bündel steht unten bei
     .cluster-badge, das Stylesheet hier bringt allein die Bewegung beim
     Auf- und Zuklappen und die Spinnenbeine. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="" />
<!-- events.json ist das, worauf die Seite wartet - deshalb wird der
     Download hier angestossen, noch bevor der Browser das Stylesheet und
     die Skripte gesehen hat. Ohne diese Zeile begann er erst, nachdem
     filters.js und filter-ui.js geladen UND ausgefuehrt waren. -->
<link rel="preload" href="events.json" as="fetch" type="application/json" crossorigin="anonymous">
<!-- Verbindungsaufbau (DNS + TLS) zu den mit `defer` geladenen
     Firebase-Dateien schon jetzt, nicht erst beim Abruf. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<!-- Leaflet kommt von unpkg: Verbindung schon beim Kopf der Seite aufbauen. -->
<link rel="preconnect" href="https://unpkg.com" crossorigin>

<link rel="stylesheet" href="filter-ui.css?v=452fb354">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e0e3e8;
    --text: #1c1f24;
    --text-muted: #6b7280;
    --accent: #14509a;
    --accent-bg: #eaf1ff;
    /* filter-ui.css braucht --row-hover (Zeitraum-Knöpfe im Datumsfilter). */
    --row-hover: #eef4ff;
    --hero-gradient: linear-gradient(135deg, #0b2e6b 0%, #14509a 55%, #1d8fa8 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1d2025;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-muted: #9aa1ac;
      --accent: #5b9dff;
      --accent-bg: #1e2a40;
      --row-hover: #22314a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    background: var(--hero-gradient);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; color: #fff; }
  .subtitle { color: rgba(255,255,255,0.85); font-size: 0.85rem; margin: 0; }
  /* Darf umbrechen: auf 390 px stand die Reihe (Startseite, Liste,
     Anmelden, DE/EN) sonst in einer Zeile und ragte über den blauen
     Kasten hinaus - "EN" war angeschnitten. In events.html war dieselbe
     Stelle schon behoben, hier stand noch die alte Fassung. */
  .top-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
    max-width: 100%;
    margin-top: 2px;
  }
  .home-btn, .list-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
  }
  .home-btn:hover, .list-btn:hover { background: rgba(255,255,255,0.26); }
  .lang-switch { display: flex; gap: 4px; flex-shrink: 0; }
  .lang-btn {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .lang-btn.active { background: #fff; color: #14315e; border-color: #fff; }

  /* Filterleiste: dieselben Filterknöpfe und Chips wie in der Liste
     (filter-ui.css, filter-ui.js). Obere Zeile die Knöpfe, darunter die
     gesetzten Filter als Chips - ohne diese Anzeige sähe eine gefilterte
     Karte wie eine kaputte aus ("wo sind meine Events?"). */
  .filter-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .filter-bar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  /* Ohne Chips keine leere zweite Zeile (und kein Abstand dafür). */
  .active-chips:empty { display: none; }
  .filter-bar-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .active-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.75rem;
  }
  .chip button {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0;
  }
  .reset-btn {
    margin-left: auto;
    padding: 6px 14px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .reset-btn:hover { opacity: 0.9; }

  .map-wrap {
    flex: 1;
    min-height: 60vh;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  #map { position: absolute; inset: 0; }
  .map-hint {
    position: absolute;
    z-index: 500;
    top: 10px;
    /* Neben den +/--Knöpfen von Leaflet, nicht darunter: bei 390 px
       verdeckten sie sonst den Anfang des Textes ("699 von …"). */
    left: 52px;
    max-width: calc(100% - 62px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.78rem;
    color: var(--text-muted);
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .marker-badge {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.72rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    border: 2px solid #fff;
  }
  /* Ein Buendel mehrerer Orte. Bewusst anders als ein einzelner Ort
     (.marker-badge): heller Kern, breiter Ring - so ist auf einen Blick zu
     sehen, dass hier noch etwas zum Aufklappen liegt. Die Zahl ist die
     Summe der EVENTS darunter, nicht die der Orte: sie soll zur Zahl in
     der Kopfzeile passen. */
  .cluster-badge {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.78rem;
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 0 0 4px rgba(20,80,154,0.25);
  }
  /* Ausgangspunkt der Umkreissuche: ein farbiger Punkt, deutlich anders
     als die blauen Event-Marker. */
  .origin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #d94f4f;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .popup-title { font-weight: 700; margin-bottom: 2px; }
  .popup-sub { color: var(--text-muted, #6b7280); font-size: 0.82rem; margin-bottom: 8px; }
  .popup-link {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff !important;
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .leaflet-popup-content { margin: 10px 12px; }
</style>

<!-- Dieselben Filter wie in der Liste: die Knöpfe öffnen dieselben Panels

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Zusammenfassen der Marker. Ohne `defer` und direkt hinter leaflet.js,
     weil das Plugin L beim Ausfuehren braucht. Bleibt es aus (Netzsperre,
     unpkg nicht erreichbar), faellt die Karte unten auf eine einfache
     Ebene zurueck - dann liegen die Marker wieder einzeln da, statt dass
     die Seite leer bleibt. -->
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
        integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>

<!-- Login/Registrierung (Google + E-Mail/Passwort), siehe auth.js und
     firebase-config.js. Ohne ausgefüllte Firebase-Config zeigt der
     "Anmelden"-Button einen Hinweis statt kaputter Funktionalität. -->
<!-- `defer`: laedt parallel zum Seitenaufbau und laeuft erst danach.
     Ohne das wartete das Inline-Skript dieser Seite auf ~200 KB
     Firebase, bevor es events.json ueberhaupt anforderte.
     firebase-firestore-compat.js (344 KB) fehlt hier absichtlich -
     auth.js laedt es erst nach, wenn wirklich geschrieben wird. -->
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="firebase-config.js"></script>
<script defer src="auth.js"></script>

<!-- Gemeinsamer Filterzustand mit events.html: dieselben Parameter in der
     Adresse, dieselben Kategorien, dieselben Chips. -->
<script src="filters.js?v=12187957"></script>
<script src="filter-ui.js?v=158d0aeb"></script>

<script>
(async function () {
  // Gemeinsamer Filterzustand mit events.html (filters.js): Die Karte
  // liest die Filter aus derselben Adresse und prüft sie mit denselben
  // Funktionen. Ein Marker zeigt damit genau die Events, die in der Liste
  // auch zu sehen wären - vorher zeigte die Karte immer alle.
  const EF = window.EnduranceFilters;
  const EFU = window.EnduranceFilterUI;

  // Sicherung gegen eine halb alte Seite: GitHub Pages liefert jede Datei
  // mit max-age=600, ein Browser kann also diese Seite mit einer zehn
  // Minuten alten filters.js kombinieren. Fehlt darin eine Funktion,
  // bricht das Skript in seiner ersten Zeile ab - die Seite blieb dann
  // LEER (blauer Kopf, sonst nichts; genau das ist passiert). Die
  // ?v=<Stempel>-Anhänge an den Skripten sollen das verhindern
  // (scripts/stamp_assets.py), hier steht die Notbremse, falls doch.
  if (!EF || !EFU || !EF.uniqueSorted || !EFU.create) {
    let spracheDe = true;
    try { spracheDe = localStorage.getItem('endurance-lang') !== 'en'; } catch (e) { /* ignorieren */ }
    document.getElementById('page-title').textContent =
      spracheDe ? 'Bitte neu laden' : 'Please reload';
    document.getElementById('subtitle').textContent = spracheDe
      ? 'Der Browser hat eine veraltete Programmdatei gespeichert. Einmal neu laden genügt (auf dem iPhone/iPad: Seite schließen und wieder öffnen).'
      : 'Your browser kept an outdated script file. Just reload the page (on iPhone/iPad: close the tab and open it again).';
    return;
  }

  const I18N = {
    de: {
      title: 'Karte',
      subtitle: 'Klicke auf einen Marker, um die Events an diesem Ort in der Liste zu sehen.',
      home: 'Startseite',
      list: 'Liste',
      hint: (n, cities) => `${n} Events an ${cities} Orten`,
      hint_filtered: (n, total, cities) => `${n} von ${total} Events an ${cities} Orten`,
      hint_empty: 'Kein Event entspricht den Filtern.',
      load_error: (msg) => `Konnte events.json nicht laden: ${msg}`,
      popup_count: (n) => `${n} Event${n === 1 ? '' : 's'}`,
      popup_link: (n) => `${n} Event${n === 1 ? '' : 's'} in der Liste anzeigen ↗`,
      filter_label: 'Filter:',
      reset: 'Alle Filter zurücksetzen',
      origin_title: 'Ausgangspunkt'
    },
    en: {
      title: 'Map',
      subtitle: 'Click a marker to see the events at that location in the list.',
      home: 'Home',
      list: 'List',
      hint: (n, cities) => `${n} events across ${cities} locations`,
      hint_filtered: (n, total, cities) => `${n} of ${total} events across ${cities} locations`,
      hint_empty: 'No event matches the filters.',
      load_error: (msg) => `Could not load events.json: ${msg}`,
      popup_count: (n) => `${n} event${n === 1 ? '' : 's'}`,
      popup_link: (n) => `View ${n} event${n === 1 ? '' : 's'} in the list ↗`,
      filter_label: 'Filters:',
      reset: 'Reset all filters',
      origin_title: 'Starting point'
    }
  };
  // Chip- und Zeitraum-Texte aus filters.js, die Texte der Filter-Panels
  // und die Spaltennamen aus filter-ui.js - die Karte beschriftet die
  // Filter damit wortgleich wie die Liste.
  Object.assign(I18N.de, EF.I18N.de, EFU.I18N.de);
  Object.assign(I18N.en, EF.I18N.en, EFU.I18N.en);

  let currentLang = 'de';
  try {
    const saved = localStorage.getItem('endurance-lang');
    if (saved === 'de' || saved === 'en') currentLang = saved;
  } catch (e) { /* localStorage evtl. nicht verfügbar (privater Modus) */ }

  const t = (key, ...args) => {
    const entry = I18N[currentLang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  };

  const tv = (field, value) => {
    if (value == null) return value;
    const entry = EF.VALUE_TRANSLATIONS[field] && EF.VALUE_TRANSLATIONS[field][value];
    return entry ? entry[currentLang] : value;
  };

  const titleEl = document.getElementById('page-title');
  const subtitleEl = document.getElementById('subtitle');
  const homeLabelEl = document.getElementById('home-btn-label');
  const listLabelEl = document.getElementById('list-btn-label');
  const hintEl = document.getElementById('map-hint');
  const filterBarLabelEl = document.getElementById('filter-bar-label');
  const filterButtonsEl = document.getElementById('filter-buttons');
  const chipsEl = document.getElementById('active-chips');
  const resetBtnEl = document.getElementById('reset-btn');

  // Der Filterzustand selbst (Land, Sportart, Umkreis …) - dieselbe
  // Struktur wie in der Liste, gelesen und geschrieben über dieselbe
  // Adresse. Gesetzt wird er hier mit denselben Knöpfen und Panels.
  const state = EF.createState();
  // Die reinen Ansichts-Parameter der Liste (Sortierung, Zusammenfassen)
  // versteht die Karte nicht, sie trägt sie aber unverändert weiter:
  // sonst verlöre der Weg Liste -> Karte -> Liste die Ansicht.
  const listenAnsicht = {};
  let events = [];
  let alleStandorte = new Set();
  let alleTage = [];

  const escapeHtml = EF.escapeHtml;

  // Karte initialisieren, Mittelpunkt/Zoom grob auf D/A/CH.
  const map = L.map('map').setView([48.5, 10.5], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'
  }).addTo(map);
  // Alles, was beim Filtern neu gezeichnet wird, liegt in einer eigenen
  // Ebene - so muss nur diese geleert werden, nicht die Kachel-Ebene.
  // Es sind ZWEI Ebenen, und das ist wichtig: Die Event-Marker werden
  // gebuendelt (markercluster), der Ausgangspunkt und sein Umkreis dagegen
  // nicht - sonst verschwaende der rote Punkt in einem Buendel.
  const markerLayer = createMarkerLayer();
  markerLayer.addTo(map);
  const overlayLayer = L.layerGroup().addTo(map);

  // Ohne das Plugin (unpkg nicht erreichbar, Netzsperre) bleibt es bei
  // einer einfachen Ebene: die Marker liegen dann wieder einzeln da. Eine
  // Karte ohne Buendel ist unuebersichtlich, eine leere Seite waere
  // schlimmer.
  function createMarkerLayer() {
    if (typeof L.markerClusterGroup !== 'function') return L.layerGroup();
    return L.markerClusterGroup({
      // Kein Umriss beim Darueberfahren: auf dem Handy gibt es kein
      // "darueber", und am Rechner blinkte er bei jedem Schwenk auf.
      showCoverageOnHover: false,
      // Liegen mehrere Orte auf derselben Koordinate, faechert ein Klick
      // sie auf statt endlos weiter hineinzuzoomen.
      spiderfyOnMaxZoom: true,
      // Ab dieser Zoomstufe steht jeder Ort fuer sich: wer so weit
      // hineingezoomt hat, will die einzelnen Orte sehen.
      disableClusteringAtZoom: 11,
      // Der Radius in Bildschirmpunkten. Weit draussen (ganz D/A/CH im
      // Bild) darf er groesser sein, sonst klebt ueber jeder Grossstadt
      // ein eigenes Buendel; naeher dran wird er kleiner, damit Nachbar-
      // orte sich trennen.
      maxClusterRadius: zoom => (zoom <= 6 ? 80 : zoom <= 8 ? 60 : 45),
      // Baut die Buendel in Haeppchen auf, damit der Aufbau bei vielen
      // Markern den Bildlauf nicht blockiert (wichtig fuer den geplanten
      // Datenstand mit >20.000 Events).
      chunkedLoading: true,
      iconCreateFunction: clusterIcon
    });
  }

  // Die Zahl im Buendel ist die Summe der Events, nicht die der Marker:
  // ein Marker steht fuer einen Ort und traegt seine Event-Zahl in
  // options.eeCount.
  function clusterIcon(cluster) {
    let events = 0;
    cluster.getAllChildMarkers().forEach(m => { events += (m.options.eeCount || 1); });
    const size = events >= 500 ? 56 : events >= 100 ? 48 : events >= 20 ? 40 : 34;
    return L.divIcon({
      className: '',
      html: `<div class="cluster-badge" style="width:${size}px;height:${size}px;">${events}</div>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
  }

  // Dieselben Filterknöpfe und Panels wie in der Liste (filter-ui.js).
  // Ein Filter, der hier gesetzt wird, gilt beim Wechsel in die Liste
  // weiter - beide Seiten schreiben ihn in dieselbe Adresse.
  const ui = EFU.create({
    state,
    getEvents: () => events,
    t,
    tv,
    getLang: () => currentLang,
    onChange: () => render()
  });

  function setLanguage(lang) {
    currentLang = lang;
    try { localStorage.setItem('endurance-lang', lang); } catch (e) { /* ignorieren */ }
    document.title = t('title') + ' – Ausdauersport-Events D/A/CH';
    titleEl.textContent = t('title');
    subtitleEl.textContent = t('subtitle');
    homeLabelEl.textContent = t('home');
    listLabelEl.textContent = t('list');
    resetBtnEl.textContent = t('reset');
    filterBarLabelEl.textContent = t('filter_label');
    // Die Filterknöpfe tragen die Spaltennamen - neu bauen, sonst bleibt
    // "Stadt/Ort" auf Englisch stehen.
    ui.buildButtonBar(filterButtonsEl);
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
    // Chips und Popups tragen übersetzte Texte, müssen also mit. Ohne
    // neuen Ausschnitt: ein Sprachwechsel ändert nicht, wohin man schaut.
    if (events.length) render({ refit: false });
  }
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  // ---------- Filter <-> Adresse ----------

  // Der Filterzustand als Parameter - Filterteil aus filters.js, dazu die
  // durchgereichten Ansichts-Parameter der Liste.
  function currentParams() {
    const p = EF.toParams(state);
    Object.keys(listenAnsicht).forEach(k => p.set(k, listenAnsicht[k]));
    return p;
  }

  function linkTo(seite, extra) {
    const p = currentParams();
    if (extra) Object.keys(extra).forEach(k => p.set(k, extra[k]));
    const suffix = p.toString();
    return seite + (suffix ? '?' + suffix : '');
  }

  // Die eigene Adresse mitschreiben: entfernt jemand hier einen Chip, soll
  // der Link auf diese Karte den neuen Stand zeigen (replaceState statt
  // pushState - wie in events.html, damit der Zurück-Knopf brauchbar
  // bleibt).
  function writeUrlState() {
    if (!window.history || !window.history.replaceState) return;
    const suffix = currentParams().toString();
    const neu = window.location.pathname + (suffix ? '?' + suffix : '');
    if (neu !== window.location.pathname + window.location.search) {
      try { window.history.replaceState(null, '', neu); } catch (e) { /* ignorieren */ }
    }
  }

  // ---------- Filterleiste ----------

  function renderChips() {
    const chips = EF.buildChips(state, {
      t,
      tv,
      lang: currentLang,
      dayCount: alleTage.length,
      // Wie viele Werte ein Mengen-Filter hat, weiß dieselbe Stelle, die
      // auch die Häkchenliste im Panel füllt.
      optionCount: stateKey => ui.options(stateKey).length
    });
    chipsEl.innerHTML = '';
    chips.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(c.label)} <button aria-label="✕">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        c.clear();
        render();
      });
      chipsEl.appendChild(chip);
    });
  }

  // "Alle Filter zurücksetzen" - wie in der Liste, samt offenem Panel und
  // der Eingabe im Ortssuchfeld.
  resetBtnEl.addEventListener('click', () => {
    EF.clearFilters(state);
    ui.resetTransient();
    ui.close();
    render();
  });

  // ---------- Marker ----------

  function badgeIcon(count) {
    const size = count >= 20 ? 34 : count >= 5 ? 28 : 22;
    return L.divIcon({
      className: '',
      html: `<div class="marker-badge" style="width:${size}px;height:${size}px;">${count}</div>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
  }

  // opts.refit === false lässt den Kartenausschnitt, wie er ist.
  function render(opts) {
    ui.updateIndicators();
    renderChips();
    // Das offene Panel zeigt Häkchen und Regler des Filters - nach einer
    // Änderung muss es mitkommen (es zeichnet sich nicht neu, solange der
    // Fokus darin liegt, siehe filter-ui.js).
    ui.refresh();
    listLabelEl.href = linkTo('events.html');
    writeUrlState();
    renderMarkers(!opts || opts.refit !== false);
  }

  function renderMarkers(refit) {
    markerLayer.clearLayers();
    overlayLayer.clearLayers();
    const passend = events.filter(e => EF.matchEvent(state, e));

    // Ein Marker pro eindeutigem Standort (nicht pro einzelnem Event) -
    // so zeigt z. B. Frankfurt EINEN Marker mit der Zahl "10" statt zehn
    // übereinanderliegender Punkte. Koordinaten des ersten Events mit
    // gültigem lat/lon je Standort werden übernommen (alle Events am
    // selben Ort teilen sich ohnehin dieselbe Geocoding-Koordinate).
    const byStandort = new Map();
    let withCoords = 0;
    passend.forEach(e => {
      if (e.lat == null || e.lon == null || !e.standort) return;
      withCoords++;
      const key = e.standort;
      if (!byStandort.has(key)) {
        byStandort.set(key, { standort: e.standort, land: e.land, lat: e.lat, lon: e.lon, count: 0 });
      }
      byStandort.get(key).count++;
    });

    hintEl.textContent = withCoords === 0
      ? t('hint_empty')
      : EF.hasFilters(state)
        ? t('hint_filtered', withCoords, events.length, byStandort.size)
        : t('hint', withCoords, byStandort.size);

    const markers = [];
    byStandort.forEach(loc => {
      // eeCount: die Event-Zahl dieses Ortes. clusterIcon() summiert sie
      // ueber alle Marker eines Buendels - sonst stuende dort die Zahl der
      // ORTE und die Karte widersprueche ihrer eigenen Kopfzeile.
      const marker = L.marker([loc.lat, loc.lon], { icon: badgeIcon(loc.count), eeCount: loc.count });
      // Der Popup-Inhalt entsteht erst beim Öffnen: bindPopup nimmt auch
      // eine FUNKTION. Als fertiger String kostete er bei ~2.000 Orten
      // 2.000 Popups samt 2.000 linkTo()-Aufrufen (jeder baut eigene
      // URLSearchParams) - für höchstens eines, das jemand ansieht.
      //
      // Der Link in die Liste nimmt die aktuellen Filter mit und setzt
      // zusätzlich diesen Ort - sonst führte ein Marker aus einer
      // gefilterten Karte zurück in eine ungefilterte Liste. Weil er erst
      // beim Klick entsteht, trägt er jetzt sogar die Filter von genau
      // diesem Moment.
      marker.bindPopup(() =>
        `<div class="popup-title">${escapeHtml(loc.standort)}</div>` +
        `<div class="popup-sub">${escapeHtml(tv('land', loc.land) || '')} · ${t('popup_count', loc.count)}</div>` +
        `<a class="popup-link" href="${linkTo('events.html', { standort: loc.standort })}">`
        + `${escapeHtml(t('popup_link', loc.count))}</a>`
      );
      markers.push(marker);
    });
    // In EINEM Zug einhaengen: markercluster rechnet die Buendel dann
    // einmal statt nach jedem Marker neu (bei ~1.500 Orten der
    // Unterschied zwischen ruckelfrei und zaeh).
    if (typeof markerLayer.addLayers === 'function') {
      markerLayer.addLayers(markers);
    } else {
      markers.forEach(m => markerLayer.addLayer(m));
    }

    // Umkreissuche sichtbar machen: der Ausgangspunkt als Punkt, der
    // Umkreis als Kreis. Erst damit ist zu sehen, WARUM außerhalb keine
    // Marker stehen.
    let kreis = null;
    if (state.origin) {
      L.marker([state.origin.lat, state.origin.lon], {
        icon: L.divIcon({ className: '', html: '<div class="origin-dot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }),
        title: `${t('origin_title')}: ${state.origin.label}`
      }).addTo(overlayLayer);
      if (state.radiusKm != null) {
        kreis = L.circle([state.origin.lat, state.origin.lon], {
          radius: state.radiusKm * 1000,
          color: '#14509a',
          weight: 1,
          fillColor: '#14509a',
          fillOpacity: 0.06
        }).addTo(overlayLayer);
      }
    }

    // Ausschnitt: der Umkreis hat Vorrang (er ist die Frage, die gestellt
    // wurde), sonst alle Marker. Ohne beides bleibt der Blick auf D/A/CH.
    if (!refit) {
      return;
    } else if (kreis) {
      map.fitBounds(kreis.getBounds().pad(0.1));
    } else if (markers.length) {
      map.fitBounds(L.featureGroup(markers).getBounds().pad(0.15));
    }
  }

  // ---------- Laden ----------

  try {
    const res = await fetch('events.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    // Vergangene Events zählen nicht mit: die Marker-Zahl eines Ortes
    // soll dieselbe sein wie die Trefferzahl in events.html (dort
    // dieselbe Filterung beim Laden, siehe EF.dropPastEvents).
    events = EF.dropPastEvents(await res.json());
  } catch (err) {
    setLanguage(currentLang);
    hintEl.textContent = t('load_error', err.message);
    return;
  }

  alleStandorte = new Set(events.map(e => e.standort).filter(v => v));
  alleTage = Array.from(new Set(events.map(e => e.datum_start).filter(v => v))).sort();

  // Filter aus der Adresse übernehmen - dieselben Parameter, die
  // events.html schreibt (?land=…&kat=…&ort=…&umkreis=…). Ein Tippfehler
  // im Ortsnamen wird verworfen statt zu einer leeren Karte zu führen.
  EF.readParams(state, window.location.search, {
    knownStandort: v => alleStandorte.has(v),
    alleTage,
    geoLabel: t('geo_current_label')
  });
  try {
    const p = new URLSearchParams(window.location.search);
    ['sort', 'gruppiert'].forEach(k => { if (p.get(k)) listenAnsicht[k] = p.get(k); });
  } catch (e) { /* ignorieren */ }

  setLanguage(currentLang);
  render();
})();
</script>
</body>
</html>
